<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>GPTrad — Радар и опасные явления</title>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#101318;
}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#111;
}

#loading{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:5000;
  padding:12px 18px;
  border-radius:12px;
  background:rgba(20,22,27,.88);
  color:#fff;
  font-size:14px;
  pointer-events:none;
  backdrop-filter:blur(10px);
}

.topbar{
  position:absolute;
  z-index:3000;
  left:12px;
  right:12px;
  top:12px;
  height:50px;
  display:flex;
  align-items:center;
  gap:8px;
  pointer-events:none;
}

.topbar>*{
  pointer-events:auto;
}

.brand{
  height:46px;
  padding:0 15px;
  display:flex;
  align-items:center;
  border-radius:14px;
  background:rgba(20,23,29,.88);
  color:#fff;
  font-weight:700;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
  backdrop-filter:blur(12px);
}

.top-buttons{
  margin-left:auto;
  display:flex;
  gap:7px;
}

.icon-btn{
  width:46px;
  height:46px;
  border:0;
  border-radius:14px;
  background:rgba(20,23,29,.9);
  color:#fff;
  font-size:21px;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
  backdrop-filter:blur(12px);
}

.icon-btn:active{
  transform:scale(.94);
}

.panel{
  position:absolute;
  z-index:2500;
  top:72px;
  right:12px;
  width:min(330px,calc(100vw - 24px));
  max-height:calc(100vh - 160px);
  overflow:auto;
  padding:12px;
  border-radius:18px;
  background:rgba(20,23,29,.92);
  color:#fff;
  box-shadow:0 8px 35px rgba(0,0,0,.35);
  backdrop-filter:blur(16px);
  transform:translateX(calc(100% + 20px));
  transition:transform .22s ease;
}

.panel.open{
  transform:translateX(0);
}

.panel-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:10px;
}

.layer{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:45px;
  padding:8px 9px;
  margin-bottom:6px;
  border-radius:12px;
  cursor:pointer;
}

.layer:hover{
  background:rgba(255,255,255,.07);
}

.layer input{
  width:18px;
  height:18px;
}

.layer span{
  font-size:14px;
}

.timeline{
  position:absolute;
  z-index:2800;
  left:12px;
  right:12px;
  bottom:14px;
  height:67px;
  padding:9px 12px 8px;
  border-radius:17px;
  background:rgba(20,23,29,.92);
  color:#fff;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
  backdrop-filter:blur(15px);
}

.timeline-row{
  display:flex;
  align-items:center;
  gap:9px;
}

#timeSlider{
  flex:1;
  min-width:0;
  accent-color:#fff;
}

#timeLabel{
  width:72px;
  text-align:right;
  font-size:12px;
  opacity:.9;
}

.progress{
  position:relative;
  width:100%;
  height:7px;
  margin-top:8px;
  border-radius:10px;
  background:rgba(255,255,255,.13);
  overflow:hidden;
}

.progress-segments{
  position:absolute;
  inset:0;
  display:flex;
  gap:2px;
}

.progress-segment{
  flex:1;
  height:100%;
  border-radius:3px;
  background:rgba(255,255,255,.12);
}

.progress-segment.loaded{
  background:#fff;
}

.progress-continuous{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0;
  background:#fff;
  border-radius:10px;
  transition:width .12s linear;
}

.preload{
  position:absolute;
  right:12px;
  bottom:91px;
  z-index:2900;
  width:46px;
  height:46px;
  border:0;
  border-radius:14px;
  background:rgba(20,23,29,.92);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 7px 25px rgba(0,0,0,.3);
  backdrop-filter:blur(14px);
  cursor:pointer;
}

.preload:disabled{
  opacity:.35;
  cursor:default;
}

.preload-arrow{
  width:0;
  height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:10px solid currentColor;
}

.preload.loading .preload-arrow{
  animation:spin .7s linear infinite;
}

.preload.done .preload-arrow{
  transform:rotate(180deg);
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.leaflet-control-zoom{
  margin-top:70px!important;
  margin-left:12px!important;
}

.leaflet-control-zoom a{
  background:rgba(20,23,29,.9)!important;
  color:#fff!important;
  border:0!important;
}

.oya-info{
  position:absolute;
  z-index:2200;
  left:50%;
  top:76px;
  transform:translateX(-50%);
  padding:7px 11px;
  border-radius:11px;
  background:rgba(20,23,29,.82);
  color:#fff;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
  backdrop-filter:blur(10px);
}

.oya-info.show{
  opacity:1;
}

@media(max-width:600px){
  .brand{
    padding:0 12px;
    font-size:14px;
  }

  .timeline{
    bottom:10px;
  }

  .preload{
    bottom:87px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div id="loading">Загрузка карты…</div>

<div class="topbar">
  <div class="brand">GPTrad</div>

  <div class="top-buttons">
    <button class="icon-btn" id="locationBtn" title="Моё местоположение">⌖</button>
    <button class="icon-btn" id="panelBtn" title="Слои">☰</button>
  </div>
</div>

<div class="oya-info" id="oyaInfo"></div>

<div class="panel" id="panel">
  <div class="panel-title">Слои</div>

  <label class="layer">
    <input type="radio" name="baseLayer" value="rain" checked>
    <span>Радар осадков</span>
  </label>

  <label class="layer">
    <input type="radio" name="baseLayer" value="oya">
    <span>Опасные явления</span>
  </label>

  <label class="layer">
    <input type="checkbox" id="radarCoverage">
    <span>Зоны покрытия радаров</span>
  </label>

  <label class="layer">
    <input type="checkbox" id="radarStations">
    <span>Радарные станции</span>
  </label>
</div>

<button
  id="preloadBtn"
  class="preload"
  title="Загрузить все кадры"
  aria-label="Загрузить все кадры"
>
  <span class="preload-arrow"></span>
</button>

<div class="timeline">
  <div class="timeline-row">
    <input
      id="timeSlider"
      type="range"
      min="0"
      max="0"
      value="0"
      step="1"
    >
    <div id="timeLabel">—</div>
  </div>

  <div class="progress">
    <div id="progressSegments" class="progress-segments"></div>
    <div id="progressContinuous" class="progress-continuous"></div>
  </div>
</div>

<script>
/* =========================================================
   LEAFLET LOADER
   ========================================================= */

(function(){

  function start(){

    if(!window.L){
      document.getElementById("loading").textContent =
        "Не удалось загрузить карту";
      return;
    }

    GPTradApp();

  }

  if(window.L){
    start();
    return;
  }

  const fallback=document.createElement("script");

  fallback.src=
    "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";

  fallback.onload=start;

  fallback.onerror=function(){
    document.getElementById("loading").textContent =
      "Ошибка загрузки Leaflet";
  };

  document.head.appendChild(fallback);

})();


/* =========================================================
   APPLICATION
   ========================================================= */

function GPTradApp(){

"use strict";

/* =========================================================
   MAP
   ========================================================= */

const map=L.map("map",{
  zoomControl:true,
  attributionControl:true,
  preferCanvas:true,
  zoomAnimation:true,
  fadeAnimation:false,
  markerZoomAnimation:false,
  inertia:true,
  worldCopyJump:false
}).setView([55.75,37.61],5);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    minZoom:2,
    attribution:"© OpenStreetMap contributors",
    updateWhenIdle:true,
    keepBuffer:3
  }
).addTo(map);

setTimeout(function(){
  map.invalidateSize(true);
},100);

window.addEventListener("load",function(){
  map.invalidateSize(true);
});

const loading=document.getElementById("loading");
const panel=document.getElementById("panel");
const panelBtn=document.getElementById("panelBtn");
const locationBtn=document.getElementById("locationBtn");

panelBtn.onclick=function(){
  panel.classList.toggle("open");
};

locationBtn.onclick=function(){

  if(!navigator.geolocation){
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(pos){
      map.flyTo(
        [pos.coords.latitude,pos.coords.longitude],
        Math.max(map.getZoom(),8),
        {
          duration:.8
        }
      );
    },
    function(){},
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:30000
    }
  );

};


/* =========================================================
   STATE
   ========================================================= */

let activeLayer="rain";

let rainLayer=null;

let radarCoverageLayer=L.layerGroup().addTo(map);
let radarStationsLayer=L.layerGroup().addTo(map);

radarCoverageLayer.clearLayers();
radarStationsLayer.clearLayers();

let oyaTimes=[];
let oyaImage=null;
let oyaImageBlobUrl=null;

const oyaCache=new Map();
const oyaPending=new Map();
const oyaLoadedTimes=new Set();

let oyaGeneration=0;
let oyaPreloadGeneration=0;
let oyaPreloading=false;

let oyaCurrentIndex=-1;

let oyaCapabilities=null;

const preloadBtn=document.getElementById("preloadBtn");
const timeSlider=document.getElementById("timeSlider");
const timeLabel=document.getElementById("timeLabel");

const progressSegments=
  document.getElementById("progressSegments");

const progressContinuous=
  document.getElementById("progressContinuous");

const oyaInfo=document.getElementById("oyaInfo");


/* =========================================================
   LOADING
   ========================================================= */

function showLoading(text){

  loading.textContent=text;
  loading.style.display="block";

}

function hideLoading(){

  loading.style.display="none";

}


/* =========================================================
   RAINVIEWER
   ========================================================= */

async function loadRainViewer(){

  try{

    const response=await fetch(
      "https://api.rainviewer.com/public/weather-maps.json",
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("RainViewer HTTP "+response.status);
    }

    const data=await response.json();

    const frames=[
      ...(data.radar?.past||[]),
      ...(data.radar?.nowcast||[])
    ];

    if(!frames.length){
      throw new Error("Нет кадров радара");
    }

    const latest=frames[frames.length-1];

    if(rainLayer){
      map.removeLayer(rainLayer);
      rainLayer=null;
    }

    rainLayer=L.tileLayer(
      "https://tilecache.rainviewer.com" +
      latest.path +
      "/256/{z}/{x}/{y}/2/1_1.png",
      {
        tileSize:256,
        opacity:.78,
        maxZoom:7,
        minZoom:2,
        updateWhenIdle:true,
        updateWhenZooming:false,
        keepBuffer:3,
        crossOrigin:true
      }
    );

    if(activeLayer==="rain"){
      rainLayer.addTo(map);
    }

  }catch(err){

    console.error("RainViewer:",err);

  }

}


/* =========================================================
   OYA API
   ========================================================= */

async function oyaFetch(url){

  const response=await fetch(url,{
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error(
      "OYA HTTP "+response.status
    );
  }

  return response;

}


async function loadOyaCapabilities(){

  const response=await oyaFetch(
    "/api/oya?action=capabilities"
  );

  return await response.json();

}


/* =========================================================
   EXTRACT TIMES
   ========================================================= */

function extractOyaTimes(data){

  const result=[];

  function add(value){

    if(value===undefined || value===null){
      return;
    }

    let time=value;

    if(typeof time==="object"){

      if(time.time!==undefined){
        time=time.time;
      }else if(time.datetime!==undefined){
        time=time.datetime;
      }else if(time.timestamp!==undefined){
        time=time.timestamp;
      }

    }

    if(typeof time==="number"){
      if(time>100000000000){
        time=Math.floor(time/1000);
      }

      result.push(String(time));
      return;
    }

    if(typeof time==="string"){

      const n=Number(time);

      if(Number.isFinite(n)){

        if(n>100000000000){
          result.push(String(Math.floor(n/1000)));
        }else{
          result.push(String(n));
        }

      }else{

        const d=Date.parse(time);

        if(Number.isFinite(d)){
          result.push(
            String(Math.floor(d/1000))
          );
        }

      }

    }

  }


  function walk(value,depth){

    if(depth>7 || value===null){
      return;
    }

    if(Array.isArray(value)){

      for(const item of value){
        walk(item,depth+1);
      }

      return;
    }

    if(typeof value!=="object"){
      return;
    }

    const keys=[
      "times",
      "time",
      "frames",
      "timestamps",
      "dimensions",
      "values"
    ];

    for(const key of keys){

      if(value[key]!==undefined){

        const before=result.length;

        if(Array.isArray(value[key])){

          for(const item of value[key]){
            add(item);
          }

        }else{

          add(value[key]);

        }

        if(result.length===before){
          walk(value[key],depth+1);
        }

      }

    }

    for(const key of Object.keys(value)){

      if(
        key==="times" ||
        key==="time" ||
        key==="frames" ||
        key==="timestamps"
      ){
        continue;
      }

      walk(value[key],depth+1);

    }

  }

  walk(data,0);

  const unique=[...new Set(result)];

  unique.sort(function(a,b){
    return Number(a)-Number(b);
  });

  return unique;

}


/* =========================================================
   DEFAULT OYA FRAME COUNT
   ========================================================= */

function getSavedOyaCount(){

  const raw=localStorage.getItem(
    "gptrad_oya_frame_count"
  );

  if(raw===null){
    return 50;
  }

  const value=Number(raw);

  if(
    Number.isFinite(value) &&
    value>=1 &&
    value<=500
  ){
    return Math.floor(value);
  }

  return 50;

}


/* =========================================================
   OYA TIME LIST
   ========================================================= */

function setOyaTimes(times){

  const wanted=getSavedOyaCount();

  let selected=times.slice();

  if(selected.length>wanted){

    selected=selected.slice(
      selected.length-wanted
    );

  }

  oyaTimes=selected;

  timeSlider.min=0;
  timeSlider.max=Math.max(0,oyaTimes.length-1);

  if(oyaCurrentIndex>=oyaTimes.length){
    oyaCurrentIndex=oyaTimes.length-1;
  }

  if(oyaCurrentIndex<0 && oyaTimes.length){
    oyaCurrentIndex=oyaTimes.length-1;
  }

  timeSlider.value=Math.max(
    0,
    oyaCurrentIndex
  );

  renderOyaTimeline();
  updatePreloadButton();

}


/* =========================================================
   OYA IMAGE URL
   ========================================================= */

function getOyaImageUrl(time){

  return (
    "/api/oya?action=image" +
    "&time="+encodeURIComponent(time)
  );

}


/* =========================================================
   BLOB CACHE
   ========================================================= */

function revokeOyaBlobUrl(url){

  if(!url){
    return;
  }

  try{
    URL.revokeObjectURL(url);
  }catch(e){}

}


async function fetchOyaFrame(time,generation){

  if(generation!==oyaGeneration){
    throw new Error("stale");
  }

  if(oyaCache.has(time)){
    return oyaCache.get(time);
  }

  if(oyaPending.has(time)){
    return oyaPending.get(time);
  }

  const promise=(async function(){

    const response=await oyaFetch(
      getOyaImageUrl(time)
    );

    const blob=await response.blob();

    if(generation!==oyaGeneration){
      return null;
    }

    const url=URL.createObjectURL(blob);

    oyaCache.set(time,url);
    oyaLoadedTimes.add(time);

    renderOyaTimeline();
    updatePreloadButton();

    return url;

  })().finally(function(){

    oyaPending.delete(time);

  });

  oyaPending.set(time,promise);

  return promise;

}


/* =========================================================
   OYA OVERLAY
   ========================================================= */

function makeOyaOverlay(url){

  const bounds=[
    [-85,-180],
    [85,180]
  ];

  return L.imageOverlay(
    url,
    bounds,
    {
      opacity:1,
      interactive:false,
      crossOrigin:true,
      zIndex:20
    }
  );

}


/* =========================================================
   SWAP WITHOUT BLANK
   ========================================================= */

function swapOyaOverlay(newOverlay,newBlobUrl){

  const oldImage=oyaImage;
  const oldBlobUrl=oyaImageBlobUrl;

  oyaImage=newOverlay;
  oyaImageBlobUrl=newBlobUrl;

  if(
    !oldImage ||
    !map.hasLayer(oldImage)
  ){

    if(
      oldBlobUrl &&
      oldBlobUrl!==newBlobUrl
    ){

      setTimeout(function(){

        if(
          oldBlobUrl!==oyaImageBlobUrl
        ){
          revokeOyaBlobUrl(oldBlobUrl);
        }

      },50);

    }

    return;

  }


  requestAnimationFrame(function(){

    requestAnimationFrame(function(){

      setTimeout(function(){

        if(
          oldImage &&
          oldImage!==oyaImage &&
          map.hasLayer(oldImage)
        ){

          map.removeLayer(oldImage);

        }

        if(
          oldBlobUrl &&
          oldBlobUrl!==oyaImageBlobUrl
        ){

          revokeOyaBlobUrl(oldBlobUrl);

        }

      },50);

    });

  });

}


/* =========================================================
   LOAD OYA FRAME
   ========================================================= */

async function showOyaFrame(
  index,
  options={}
){

  if(activeLayer!=="oya"){
    return;
  }

  if(!oyaTimes.length){
    return;
  }

  index=Math.max(
    0,
    Math.min(index,oyaTimes.length-1)
  );

  const time=oyaTimes[index];

  oyaCurrentIndex=index;

  timeSlider.value=index;
  updateTimeLabel(time);

  const generation=oyaGeneration;

  try{

    const url=await fetchOyaFrame(
      time,
      generation
    );

    if(
      !url ||
      generation!==oyaGeneration ||
      activeLayer!=="oya"
    ){
      return;
    }

    const overlay=makeOyaOverlay(url);

    /*
     * Не удаляем старый overlay заранее.
     * Сначала добавляем новый.
     */
    overlay.once("load",function(){

      if(
        generation!==oyaGeneration ||
        activeLayer!=="oya"
      ){

        if(map.hasLayer(overlay)){
          map.removeLayer(overlay);
        }

        return;
      }

      if(!map.hasLayer(overlay)){
        overlay.addTo(map);
      }

      swapOyaOverlay(
        overlay,
        url
      );

    });

    overlay.addTo(map);

    /*
     * ImageOverlay иногда не вызывает load,
     * если браузер отдал blob моментально.
     */
    setTimeout(function(){

      if(
        generation!==oyaGeneration ||
        activeLayer!=="oya"
      ){
        return;
      }

      if(
        !map.hasLayer(overlay)
      ){
        return;
      }

      swapOyaOverlay(
        overlay,
        url
      );

    },80);

  }catch(err){

    if(err.message!=="stale"){
      console.error(
        "OYA frame:",
        time,
        err
      );
    }

  }

}


/* =========================================================
   TIME LABEL
   ========================================================= */

function updateTimeLabel(time){

  const n=Number(time);

  if(!Number.isFinite(n)){
    timeLabel.textContent="—";
    return;
  }

  const d=new Date(n*1000);

  timeLabel.textContent=
    d.toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =========================================================
   TIMELINE
   ========================================================= */

function renderOyaTimeline(){

  progressSegments.innerHTML="";

  progressContinuous.style.width="0%";

  if(!oyaTimes.length){
    return;
  }

  const count=oyaTimes.length;

  /*
   * <=65 кадров:
   * отдельные сегменты.
   */

  if(count<=65){

    progressSegments.style.display="flex";

    progressContinuous.style.display="none";

    for(const time of oyaTimes){

      const segment=
        document.createElement("div");

      segment.className=
        "progress-segment";

      if(oyaLoadedTimes.has(time)){
        segment.classList.add("loaded");
      }

      progressSegments.appendChild(segment);

    }

  }else{

    /*
     * >65:
     * одна непрерывная линия.
     */

    progressSegments.style.display="none";

    progressContinuous.style.display="block";

    let loaded=0;

    for(const time of oyaTimes){

      if(oyaLoadedTimes.has(time)){
        loaded++;
      }

    }

    const percent=
      count ?
      (loaded/count)*100 :
      0;

    progressContinuous.style.width=
      percent+"%";

  }

}


/* =========================================================
   PRELOAD BUTTON
   ========================================================= */

function updatePreloadButton(){

  if(!preloadBtn){
    return;
  }

  const enabled=
    activeLayer==="oya" &&
    oyaTimes.length>0 &&
    oyaTimes.length<52;

  if(!enabled){

    preloadBtn.disabled=true;

    preloadBtn.setAttribute(
      "disabled",
      ""
    );

    preloadBtn.classList.remove(
      "loading",
      "done"
    );

    if(activeLayer==="oya"){

      preloadBtn.title=
        "Загрузка всех кадров доступна только до 51 кадра";

    }else{

      preloadBtn.title=
        "Загрузка всех кадров доступна только для ОЯ";

    }

    return;

  }

  if(oyaPreloading){

    preloadBtn.disabled=true;

    preloadBtn.setAttribute(
      "disabled",
      ""
    );

    preloadBtn.title=
      "Загрузка кадров…";

  }else{

    preloadBtn.disabled=false;

    preloadBtn.removeAttribute(
      "disabled"
    );

    preloadBtn.title=
      "Загрузить все кадры";

  }

  const allLoaded=
    oyaTimes.length>0 &&
    oyaTimes.every(
      time=>oyaLoadedTimes.has(time)
    );

  preloadBtn.classList.toggle(
    "done",
    !oyaPreloading && allLoaded
  );

  preloadBtn.classList.toggle(
    "loading",
    oyaPreloading
  );

}


/* =========================================================
   PRELOAD ALL
   ========================================================= */

async function preloadAllOyaFrames(){

  if(
    activeLayer!=="oya" ||
    oyaTimes.length<1 ||
    oyaTimes.length>=52 ||
    oyaPreloading
  ){
    return;
  }

  oyaPreloading=true;

  const generation=oyaGeneration;

  oyaPreloadGeneration++;

  const preloadGeneration=
    oyaPreloadGeneration;

  updatePreloadButton();

  try{

    for(const time of oyaTimes){

      if(
        generation!==oyaGeneration ||
        preloadGeneration!==oyaPreloadGeneration ||
        activeLayer!=="oya"
      ){
        break;
      }

      try{

        await fetchOyaFrame(
          time,
          generation
        );

      }catch(err){

        if(err.message==="stale"){
          break;
        }

        console.warn(
          "Не удалось загрузить кадр:",
          time,
          err
        );

      }

      renderOyaTimeline();
      updatePreloadButton();

    }

  }finally{

    if(
      generation===oyaGeneration &&
      preloadGeneration===oyaPreloadGeneration
    ){

      oyaPreloading=false;

    }

    updatePreloadButton();
    renderOyaTimeline();

  }

}

preloadBtn.addEventListener(
  "click",
  preloadAllOyaFrames
);


/* =========================================================
   VIEWPORT INVALIDATION
   ========================================================= */

function invalidateOyaViewport(){

  if(activeLayer!=="oya"){
    return;
  }

  /*
   * Останавливаем старые запросы логически.
   */
  oyaGeneration++;
  oyaPreloadGeneration++;

  /*
   * Старый overlay НЕ удаляем.
   * Он должен остаться видимым,
   * пока новый кадр не загрузится.
   */

  for(const url of oyaCache.values()){
    revokeOyaBlobUrl(url);
  }

  oyaCache.clear();
  oyaPending.clear();
  oyaLoadedTimes.clear();

  renderOyaTimeline();
  updatePreloadButton();

}


/* =========================================================
   DEBOUNCED VIEWPORT UPDATE
   ========================================================= */

let viewportTimer=null;

function scheduleOyaViewportUpdate(){

  if(activeLayer!=="oya"){
    return;
  }

  clearTimeout(viewportTimer);

  viewportTimer=setTimeout(function(){

    invalidateOyaViewport();

    if(
      oyaCurrentIndex>=0 &&
      oyaTimes.length
    ){

      showOyaFrame(
        oyaCurrentIndex
      );

    }

  },220);

}

map.on(
  "moveend zoomend",
  scheduleOyaViewportUpdate
);


/* =========================================================
   SLIDER
   ========================================================= */

let sliderTimer=null;

timeSlider.addEventListener(
  "input",
  function(){

    if(activeLayer!=="oya"){
      return;
    }

    const index=Number(
      timeSlider.value
    );

    if(!Number.isFinite(index)){
      return;
    }

    oyaCurrentIndex=index;

    const time=oyaTimes[index];

    if(time){
      updateTimeLabel(time);
    }

    clearTimeout(sliderTimer);

    sliderTimer=setTimeout(
      function(){

        showOyaFrame(
          index
        );

      },
      35
    );

  }
);


/* =========================================================
   OYA INITIALIZATION
   ========================================================= */

async function loadOya(){

  try{

    showLoading(
      "Загрузка опасных явлений…"
    );

    oyaCapabilities=
      await loadOyaCapabilities();

    const times=
      extractOyaTimes(
        oyaCapabilities
      );

    if(!times.length){

      throw new Error(
        "В capabilities не найдены времена"
      );

    }

    setOyaTimes(times);

    if(oyaTimes.length){

      await showOyaFrame(
        oyaCurrentIndex>=0 ?
        oyaCurrentIndex :
        oyaTimes.length-1
      );

    }

  }catch(err){

    console.error(
      "OYA:",
      err
    );

    oyaInfo.textContent=
      "Не удалось загрузить ОЯ";

    oyaInfo.classList.add("show");

  }

}


/* =========================================================
   LAYER SWITCH
   ========================================================= */

async function setActiveLayer(layer){

  if(layer===activeLayer){
    return;
  }

  activeLayer=layer;

  if(layer==="rain"){

    /*
     * ОЯ overlay оставляем в DOM только на момент
     * переключения? Здесь удаляем, потому что слой
     * больше не нужен.
     */

    if(oyaImage && map.hasLayer(oyaImage)){
      map.removeLayer(oyaImage);
    }

    if(rainLayer && !map.hasLayer(rainLayer)){
      rainLayer.addTo(map);
    }

    oyaInfo.classList.remove("show");

    updatePreloadButton();

    return;

  }


  if(layer==="oya"){

    if(rainLayer && map.hasLayer(rainLayer)){
      map.removeLayer(rainLayer);
    }

    updatePreloadButton();

    if(!oyaTimes.length){

      await loadOya();

    }else{

      await showOyaFrame(
        oyaCurrentIndex>=0 ?
        oyaCurrentIndex :
        oyaTimes.length-1
      );

    }

    return;

  }

}


/* =========================================================
   RADIO BUTTONS
   ========================================================= */

document
  .querySelectorAll(
    'input[name="baseLayer"]'
  )
  .forEach(function(input){

    input.addEventListener(
      "change",
      function(){

        if(this.checked){
          setActiveLayer(
            this.value
          );
        }

      }
    );

  });


/* =========================================================
   RADAR STATIONS
   ========================================================= */

const radarStations=[
  [64.54,40.54,"Архангельск"],
  [48.72,44.51,"Волгоград"],
  [55.79,49.12,"Казань"],
  [56.84,60.61,"Екатеринбург"],
  [55.03,82.92,"Новосибирск"],
  [59.93,30.32,"Санкт-Петербург"],
  [55.75,37.61,"Москва"],
  [43.12,131.90,"Владивосток"],
  [51.67,39.21,"Воронеж"],
  [54.74,20.51,"Калининград"]
];

function renderRadarStations(){

  radarStationsLayer.clearLayers();

  for(const station of radarStations){

    const marker=
      L.circleMarker(
        [station[0],station[1]],
        {
          radius:5,
          weight:2,
          fillOpacity:.9
        }
      );

    marker.bindTooltip(
      station[2],
      {
        direction:"top"
      }
    );

    radarStationsLayer.addLayer(
      marker
    );

  }

}


/* =========================================================
   RADAR COVERAGE
   ========================================================= */

function renderRadarCoverage(){

  radarCoverageLayer.clearLayers();

  for(const station of radarStations){

    const circle=
      L.circle(
        [station[0],station[1]],
        {
          radius:150000,
          weight:1,
          fillOpacity:.06
        }
      );

    radarCoverageLayer.addLayer(
      circle
    );

  }

}

renderRadarStations();
renderRadarCoverage();


/* =========================================================

document

  .addEventListener(

          radarCoverageLayer
