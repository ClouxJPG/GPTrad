<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPTrad</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#111;
}

#map{
position:absolute;
inset:0;
z-index:1;
}

/* =========================================================
   TOP
========================================================= */

.top-panel{
position:absolute;
top:12px;
left:12px;
right:12px;
height:54px;
z-index:1000;

display:flex;
align-items:center;
gap:8px;
padding:6px;

background:rgba(28,28,28,.90);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,.25);
}

.logo{
color:white;
font-size:25px;
font-weight:700;
white-space:nowrap;
margin-left:8px;
margin-right:8px;
}

#selectedLayer{
flex:1;
min-width:0;
height:42px;

border:0;
outline:0;
border-radius:12px;

background:#292929;
color:white;

padding:0 14px;

font-size:17px;
font-weight:650;

text-align:left;

display:flex;
align-items:center;
justify-content:space-between;

gap:8px;
}

#selectedLayerName{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

#selectedLayerArrow{
flex:none;
font-size:14px;
opacity:.7;
transition:transform .25s ease;
}

#selectedLayer.open #selectedLayerArrow{
transform:rotate(180deg);
}

.icon-btn{
flex:none;

width:42px;
height:42px;

border:0;
outline:0;
border-radius:12px;

background:#292929;
color:white;

font-size:21px;

display:flex;
align-items:center;
justify-content:center;

transition:transform .15s ease;
}

.icon-btn:active{
transform:scale(.94);
}

/* =========================================================
   DRAWER
========================================================= */

#layerDrawer{
position:absolute;

top:72px;
left:50%;

width:calc(100% - 24px);
max-width:520px;

z-index:1100;

transform:translate(-50%,-18px) scale(.98);
opacity:0;
pointer-events:none;

padding:10px;

border-radius:15px;

background:rgba(25,25,25,.96);

backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);

box-shadow:0 10px 35px rgba(0,0,0,.35);

transition:
transform .28s cubic-bezier(.22,.61,.36,1),
opacity .22s ease;
}

#layerDrawer.open{
transform:translate(-50%,0) scale(1);
opacity:1;
pointer-events:auto;
}

.drawer-header{
color:white;
font-size:14px;
font-weight:700;
padding:4px 7px 9px;
}

.layer-item{
width:100%;
min-height:48px;

border:0;
outline:0;
border-radius:11px;

background:#303030;
color:white;

display:flex;
align-items:center;
gap:10px;

padding:10px 12px;
margin-bottom:7px;

font-size:15px;
text-align:left;

transition:
background .15s ease,
transform .15s ease;
}

.layer-item:last-child{
margin-bottom:0;
}

.layer-item:active{
transform:scale(.985);
}

.layer-item.active{
background:#3b3b3b;
}

.layer-dot{
width:10px;
height:10px;
flex:none;
border-radius:50%;
background:#777;
}

.layer-item.active .layer-dot{
background:#36d67a;
box-shadow:0 0 8px rgba(54,214,122,.55);
}

/* =========================================================
   STATUS
========================================================= */

#status{
position:absolute;
left:14px;
top:74px;

z-index:900;

padding:6px 10px;

border-radius:8px;

background:rgba(20,20,20,.78);
color:white;

font-size:12px;

pointer-events:none;
opacity:.9;
}

/* =========================================================
   SETTINGS
========================================================= */

#settings{
position:absolute;

left:12px;
top:74px;

width:240px;

z-index:1200;

padding:12px;

border-radius:14px;

background:rgba(20,20,20,.96);
color:white;

box-shadow:0 8px 30px rgba(0,0,0,.35);

opacity:0;
visibility:hidden;
pointer-events:none;

transform:translateY(-10px) scale(.97);

max-height:0;
overflow:hidden;

transition:
opacity .25s ease,
transform .28s cubic-bezier(.22,.61,.36,1),
max-height .32s ease,
visibility 0s linear .32s;
}

#settings.open{
opacity:1;
visibility:visible;
pointer-events:auto;

transform:translateY(0) scale(1);

max-height:500px;

transition:
opacity .25s ease,
transform .28s cubic-bezier(.22,.61,.36,1),
max-height .32s ease,
visibility 0s linear 0s;
}

.settings-title{
font-size:15px;
font-weight:700;
margin-bottom:10px;
}

.settings-section{
margin-bottom:7px;
}

.settings-section:last-child{
margin-bottom:0;
}

.settings-section-btn{
width:100%;

height:40px;

border:0;
outline:0;

border-radius:10px;

background:#292929;
color:white;

font-size:14px;
font-weight:600;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 11px;

transition:
background .15s ease,
transform .15s ease;
}

.settings-section-btn:active{
transform:scale(.98);
}

.settings-section-arrow{
font-size:12px;
opacity:.65;

transition:
transform .25s ease;
}

.settings-section.open
.settings-section-arrow{
transform:rotate(180deg);
}

.settings-subpanel{
max-height:0;
opacity:0;

overflow:hidden;

transform:translateY(-4px);

transition:
max-height .3s ease,
opacity .2s ease,
transform .25s ease;

padding:0 2px;
}

.settings-section.open
.settings-subpanel{
max-height:180px;
opacity:1;

transform:translateY(0);

padding-top:7px;
padding-bottom:2px;
}

.theme-btn{
width:100%;

border:0;
outline:0;

padding:9px 10px;

margin-bottom:6px;

border-radius:9px;

background:#292929;
color:white;

text-align:left;

font-size:13px;
}

.theme-btn:last-child{
margin-bottom:0;
}

/* =========================================================
   FRAME COUNT
========================================================= */

.frame-count-row{
display:flex;
align-items:center;
gap:6px;

padding:3px 1px 2px;
}

#frameCountSlider{
flex:1;
min-width:0;
}

#frameCountValue{
min-width:34px;

text-align:center;

font-size:13px;
font-weight:700;
color:white;
}

.frame-count-arrow{
width:26px;
height:26px;

flex:none;

border:0;
outline:0;

border-radius:7px;

background:#292929;
color:white;

font-size:11px;

display:flex;
align-items:center;
justify-content:center;

padding:0;

transition:
transform .15s ease,
background .15s ease;
}

.frame-count-arrow:active{
transform:scale(.9);
}

.frame-count-arrow:disabled{
opacity:.35;
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline{
position:absolute;

left:50%;
bottom:14px;

transform:translateX(-50%);

width:min(680px,calc(100vw - 28px));

z-index:1000;

padding:8px 12px 9px;

border-radius:15px;

background:rgba(20,20,20,.90);

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.timeline-play{
width:100%;

display:flex;
justify-content:center;
align-items:center;

gap:7px;

margin-bottom:6px;
}

#playBtn{
width:38px;
height:30px;

border:0;
outline:0;

border-radius:8px;

background:#292929;
color:white;

font-size:14px;

display:flex;
align-items:center;
justify-content:center;

transition:
transform .15s ease,
background .15s ease;
}

#playBtn:active{
transform:scale(.92);
}

/* =========================================================
   PRELOAD BUTTON
========================================================= */

#preloadBtn{
width:34px;
height:30px;

flex:none;

border:0;
outline:0;

border-radius:8px;

background:#292929;
color:white;

display:flex;
align-items:center;
justify-content:center;

padding:0;

transition:
transform .15s ease,
background .18s ease,
opacity .2s ease;
}

#preloadBtn:active{
transform:scale(.91);
}

#preloadBtn:disabled{
opacity:.30;
}

/* Одна цельная стрелка */

.download-icon{
width:15px;
height:18px;

display:block;

background:currentColor;

clip-path:polygon(
38% 0%,
62% 0%,
62% 55%,
100% 55%,
50% 100%,
0% 55%,
38% 55%
);

-webkit-clip-path:polygon(
38% 0%,
62% 0%,
62% 55%,
100% 55%,
50% 100%,
0% 55%,
38% 55%
);
}

#preloadBtn.loading .download-icon{
animation:downloadFloat .7s ease-in-out infinite;
}

@keyframes downloadFloat{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(2px);
}

}

#preloadBtn.done{
background:#315f45;
}

body.light #preloadBtn{
background:#eeeeee;
color:#111;
}

body.light #preloadBtn.done{
background:#d9eee1;
}

body.green #preloadBtn{
background:#123d29;
color:white;
}

body.green #preloadBtn.done{
background:#185538;
}

/* =========================================================
   TIMELINE CONTROLS
========================================================= */

.timeline-controls{
display:flex;
align-items:center;
gap:7px;
}

.timeline-arrow{
width:36px;
height:32px;

flex:none;

border:0;
outline:0;

border-radius:8px;

background:#292929;
color:white;

font-size:15px;

display:flex;
align-items:center;
justify-content:center;

transition:transform .15s ease;
}

.timeline-arrow:active{
transform:scale(.92);
}

.timeline-slider-wrap{
position:relative;

flex:1;
min-width:0;

height:18px;

display:flex;
align-items:center;
}

/* =========================================================
   OYA TIMELINE
========================================================= */

#oyaTimelineSegments{
position:absolute;

left:0;
right:0;
top:2px;

height:14px;

display:flex;
align-items:center;

gap:2px;

pointer-events:none;

overflow:hidden;

z-index:1;
}

.oya-segment{
flex:1;
min-width:0;

height:14px;

border-radius:3px;

background:#666;

opacity:.95;

transition:
background .18s ease,
transform .12s ease,
opacity .18s ease;
}

.oya-segment.loaded{
background:#45c9ef;
}

.oya-segment.current{
transform:scaleY(1.08);
filter:brightness(1.15);
}

/* =========================================================
   LONG OYA PROGRESS
========================================================= */

#oyaLongProgress{
position:absolute;

left:0;
right:0;
top:5px;

height:6px;

border-radius:999px;

background:#666;

overflow:hidden;

pointer-events:none;

z-index:1;

display:none;
}

#oyaLongProgressFill{
position:absolute;

left:0;
top:0;
bottom:0;

width:0%;

background:#45c9ef;

border-radius:999px;

transition:width .12s linear;
}

#timeSlider{
position:relative;

z-index:3;

width:100%;
min-width:0;

margin:0;

background:transparent;

appearance:none;
-webkit-appearance:none;
}

/* Chrome / Safari */

#timeSlider::-webkit-slider-runnable-track{
height:14px;

background:transparent;

border:0;
}

#timeSlider::-webkit-slider-thumb{
-webkit-appearance:none;

width:18px;
height:18px;

margin-top:-2px;

border-radius:50%;

border:2px solid white;

background:#fff;

box-shadow:0 1px 5px rgba(0,0,0,.45);
}

/* Firefox */

#timeSlider::-moz-range-track{
height:14px;

background:transparent;

border:0;
}

#timeSlider::-moz-range-thumb{
width:18px;
height:18px;

border-radius:50%;

border:2px solid white;

background:#fff;
}

/* LIGHT */

body.light .oya-segment{
background:#c8c8c8;
}

body.light .oya-segment.loaded{
background:#49b9df;
}

body.light #oyaLongProgress{
background:#c8c8c8;
}

body.light #oyaLongProgressFill{
background:#49b9df;
}

/* GREEN */

body.green .oya-segment{
background:#315f45;
}

body.green .oya-segment.loaded{
background:#69c98a;
}

body.green #oyaLongProgress{
background:#315f45;
}

body.green #oyaLongProgressFill{
background:#69c98a;
}

body.green .oya-segment.current{
filter:brightness(1.1);
}

#timeLabel{
width:100%;

margin-top:5px;

text-align:center;

color:white;
font-size:11px;
opacity:.85;
}

/* =========================================================
   LOADING
========================================================= */

#loading{
position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

z-index:2000;

display:none;

padding:9px 13px;

border-radius:10px;

background:rgba(20,20,20,.92);

color:white;

font-size:13px;
}

/* =========================================================
   LIGHT
========================================================= */

body.light .top-panel,
body.light #layerDrawer,
body.light #settings,
body.light .timeline,
body.light #status{
background:rgba(255,255,255,.94);
}

body.light .logo,
body.light #status,
body.light .drawer-header{
color:#111;
}

body.light #selectedLayer,
body.light .icon-btn,
body.light .layer-item,
body.light .timeline-arrow,
body.light #playBtn,
body.light .theme-btn,
body.light .settings-section-btn,
body.light .frame-count-arrow{
background:#eeeeee;
color:#111;
}

body.light .layer-item.active{
background:#dddddd;
}

body.light #frameCountValue{
color:#111;
}

/* =========================================================
   GREEN
========================================================= */

body.green .top-panel,
body.green #layerDrawer,
body.green #settings,
body.green .timeline,
body.green #status{
background:rgba(8,35,22,.94);
}

body.green #selectedLayer,
body.green .icon-btn,
body.green .layer-item,
body.green .timeline-arrow,
body.green #playBtn,
body.green .theme-btn,
body.green .settings-section-btn,
body.green .frame-count-arrow{
background:#123d29;
color:white;
}

body.green .layer-item.active{
background:#185538;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

.top-panel{
top:8px;
left:8px;
right:8px;
height:54px;
gap:5px;
}

.logo{
font-size:21px;
margin-left:6px;
margin-right:3px;
}

#selectedLayer{
height:42px;
padding:0 11px;
font-size:16px;
}

.icon-btn{
width:38px;
height:38px;
border-radius:11px;
font-size:19px;
}

#layerDrawer{
top:70px;
width:calc(100% - 16px);
}

#status{
top:68px;
left:9px;
}

#settings{
left:8px;
top:68px;
width:235px;
}

.timeline{
bottom:8px;
width:calc(100vw - 16px);
}

#timeLabel{
font-size:10px;
}

.timeline-arrow{
width:35px;
}

}

</style>
</head>

<body>

<div id="map"></div>

<div class="top-panel">

<div class="logo">
GPTrad
</div>

<button id="selectedLayer">

<span id="selectedLayerName">
Радар (RainViewer)
</span>

<span id="selectedLayerArrow">
▾
</span>

</button>

<button id="locateBtn" class="icon-btn">
⌖
</button>

<button id="reloadBtn" class="icon-btn">
↻
</button>

<button id="settingsBtn" class="icon-btn">
⚙
</button>

</div>

<div id="layerDrawer">

<div class="drawer-header">
Слои
</div>

<button class="layer-item active"
data-layer="radar">

<span class="layer-dot"></span>

<span>
Радар (RainViewer)
</span>

</button>

<button class="layer-item"
data-layer="oya">

<span class="layer-dot"></span>

<span>
Опасные явления
</span>

</button>

</div>

<div id="status">
Загрузка…
</div>

<div id="settings">

<div class="settings-title">
Настройки
</div>

<div class="settings-section"
id="appearanceSection">

<button class="settings-section-btn"
id="appearanceToggle">

<span>
Оформление
</span>

<span class="settings-section-arrow">
▾
</span>

</button>

<div class="settings-subpanel">

<button class="theme-btn"
data-theme="dark">
Тёмная
</button>

<button class="theme-btn"
data-theme="light">
Светлая
</button>

<button class="theme-btn"
data-theme="green">
Зелёная
</button>

</div>

</div>

<div class="settings-section"
id="frameCountSection">

<button class="settings-section-btn"
id="frameCountToggle">

<span>
Кол. кадров
</span>

<span class="settings-section-arrow">
▾
</span>

</button>

<div class="settings-subpanel">

<div class="frame-count-row">

<button
id="frameCountPrev"
class="frame-count-arrow">
◀
</button>

<input
id="frameCountSlider"
type="range"
min="1"
max="1"
value="50">

<div id="frameCountValue">
50
</div>

<button
id="frameCountNext"
class="frame-count-arrow">
▶
</button>

</div>

</div>

</div>

</div>

<div class="timeline">

<div class="timeline-play">

<button id="playBtn">
▶
</button>

<button
id="preloadBtn"
title="Загрузить все кадры"
aria-label="Загрузить все кадры">

<span class="download-icon"></span>

</button>

</div>

<div class="timeline-controls">

<button id="backBtn"
class="timeline-arrow">
◀
</button>

<div class="timeline-slider-wrap">

<div id="oyaTimelineSegments"></div>

<div id="oyaLongProgress">
<div id="oyaLongProgressFill"></div>
</div>

<input id="timeSlider"
type="range"
min="0"
max="0"
value="0">

</div>

<button id="forwardBtn"
class="timeline-arrow">
▶
</button>

</div>

<div id="timeLabel">
—
</div>

</div>

<div id="loading">
Загрузка…
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   MAP
========================================================= */

const map=L.map("map",{

zoomControl:true,
attributionControl:true,

zoomSnap:0,
zoomDelta:.5,

zoomAnimation:false,
fadeAnimation:false,
markerZoomAnimation:false,
zoomAnimationThreshold:0,

touchZoom:true,
scrollWheelZoom:true,

wheelDebounceTime:20,
wheelPxPerZoomLevel:80,

doubleClickZoom:true,

dragging:true,
inertia:true,
inertiaDeceleration:3000,
easeLinearity:.2,

minZoom:2,
maxZoom:19

}).setView(
[55.75,37.61],
5
);

/* =========================================================
   OSM
========================================================= */

const osmLayer=L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

minZoom:2,
maxZoom:19,

tileSize:256,

updateWhenIdle:true,
updateWhenZooming:false,

keepBuffer:3,

attribution:"© OpenStreetMap"

}
).addTo(map);

/* =========================================================
   ELEMENTS
========================================================= */

const selectedLayer=
document.getElementById("selectedLayer");

const selectedLayerName=
document.getElementById("selectedLayerName");

const layerDrawer=
document.getElementById("layerDrawer");

const status=
document.getElementById("status");

const loading=
document.getElementById("loading");

const timeSlider=
document.getElementById("timeSlider");

const oyaTimelineSegments=
document.getElementById("oyaTimelineSegments");

const oyaLongProgress=
document.getElementById("oyaLongProgress");

const oyaLongProgressFill=
document.getElementById("oyaLongProgressFill");

const timeLabel=
document.getElementById("timeLabel");

const settings=
document.getElementById("settings");

const appearanceSection=
document.getElementById("appearanceSection");

const appearanceToggle=
document.getElementById("appearanceToggle");

const frameCountSection=
document.getElementById("frameCountSection");

const frameCountToggle=
document.getElementById("frameCountToggle");

const frameCountSlider=
document.getElementById("frameCountSlider");

const frameCountValue=
document.getElementById("frameCountValue");

const frameCountPrev=
document.getElementById("frameCountPrev");

const frameCountNext=
document.getElementById("frameCountNext");

const playBtn=
document.getElementById("playBtn");

const preloadBtn=
document.getElementById("preloadBtn");

/* =========================================================
   STATE
========================================================= */

let activeLayer="radar";

let radarLayer=null;

let rainFrames=[];

let currentFrame=0;

/* =========================================================
   OYA STATE
========================================================= */

let oyaAllTimes=[];
let oyaTimes=[];

let oyaFrameCount=50;

let oyaFrameIndex=0;

let oyaImage=null;

let oyaImageBlobUrl=null;

const oyaLoadedTimes=new Set();

const oyaFrameCache=new Map();

const oyaPendingRequests=new Map();

let oyaCapabilitiesLoaded=false;
let oyaCapabilitiesLoading=false;

let oyaCacheGeneration=0;
let oyaPreloadGeneration=0;

let oyaPreloading=false;

let oyaViewportKey="";

let playing=false;
let playTimer=null;

let oyaFrameRequestId=0;
let rainFrameRequestId=0;

/* =========================================================
   HELPERS
========================================================= */

function setStatus(text){
status.textContent=text;
}

function showLoading(text){
loading.textContent=text;
loading.style.display="block";
}

function hideLoading(){
loading.style.display="none";
}

function formatTime(ts){

if(!ts)
return"—";

return new Date(ts*1000)
.toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

/* =========================================================
   VIEWPORT DATA
========================================================= */

function getCurrentViewportData(){

const bounds=map.getBounds();

const sw=bounds.getSouthWest();
const ne=bounds.getNorthEast();

const size=map.getSize();

const width=Math.max(
256,
Math.min(
1600,
Math.round(size.x)
)
);

const height=Math.max(
256,
Math.min(
1200,
Math.round(size.y)
)
);

const key=[
sw.lat.toFixed(5),
sw.lng.toFixed(5),
ne.lat.toFixed(5),
ne.lng.toFixed(5),
width,
height
].join("|");

return{
bounds,
width,
height,
key
};

}

/* =========================================================
   CACHE URL
========================================================= */

function cacheContainsBlobUrl(blobUrl){

if(!blobUrl)
return false;

for(
const value of oyaFrameCache.values()
){

if(
value &&
value.blobUrl===blobUrl
){

========================================================= */

function revokeOyaBlobUrl(blobUrl){

if(!blobUrl)
return;

if(
blobUrl===oyaImageBlobUrl
){

return;

}

if(
cacheContainsBlobUrl(blobUrl)
){

return;

}

try{

URL.revokeObjectURL(blobUrl);

}catch(error){

"OYA revoke:",
error
);

}

}

/* =========================================================
   ISO → UNIX
========================================================= */

function isoToUnix(value){

const t=Date.parse(value);

if(Number.isNaN(t))
return null;

return Math.floor(t/1000);

}

/* =========================================================
   PARSE OYA TIMES
========================================================= */

function parseOyaTimes(text){

if(!text)
return[];

const result=[];

const parts=text
.split(",")
.map(x=>x.trim())
.filter(Boolean);

for(
const value of parts
){

const unix=isoToUnix(value);

if(unix!==null){

result.push(unix);

}

}

return[
...new Set(result)
].sort(
(a,b)=>a-b
);

}

/* =========================================================
   WEB MERCATOR
========================================================= */

function lonToMercator(lon){

return lon*
20037508.34/
180;

}

function latToMercator(lat){

lat=Math.max(
-85.05112878,
Math.min(
85.05112878,
lat
)
);

return 6378137*
Math.log(
Math.tan(
Math.PI/4+
lat*Math.PI/360
)
);

}

/* =========================================================

function getOyaRequestData(timeValue){

const viewport=
getCurrentViewportData();

const bounds=
viewport.bounds;

bounds.getSouthWest();

bounds.getNorthEast();

const width=
viewport.width;

].join(",");

const params=
new URLSearchParams({

WIDTH:String(width),

EXCEPTIONS:
"application/vnd.ogc.se_inimage",

timeValue*1000
).toISOString()

});

url:
OYA_PROXY+
"?"+
params.toString(),

bounds,
width,
height,

viewportKey:
viewport.key

};

}

/* =========================================================
   READY OYA OVERLAY
========================================================= */

function createReadyOyaOverlay(
blobUrl,
bounds
){

return new Promise(
(resolve,reject)=>{

const overlay=
L.imageOverlay(
blobUrl,
bounds,
{

opacity:.75,

interactive:false,

zIndex:60

}
);

let finished=false;

function cleanup(){

overlay.off(
"load",
onLoad
);

overlay.off(
"error",
onError
);

}

function onLoad(){

if(finished)
return;

finished=true;

cleanup();

resolve(overlay);

}

function onError(){

if(finished)
return;

finished=true;

cleanup();

if(
map.hasLayer(overlay)
){

map.removeLayer(
overlay
);

}

reject(
new Error(
"Ошибка отображения OYA"
)
);

}

overlay.once(
"load",
onLoad
);

overlay.once(
"error",
onError
);

overlay.addTo(map);

const image=
overlay.getElement();

if(
image &&
image.complete &&
image.naturalWidth>0
){

setTimeout(
onLoad,
0
);

}

}

);

}

/* =========================================================
   SWAP OYA OVERLAY
========================================================= */

/*
Настоящий double-buffer.

Новый кадр сначала полностью
добавляется поверх старого.

Старый кадр удаляется только после
двух animation frame + небольшой задержки.

Это предотвращает видимый промежуток
между кадрами при быстром переключении.
*/

function swapOyaOverlay(
newOverlay,
newBlobUrl
){

const oldImage=
oyaImage;

const oldBlobUrl=
oyaImageBlobUrl;

oyaImage=
newOverlay;

oyaImageBlobUrl=
newBlobUrl;

/*
Если старого кадра нет,
новый просто остаётся на карте.
*/

if(
!oldImage ||
!map.hasLayer(oldImage)
){

if(
oldBlobUrl &&
oldBlobUrl!==newBlobUrl
){

setTimeout(
()=>{

if(
oldBlobUrl!==oyaImageBlobUrl
){

revokeOyaBlobUrl(
oldBlobUrl
);

}

},
50
);

}

return;

}

/*
Два кадра отрисовки дают браузеру
возможность реально показать новый
overlay поверх старого.
*/

requestAnimationFrame(
()=>{

requestAnimationFrame(
()=>{

setTimeout(
()=>{

if(
oldImage &&
oldImage!==oyaImage &&
map.hasLayer(oldImage)
){

map.removeLayer(
oldImage
);

}

if(
oldBlobUrl &&
oldBlobUrl!==oyaImageBlobUrl
){

revokeOyaBlobUrl(
oldBlobUrl
);

}

},
50
);

}
);

}

}

/* =========================================================
   PRELOAD ONE FRAME
========================================================= */

async function preloadOyaFrame(
timeValue,
preloadGeneration,
cacheGeneration
){

if(
preloadGeneration!==oyaPreloadGeneration ||
cacheGeneration!==oyaCacheGeneration ||
activeLayer!=="oya"
){

return false;

}

const requestData=
getOyaRequestData(
timeValue
);

const cacheKey=
makeOyaCacheKey(
timeValue,
requestData.bounds,
requestData.width,
requestData.height
);

const cached=
oyaFrameCache.get(
cacheKey
);

if(
cached &&
cached.blobUrl
){

if(
preloadGeneration===oyaPreloadGeneration &&
cacheGeneration===oyaCacheGeneration &&
activeLayer==="oya"
){

oyaLoadedTimes.add(
timeValue
);

}

return true;

}

if(
oyaPendingRequests.has(cacheKey)
){

try{

const result=
await oyaPendingRequests.get(
cacheKey
);

if(
result &&
preloadGeneration===oyaPreloadGeneration &&
cacheGeneration===oyaCacheGeneration &&
activeLayer==="oya"
){

oyaLoadedTimes.add(
timeValue
);

return true;

}

}catch(error){

console.error(
"OYA pending preload:",
error
);

}

return false;

}

const promise=
(async()=>{

let blobUrl=null;

try{

const response=
await fetch(
requestData.url,
{
cache:"force-cache"
}
);

if(!response.ok){

throw new Error(
"OYA preload "+response.status
);

}

const blob=
await response.blob();

if(
preloadGeneration!==oyaPreloadGeneration ||
cacheGeneration!==oyaCacheGeneration ||
activeLayer!=="oya"
){

return null;

}

blobUrl=
URL.createObjectURL(
blob
);

oyaFrameCache.set(
cacheKey,
{
blobUrl,
timeValue,
viewportKey:
requestData.viewportKey
}
);

oyaLoadedTimes.add(
timeValue
);

return{

blobUrl,

bounds:
requestData.bounds,

viewportKey:
requestData.viewportKey

};

}catch(error){

if(blobUrl){

revokeOyaBlobUrl(
blobUrl
);

}

console.error(
"OYA preload frame:",
timeValue,
error
);

return null;

}

})();

oyaPendingRequests.set(
cacheKey,
promise
);

try{

return !!(
await promise
);

}finally{

if(
oyaPendingRequests.get(cacheKey)===promise
){

oyaPendingRequests.delete(cacheKey);

}

}

}

/* =========================================================
   OYA CAPABILITIES
========================================================= */

async function loadOyaCapabilities(){

if(
oyaCapabilitiesLoaded &&
oyaAllTimes.length
){

return true;

}

if(oyaCapabilitiesLoading){

while(oyaCapabilitiesLoading){

await new Promise(
resolve=>
setTimeout(
resolve,
50
)
);

}

return(
oyaCapabilitiesLoaded &&
oyaAllTimes.length>0
);

}

oyaCapabilitiesLoading=true;

setStatus(
"Получение времени ОЯ…"
);

try{

const response=
await fetch(
OYA_PROXY+
"?action=capabilities",
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Capabilities "+response.status
);

}

const xmlText=
await response.text();

const parser=
new DOMParser();

const xml=
parser.parseFromString(
xmlText,
"text/xml"
);

if(
xml.querySelector("parsererror")
){

throw new Error(
"Ошибка XML"
);

}

let times=[];

const layers=
Array.from(
xml.getElementsByTagName(
"Layer"
)
);

for(
const layer of layers
){

const nameNode=
Array.from(
layer.children
)
.find(
node=>
node.localName==="Name"
);

if(!nameNode)
continue;

const name=
nameNode.textContent.trim();

if(
name!=="bufr_phenomena" &&
!name.startsWith(
"bufr_phenomena"
)
){

continue;

}

const extentNodes=
Array.from(
layer.children
)
.filter(
node=>
node.localName==="Extent" ||
node.localName==="Dimension"
);

for(
const node of extentNodes
){

const name=
node.getAttribute("name");

if(
name &&
name.toLowerCase()!=="time"
)
continue;

const parsed=
parseOyaTimes(
node.textContent.trim()
);

if(parsed.length){

times.push(
...parsed
);

}

}

const descendants=
Array.from(
layer.getElementsByTagName("*")
);

for(
const node of descendants
){

if(
node.localName!=="Extent" &&
node.localName!=="Dimension"
)
continue;

const name=
node.getAttribute("name");

if(
name &&
name.toLowerCase()!=="time"
)
continue;

const parsed=
parseOyaTimes(
node.textContent.trim()
);

if(parsed.length){

times.push(
...parsed
);

}

}

}

/* =====================================================
   INTERVAL
===================================================== */

if(!times.length){

for(
const node of
Array.from(
xml.getElementsByTagName("*")
)
){

if(
node.localName!=="Extent" &&
node.localName!=="Dimension"
)
continue;

const name=
node.getAttribute("name");

if(
name &&
name.toLowerCase()!=="time"
)
continue;

const value=
node.textContent.trim();

if(!value.includes("/"))
continue;

const parts=
value.split("/");

if(parts.length<2)
continue;

const start=
isoToUnix(parts[0]);

const end=
isoToUnix(parts[1]);

if(
start===null ||
end===null
)
continue;

let step=600;

if(parts[2]){

const match=
parts[2].match(
/PT(\d+)M/i
);

if(match){

step=
Math.max(
60,
Number(match[1])*60
);

}

}

for(
let t=start;
t<=end;
t+=step
){

times.push(t);

}

}

}

times=[
...new Set(times)
].sort(
(a,b)=>a-b
);

if(!times.length){

throw new Error(
"В GetCapabilities нет времени"
);

}

oyaAllTimes=times;

oyaCapabilitiesLoaded=true;

const savedCount=
Number(
localStorage.getItem(
"gptrad-oya-frame-count"
)
);

if(
Number.isFinite(savedCount) &&
savedCount>=1
){

oyaFrameCount=
Math.min(
savedCount,
oyaAllTimes.length
);

}else{

oyaFrameCount=
Math.min(
50,
oyaAllTimes.length
);

}

frameCountSlider.min=1;

frameCountSlider.max=
oyaAllTimes.length;

frameCountSlider.value=
oyaFrameCount;

frameCountValue.textContent=
oyaFrameCount;

applyOyaFrameCount(
oyaFrameCount,
false
);

setStatus(
"Опасные явления"
);

updatePreloadButton();

return true;

}catch(error){

console.error(
"OYA capabilities:",
error
);

setStatus(
"Ошибка времени ОЯ"
);

return false;

}finally{

oyaCapabilitiesLoading=false;

}

}

/* =========================================================
   APPLY FRAME COUNT
========================================================= */

function applyOyaFrameCount(
count,
preserveCurrent=true
){

if(!oyaAllTimes.length)
return;

const oldTime=
preserveCurrent &&
oyaTimes.length &&
oyaTimes[oyaFrameIndex]
?
oyaTimes[oyaFrameIndex]
:null;

oyaFrameCount=
Math.max(
1,
Math.min(
Number(count),
oyaAllTimes.length
)
);

oyaTimes=
oyaAllTimes.slice(
-oyaFrameCount
);

let newIndex=
oyaTimes.length-1;

if(oldTime!==null){

const found=
oyaTimes.indexOf(
oldTime
);

if(found!==-1){

newIndex=found;

}

}

oyaFrameIndex=
newIndex;

localStorage.setItem(
"gptrad-oya-frame-count",
String(oyaFrameCount)
);

frameCountSlider.min=1;

frameCountSlider.max=
oyaAllTimes.length;

frameCountSlider.value=
oyaFrameCount;

frameCountValue.textContent=
oyaFrameCount;

if(activeLayer==="oya"){

setOyaTimeline();

}else{

updatePreloadButton();

}

}

);

if(
requestId!==oyaFrameRequestId ||
generation!==oyaCacheGeneration ||
activeLayer!=="oya" ||
oyaTimes[oyaFrameIndex]!==timeValue
){

if(
map.hasLayer(newOverlay)
){

map.removeLayer(
newOverlay
);

}

return;

}

swapOyaOverlay(
newOverlay,
cached.blobUrl
);

oyaLoadedTimes.add(
timeValue
);

renderOyaTimeline();

setStatus(
"Опасные явления"
);

}catch(error){

console.error(
"OYA cached display:",
error
);

}

return;

}

/* =====================================================
   PENDING
===================================================== */

if(
oyaPendingRequests.has(cacheKey)
){

try{

const result=
await oyaPendingRequests.get(
cacheKey
);

if(!result)
return;

if(
requestId!==oyaFrameRequestId ||
generation!==oyaCacheGeneration ||
activeLayer!=="oya" ||
oyaTimes[oyaFrameIndex]!==timeValue
){

return;

}

const newOverlay=
await createReadyOyaOverlay(
result.blobUrl,
requestData.bounds
);

if(
requestId!==oyaFrameRequestId ||
generation!==oyaCacheGeneration ||
activeLayer!=="oya" ||
oyaTimes[oyaFrameIndex]!==timeValue
){

if(
map.hasLayer(newOverlay)
){

map.removeLayer(
newOverlay
);

}

return;

}

swapOyaOverlay(
newOverlay,
result.blobUrl
);

oyaLoadedTimes.add(
timeValue
);

renderOyaTimeline();

setStatus(
"Опасные явления"
);

}catch(error){

console.error(
"OYA pending:",
error
);

}

return;

}

/* =====================================================
   NEW REQUEST
===================================================== */

setStatus(
"Загрузка ОЯ…"
);

const promise=
(async()=>{

let blobUrl=null;

try{

const response=
await fetch(
requestData.url,
{
cache:"force-cache"
}
);

if(!response.ok){

throw new Error(
"OYA image "+response.status
);

}

const blob=
await response.blob();

if(
generation!==oyaCacheGeneration ||
activeLayer!=="oya"
){

return null;

}

blobUrl=
URL.createObjectURL(
blob
);

oyaFrameCache.set(
cacheKey,
{
blobUrl,
timeValue,
viewportKey:
requestData.viewportKey
}
);

if(
requestData.viewportKey===oyaViewportKey
){

oyaLoadedTimes.add(
timeValue
);

}

renderOyaTimeline();

return{

blobUrl,

bounds:
requestData.bounds,

viewportKey:
requestData.viewportKey

};

}catch(error){

if(blobUrl){

revokeOyaBlobUrl(
blobUrl
);

}

console.error(
"OYA frame:",
timeValue,
error
);

return null;

}

})();

oyaPendingRequests.set(
cacheKey,
promise
);

try{

const result=
await promise;

if(
oyaPendingRequests.get(cacheKey)===promise
){

oyaPendingRequests.delete(
cacheKey
);

}

if(!result)
return;

if(
requestId!==oyaFrameRequestId ||
generation!==oyaCacheGeneration ||
activeLayer!=="oya" ||
oyaTimes[oyaFrameIndex]!==timeValue
){

return;

}

const newOverlay=
await createReadyOyaOverlay(
result.blobUrl,
requestData.bounds
);

if(
requestId!==oyaFrameRequestId ||
generation!==oyaCacheGeneration ||
activeLayer!=="oya" ||
oyaTimes[oyaFrameIndex]!==timeValue
){

if(
map.hasLayer(newOverlay)
){

map.removeLayer(
newOverlay
);

}

return;

}

swapOyaOverlay(
newOverlay,
result.blobUrl
);

renderOyaTimeline();

setStatus(
"Опасные явления"
);

}catch(error){

if(
oyaPendingRequests.get(cacheKey)===promise
){

oyaPendingRequests.delete(cacheKey);

}

if(
requestId===oyaFrameRequestId
){

setStatus(
"Ошибка ОЯ"
);

}

}

}

/* =========================================================
   SHOW OYA
========================================================= */

async function showOya(){

rainFrameRequestId++;

oyaFrameRequestId++;

oyaPreloadGeneration++;

oyaPreloading=false;

if(
radarLayer &&
map.hasLayer(radarLayer)
){

map.removeLayer(radarLayer);

}

radarLayer=null;

if(
oyaImage &&
map.hasLayer(oyaImage)
){

map.removeLayer(oyaImage);

}

oyaImage=null;

oyaImageBlobUrl=null;

const viewport=
getCurrentViewportData();

oyaViewportKey=
viewport.key;

clearOyaCache();

oyaViewportKey=
viewport.key;

const ready=
await loadOyaCapabilities();

if(!ready)
return;

if(!oyaTimes.length)
return;

setOyaTimeline();

oyaFrameIndex=
oyaTimes.length-1;

timeSlider.value=
oyaFrameIndex;

updateTimeLabel();

renderOyaTimeline();

updatePreloadButton();

loadOyaFrame(
oyaFrameIndex
);

}

/* =========================================================
   MAP MOVE / ZOOM
========================================================= */

map.on(
"moveend",
()=>{

if(activeLayer!=="oya")
return;

invalidateOyaViewport();

if(oyaTimes.length){

loadOyaFrame(
oyaFrameIndex
);

}

}
);

/* =========================================================
   MAP RESIZE
========================================================= */

map.on(
"resize",
()=>{

if(activeLayer!=="oya")
return;

invalidateOyaViewport();

if(oyaTimes.length){

loadOyaFrame(
oyaFrameIndex
);

}

}
);

/* =========================================================
   RAINVIEWER
========================================================= */

async function loadRainViewer(){

showLoading(
"Загрузка радара…"
);

try{

const r=
await fetch(
"https://api.rainviewer.com/public/weather-maps.json",
{
cache:"no-store"
}
);

if(!r.ok){

throw new Error(
"RainViewer "+r.status
);

}

const data=
await r.json();

rainFrames=
Array.isArray(
data.radar?.past
)
?
data.radar.past
:[];

if(!rainFrames.length){

throw new Error(
"Нет кадров"
);

}

rainFrames.sort(
(a,b)=>a.time-b.time
);

currentFrame=
rainFrames.length-1;

setRadarTimeline();

showRainFrame(
currentFrame
);

setStatus(
"Радар RainViewer"
);

}catch(e){

console.error(
"RainViewer:",
e
);

setStatus(
"Ошибка RainViewer"
);

}finally{

hideLoading();

}

}

/* =========================================================
   RAIN TILE
========================================================= */

function makeRainLayer(frame){

return L.tileLayer(

"https://tilecache.rainviewer.com"+
frame.path+
"/256/{z}/{x}/{y}/2/1_1.png",

{

tileSize:256,

opacity:1,

minZoom:2,

maxZoom:7,

zIndex:10,

updateWhenIdle:true,

updateWhenZooming:false,

keepBuffer:2,

noWrap:false

}

);

}

/* =========================================================
   RAIN FRAME
========================================================= */

function showRainFrame(index){

if(!rainFrames[index])
return;

if(activeLayer!=="radar")
return;

const frame=
rainFrames[index];

const requestId=
++rainFrameRequestId;

const newLayer=
makeRainLayer(frame);

newLayer.addTo(map);

newLayer.once(
"load",
()=>{

if(
requestId!==rainFrameRequestId ||
activeLayer!=="radar"
){

if(
map.hasLayer(newLayer)
){

map.removeLayer(newLayer);

}

return;

}

const oldLayer=
radarLayer;

radarLayer=
newLayer;

if(
oldLayer &&
map.hasLayer(oldLayer)
){

map.removeLayer(oldLayer);

}

}
);

const cleanupTimer=
setTimeout(
()=>{

if(
requestId!==rainFrameRequestId
)
return;

if(
radarLayer!==newLayer
){

if(
map.hasLayer(newLayer)
){

map.removeLayer(newLayer);

}

}

},
15000
);

newLayer.once(
"load",
()=>{

clearTimeout(
cleanupTimer
);

}
);

updateTimeLabel();

}

/* =========================================================
   SHOW RADAR
========================================================= */

function showRadar(){

oyaFrameRequestId++;

oyaPreloadGeneration++;

oyaPreloading=false;

if(
oyaImage &&
map.hasLayer(oyaImage)
){

map.removeLayer(oyaImage);

}

oyaImage=null;

clearOyaCache();

if(rainFrames.length){

setRadarTimeline();

showRainFrame(
currentFrame
);

setStatus(
"Радар RainViewer"
);

}else{

loadRainViewer();

}

}

/* =========================================================
   TIME LABEL
========================================================= */

function updateTimeLabel(){

if(activeLayer==="radar"){

if(rainFrames[currentFrame]){

timeLabel.textContent=
formatTime(
rainFrames[currentFrame].time
);

}else{

timeLabel.textContent="—";

}

return;

}

if(activeLayer==="oya"){

if(oyaTimes[oyaFrameIndex]){

timeLabel.textContent=
formatTime(
oyaTimes[oyaFrameIndex]
);

}else{

timeLabel.textContent="—";

}

}

}

/* =========================================================
   SLIDER
========================================================= */

timeSlider.addEventListener(
"input",
()=>{

const index=
Number(
timeSlider.value
);

if(activeLayer==="radar"){

if(!rainFrames.length)
return;

currentFrame=
Math.max(
0,
Math.min(
rainFrames.length-1,
index
)
);

updateTimeLabel();

showRainFrame(
currentFrame
);

return;

}

if(activeLayer==="oya"){

if(!oyaTimes.length)
return;

oyaFrameIndex=
Math.max(
0,
Math.min(
oyaTimes.length-1,
index
)
);

updateTimeLabel();

renderOyaTimeline();

loadOyaFrame(
oyaFrameIndex
);

}

}
);

/* =========================================================
   BACK
========================================================= */

document
.getElementById("backBtn")
.addEventListener(
"click",
()=>{

if(activeLayer==="radar"){

if(!rainFrames.length)
return;

currentFrame=
Math.max(
0,
currentFrame-1
);

timeSlider.value=
currentFrame;

updateTimeLabel();

showRainFrame(
currentFrame
);

return;

}

if(activeLayer==="oya"){

if(!oyaTimes.length)
return;

Math.max(

oyaFrameIndex-1
);

timeSlider.value=
oyaFrameIndex;

updateTimeLabel();

renderOyaTimeline();

loadOyaFrame(
oyaFrameIndex
);

}

}
);

/* =========================================================
   FORWARD
========================================================= */

document
.getElementById("forwardBtn")
.addEventListener(
"click",
()=>{

if(activeLayer==="radar"){

if(!rainFrames.length)
return;

currentFrame=
Math.min(
rainFrames.length-1,
currentFrame+1
);

timeSlider.value=
currentFrame;

updateTimeLabel();

showRainFrame(
currentFrame
);

return;

}

if(activeLayer==="oya"){

if(!oyaTimes.length)
return;

oyaFrameIndex=
Math.min(
oyaTimes.length-1,
oyaFrameIndex+1
);

timeSlider.value=
oyaFrameIndex;

updateTimeLabel();

renderOyaTimeline();

loadOyaFrame(
oyaFrameIndex
);

}

}
);

/* =========================================================
   PLAY
========================================================= */

playBtn.addEventListener(
"click",
()=>{

let total=0;

if(activeLayer==="radar"){

total=
rainFrames.length;

}else if(activeLayer==="oya"){

total=
oyaTimes.length;

}

if(!total)
return;

playing=!playing;

playBtn.textContent=
playing
?"Ⅱ"
:"▶";

clearInterval(
playTimer
);

if(playing){

playTimer=
setInterval(
()=>{

if(activeLayer==="radar"){

currentFrame++;

if(
currentFrame>=rainFrames.length
){

currentFrame=0;

}

timeSlider.value=
currentFrame;

updateTimeLabel();

showRainFrame(
currentFrame
);

return;

}

if(activeLayer==="oya"){

oyaFrameIndex++;

if(
oyaFrameIndex>=oyaTimes.length
){

oyaFrameIndex=0;

}

timeSlider.value=
oyaFrameIndex;

updateTimeLabel();

renderOyaTimeline();

loadOyaFrame(
oyaFrameIndex
);

}

},
600
);

}

}
);

/* =========================================================
   PRELOAD BUTTON
========================================================= */

preloadBtn.addEventListener(
"click",
()=>{

if(
preloadBtn.disabled
)
return;

preloadAllOyaFrames();

}
);

/* =========================================================
   STOP PLAYBACK
========================================================= */

function stopPlayback(){

playing=false;

clearInterval(
playTimer
);

playTimer=null;

playBtn.textContent="▶";

}

/* =========================================================
   LOCATION
========================================================= */

document
.getElementById("locateBtn")
.addEventListener(
"click",
()=>{

if(!navigator.geolocation){

setStatus(
"Геолокация недоступна"
);

return;

}

setStatus(
"Определение местоположения…"
);

navigator.geolocation.getCurrentPosition(

position=>{

map.flyTo(

[
position.coords.latitude,
position.coords.longitude
],

Math.max(
map.getZoom(),
8
),

{
duration:.8
}

);

setStatus(
"Ваше местоположение"
);

},

()=>{

setStatus(
"Не удалось определить местоположение"
);

},

{

enableHighAccuracy:true,

timeout:10000

}

);

}
);

/* =========================================================
   RELOAD
========================================================= */

document
.getElementById("reloadBtn")
.addEventListener(
"click",
()=>{

stopPlayback();

if(activeLayer==="oya"){

oyaFrameRequestId++;

if(
oyaImage &&
map.hasLayer(oyaImage)
){

map.removeLayer(oyaImage);

}

oyaImage=null;

clearOyaCache();

oyaCapabilitiesLoaded=false;

oyaAllTimes=[];

oyaTimes=[];

oyaFrameIndex=0;

oyaFrameCount=
Number(
localStorage.getItem(
"gptrad-oya-frame-count"
)
) || 50;

frameCountSlider.min=1;
frameCountSlider.max=1;

frameCountSlider.value=
Math.min(
oyaFrameCount,
1
);

frameCountValue.textContent="—";

updatePreloadButton();

showOya();

}else{

loadRainViewer();

}

}
);

/* =========================================================
   SETTINGS OPEN
========================================================= */

document
.getElementById("settingsBtn")
.addEventListener(
"click",
()=>{

settings.classList.toggle(
"open"
);

}
);

/* =========================================================
   APPEARANCE
========================================================= */

appearanceToggle.addEventListener(
"click",
()=>{

appearanceSection.classList.toggle(
"open"
);

}
);

/* =========================================================
   FRAME COUNT OPEN
========================================================= */

frameCountToggle.addEventListener(
"click",
async()=>{

const opening=
!frameCountSection.classList.contains(
"open"
);

frameCountSection.classList.toggle(
"open"
);

if(
opening &&
!(
oyaCapabilitiesLoaded &&
oyaAllTimes.length
)
){

const ready=
await loadOyaCapabilities();

if(
ready &&
activeLayer==="radar"
){

setRadarTimeline();

}

}

}
);

/* =========================================================
   CHANGE FRAME COUNT
========================================================= */

function changeOyaFrameCount(delta){

if(!oyaAllTimes.length)
return;

let count=
Number(frameCountSlider.value) ||
oyaFrameCount ||
50;

count+=delta;

count=
Math.max(
1,
Math.min(
oyaAllTimes.length,
count
)
);

frameCountSlider.value=count;

frameCountValue.textContent=count;

oyaFrameCount=count;

localStorage.setItem(
"gptrad-oya-frame-count",
String(count)
);

applyOyaFrameCount(
count,
true
);

if(
activeLayer==="oya" &&
oyaTimes.length
){

oyaFrameRequestId++;

loadOyaFrame(
oyaFrameIndex
);

}

}

/* =========================================================
   FRAME COUNT SLIDER
========================================================= */

frameCountSlider.addEventListener(
"input",
()=>{

if(!oyaAllTimes.length)
return;

const count=
Number(
frameCountSlider.value
);

oyaFrameCount=count;

frameCountValue.textContent=count;

localStorage.setItem(
"gptrad-oya-frame-count",
String(count)
);

applyOyaFrameCount(
count,
true
);

if(
activeLayer==="oya" &&
oyaTimes.length
){

oyaFrameRequestId++;

loadOyaFrame(
oyaFrameIndex
);

}

}
);

   FRAME COUNT ARROWS
========================================================= */

frameCountPrev.addEventListener(
"click",
()=>{

changeOyaFrameCount(-1);

}
);

frameCountNext.addEventListener(

}
);

   THEME

.querySelectorAll(".theme-btn")
.forEach(

()=>{

const theme=
button.dataset.theme;

document.body.classList.remove(

);

);

"gptrad-theme",
theme
);

);

);

   THEME RESTORE
========================================================= */

localStorage.getItem(
"gptrad-theme"
);

"light",
"green"
);

/* =========================================================
   SELECT LAYER
========================================================= */

selectedLayer.addEventListener(
"click",
()=>{

layerDrawer.classList.toggle(
"open"
);

selectedLayer.classList.toggle(
"open",
open
);

});

document
.querySelectorAll(".layer-item")
.forEach(
button=>{

()=>{

button.dataset.layer;

.querySelectorAll(".layer-item")

);

);

);

);

);

}
);

   CLOSE DRAWER
========================================================= */

"click",
()=>{

layerDrawer.classList.remove(
"open"
);

selectedLayer.classList.remove(
"open"
);

}
);

/* =========================================================
   PAGE UNLOAD
========================================================= */

window.addEventListener(
"beforeunload",
()=>{

const urls=new Set();

for(
const value of
oyaFrameCache.values()
){

if(
value &&
value.blobUrl
){

urls.add(
value.blobUrl
);

}

}

if(oyaImageBlobUrl){

urls.add(
oyaImageBlobUrl
);

}

for(
const url of urls
){

try{

URL.revokeObjectURL(url);

}catch(error){}

}

});

/* =========================================================
   START
========================================================= */

loadRainViewer();

</script>
