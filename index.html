<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPTrad</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/openlayers/7.4.0/ol.css">

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#111;
}

#map{
position:absolute;
inset:0;
z-index:1;
background:#d8d8d8;
}

/* =====================================================
   ТЁМНАЯ КОПИЯ КАРТЫ
===================================================== */

.dark-osm-layer img,
.dark-osm-layer canvas{
filter:
invert(1)
hue-rotate(180deg)
brightness(.72)
contrast(1.05);
}

.ol-zoom{
position:absolute;
top:82px;
left:12px;
}

.ol-control{
background:transparent!important;
padding:0!important;
}

.ol-zoom button{
display:block;
width:38px;
height:38px;
margin:3px;
border:0;
border-radius:10px;
background:rgba(28,28,28,.9)!important;
color:white!important;
font-size:22px;
line-height:36px;
cursor:pointer;
}

.ol-attribution{
right:8px!important;
bottom:4px!important;
}

.ol-attribution button{
background:rgba(28,28,28,.8)!important;
color:white!important;
border-radius:7px;
}

.ol-attribution ul{
background:rgba(28,28,28,.8);
color:white;
border-radius:7px;
padding:4px 8px;
}

.top-panel{
position:absolute;
top:12px;
left:12px;
right:12px;
height:54px;
z-index:1000;
display:flex;
align-items:center;
gap:8px;
padding:6px;
background:rgba(28,28,28,.9);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,.25);
}

.logo{
color:white;
font-size:25px;
font-weight:700;
white-space:nowrap;
margin-left:8px;
margin-right:8px;
}

#selectedLayer{
flex:1;
min-width:0;
height:42px;
border:0;
outline:0;
border-radius:12px;
background:#292929;
color:white;
padding:0 14px;
font-size:17px;
font-weight:650;
text-align:left;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
}

#selectedLayerName{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

#selectedLayerArrow{
flex:none;
font-size:14px;
opacity:.7;
transition:transform .25s ease;
}

#selectedLayer.open #selectedLayerArrow{
transform:rotate(180deg);
}

.icon-btn{
flex:none;
width:42px;
height:42px;
border:0;
outline:0;
border-radius:12px;
background:#292929;
color:white;
font-size:21px;
display:flex;
align-items:center;
justify-content:center;
transition:transform .15s ease;
}

.icon-btn:active{
transform:scale(.94);
}

#layerDrawer{
position:absolute;
top:72px;
left:50%;
width:calc(100% - 24px);
max-width:520px;
z-index:1100;
transform:translate(-50%,-18px) scale(.98);
opacity:0;
pointer-events:none;
padding:10px;
border-radius:15px;
background:rgba(25,25,25,.96);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
box-shadow:0 10px 35px rgba(0,0,0,.35);
transition:
transform .28s cubic-bezier(.22,.61,.36,1),
opacity .22s ease;
}

#layerDrawer.open{
transform:translate(-50%,0) scale(1);
opacity:1;
pointer-events:auto;
}

.drawer-header{
color:white;
font-size:14px;
font-weight:700;
padding:4px 7px 9px;
}

.layer-item{
width:100%;
min-height:48px;
border:0;
outline:0;
border-radius:11px;
background:#303030;
color:white;
display:flex;
align-items:center;
gap:10px;
padding:10px 12px;
margin-bottom:7px;
font-size:15px;
text-align:left;
transition:background .15s ease,transform .15s ease;
}

.layer-item:last-child{
margin-bottom:0;
}

.layer-item:active{
transform:scale(.985);
}

.layer-item.active{
background:#3b3b3b;
}

.layer-dot{
width:10px;
height:10px;
flex:none;
border-radius:50%;
background:#777;
}

.layer-item.active .layer-dot{
background:#36d67a;
box-shadow:0 0 8px rgba(54,214,122,.55);
}

#status{
position:absolute;
left:14px;
top:74px;
z-index:900;
padding:6px 10px;
border-radius:8px;
background:rgba(20,20,20,.78);
color:white;
font-size:12px;
pointer-events:none;
opacity:.9;
}

#settings{
position:absolute;
left:12px;
top:74px;
width:240px;
z-index:1200;
padding:12px;
border-radius:14px;
background:rgba(20,20,20,.96);
color:white;
box-shadow:0 8px 30px rgba(0,0,0,.35);
opacity:0;
visibility:hidden;
pointer-events:none;
transform:translateY(-10px) scale(.97);
max-height:0;
overflow:hidden;
transition:
opacity .25s ease,
transform .28s cubic-bezier(.22,.61,.36,1),
max-height .32s ease,
visibility 0s linear .32s;
}

#settings.open{
opacity:1;
visibility:visible;
pointer-events:auto;
transform:translateY(0) scale(1);
max-height:560px;
transition:
opacity .25s ease,
transform .28s cubic-bezier(.22,.61,.36,1),
max-height .32s ease,
visibility 0s linear 0s;
}

.settings-title{
font-size:15px;
font-weight:700;
margin-bottom:10px;
}

.settings-section{
margin-bottom:7px;
}

.settings-section:last-child{
margin-bottom:0;
}

.settings-section-btn{
width:100%;
height:40px;
border:0;
outline:0;
border-radius:10px;
background:#292929;
color:white;
font-size:14px;
font-weight:600;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 11px;
}

.settings-section-btn:active{
transform:scale(.98);
}

.settings-section-arrow{
font-size:12px;
opacity:.65;
transition:transform .25s ease;
}

.settings-section.open .settings-section-arrow{
transform:rotate(180deg);
}

.settings-subpanel{
max-height:0;
opacity:0;
overflow:hidden;
transform:translateY(-4px);
transition:
max-height .3s ease,
opacity .2s ease,
transform .25s ease;
padding:0 2px;
}

.settings-section.open .settings-subpanel{
max-height:120px;
opacity:1;
transform:translateY(0);
padding-top:7px;
padding-bottom:2px;
}

.theme-btn{
width:100%;
border:0;
outline:0;
padding:9px 10px;
margin-bottom:6px;
border-radius:9px;
background:#292929;
color:white;
text-align:left;
font-size:13px;
}

.theme-btn:last-child{
margin-bottom:0;
}

.theme-btn.active{
background:#3b3b3b;
}

body.light .theme-btn.active{
background:#d7d7d7;
}

.frame-count-row{
display:flex;
align-items:center;
justify-content:center;
gap:6px;
padding:3px 1px 2px;
}

#frameCountInput{
width:76px;
height:30px;
flex:none;
border:0;
outline:0;
border-radius:8px;
background:#292929;
color:white;
text-align:center;
font-size:14px;
font-weight:700;
padding:0 7px;
appearance:textfield;
-webkit-appearance:none;
}

#frameCountInput::-webkit-inner-spin-button,
#frameCountInput::-webkit-outer-spin-button{
opacity:1;
margin:0;
}

#frameCountInput:focus{
box-shadow:0 0 0 2px rgba(69,201,239,.45);
}

.frame-count-arrow{
width:26px;
height:26px;
flex:none;
border:0;
outline:0;
border-radius:7px;
background:#292929;
color:white;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
padding:0;
}

.frame-count-arrow:disabled{
opacity:.35;
}

/* =====================================================
   РАДАРНЫЙ ЛУЧ
===================================================== */

.radar-beam-button{
width:100%;
height:40px;
border:0;
outline:0;
border-radius:10px;
background:#292929;
color:white;
font-size:14px;
font-weight:600;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 11px;
margin-top:7px;
transition:
background .18s ease,
transform .15s ease;
}

.radar-beam-button:active{
transform:scale(.98);
}

.radar-beam-button .radar-beam-state{
font-size:12px;
opacity:.55;
}

.radar-beam-button.active{
background:#3b3b3b;
}

.radar-beam-button.active .radar-beam-state{
color:#69d99a;
opacity:1;
}

/* =====================================================
   TIMELINE
===================================================== */

.timeline{
position:absolute;
left:50%;
bottom:14px;
transform:translateX(-50%);
width:min(680px,calc(100vw - 28px));
z-index:1000;
padding:8px 12px 9px;
border-radius:15px;
background:rgba(20,20,20,.9);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.timeline-play{
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:7px;
margin-bottom:6px;
}

#playBtn{
width:38px;
height:30px;
border:0;
outline:0;
border-radius:8px;
background:#292929;
color:white;
font-size:14px;
display:flex;
align-items:center;
justify-content:center;
}

#playBtn:active{
transform:scale(.92);
}

#preloadBtn{
width:34px;
height:30px;
flex:none;
border:0;
outline:0;
border-radius:8px;
background:#292929;
color:white;
display:flex;
align-items:center;
justify-content:center;
padding:0;
}

#preloadBtn:active{
transform:scale(.91);
}

#preloadBtn:disabled{
opacity:.3;
}

.download-icon{
width:15px;
height:18px;
display:block;
background:currentColor;
clip-path:polygon(
38% 0%,
62% 0%,
62% 55%,
100% 55%,
50% 100%,
0% 55%,
38% 55%
);
-webkit-clip-path:polygon(
38% 0%,
62% 0%,
62% 55%,
100% 55%,
50% 100%,
0% 55%,
38% 55%
);
}

#preloadBtn.loading .download-icon{
animation:downloadFloat .7s ease-in-out infinite;
}

@keyframes downloadFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(2px)}
}

#preloadBtn.done{
background:#315f45;
}

.timeline-controls{
display:flex;
align-items:center;
gap:7px;
}

.timeline-arrow{
width:36px;
height:32px;
flex:none;
border:0;
outline:0;
border-radius:8px;
background:#292929;
color:white;
font-size:15px;
display:flex;
align-items:center;
justify-content:center;
}

.timeline-arrow:active{
transform:scale(.92);
}

.timeline-slider-wrap{
position:relative;
flex:1;
min-width:0;
height:18px;
display:flex;
align-items:center;
}

#oyaTimelineSegments{
position:absolute;
left:0;
right:0;
top:2px;
height:14px;
display:flex;
align-items:center;
gap:2px;
pointer-events:none;
overflow:hidden;
z-index:1;
}

.oya-segment{
flex:1;
min-width:0;
height:14px;
border-radius:3px;
background:#666;
opacity:.95;
transition:
background .18s ease,
transform .12s ease,
opacity .18s ease;
}

.oya-segment.loaded{
background:#45c9ef;
}

.oya-segment.current{
transform:scaleY(1.08);
filter:brightness(1.15);
}

#oyaLongProgress{
position:absolute;
left:0;
right:0;
top:5px;
height:6px;
border-radius:999px;
background:#666;
overflow:hidden;
pointer-events:none;
z-index:1;
display:none;
}

#oyaLongProgressFill{
position:absolute;
left:0;
top:0;
bottom:0;
width:0%;
background:#45c9ef;
border-radius:999px;
}

#timeSlider{
position:relative;
z-index:3;
width:100%;
min-width:0;
margin:0;
background:transparent;
appearance:none;
-webkit-appearance:none;
}

#timeSlider::-webkit-slider-runnable-track{
height:14px;
background:transparent;
border:0;
}

#timeSlider::-webkit-slider-thumb{
-webkit-appearance:none;
width:18px;
height:18px;
margin-top:-2px;
border-radius:50%;
border:2px solid white;
background:#fff;
box-shadow:0 1px 5px rgba(0,0,0,.45);
}

#timeSlider::-moz-range-track{
height:14px;
background:transparent;
border:0;
}

#timeSlider::-moz-range-thumb{
width:18px;
height:18px;
border-radius:50%;
border:2px solid white;
background:#fff;
}

body.light .oya-segment{
background:#c8c8c8;
}

body.light .oya-segment.loaded{
background:#49b9df;
}

body.light #oyaLongProgress{
background:#c8c8c8;
}

body.light #oyaLongProgressFill{
background:#49b9df;
}

body.light .top-panel,
body.light #layerDrawer,
body.light #settings,
body.light .timeline,
body.light #status{
background:rgba(255,255,255,.94);
}

body.light .logo,
body.light #status,
body.light .drawer-header{
color:#111;
}

body.light #selectedLayer,
body.light .icon-btn,
body.light .layer-item,
body.light .timeline-arrow,
body.light #playBtn,
body.light .theme-btn,
body.light .settings-section-btn,
body.light .frame-count-arrow,
body.light #frameCountInput,
body.light .radar-beam-button{
background:#eee;
color:#111;
}

body.light .layer-item.active,
body.light .radar-beam-button.active{
background:#ddd;
}

body.light #preloadBtn{
background:#eee;
color:#111;
}

#timeLabel{
width:100%;
margin-top:5px;
text-align:center;
color:white;
font-size:11px;
opacity:.85;
}

body.light #timeLabel{
color:#111;
}

#loading{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:2000;
display:none;
padding:9px 13px;
border-radius:10px;
background:rgba(20,20,20,.92);
color:white;
font-size:13px;
}

@media(max-width:600px){

.top-panel{
top:8px;
left:8px;
right:8px;
height:54px;
gap:5px;
}

.logo{
font-size:21px;
margin-left:6px;
margin-right:3px;
}

#selectedLayer{
height:42px;
padding:0 11px;
font-size:16px;
}

.icon-btn{
width:38px;
height:38px;
border-radius:11px;
font-size:19px;
}

#layerDrawer{
top:70px;
width:calc(100% - 16px);
}

#status{
top:68px;
left:9px;
}

#settings{
left:8px;
top:68px;
width:235px;
}

.timeline{
bottom:8px;
width:calc(100vw - 16px);
}

#timeLabel{
font-size:10px;
}

.timeline-arrow{
width:35px;
}

.ol-zoom{
top:68px;
left:8px;
}

}
</style>
</head>

<body>

<div id="map"></div>

<div class="top-panel">

<div class="logo">GPTrad</div>

<button id="selectedLayer">
<span id="selectedLayerName">Радар (RainViewer)</span>
<span id="selectedLayerArrow">▾</span>
</button>

<button id="locateBtn" class="icon-btn">⌖</button>
<button id="reloadBtn" class="icon-btn">↻</button>
<button id="settingsBtn" class="icon-btn">⚙</button>

</div>

<div id="layerDrawer">

<div class="drawer-header">Слои</div>

<button class="layer-item active" data-layer="radar">
<span class="layer-dot"></span>
<span>Радар (RainViewer)</span>
</button>

<button class="layer-item" data-layer="oya">
<span class="layer-dot"></span>
<span>Опасные явления</span>
</button>

</div>

<div id="status">Загрузка…</div>

<div id="settings">

<div class="settings-title">Настройки</div>

<!-- ===================================================
     ОФОРМЛЕНИЕ
=================================================== -->

<div class="settings-section" id="appearanceSection">

<button class="settings-section-btn" id="appearanceToggle">
<span>Оформление</span>
<span class="settings-section-arrow">▾</span>
</button>

<div class="settings-subpanel">

<button class="theme-btn" data-theme="light">
Светлая
</button>

<button class="theme-btn" data-theme="dark">
Тёмная
</button>

</div>

</div>

<!-- ===================================================
     КАДРЫ
=================================================== -->

<div class="settings-section" id="frameCountSection">

<button class="settings-section-btn" id="frameCountToggle">
<span>Кол. кадров</span>
<span class="settings-section-arrow">▾</span>
</button>

<div class="settings-subpanel">

<div class="frame-count-row">

<button id="frameCountPrev"
class="frame-count-arrow">◀</button>

<input id="frameCountInput"
type="number"
min="1"
max="1"
step="1"
value="50"
inputmode="numeric">

<button id="frameCountNext"
class="frame-count-arrow">▶</button>

</div>

</div>

</div>

<!-- ===================================================
     РАДАРНЫЙ ЛУЧ
=================================================== -->

<button id="radarBeamToggle"
class="radar-beam-button">

<span>Радарный луч</span>

<span
id="radarBeamState"
class="radar-beam-state">
выкл
</span>

</button>

</div>

<div class="timeline">

<div class="timeline-play">

<button id="playBtn">▶</button>

<button id="preloadBtn"
title="Загрузить все кадры"
aria-label="Загрузить все кадры">

<span class="download-icon"></span>

</button>

</div>

<div class="timeline-controls">

<button id="backBtn"
class="timeline-arrow">◀</button>

<div class="timeline-slider-wrap">

<div id="oyaTimelineSegments"></div>

<div id="oyaLongProgress">

<div id="oyaLongProgressFill"></div>

</div>

<input id="timeSlider"
type="range"
min="0"
max="0"
value="0">

</div>

<button id="forwardBtn"
class="timeline-arrow">▶</button>

</div>

<div id="timeLabel">—</div>

</div>

<div id="loading">Загрузка…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/openlayers/7.4.0/dist/ol.js"></script>

<script>

window.addEventListener("error",function(e){

console.error(
"GPTrad:",
e.error||e.message
);

const s=
document.getElementById("status");

if(
s &&
(!window.ol||typeof map==="undefined")
){

s.textContent="Ошибка карты";

}

});

window.addEventListener(
"unhandledrejection",
function(e){

console.error(
"GPTrad promise:",
e.reason
);

}
);

if(!window.ol){

document.getElementById(
"status"
).textContent=
"OpenLayers не загрузился";

throw new Error(
"OpenLayers unavailable"
);

}

/* =====================================================
   ELEMENTS
===================================================== */

const status=
document.getElementById("status");

const loading=
document.getElementById("loading");

const selectedLayer=
document.getElementById("selectedLayer");

const selectedLayerName=
document.getElementById(
"selectedLayerName"
);

const layerDrawer=
document.getElementById(
"layerDrawer"
);

const settings=
document.getElementById(
"settings"
);

const timeSlider=
document.getElementById(
"timeSlider"
);

const timeLabel=
document.getElementById(
"timeLabel"
);

const oyaTimelineSegments=
document.getElementById(
"oyaTimelineSegments"
);

const oyaLongProgress=
document.getElementById(
"oyaLongProgress"
);

const oyaLongProgressFill=
document.getElementById(
"oyaLongProgressFill"
);

const frameCountInput=
document.getElementById(
"frameCountInput"
);

const preloadBtn=
document.getElementById(
"preloadBtn"
);

const playBtn=
document.getElementById(
"playBtn"
);

function setStatus(text){

status.textContent=text;

}

function showLoading(text){

loading.textContent=text;

loading.style.display="block";

}

function hideLoading(){

loading.style.display="none";

}

function formatTime(ts){

if(!ts)return"—";

return new Date(
ts*1000
).toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

/* =====================================================
   MAP
===================================================== */

const osmSource=
new ol.source.XYZ({

url:
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

maxZoom:19,

transition:0,

wrapX:true,

crossOrigin:"anonymous",

attributions:
"© OpenStreetMap contributors"

});

const osmLayer=
new ol.layer.Tile({

source:osmSource,

zIndex:0,

visible:true

});

const darkOsmLayer=
new ol.layer.Tile({

source:new ol.source.XYZ({

url:
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

maxZoom:19,

transition:0,

wrapX:true,

crossOrigin:"anonymous",

attributions:
"© OpenStreetMap contributors"

}),

zIndex:0,

visible:false,

className:"dark-osm-layer"

});

const view=
new ol.View({

center:
ol.proj.fromLonLat([
37.61,
55.75
]),

zoom:5,

minZoom:2,

maxZoom:19,

constrainResolution:false,

enableRotation:false

});

const map=
new ol.Map({

target:"map",

layers:[
osmLayer,
darkOsmLayer
],

view:view

});

function resizeMap(){

try{

map.updateSize();

map.render();

}catch(e){

console.error(e);

}

}

window.addEventListener(
"resize",
resizeMap
);

window.addEventListener(
"orientationchange",

function renderRadarPositions(
radars
){

if(
!Array.isArray(radars)||
!radars.length
){

return;

}

radarBeamSource.clear();

for(
const radar of radars
){

if(
!Number.isFinite(radar.lat)||
!Number.isFinite(radar.lon)
){

continue;

}

const center=
ol.proj.fromLonLat([
radar.lon,
radar.lat
]);

const circle=
new ol.geom.Circle(
center,
RADAR_COVERAGE_RADIUS
);

const coverageFeature=
new ol.Feature(
circle
);

coverageFeature.set(
"radarType",
"coverage"
);

coverageFeature.set(
"radarLatitude",
radar.lat
);

coverageFeature.set(
"radarLongitude",
radar.lon
);

coverageFeature.setStyle(
radarCoverageStyle
);

radarBeamSource.addFeature(
coverageFeature
);

const radarPoint=
new ol.Feature(
new ol.geom.Point(
center
)
);

radarPoint.set(
"radarType",
"radar"
);

radarPoint.set(
"radarLatitude",
radar.lat
);

radarPoint.set(
"radarLongitude",
radar.lon
);

radarPoint.setStyle(
radarPointStyle
);

radarBeamSource.addFeature(
radarPoint
);

}

map.render();

}

===================================================== */

async function loadRadarPositions(){

try{

const response=
await fetch(
RADAR_VECTOR_PROXY,
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Radar vector HTTP "+
response.status
);

}

const data=
await response.json();

if(!Array.isArray(data)){

throw new Error(
"Invalid radar vector"
);

}

const result=[];

for(
const item of data
){

if(
!Array.isArray(item)||
item.length<2
){

continue;

}

const lat=
Number(item[0]);

const lon=
Number(item[1]);

if(
!Number.isFinite(lat)||
!Number.isFinite(lon)
){

continue;

}

if(
lat<-90||
lat>90||
lon<-180||
lon>180
){

continue;

}

result.push({

lat,
lon

});

}

/*
 * Удаляем только настоящие дубликаты.
 */

const unique=[];
const seen=new Set();

for(
const radar of result
){

const key=
radar.lat.toFixed(6)+","+
radar.lon.toFixed(6);

if(
seen.has(key)
){

continue;

}

seen.add(key);

unique.push(radar);

}

console.log(
"Radar positions:",
unique.length
);

return unique;

}catch(error){

console.error(
"Radar positions:",
error
);

return[];

}

}

view.calculateExtent(size);

const geoExtent=
ol.proj.transformExtent(
extent,
"EPSG:3857",

);

Math.max(
256,
Math.min(
1600,
Math.round(size[0])
)

)
);

geoExtent[1].toFixed(5),
geoExtent[2].toFixed(5),
geoExtent[3].toFixed(5),
width,
height
].join("|");

key

/* =====================================================
   ISO
===================================================== */

function isoToUnix(value){

const t=
Date.parse(value);

return Number.isNaN(t)
?
null
:
Math.floor(t/1000);

}

function parseOyaTimes(text){

if(!text)return[];

const result=[];

for(
const value of
text
.split(",")
.map(
x=>x.trim()
)
.filter(Boolean)
){

const unix=
isoToUnix(value);

if(unix!==null){

const date=
new Date(
unix*1000
);

const minute=
date.getUTCMinutes();

const second=
date.getUTCSeconds();

if(
minute%10===0&&
second===0
){

result.push(
unix
);

}

}

}

return[
...new Set(result)
];

}

function normalizeOyaTimes(times){

const now=
Math.floor(
Date.now()/1000
);

const result=[];

for(
const time of times
){

if(!Number.isFinite(time)){
continue;
}

if(time>now){
continue;
}

const date=
new Date(
time*1000
);

const minute=
date.getUTCMinutes();

const second=
date.getUTCSeconds();

if(
minute%10!==0||
second!==0
){

continue;

}

result.push(time);

}

return[
...new Set(result)
].sort(
(a,b)=>a-b
);

}

/* =====================================================
   OYA CAPABILITIES
===================================================== */

async function loadOyaCapabilities(){

if(
oyaCapabilitiesLoaded&&
oyaAllTimes.length
){

return true;

}

if(oyaCapabilitiesLoading){

while(oyaCapabilitiesLoading){

await new Promise(
r=>setTimeout(
r,
50
)
);

}

return(
oyaCapabilitiesLoaded&&
oyaAllTimes.length
);

}

oyaCapabilitiesLoading=true;

try{

const response=
await fetch(
OYA_PROXY+
"?action=capabilities",
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Capabilities HTTP "+
response.status
);

}

const text=
await response.text();

const xml=
new DOMParser()
.parseFromString(
text,
"text/xml"
);

if(
xml.querySelector(
"parsererror"
)
){

throw new Error(
"Ошибка XML"
);

}

let times=[];

for(
const node of
Array.from(
xml.getElementsByTagName("*")
)
){

if(
node.localName!=="Extent"&&
node.localName!=="Dimension"
){

continue;

}

const name=
node.getAttribute(
"name"
);

if(
name&&
name.toLowerCase()!=="time"
){

continue;

}

const value=
(
node.textContent||
""
).trim();

if(!value)continue;

if(
value.includes("/")
){

const parts=
value.split("/");

const start=
isoToUnix(
parts[0]
);

const end=
isoToUnix(
parts[1]
);

if(
start!==null&&
end!==null&&
end>=start
){

const step=600;

const alignedStart=
Math.ceil(
start/step
)*step;

const now=
Math.floor(
Date.now()/1000
);

const lastAllowed=
Math.min(
end,
now
);

for(
let t=alignedStart;
t<=lastAllowed;
t+=step
){

times.push(t);

}

}

}else{

times.push(
...parseOyaTimes(value)
);

}

}

oyaAllTimes=
normalizeOyaTimes(
times
);

if(!oyaAllTimes.length){

throw new Error(
"В GetCapabilities нет актуального времени"
);

}

oyaCapabilitiesLoaded=true;

const saved=
Number(
localStorage.getItem(
"gptrad-oya-frame-count"
)
);

oyaFrameCount=
Number.isFinite(saved)&&
saved>=1
?
Math.min(
Math.floor(saved),
oyaAllTimes.length
)
:
Math.min(
50,
oyaAllTimes.length
);

frameCountInput.min=1;

frameCountInput.max=
oyaAllTimes.length;

frameCountInput.value=
oyaFrameCount;

applyOyaFrameCount(
oyaFrameCount,
false
);

return true;

}catch(error){

console.error(
"OYA capabilities:",
error
);

setStatus(
"Ошибка загрузки ОЯ"
);

return false;

}finally{

oyaCapabilitiesLoading=false;

}

}

/* =====================================================
   FRAME COUNT
===================================================== */

function applyOyaFrameCount(
count,
preserve=true
){

if(!oyaAllTimes.length)return;

const oldTime=
preserve&&oyaTimes.length
?
oyaTimes[oyaFrameIndex]
:
null;

let numeric=
Number.parseInt(
count,
10
);

if(!Number.isFinite(numeric)){

numeric=
oyaFrameCount||
50;

}

oyaFrameCount=
Math.max(
1,
Math.min(
numeric,
oyaAllTimes.length
)
);

oyaTimes=
oyaAllTimes.slice(
-oyaFrameCount
);

oyaFrameIndex=
oyaTimes.length-1;

if(oldTime!==null){

const index=
oyaTimes.indexOf(
oldTime
);

if(index!==-1){

oyaFrameIndex=index;

}

}

localStorage.setItem(
"gptrad-oya-frame-count",
String(
oyaFrameCount
)
);

frameCountInput.min=1;

frameCountInput.max=
oyaAllTimes.length;

frameCountInput.value=
oyaFrameCount;

setOyaTimeline();

}

/* =====================================================
   CLEAN OYA PNG
===================================================== */

function createCleanOyaBlobUrl(
blobUrl
){

return new Promise(
(resolve,reject)=>{

const image=
new Image();

image.onload=()=>{

try{

const canvas=
document.createElement(
"canvas"
);

canvas.width=
image.naturalWidth;

canvas.height=
image.naturalHeight;

const ctx=
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);

if(!ctx){

reject(
new Error(
"Canvas unavailable"
)
);

return;

}

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.drawImage(
image,
0,
0
);

const imageData=
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const pixels=
imageData.data;

for(
let i=0;
i<pixels.length;
i+=4
){

const r=pixels[i];

const g=
pixels[i+1];

const b=
pixels[i+2];

const a=
pixels[i+3];

if(a===0)continue;

const max=
Math.max(
r,g,b
);

const min=
Math.min(
r,g,b
);

const diff=
max-min;

if(
diff<=22 &&
r>=125 &&
g>=125 &&
b>=125 &&
r<=250 &&
g<=250 &&
b<=250
){

pixels[i+3]=0;

}

}

ctx.putImageData(
imageData,
0,
0
);

canvas.toBlob(
blob=>{

if(!blob){

reject(
new Error(
"PNG creation failed"
)
);

return;

}

resolve(
URL.createObjectURL(
blob
)
);

},
"image/png"
);

}catch(error){

reject(error);

}

};

image.onerror=()=>{

reject(
new Error(
"OYA image error"
)
);

};

image.src=
blobUrl;

});

}

/* =====================================================
   RETRY FETCH
===================================================== */

function wait(ms){

return new Promise(
resolve=>
setTimeout(
resolve,
ms
)
);

}

async function fetchOyaBlob(
url,
attempts=3
){

let lastError=null;

for(
let attempt=1;
attempt<=attempts;
attempt++
){

try{

const response=
await fetch(
url,
{
cache:"force-cache"
}
);

if(!response.ok){

throw new Error(
"OYA HTTP "+
response.status
);

}

const blob=
await response.blob();

if(
!blob||
blob.size===0
){

throw new Error(
"OYA empty response"
);

}

return blob;

}catch(error){

lastError=error;

console.warn(
`OYA request attempt ${attempt}/${attempts}:`,
error
);

if(
attempt<attempts
){

await wait(
250*attempt
);

}

}

}

throw lastError||
new Error(
"OYA request failed"
);

}

async function createOyaImageLayer(

){

const cleanedUrl=
await createCleanOyaBlobUrl(
originalBlobUrl
);

const source=
new ol.source.ImageStatic({

url:cleanedUrl,

imageExtent:extent,

projection:"EPSG:3857",

interpolate:false

});

const layer=
new ol.layer.Image({

source:source,

opacity:1,

zIndex:60

});

layer.__oyaCleanUrl=
cleanedUrl;

return layer;

}

/* =====================================================
   WAIT FOR OYA
===================================================== */

function waitForOyaLayerReady(
layer,
timeout=15000
){

return new Promise(
(resolve,reject)=>{

const source=
layer.getSource();

let finished=false;

let timer=null;

const cleanup=()=>{

source.un(
"imageloadend",
onLoadEnd
);

source.un(
"imageloaderror",
onLoadError
);

if(timer){

clearTimeout(
timer
);

timer=null;

}

};

const finish=(
error
)=>{

if(finished)return;

finished=true;

cleanup();

if(error){

reject(error);

}else{

resolve();

}

};

const onLoadEnd=()=>finish();

const onLoadError=()=>{

finish(
new Error(
"OYA ImageStatic load error"
)
);

};

source.on(
"imageloadend",
onLoadEnd
);

source.on(
"imageloaderror",
onLoadError
);

timer=setTimeout(
()=>{

finish(
new Error(
"OYA image timeout"
)
);

},
timeout
);

map.addLayer(
layer
);

map.renderSync();

});

}

/* =====================================================
   LOAD OYA FRAME
===================================================== */

async function loadOyaFrame(
index
){

if(
activeLayer!=="oya"
)return;

if(!oyaTimes.length){

if(
!(await loadOyaCapabilities())
){

return;

}

}

if(
index<0||
index>=oyaTimes.length
){

return;

}

const requestId=
++oyaFrameRequestId;

const generation=
oyaCacheGeneration;

oyaFrameIndex=index;

timeSlider.value=index;

updateTimeLabel();

renderOyaTimeline();

const timeValue=
oyaTimes[index];

const requestData=
getOyaRequestData(
timeValue
);

const cacheKey=
makeOyaCacheKey(
timeValue,
requestData
);

let newLayer=null;

try{

let result=
oyaFrameCache.get(
cacheKey
);

if(!result){

setStatus(
"Загрузка ОЯ…"
);

let pending=
oyaPendingRequests.get(
cacheKey
);

if(!pending){

pending=(async()=>{

const blob=
await fetchOyaBlob(
requestData.url,
3
);

if(
generation!==oyaCacheGeneration
){

return null;

}

const blobUrl=
URL.createObjectURL(
blob
);

const value={

blobUrl,

extent:
requestData.extent,

timeValue

};

oyaFrameCache.set(
cacheKey,
value
);

return value;

})();

oyaPendingRequests.set(
cacheKey,
pending
);

}

try{

result=
await pending;

}finally{

oyaPendingRequests.delete(
cacheKey
);

}

}

if(!result)return;

if(
requestId!==oyaFrameRequestId||
generation!==oyaCacheGeneration||
activeLayer!=="oya"||
oyaTimes[oyaFrameIndex]!==timeValue
){

return;

}

newLayer=
await createOyaImageLayer(
result.blobUrl,
result.extent
);

if(
requestId!==oyaFrameRequestId||
generation!==oyaCacheGeneration||
activeLayer!=="oya"||
oyaTimes[oyaFrameIndex]!==timeValue
){

if(newLayer.__oyaCleanUrl){

try{

URL.revokeObjectURL(
newLayer.__oyaCleanUrl
);

}catch(e){}

}

return;

}

try{

await waitForOyaLayerReady(
newLayer,
15000
);

}catch(error){

console.error(
"OYA layer load:",
error
);

try{

map.removeLayer(
newLayer
);

}catch(e){}

if(
newLayer.__oyaCleanUrl
){

try{

URL.revokeObjectURL(
newLayer.__oyaCleanUrl
);

}catch(e){}

}

throw error;

}

if(
requestId!==oyaFrameRequestId||
generation!==oyaCacheGeneration||
activeLayer!=="oya"||
oyaTimes[oyaFrameIndex]!==timeValue
){

try{

map.removeLayer(
newLayer
);

}catch(e){}

if(
newLayer.__oyaCleanUrl
){

try{

URL.revokeObjectURL(
newLayer.__oyaCleanUrl
);

}catch(e){}

}

return;

}

swapOyaLayer(
newLayer
);

oyaLoadedTimes.add(
timeValue
);

renderOyaTimeline();

setStatus(
"Опасные явления"
);

}catch(error){

oyaPendingRequests.delete(
cacheKey
);

if(newLayer){

try{

map.removeLayer(
newLayer
);

}catch(e){}

if(
newLayer.__oyaCleanUrl
){

try{

URL.revokeObjectURL(
newLayer.__oyaCleanUrl
);

}catch(e){}

}

}

console.error(
"OYA frame:",
error
);

if(
requestId===oyaFrameRequestId
){

setStatus(
"Кадр ОЯ не загрузился"
);

}

}

}

/* =====================================================
   PRELOAD
===================================================== */

async function preloadOyaFrame(
timeValue,
generation,
cacheGeneration
){

if(
generation!==oyaPreloadGeneration||
cacheGeneration!==oyaCacheGeneration||
activeLayer!=="oya"
){

return false;

}

const data=
getOyaRequestData(
timeValue
);

const key=
makeOyaCacheKey(
timeValue,
data
);

if(
oyaFrameCache.has(key)
){

oyaLoadedTimes.add(
timeValue
);

return true;

}

let pending=
oyaPendingRequests.get(
key
);

if(!pending){

pending=(async()=>{

const blob=
await fetchOyaBlob(
data.url,
3
);

if(
generation!==oyaPreloadGeneration||
cacheGeneration!==oyaCacheGeneration||
activeLayer!=="oya"
){

return null;

}

const blobUrl=
URL.createObjectURL(
blob
);

oyaFrameCache.set(
key,
{

blobUrl,

extent:data.extent,

timeValue

}
);

oyaLoadedTimes.add(
timeValue
);

return true;

})();

oyaPendingRequests.set(
key,
pending
);

}

try{

return !!(
await pending
);

}catch(error){

console.error(
"Preload:",
error
);

return false;

}finally{

oyaPendingRequests.delete(
key
);

}

}

async function preloadAllOyaFrames(){

if(
activeLayer!=="oya"||
oyaTimes.length<1||
oyaTimes.length>=52||
oyaPreloading
){

return;

}

oyaPreloading=true;

const generation=
++oyaPreloadGeneration;

const cacheGeneration=
oyaCacheGeneration;

updatePreloadButton();

const times=
oyaTimes.slice();

let cursor=0;

async function worker(){

while(true){

if(
generation!==oyaPreloadGeneration||
cacheGeneration!==oyaCacheGeneration||
activeLayer!=="oya"
){

return;

}

const index=
cursor++;

if(index>=times.length)return;

await preloadOyaFrame(
times[index],
generation,
cacheGeneration
);

let loaded=0;

for(
const time of times
){

if(
oyaLoadedTimes.has(time)
){

loaded++;

}

}

setStatus(
`Загрузка кадров: ${loaded}/${times.length}`
);

renderOyaTimeline();

}

}

try{

await Promise.all(
Array.from(
{
length:
Math.min(
4,
times.length
)
},
()=>worker()
)
);

if(
generation===oyaPreloadGeneration&&
activeLayer==="oya"
){

const complete=
times.every(
t=>oyaLoadedTimes.has(t)
);

setStatus(
complete
?
"Все кадры ОЯ загружены"
:
"Загрузка ОЯ завершена"
);

}

}catch(error){

console.error(error);

setStatus(
"Ошибка загрузки ОЯ"
);

}finally{

if(
generation===oyaPreloadGeneration
){

oyaPreloading=false;

}

renderOyaTimeline();

updatePreloadButton();

}

}

async function loadRainViewer(){

showLoading(
"Загрузка радара…"
);

setStatus(
"Получение RainViewer…"
);

try{

const response=
await fetch(
"https://api.rainviewer.com/public/weather-maps.json",
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"RainViewer HTTP "+
response.status
);

}

const data=
await response.json();

const past=
Array.isArray(
data.radar?.past
)
?
data.radar.past
:
[];

const nowcast=
Array.isArray(
data.radar?.nowcast
)
?
data.radar.nowcast
:
[];

rainFrames=[
...past,
...nowcast
]
.filter(
frame=>
frame&&
Number.isFinite(
Number(frame.time)
)&&
typeof frame.path==="string"&&
frame.path.length>0
)
.sort(
(a,b)=>a.time-b.time
);

if(!rainFrames.length){

throw new Error(
"RainViewer не вернул кадры"
);

}

currentFrame=
rainFrames.length-1;

setRadarTimeline();

showRainFrame(
currentFrame
);

setStatus(
"Радар RainViewer"
);

}catch(error){

console.error(
"RainViewer:",
error
);

setStatus(
"Ошибка RainViewer"
);

}finally{

hideLoading();

}

}

/* =====================================================
   RAIN LAYER
===================================================== */

function makeRainLayer(frame){

let path=
String(
frame.path||""
).trim();

if(!path){

throw new Error(
"Пустой RainViewer path"
);

}

if(!path.startsWith("/")){

path="/"+path;

}

const tileUrl=
"https://tilecache.rainviewer.com"+
path+
"/256/{z}/{x}/{y}/2/1_1.png";

const source=
new ol.source.XYZ({

url:tileUrl,

tileSize:256,

maxZoom:19,

wrapX:true,

transition:0

});

const layer=
new ol.layer.Tile({

source,

opacity:.82,

zIndex:20,

preload:1

});

layer.__rainFrame=
frame;

return layer;

}

/* =====================================================
   SHOW RAIN
===================================================== */

function showRainFrame(index){

if(
activeLayer!=="radar"||
!rainFrames[index]
){

return;

}

const frame=
rainFrames[index];

const requestId=
++rainFrameRequestId;

let newLayer;

try{

newLayer=
makeRainLayer(
frame
);

}catch(error){

console.error(error);

setStatus(
"Ошибка URL радара"
);

return;

}

const source=
newLayer.getSource();

let finished=false;

let loadedTiles=0;

let failedTiles=0;

const cleanup=()=>{

source.un(
"tileloadend",
onTileLoadEnd
);

source.un(
"tileloaderror",
onTileLoadError
);

};

const removeNewLayer=()=>{

cleanup();

try{

map.removeLayer(
newLayer
);

}catch(e){}

};

const promote=()=>{

if(finished)return;

finished=true;

cleanup();

if(
requestId!==rainFrameRequestId||
activeLayer!=="radar"
){

removeNewLayer();

return;

}

const oldLayer=
radarLayer;

radarLayer=
newLayer;

if(
oldLayer&&
oldLayer!==newLayer
){

map.removeLayer(
oldLayer
);

}

map.render();

setStatus(
"Радар RainViewer"
);

};

const onTileLoadEnd=()=>{

loadedTiles++;

if(!finished){

promote();

}

};

const onTileLoadError=()=>{

failedTiles++;

if(
!finished&&
loadedTiles===0&&
failedTiles>=4
){

removeNewLayer();

if(
requestId===rainFrameRequestId
){

setStatus(
"Кадр радара недоступен"
);

}

}

};

source.on(
"tileloadend",
onTileLoadEnd
);

source.on(
"tileloaderror",
onTileLoadError
);

map.addLayer(
newLayer
);

map.render();

updateTimeLabel();

setTimeout(
()=>{

if(
finished||
requestId!==rainFrameRequestId
){

return;

}

if(loadedTiles>0){

promote();

}else{

removeNewLayer();

setStatus(
"Кадр радара не загрузился"
);

}

},
5000
);

}

/* =====================================================
   FRAME COUNT
===================================================== */

function commitOyaFrameCount(){

if(!oyaAllTimes.length){

frameCountInput.value=
oyaFrameCount||50;

return;

}

let count=
Number.parseInt(
frameCountInput.value,
10
);

if(!Number.isFinite(count)){

count=
oyaFrameCount||
Math.min(
50,
oyaAllTimes.length
);

}

count=
Math.max(
1,
Math.min(
count,
oyaAllTimes.length
)
);

applyOyaFrameCount(
count,
true
);

if(activeLayer==="oya"){

oyaFrameRequestId++;

loadOyaFrame(
oyaFrameIndex
);

}

}

function changeOyaFrameCount(
delta
){

if(!oyaAllTimes.length)return;

let count=
Number.parseInt(
frameCountInput.value,
10
);

if(!Number.isFinite(count)){

count=
oyaFrameCount||
50;

}

count=
Math.max(
1,
Math.min(
oyaAllTimes.length,
count+delta
)
);

applyOyaFrameCount(
count,
true
);

if(activeLayer==="oya"){

oyaFrameRequestId++;

loadOyaFrame(
oyaFrameIndex
);

}

}

frameCountInput.addEventListener(
"change",
commitOyaFrameCount
);

"keydown",
event=>{

if(event.key==="Enter"){

event.preventDefault();

commitOyaFrameCount();
