<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPTrad</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/openlayers/7.4.0/ol.css">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#111;
color:#fff;
}

body.light{
background:#f5f5f5;
color:#111;
}

#map{
position:fixed;
inset:0;
width:100%;
height:100%;
}

.topbar{
position:fixed;
top:12px;
left:12px;
right:12px;
height:48px;
display:flex;
align-items:center;
justify-content:space-between;
z-index:1000;
pointer-events:none;
}

.top-left,
.top-right{
display:flex;
align-items:center;
gap:8px;
pointer-events:auto;
}

.logo{
font-size:19px;
font-weight:700;
padding:0 12px;
height:42px;
display:flex;
align-items:center;
background:rgba(15,15,15,.86);
border:1px solid rgba(255,255,255,.12);
border-radius:14px;
backdrop-filter:blur(12px);
}

body.light .logo{
background:rgba(255,255,255,.9);
border-color:rgba(0,0,0,.1);
}

.icon-btn{
width:42px;
height:42px;
border:0;
border-radius:13px;
background:rgba(15,15,15,.86);
color:#fff;
font-size:19px;
display:flex;
align-items:center;
justify-content:center;
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.12);
cursor:pointer;
}

body.light .icon-btn{
background:rgba(255,255,255,.9);
color:#111;
border-color:rgba(0,0,0,.1);
}

.status{
position:fixed;
top:70px;
left:50%;
transform:translateX(-50%);
z-index:1000;
padding:7px 12px;
border-radius:12px;
font-size:12px;
background:rgba(15,15,15,.78);
backdrop-filter:blur(10px);
pointer-events:none;
white-space:nowrap;
}

body.light .status{
background:rgba(255,255,255,.85);
color:#111;
}

.layer-selector{
position:fixed;
left:14px;
top:50%;
transform:translateY(-50%);
z-index:1000;
background:rgba(15,15,15,.9);
border:1px solid rgba(255,255,255,.12);
border-radius:15px;
backdrop-filter:blur(12px);
overflow:hidden;
min-width:190px;
}

body.light .layer-selector{
background:rgba(255,255,255,.92);
color:#111;
border-color:rgba(0,0,0,.1);
}

.selected-layer{
padding:12px 14px;
font-size:13px;
font-weight:600;
cursor:pointer;
display:flex;
justify-content:space-between;
gap:10px;
}

.selected-layer span:last-child{
opacity:.55;
}

.layer-drawer{
max-height:0;
overflow:hidden;
transition:max-height .25s ease;
}

.layer-drawer.open{
max-height:160px;
}

.layer-item{
width:100%;
border:0;
background:transparent;
color:inherit;
padding:11px 14px;
text-align:left;
font-size:13px;
cursor:pointer;
}

.layer-item.active{
background:rgba(255,255,255,.1);
font-weight:600;
}

body.light .layer-item.active{
background:rgba(0,0,0,.08);
}

.settings{
position:fixed;
right:14px;
top:68px;
width:280px;
max-height:calc(100vh - 150px);
overflow-y:auto;
z-index:1100;
background:rgba(15,15,15,.94);
border:1px solid rgba(255,255,255,.12);
border-radius:17px;
backdrop-filter:blur(18px);
padding:8px;
transform:translateX(calc(100% + 25px));
transition:transform .25s ease;
}

.settings.open{
transform:translateX(0);
}

body.light .settings{
background:rgba(255,255,255,.95);
color:#111;
border-color:rgba(0,0,0,.1);
}

.setting-section{
border-radius:12px;
overflow:hidden;
margin-bottom:5px;
}

.setting-toggle{
width:100%;
min-height:44px;
border:0;
background:transparent;
color:inherit;
padding:10px 12px;
font-size:14px;
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
text-align:left;
}

.setting-toggle:active{
background:rgba(255,255,255,.08);
}

.setting-toggle span:last-child{
opacity:.45;
font-size:13px;
}

.setting-content{
display:none;
padding:5px 10px 10px;
}

.setting-section.open .setting-content{
display:block;
}

.option-row{
display:flex;
gap:7px;
}

.option-btn{
flex:1;
min-height:38px;
border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.06);
color:inherit;
border-radius:10px;
font-size:12px;
cursor:pointer;
}

.option-btn.active{
background:rgba(255,255,255,.18);
border-color:rgba(255,255,255,.3);
}

body.light .option-btn{
border-color:rgba(0,0,0,.1);
background:rgba(0,0,0,.04);
}

body.light .option-btn.active{
background:rgba(0,0,0,.1);
}

.range-wrap{
padding:5px 2px;
}

.range-line{
display:flex;
align-items:center;
gap:9px;
}

input[type=range]{
width:100%;
accent-color:#888;
}

.range-value{
min-width:43px;
text-align:right;
font-size:12px;
opacity:.7;
}

.switch-row{
display:flex;
align-items:center;
justify-content:space-between;
min-height:42px;
font-size:13px;
}

.switch{
position:relative;
width:43px;
height:24px;
}

.switch input{
display:none;
}

.switch-track{
position:absolute;
inset:0;
background:#555;
border-radius:20px;
cursor:pointer;
transition:.2s;
}

.switch-track:after{
content:"";
position:absolute;
width:18px;
height:18px;
top:3px;
left:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked + .switch-track{
background:#888;
}

.switch input:checked + .switch-track:after{
transform:translateX(19px);
}

.frame-control{
display:flex;
align-items:center;
gap:6px;
}

.frame-control button{
width:38px;
height:38px;
border:0;
border-radius:10px;
background:rgba(255,255,255,.08);
color:inherit;
font-size:18px;
cursor:pointer;
}

.frame-control input{
width:100%;
height:38px;
border:1px solid rgba(255,255,255,.12);
border-radius:10px;
background:rgba(255,255,255,.05);
color:inherit;
text-align:center;
font-size:14px;
outline:none;
}

body.light .frame-control button{
background:rgba(0,0,0,.06);
}

body.light .frame-control input{
border-color:rgba(0,0,0,.1);
background:rgba(0,0,0,.03);
}

#paletteModal{
position:fixed;
inset:0;
z-index:3000;
display:none;
}

#paletteModal.open{
display:block;
}

.palette-modal-backdrop{
position:absolute;
inset:0;
background:rgba(0,0,0,.5);
backdrop-filter:blur(10px);
}

.palette-window{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(410px,calc(100vw - 28px));
max-height:min(650px,calc(100vh - 40px));
overflow:hidden;
background:#171717;
border:1px solid rgba(255,255,255,.14);
border-radius:18px;
box-shadow:0 20px 70px rgba(0,0,0,.45);
display:flex;
flex-direction:column;
}

body.light .palette-window{
background:#fff;
color:#111;
border-color:rgba(0,0,0,.1);
}

.palette-header{
height:54px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
border-bottom:1px solid rgba(255,255,255,.1);
flex-shrink:0;
}

body.light .palette-header{
border-color:rgba(0,0,0,.08);
}

.palette-title{
font-size:15px;
font-weight:650;
}

.palette-close{
border:0;
background:transparent;
color:inherit;
font-size:22px;
width:34px;
height:34px;
cursor:pointer;
}

.palette-list{
padding:9px;
overflow-y:auto;
}

.palette-row{
display:grid;
grid-template-columns:1fr 32px 40px;
gap:8px;
align-items:center;
min-height:42px;
border-radius:10px;
padding:4px 6px;
}

.palette-row:active{
background:rgba(255,255,255,.06);
}

.palette-name{
font-size:12px;
line-height:1.2;
}

.palette-swatch{
width:30px;
height:30px;
border-radius:7px;
border:1px solid rgba(255,255,255,.25);
}

.palette-move{
width:32px;
height:18px;
padding:0;
border:0;
border-radius:5px;
background:rgba(255,255,255,.09);
color:inherit;
font-size:10px;
cursor:pointer;
}

.palette-move:disabled{
opacity:.2;
}

.palette-footer{
padding:9px;
border-top:1px solid rgba(255,255,255,.1);
flex-shrink:0;
}

.palette-reset{
width:100%;
height:39px;
border:0;
border-radius:10px;
background:rgba(255,255,255,.09);
color:inherit;
cursor:pointer;
}

body.light .palette-footer{
border-color:rgba(0,0,0,.08);
}

.loading{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:2000;
padding:13px 18px;
background:rgba(15,15,15,.92);
border-radius:14px;
font-size:13px;
display:none;
backdrop-filter:blur(12px);
}

.loading.open{
display:block;
}

.bottom-panel{
position:fixed;
left:12px;
right:12px;
bottom:12px;
height:76px;
z-index:1000;
background:rgba(15,15,15,.88);
border:1px solid rgba(255,255,255,.12);
border-radius:16px;
backdrop-filter:blur(14px);
display:flex;
align-items:center;
gap:10px;
padding:10px 12px;
}

body.light .bottom-panel{
background:rgba(255,255,255,.92);
color:#111;
border-color:rgba(0,0,0,.1);
}

.time-button{
width:40px;
height:40px;
flex-shrink:0;
border:0;
border-radius:11px;
background:rgba(255,255,255,.08);
color:inherit;
font-size:16px;
cursor:pointer;
}

body.light .time-button{
background:rgba(0,0,0,.06);
}

.timeline-wrap{
flex:1;
min-width:0;
}

.time-label{
font-size:12px;
opacity:.72;
text-align:center;
margin-bottom:3px;
}

#timeSlider{
display:block;
height:20px;
}

.oya-segments{
height:3px;
display:flex;
gap:1px;
margin-top:0;
}

.oya-segment{
height:3px;
flex:1;
background:rgba(255,255,255,.13);
border-radius:2px;
}

.oya-segment.loaded{
background:rgba(255,255,255,.38);
}

.oya-segment.current{
background:#fff;
}

body.light .oya-segment{
background:rgba(0,0,0,.1);
}

body.light .oya-segment.loaded{
background:rgba(0,0,0,.3);
}

body.light .oya-segment.current{
background:#111;
}

.long-progress{
height:3px;
margin-top:1px;
background:rgba(255,255,255,.1);
display:none;
border-radius:3px;
overflow:hidden;
}

.long-progress-fill{
height:100%;
width:0;
background:#fff;
}

.preload-btn{
width:40px;
height:40px;
flex-shrink:0;
border:0;
border-radius:11px;
background:rgba(255,255,255,.08);
color:inherit;
font-size:16px;
cursor:pointer;
}

.preload-btn:disabled{
opacity:.35;
}

.ol-zoom,
.ol-attribution{
display:none!important;
}

@media(max-width:600px){

.settings{
width:calc(100vw - 28px);
right:14px;
}

.layer-selector{
left:10px;
}

.bottom-panel{
left:8px;
right:8px;
bottom:8px;
}

}

</style>
</head>

<body>

<div id="map"></div>

<div class="topbar">

<div class="top-left">

<div class="logo">GPTrad</div>

<button
id="locateBtn"
class="icon-btn"
aria-label="Местоположение">⌖</button>

<button
id="reloadBtn"
class="icon-btn"
aria-label="Обновить">↻</button>

</div>

<div class="top-right">

<button
id="settingsBtn"
class="icon-btn"
aria-label="Настройки">⚙</button>

</div>

</div>

<div id="status" class="status">Загрузка…</div>

<div id="loading" class="loading">
Загрузка…
</div>

<div class="layer-selector">

<div
id="selectedLayer"
class="selected-layer">

<span id="selectedLayerName">
Радар (RainViewer)
</span>

<span>›</span>

</div>

<div
id="layerDrawer"
class="layer-drawer">

<button
class="layer-item active"
data-layer="radar">
Радар (RainViewer)
</button>

<button
class="layer-item"
data-layer="oya">
Опасные явления
</button>

</div>

</div>

<div id="settings" class="settings">

<div
class="setting-section"
id="appearanceSection">

<button
class="setting-toggle"
id="appearanceToggle">

<span>Оформление</span>
<span>›</span>

</button>

<div class="setting-content">

<div class="option-row">

<button
class="option-btn theme-btn"
data-theme="dark">
Тёмное
</button>

<button
class="option-btn theme-btn"
data-theme="light">
Светлое
</button>

</div>

</div>

</div>

<div
class="setting-section"
id="mapSection">

<button
class="setting-toggle"
id="mapToggle">

<span>Карта</span>
<span>›</span>

</button>

<div class="setting-content">

<div class="option-row">

<button
class="option-btn map-theme-btn"
data-map-theme="light">
Светлая карта
</button>

<button
class="option-btn map-theme-btn"
data-map-theme="dark">
Тёмная карта
</button>

</div>

<button
id="resetMapBtn"
class="option-btn"
style="width:100%;margin-top:7px;">
Сбросить положение
</button>

</div>

</div>

<div
class="setting-section"
id="opacitySection">

<button
class="setting-toggle"
id="opacityToggle">

<span>Прозрачность</span>
<span>›</span>

</button>

<div class="setting-content">

<div class="range-wrap">

<div class="range-line">

<input
id="oyaOpacitySlider"
type="range"
min="0"
max="100"
step="1">

<span
id="oyaOpacityValue"
class="range-value">
90%
</span>

</div>

</div>

</div>

</div>

<div class="setting-section">

<button
class="setting-toggle"
id="radarBeamToggle">

<span>Радарный луч</span>

<span>›</span>

</button>

<div class="setting-content">

<div class="switch-row">

<span>Показывать зоны радаров</span>

<label class="switch">

<input
id="radarBeamCheckbox"
type="checkbox">

<span class="switch-track"></span>

</label>

</div>

</div>

</div>

<div class="setting-section">

<button
class="setting-toggle"
id="radarMaskToggle">

<span>Маски радарных лучей</span>

<span>›</span>

</button>

<div class="setting-content">

<div class="switch-row">

<span>Затемнять вне данных</span>

<label class="switch">

<input
id="radarMaskCheckbox"
type="checkbox">

<span class="switch-track"></span>

</label>

</div>

</div>

</div>

<div
class="setting-section">

<button
class="setting-toggle"
id="paletteToggle">

<span>Палитра</span>
<span>›</span>

</button>

</div>

<div
class="setting-section"
id="smoothingSection">

<button
class="setting-toggle"
id="smoothingToggle">

<span>Сглаживание</span>
<span>›</span>

</button>

<div class="setting-content">

<div class="range-wrap">

<div class="range-line">

<input
id="oyaSmoothingSlider"
type="range"
min="0"
max="100"
step="1">

<span
id="oyaSmoothingValue"
class="range-value">
0%
</span>

</div>

</div>

</div>

</div>

<div
class="setting-section"
id="frameCountSection">

<button
class="setting-toggle"
id="frameCountToggle">

<span>Кол. кадров</span>
<span>›</span>

</button>

<div class="setting-content">

<div class="frame-control">

<button id="frameCountPrev">−</button>

<input
id="frameCountInput"
type="number"
min="1"
max="100"
value="50">

<button id="frameCountNext">+</button>

</div>

</div>

</div>

</div>

<div id="paletteModal">

<div class="palette-modal-backdrop"></div>

<div class="palette-window">

<div class="palette-header">

<div class="palette-title">
Палитра ОЯ
</div>

<button
id="paletteClose"
class="palette-close">
×
</button>

</div>

<div
id="paletteRows"
class="palette-list">
</div>

<div class="palette-footer">

<button
id="paletteReset"
class="palette-reset">
Сбросить порядок
</button>

</div>

</div>

</div>

<div class="bottom-panel">

<button
id="backBtn"
class="time-button">
‹
</button>

<div class="timeline-wrap">

<div
id="timeLabel"
class="time-label">
—
</div>

<input
id="timeSlider"
type="range"
min="0"
max="0"
value="0"
step="1">

<div
id="oyaTimelineSegments"
class="oya-segments">
</div>

<div
id="oyaLongProgress"
class="long-progress">

<div
id="oyaLongProgressFill"
class="long-progress-fill">
</div>

</div>

</div>

<button
id="playBtn"
class="time-button">
▶
</button>

<button
id="forwardBtn"
class="time-button">
›
</button>

<button
id="preloadBtn"
class="preload-btn"
disabled>
⇩
</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/openlayers/7.4.0/dist/ol.js"></script>

<script>

"use strict";

/* =====================================================
   ОСНОВНЫЕ НАСТРОЙКИ
===================================================== */

const OYA_PROXY="/api/oya";

const OYA_LAYER="bufr_dbz1";

const DEFAULT_MAP_CENTER=[
55.75,
37.62
];

const DEFAULT_MAP_ZOOM=5;

const RADAR_VECTOR_PROXY=
"/api/oya?action=vector";

const RADAR_COVERAGE_RADIUS=310000;

/*
 * Известные позиции.
 * Используются как fallback, если endpoint
 * временно не отдаёт станции.
 */

const KNOWN_RADAR_POSITIONS=[
{
lat:55.67,
lon:37.55
},
{
lat:56.28,
lon:40.20
}
];

/* =====================================================
   DOM
===================================================== */

const statusEl=
document.getElementById("status");

const loadingEl=
document.getElementById("loading");

const settings=
document.getElementById("settings");

const mapEl=
document.getElementById("map");

const selectedLayer=
document.getElementById("selectedLayer");

const selectedLayerName=
document.getElementById("selectedLayerName");

const layerDrawer=
document.getElementById("layerDrawer");

const timeSlider=
document.getElementById("timeSlider");

const timeLabel=
document.getElementById("timeLabel");

const backBtn=
document.getElementById("backBtn");

const forwardBtn=
document.getElementById("forwardBtn");

const playBtn=
document.getElementById("playBtn");

const preloadBtn=
document.getElementById("preloadBtn");

const frameCountInput=
document.getElementById("frameCountInput");

const oyaOpacitySlider=
document.getElementById("oyaOpacitySlider");

const oyaOpacityValue=
document.getElementById("oyaOpacityValue");

const oyaSmoothingSlider=
document.getElementById("oyaSmoothingSlider");

const oyaSmoothingValue=
document.getElementById("oyaSmoothingValue");

const radarBeamCheckbox=
document.getElementById("radarBeamCheckbox");

const radarMaskCheckbox=
document.getElementById("radarMaskCheckbox");

const paletteModal=
document.getElementById("paletteModal");

const paletteRows=
document.getElementById("paletteRows");

const oyaTimelineSegments=
document.getElementById("oyaTimelineSegments");

const oyaLongProgress=
document.getElementById("oyaLongProgress");

const oyaLongProgressFill=
document.getElementById("oyaLongProgressFill");

/* =====================================================
   MAP
===================================================== */

const osmLayer=
new ol.layer.Tile({

source:new ol.source.OSM(),

visible:true,

zIndex:0

});

const darkOsmLayer=
new ol.layer.Tile({

source:new ol.source.XYZ({

url:
"https://{a-c}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",

attributions:"© OpenStreetMap © CARTO",

crossOrigin:"anonymous"

}),

visible:false,

zIndex:0

});

const view=
new ol.View({

center:
ol.proj.fromLonLat(
DEFAULT_MAP_CENTER
),

zoom:DEFAULT_MAP_ZOOM,

minZoom:2,

maxZoom:18

});

const map=
new ol.Map({

target:"map",

layers:[
osmLayer,
darkOsmLayer
],

view:view,

controls:[]

});

function resizeMap(){

setTimeout(
()=>{
map.updateSize();
map.render();
},
0
);

}

window.addEventListener(
"resize",
resizeMap
);

/* =====================================================
   STATUS / LOADING
===================================================== */

function setStatus(text){

statusEl.textContent=
String(text||"");

}

function showLoading(text){

loadingEl.textContent=
String(text||"Загрузка…");

loadingEl.classList.add("open");

}

function hideLoading(){

loadingEl.classList.remove("open");

}

/* =====================================================
   RADAR
===================================================== */

let radarLayer=null;

const radarBeamSource=
new ol.source.Vector();

function normalizeRadarPoint(
lat,
lon
){

lat=Number(lat);
lon=Number(lon);

if(
!Number.isFinite(lat)||
!Number.isFinite(lon)
){

return null;

}

if(
lat<-90||
lat>90||
lon<-180||
lon>180
){

return null;

}

return{
lat,
lon
};

}

function extractRadarPositions(
data
){

const result=[];

function walk(value){

if(!value)return;

if(Array.isArray(value)){

/*
 * Формат:
 * [lat,lon,value,direction]
 */

if(
value.length>=2&&
Number.isFinite(Number(value[0]))&&
Number.isFinite(Number(value[1]))
){

const point=
normalizeRadarPoint(
value[0],
value[1]
);

if(point){

result.push(point);

}

}

for(
const item of value
){

if(
typeof item==="object"
){

walk(item);

}

}

return;

}

if(
typeof value!=="object"
){

return;

}

if(
value.lat!==undefined&&
value.lon!==undefined
){

const point=
normalizeRadarPoint(
value.lat,
value.lon
);

if(point){

result.push(point);

}

}

if(
value.latitude!==undefined&&
value.longitude!==undefined
){

const point=
normalizeRadarPoint(
value.latitude,
value.longitude
);

if(point){

result.push(point);

}

}

if(
value.geometry?.coordinates
){

const coordinates=
value.geometry.coordinates;

if(
Array.isArray(coordinates)&&
coordinates.length>=2
){

const point=
normalizeRadarPoint(
coordinates[1],
coordinates[0]
);

if(point){

result.push(point);

}

}

}

for(
const key of Object.keys(value)
){

if(
key==="lat"||
key==="lon"||
key==="latitude"||
key==="longitude"||
key==="geometry"
){

continue;

}

if(
typeof value[key]==="object"
){

walk(value[key]);

}

}

}

walk(data);

const unique=[];

const seen=new Set();

for(
const point of result
){

const key=
point.lat.toFixed(4)+
"|"+
point.lon.toFixed(4);

if(!seen.has(key)){

seen.add(key);

unique.push(point);

}

}

return unique;

}

/* =====================================================
   PALETTE LUT
===================================================== */

let paletteLut=null;

let paletteLutSignature="";

function getPaletteSignature(){

return oyaPalette
.map(
item=>
item.sourceIndex+
":"+
item.color
)
.join("|");

}

function buildPaletteLut(){

const signature=
getPaletteSignature();

if(
paletteLut &&
paletteLutSignature===
signature
){

return paletteLut;

}

const mapped=
new Array(
OYA_SOURCE_COLORS.length
);

for(
let sourceIndex=0;
sourceIndex<OYA_SOURCE_COLORS.length;
sourceIndex++
){

const item=
oyaPalette.find(
x=>
x.sourceIndex===
sourceIndex
);

mapped[sourceIndex]=
item
?
hexToRgb(item.color)
:
OYA_SOURCE_COLORS[sourceIndex];

}

const size=32;

const lut=
new Uint16Array(
size*size*size
);

for(
let r=0;
r<size;
r++
){

for(
let g=0;
g<size;
g++
){

for(
let b=0;
b<size;
b++
){

const rr=
r*8+4;

const gg=
g*8+4;

const bb=
b*8+4;

let best=0;

let bestDistance=
Infinity;

for(
let c=0;
c<OYA_SOURCE_COLORS.length;
c++
){

const source=
OYA_SOURCE_COLORS[c];

const dr=
rr-source[0];

const dg=
gg-source[1];

const db=
bb-source[2];

const distance=
dr*dr+
dg*dg+
db*db;

if(
distance<bestDistance
){

bestDistance=
distance;

best=c;

}

}

const index=
(
r*size+g
)*size+b;

lut[index]=
best;

}

}

}

paletteLut=
{
lut,
mapped
};

paletteLutSignature=
signature;

return paletteLut;

}

/* =====================================================
   PALETTE
===================================================== */

function applyOyaPaletteFast(
pixels
){

const data=
buildPaletteLut();

const lut=
data.lut;

const mapped=
data.mapped;

const size=32;

for(
let i=0;
i<pixels.length;
i+=4
){

if(
pixels[i+3]===0
){

continue;

}

const r=
pixels[i];

const g=
pixels[i+1];

const b=
pixels[i+2];

const index=
(
(r>>3)*size+
(g>>3)
)*size+
(b>>3);

const sourceIndex=
lut[index];

const source=
OYA_SOURCE_COLORS[
sourceIndex
];

const dr=
r-source[0];

const dg=
g-source[1];

const db=
b-source[2];

const distance=
dr*dr+
dg*dg+
db*db;

if(
distance<=2600
){

const target=
mapped[sourceIndex];

pixels[i]=target[0];
pixels[i+1]=target[1];
pixels[i+2]=target[2];
pixels[i+3]=255;

}

}

}

===================================================== */

async function removeGrayBackground(
pixels,
width
){

const rowsPerChunk=24;

for(
let y=0;
y<Math.ceil(
pixels.length/
(width*4)
);
y+=rowsPerChunk
){

const end=
Math.min(
Math.ceil(
pixels.length/
(width*4)
),
y+rowsPerChunk
);

for(
let row=y;
row<end;
row++
){

const start=
row*width*4;

const finish=
Math.min(
pixels.length,
start+width*4
);

for(
let i=start;
i<finish;
i+=4
){

const r=
pixels[i];

const g=
pixels[i+1];

const b=
pixels[i+2];

const a=
pixels[i+3];

if(a===0){

continue;

}

const max=
Math.max(r,g,b);

const min=
Math.min(r,g,b);

const diff=
max-min;

/*
 * Серый фон → прозрачный.
 *
 * Сохранена логика пользователя.
 */

if(
diff<=22&&
r>=125&&
g>=125&&
b>=125&&
r<=250&&
g<=250&&
b<=250
){

pixels[i+3]=0;

}else{

/*
 * Реально непрозрачный OYA.
 */

pixels[i+3]=255;

}

}

}

await yieldBrowser();

}

}

if(level<=0){

/*
 * 0–100% → радиус 1–4.
 *
 * Ограничение специально небольшое:
 * оно убирает крупные квадратные пиксели,
 * но не превращает радар в размытую кашу.
 */

const radius=
Math.max(
1,
Math.min(
4,
Math.round(
level/25
)
)
);

const temp=
new Uint8ClampedArray(
pixels.length
);

const rowsPerChunk=18;

/* horizontal */

for(
let y=0;
y<height;
y++
){

const rowStart=
y*width;

for(
let x=0;
x<width;
x++
){

let sr=0;
let sg=0;
let sb=0;
let count=0;

const x1=
Math.max(
0,
x-radius
);

const x2=
Math.min(
width-1,
x+radius
);

for(
let xx=x1;
xx<=x2;
xx++
){

const index=
(
rowStart+xx
)*4;

if(
pixels[index+3]===0
){

continue;

}

sr+=pixels[index];
sg+=pixels[index+1];
sb+=pixels[index+2];

count++;

}

const out=
(rowStart+x)*4;

if(count){

temp[out]=
Math.round(sr/count);

temp[out+1]=
Math.round(sg/count);

temp[out+2]=
Math.round(sb/count);

temp[out+3]=
pixels[out+3];

}else{

temp[out]=pixels[out];
temp[out+1]=pixels[out+1];
temp[out+2]=pixels[out+2];
temp[out+3]=pixels[out+3];

}

}

if(
y%rowsPerChunk===0
){

await yieldBrowser();

}

}

/* vertical */

for(
let y=0;
y<height;
y++
){

for(
let x=0;
x<width;
x++
){

let sr=0;
let sg=0;
let sb=0;
let count=0;

const y1=
Math.max(
0,
y-radius
);

const y2=
Math.min(
height-1,
y+radius
);

for(
let yy=y1;
yy<=y2;
yy++
){

const index=
(
yy*width+x
)*4;

if(
temp[index+3]===0
){

continue;

}

sr+=temp[index];
sg+=temp[index+1];
sb+=temp[index+2];

count++;

}

const out=
(y*width+x)*4;

if(count){

pixels[out]=
Math.round(sr/count);

pixels[out+1]=
Math.round(sg/count);

pixels[out+2]=
Math.round(sb/count);

}

}

if(
y%rowsPerChunk===0
){

await yieldBrowser();

}

}

}

/* =====================================================
   OYA IMAGE PROCESSING
===================================================== */

async function processOyaImage(
blobUrl
){

const image=
new Image();

image.decoding=
"async";

image.src=
blobUrl;

await new Promise(
(resolve,reject)=>{

image.onload=resolve;

image.onerror=()=>reject(
new Error(
"OYA image error"
)
);

}
);

await yieldBrowser();

const width=
image.naturalWidth;

const height=
image.naturalHeight;

const canvas=
document.createElement(
"canvas"
);

canvas.width=
width;

canvas.height=
height;

const ctx=
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);

if(!ctx){

throw new Error(
"Canvas unavailable"
);

}

ctx.drawImage(
image,
0,
0
);

await yieldBrowser();

const imageData=
ctx.getImageData(
0,
0,
width,
height
);

const pixels=
imageData.data;

/*
 * Серый фон удаляем по частям.
 */

await removeGrayBackground(
pixels,
width
);

/*
 * Создаём отдельную маску ДО сглаживания.
 * Таким образом маска показывает реальную
 * область данных, а не круг радара.
 */

const maskCanvas=
document.createElement(
"canvas"
);

maskCanvas.width=
width;

maskCanvas.height=
height;

const maskCtx=
maskCanvas.getContext(
"2d"
);

const maskData=
maskCtx.createImageData(
width,
height
);

const maskPixels=
maskData.data;

for(
let i=0;
i<pixels.length;
i+=4
){

if(
pixels[i+3]>0
){

maskPixels[i]=0;
maskPixels[i+1]=0;
maskPixels[i+2]=0;
maskPixels[i+3]=255;

}

}

maskCtx.putImageData(
maskData,
0,
0
);

const maskUrl=
await createDataMaskFromCanvas(
maskCanvas
);

await yieldBrowser();

/*
 * Сначала сглаживаем фактические
 * радарные пиксели.
 */

await smoothPixels(
pixels,
width,
height,
oyaSmoothing
);

await yieldBrowser();

/*
 * После сглаживания возвращаем цвета
 * строго к палитре легенды.
 */

applyOyaPaletteFast(
pixels
);

ctx.putImageData(
imageData,
0,
0
);

await yieldBrowser();

const blob=
await new Promise(
resolve=>
canvas.toBlob(
resolve,
"image/png"
)
);

if(!blob){

if(maskUrl){

URL.revokeObjectURL(
maskUrl
);

}

throw new Error(
"PNG creation failed"
);

}

const cleanedUrl=
URL.createObjectURL(
blob
);

return{
cleanedUrl,
maskUrl
};

}

function wait(ms){

return new Promise(
resolve=>
setTimeout(resolve,ms)
);

}

function getCurrentViewportData(){

const size=
map.getSize()||
[
window.innerWidth,
window.innerHeight
];

const extent=
view.calculateExtent(size);

const geoExtent=
ol.proj.transformExtent(
extent,
"EPSG:3857",
"EPSG:4326"
);

const width=
Math.max(
256,
Math.min(
1600,
Math.round(size[0])
)
);

const height=
Math.max(
256,
Math.min(
1200,
Math.round(size[1])
)
);

const key=[

geoExtent[0].toFixed(5),
geoExtent[1].toFixed(5),
geoExtent[2].toFixed(5),
geoExtent[3].toFixed(5),

width,
height

].join("|");

return{

extent,

geoExtent,

width,

height,

viewportKey:key,

key

};

}

function getOyaRequestData(
timeValue
){

const viewport=
getCurrentViewportData();

const params=
new URLSearchParams({

action:"image",

SERVICE:"WMS",

VERSION:"1.1.1",

REQUEST:"GetMap",

LAYERS:OYA_LAYER,

STYLES:"",

SRS:"EPSG:3857",

BBOX:
viewport.extent.join(","),

WIDTH:
String(viewport.width),

HEIGHT:
String(viewport.height),

FORMAT:"image/png",

TRANSPARENT:"true",

EXCEPTIONS:
"application/vnd.ogc.se_inimage",

TIME:
new Date(
timeValue*1000
).toISOString()

});

return{

url:
OYA_PROXY+
"?"+
params.toString(),

extent:
viewport.extent,

width:
viewport.width,

height:
viewport.height,

viewportKey:
viewport.key

};

}

function makeOyaCacheKey(
time,
data
){

return[
time,
data.viewportKey
].join("|");

}

async function fetchOyaBlob(
url,
attempts=3
){

let lastError=null;

for(
let attempt=1;
attempt<=attempts;
attempt++
){

try{

const response=
await fetch(
url,
{
cache:"force-cache"
}
);

if(!response.ok){

throw new Error(
"OYA HTTP "+
response.status
);

}

const blob=
await response.blob();

if(
!blob||
blob.size===0
){

throw new Error(
"OYA empty response"
);

}

return blob;

}catch(error){

lastError=error;

console.warn(
`OYA request attempt ${attempt}/${attempts}:`,
error
);

if(
attempt<attempts
){

await wait(
250*attempt
);

}

}

}

throw(
lastError||
new Error(
"OYA request failed"
)
);

}

async function createOyaImageLayer(
originalBlobUrl,
extent,
cacheKey
){

let processed=
oyaProcessedCache.get(
cacheKey
);

if(!processed){

setStatus(
"Обработка ОЯ…"
);

processed=
await processOyaImage(
originalBlobUrl
);

oyaProcessedCache.set(
cacheKey,
processed
);

}

const source=
new ol.source.ImageStatic({

url:
processed.cleanedUrl,

imageExtent:
extent,

projection:
"EPSG:3857",

interpolate:true

});

const layer=
new ol.layer.Image({

source,

opacity:
oyaOpacity/100,

zIndex:60

});

layer.__oyaCleanUrl=
processed.cleanedUrl;

layer.__oyaMaskUrl=
processed.maskUrl;

layer.__oyaCacheKey=
cacheKey;

return layer;

}

function waitForOyaLayerReady(
layer
){

return new Promise(
(resolve,reject)=>{

const source=
layer.getSource();

let finished=false;

let timer=null;

const cleanup=()=>{

source.un(
"imageloadend",
onLoadEnd
);

source.un(
"imageloaderror",
onLoadError
);

if(timer){

clearTimeout(timer);

timer=null;

}

};

const finish=error=>{

if(finished)return;

finished=true;

cleanup();

if(error){

reject(error);

}else{

resolve();

}

};

const onLoadEnd=()=>finish();

const onLoadError=()=>finish(
new Error(
"OYA ImageStatic load error"
)
);

source.on(
"imageloadend",
onLoadEnd
);

source.on(
"imageloaderror",
onLoadError
);

timer=
setTimeout(
()=>finish(
new Error(
"OYA image timeout"
)
),
15000
);

map.addLayer(
layer
);

map.render();

});

}

function swapOyaLayer(
newLayer
){

const oldLayer=
oyaImage;

oyaImage=
newLayer;

if(
oldLayer&&
oldLayer!==newLayer
){

try{

map.removeLayer(
oldLayer
);

}catch(e){}

}

map.render();

}

async function loadOyaFrame(
index
){

if(activeLayer!=="oya"){

return;

}

if(!oyaTimes.length){

const ready=
await loadOyaCapabilities();

if(!ready){

return;

}

}

if(
index<0||
index>=oyaTimes.length
){

return;

}

const requestId=
++oyaFrameRequestId;

const generation=
oyaCacheGeneration;

oyaFrameIndex=
index;

timeSlider.value=
index;

updateTimeLabel();

renderOyaTimeline();

const timeValue=
oyaTimes[index];

const requestData=
getOyaRequestData(
timeValue
);

const cacheKey=
makeOyaCacheKey(
timeValue,
requestData
);

let result=
oyaFrameCache.get(
cacheKey
);

try{

if(!result){

setStatus(
"Загрузка ОЯ…"
);

let pending=
oyaPendingRequests.get(
cacheKey
);

if(!pending){

pending=
(async()=>{

const blob=
await fetchOyaBlob(
requestData.url,
3
);

if(
generation!==oyaCacheGeneration
){

return null;

}

const blobUrl=
URL.createObjectURL(
blob
);

const value={

blobUrl,

extent:
requestData.extent,

timeValue

};

oyaFrameCache.set(
cacheKey,
value
);

return value;

})();

oyaPendingRequests.set(
cacheKey,
pending
);

}

try{

result=
await pending;

}finally{

oyaPendingRequests.delete(
cacheKey
);

}

}

if(!result){

return;

}

if(
requestId!==oyaFrameRequestId||
generation!==oyaCacheGeneration||
activeLayer!=="oya"
){

return;

}

const newLayer=
await createOyaImageLayer(
result.blobUrl,
result.extent,
cacheKey
);

if(
requestId!==oyaFrameRequestId||
generation!==oyaCacheGeneration||
activeLayer!=="oya"
){

return;

}

await waitForOyaLayerReady(
newLayer
);

if(
requestId!==oyaFrameRequestId||
generation!==oyaCacheGeneration||
activeLayer!=="oya"
){

try{

map.removeLayer(
newLayer
);

}catch(e){}

return;

}

swapOyaLayer(
newLayer
);

oyaLoadedTimes.add(
timeValue
);

/*
 * Обновляем фактическую маску.
 */

if(
radarMaskCheckbox.checked &&
newLayer.__oyaMaskUrl
){

removeRadarDataMaskImage();

oyaCurrentMaskUrl=
newLayer.__oyaMaskUrl;

oyaCurrentExtent=
result.extent;

setRadarDataMaskImage(
oyaCurrentMaskUrl,
oyaCurrentExtent
);

}

renderOyaTimeline();

setStatus(
"Опасные явления"
);

}catch(error){

console.error(
"OYA frame:",
error
);

if(
requestId===
oyaFrameRequestId
){

setStatus(
"Кадр ОЯ не загрузился"
);

}

}

}

   PRELOAD
===================================================== */

async function preloadOyaFrame(
timeValue,
generation,
cacheGeneration
){

if(
generation!==oyaPreloadGeneration||
cacheGeneration!==oyaCacheGeneration||
activeLayer!=="oya"
){

return false;

}

const data=
getOyaRequestData(
timeValue
);

const key=
makeOyaCacheKey(
timeValue,
data
);

if(
oyaFrameCache.has(key)
){

oyaLoadedTimes.add(
timeValue
);

return true;

}

let pending=
oyaPendingRequests.get(
key
);

if(!pending){

pending=
(async()=>{

const blob=
await fetchOyaBlob(
data.url,
3
);

if(
generation!==oyaPreloadGeneration||
cacheGeneration!==oyaCacheGeneration||
activeLayer!=="oya"
){

return null;

}

const blobUrl=
URL.createObjectURL(
blob
);

oyaFrameCache.set(
key,
{

blobUrl,

extent:
data.extent,

timeValue

}
);

oyaLoadedTimes.add(
timeValue
);

return true;

})();

oyaPendingRequests.set(
key,
pending
);

}

try{

return!!(
await pending
);

}catch(error){

console.error(
"Preload:",
error
);

return false;

}finally{

oyaPendingRequests.delete(
key
);

}

}

async function preloadAllOyaFrames(){

if(
activeLayer!=="oya"||
oyaTimes.length<1||
oyaTimes.length>=52||
oyaPreloading
){

return;

}

oyaPreloading=true;

const generation=
++oyaPreloadGeneration;

const cacheGeneration=
oyaCacheGeneration;

updatePreloadButton();

const times=
oyaTimes.slice();

let cursor=0;

async function worker(){

while(true){

if(
generation!==oyaPreloadGeneration||
cacheGeneration!==oyaCacheGeneration||
activeLayer!=="oya"
){

return;

}

const index=
cursor++;

if(
index>=times.length
){

return;

}

await preloadOyaFrame(
times[index],
generation,
cacheGeneration
);

let loaded=0;

for(
const time of times
){

if(
oyaLoadedTimes.has(time)
){

loaded++;

}

}

setStatus(
`Загрузка кадров: ${loaded}/${times.length}`
);

renderOyaTimeline();

await yieldBrowser();

}

}

try{

await Promise.all(
Array.from(
{
length:
Math.min(
3,
times.length
)
},
()=>worker()
)
);

if(
generation===oyaPreloadGeneration&&
activeLayer==="oya"
){

const complete=
times.every(
t=>
oyaLoadedTimes.has(t)
);

setStatus(
complete
?
"Все кадры ОЯ загружены"
:
"Загрузка ОЯ завершена"
);

}

}catch(error){

console.error(error);

setStatus(
"Ошибка загрузки ОЯ"
);

}finally{

if(
generation===
oyaPreloadGeneration
){

oyaPreloading=false;

}

renderOyaTimeline();

updatePreloadButton();

}

}

/* =====================================================
   CAPABILITIES
===================================================== */

function isoToUnix(
value
){

const t=
Date.parse(value);

return Number.isNaN(t)
?
null
:
Math.floor(t/1000);

}

function parseOyaTimes(
text
){

if(!text){

return[];

}

const result=[];

for(
const value of text
.split(",")
.map(
x=>x.trim()
)
.filter(Boolean)
){

const unix=
isoToUnix(value);

if(unix!==null){

const date=
new Date(
unix*1000
);

const minute=
date.getUTCMinutes();

const second=
date.getUTCSeconds();

if(
minute%10===0&&
second===0
){

result.push(unix);

}

}

}

return[
...new Set(result)
];

}

function normalizeOyaTimes(
times
){

const now=
Math.floor(
Date.now()/1000
);

const result=[];

for(
const time of times
){

if(
!Number.isFinite(time)
){

continue;

}

if(time>now){

continue;

}

const date=
new Date(
time*1000
);

const minute=
date.getUTCMinutes();

const second=
date.getUTCSeconds();

if(
minute%10!==0||
second!==0
){

continue;

}

result.push(time);

}

return[
...new Set(result)
].sort(
(a,b)=>a-b
);

}

async function loadOyaCapabilities(){

if(
oyaCapabilitiesLoaded&&
oyaAllTimes.length
){

return true;

}

if(oyaCapabilitiesLoading){

while(
oyaCapabilitiesLoading
){

await wait(50);

}

return(
oyaCapabilitiesLoaded&&
oyaAllTimes.length
);

}

oyaCapabilitiesLoading=true;

try{

const response=
await fetch(
OYA_PROXY+
"?action=capabilities",
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Capabilities HTTP "+
response.status
);

}

const text=
await response.text();

const xml=
new DOMParser()
.parseFromString(
text,
"text/xml"
);

if(
xml.querySelector(
"parsererror"
)
){

throw new Error(
"Ошибка XML"
);

}

let times=[];

for(
const node of Array.from(
xml.getElementsByTagName("*")
)
){

if(
node.localName!=="Extent"&&
node.localName!=="Dimension"
){

continue;

}

const name=
node.getAttribute(
"name"
);

if(
name&&
name.toLowerCase()!=="time"
){

continue;

}

const value=
(
node.textContent||
""
).trim();

if(!value){

continue;

}

if(
value.includes("/")
){

const parts=
value.split("/");

const start=
isoToUnix(parts[0]);

const end=
isoToUnix(parts[1]);

if(
start!==null&&
end!==null&&
end>=start
){

const step=600;

const alignedStart=
Math.ceil(
start/step
)*step;

const now=
Math.floor(
Date.now()/1000
);

const lastAllowed=
Math.min(
end,
now
);

for(
let t=alignedStart;
t<=lastAllowed;
t+=step
){

times.push(t);

}

}

}else{

times.push(
...parseOyaTimes(
value
)
);

}

}

oyaAllTimes=
normalizeOyaTimes(
times
);

if(!oyaAllTimes.length){

throw new Error(
"В GetCapabilities нет времени"
);

}

oyaCapabilitiesLoaded=true;

const saved=
Number(
localStorage.getItem(
"gptrad-oya-frame-count"
)
);

oyaFrameCount=
Number.isFinite(saved)&&
saved>=1
?
Math.min(
Math.floor(saved),
oyaAllTimes.length
)
:
Math.min(
50,
oyaAllTimes.length
);

frameCountInput.min=1;

frameCountInput.max=
oyaAllTimes.length;

frameCountInput.value=
oyaFrameCount;

applyOyaFrameCount(
oyaFrameCount,
false
);

return true;

}catch(error){

console.error(
"OYA capabilities:",
error
);

setStatus(
"Ошибка загрузки ОЯ"
);

return false;

}finally{

oyaCapabilitiesLoading=false;

}

}

function applyOyaFrameCount(
count,
preserve=true
){

if(!oyaAllTimes.length){

return;

}

const oldTime=
preserve&&oyaTimes.length
?
oyaTimes[oyaFrameIndex]
:
null;

let numeric=
Number.parseInt(
count,
10
);

if(!Number.isFinite(numeric)){

numeric=
oyaFrameCount||
50;

}

oyaFrameCount=
Math.max(
1,
Math.min(
numeric,
oyaAllTimes.length
)
);

oyaTimes=
oyaAllTimes.slice(
-oyaFrameCount
);

oyaFrameIndex=
oyaTimes.length-1;

if(oldTime!==null){

const index=
oyaTimes.indexOf(
oldTime
);

if(index!==-1){

oyaFrameIndex=
index;

}

}

localStorage.setItem(
"gptrad-oya-frame-count",
String(oyaFrameCount)
);

frameCountInput.min=1;

frameCountInput.max=
oyaAllTimes.length;

frameCountInput.value=
oyaFrameCount;

setOyaTimeline();

}

async function loadRainViewer(){

showLoading(
"Загрузка радара…"
);

setStatus(
"Получение RainViewer…"
);

try{

const response=
await fetch(
"https://api.rainviewer.com/public/weather-maps.json",
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"RainViewer HTTP "+
response.status
);

}

const data=
await response.json();

const past=
Array.isArray(
data.radar?.past
)
?
data.radar.past
:
[];

const nowcast=
Array.isArray(
data.radar?.nowcast
)
?
data.radar.nowcast
:
[];

rainFrames=[
...past,
...nowcast
]
.filter(
frame=>
frame&&
Number.isFinite(
Number(frame.time)
)&&
typeof frame.path==="string"&&
frame.path.length>0
)
.sort(
(a,b)=>a.time-b.time
);

if(!rainFrames.length){

throw new Error(
"RainViewer не вернул кадры"
);

}

currentFrame=
rainFrames.length-1;

setRadarTimeline();

showRainFrame(
currentFrame
);

setStatus(
"Радар RainViewer"
);

}catch(error){

console.error(
"RainViewer:",
error
);

setStatus(
"Ошибка RainViewer"
);

}finally{

hideLoading();

}

}

function makeRainLayer(
frame
){

let path=
String(
frame.path||""
).trim();

if(!path){

throw new Error(
"Пустой RainViewer path"
);

}

if(!path.startsWith("/")){

path="/"+path;

}

const tileUrl=
"https://tilecache.rainviewer.com"+
path+
"/256/{z}/{x}/{y}/2/1_1.png";

const source=
new ol.source.XYZ({

url:tileUrl,

tileSize:256,

maxZoom:19,

wrapX:true,

transition:0

});

const layer=
new ol.layer.Tile({

source,

opacity:.82,

zIndex:20,

preload:1

});

layer.__rainFrame=
frame;

return layer;

}

function showRainFrame(
index
){

if(
activeLayer!=="radar"||
!rainFrames[index]
){

return;

}

const frame=
rainFrames[index];

const requestId=
++rainFrameRequestId;

let newLayer;

try{

newLayer=
makeRainLayer(
frame
);

}catch(error){

console.error(error);

setStatus(
"Ошибка URL радара"
);

return;

}

const source=
newLayer.getSource();

let finished=false;

let loadedTiles=0;

let failedTiles=0;

const cleanup=()=>{

source.un(
"tileloadend",
onTileLoadEnd
);

source.un(
"tileloaderror",
onTileLoadError
);

};

const removeNewLayer=()=>{

cleanup();

try{

map.removeLayer(
newLayer
);

}catch(e){}

};

const promote=()=>{

if(finished)return;

finished=true;

cleanup();

if(
requestId!==rainFrameRequestId||
activeLayer!=="radar"
){

removeNewLayer();

return;

}

const oldLayer=
radarLayer;

radarLayer=
newLayer;

if(
oldLayer&&
oldLayer!==newLayer
){

try{

map.removeLayer(
oldLayer
);

}catch(e){}

}

map.render();

setStatus(
"Радар RainViewer"
);

};

const onTileLoadEnd=()=>{

loadedTiles++;

if(!finished){

promote();

}

};

const onTileLoadError=()=>{

failedTiles++;

if(
!finished&&
loadedTiles===0&&
failedTiles>=4
){

removeNewLayer();

if(
requestId===
rainFrameRequestId
){

setStatus(
"Кадр радара недоступен"
);

}

}

};

source.on(
"tileloadend",
onTileLoadEnd
);

source.on(
"tileloaderror",
onTileLoadError
);

map.addLayer(
newLayer
);

map.render();

updateTimeLabel();

setTimeout(
()=>{

if(
finished||
requestId!==rainFrameRequestId
){

return;

}

if(loadedTiles>0){

promote();

}else{

removeNewLayer();

setStatus(
"Кадр радара не загрузился"
);

}

},
5000
);

}

function commitOyaFrameCount(){

if(!oyaAllTimes.length){

frameCountInput.value=
oyaFrameCount||50;

return;

}

let count=
Number.parseInt(
frameCountInput.value,
10
);

if(!Number.isFinite(count)){

count=
oyaFrameCount||
Math.min(
50,
oyaAllTimes.length
);

}

count=
Math.max(
1,
Math.min(
count,
oyaAllTimes.length
)
);

applyOyaFrameCount(
count,
true
);

if(
activeLayer==="oya"
){

oyaFrameRequestId++;

loadOyaFrame(
oyaFrameIndex
);

}

}

function changeOyaFrameCount(
delta
){

if(!oyaAllTimes.length){

return;

}

let count=
Number.parseInt(
frameCountInput.value,
10
);

if(!Number.isFinite(count)){

count=
oyaFrameCount||50;

}

count=
Math.max(
1,
Math.min(
oyaAllTimes.length,
count+delta
)
);

applyOyaFrameCount(
count,
true
);

if(
activeLayer==="oya"
){

oyaFrameRequestId++;

loadOyaFrame(
oyaFrameIndex
);

}

}

"change",
commitOyaFrameCount
);

"keydown",
event=>{

if(
event.key==="Enter"
){

event.preventDefault();

commitOyaFrameCount();

frameCountInput.blur();

}
