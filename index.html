<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPTrad</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#111;
}

#map{
position:absolute;
inset:0;
z-index:1;
}

/* =========================================================
   TOP
========================================================= */

.top-panel{
position:absolute;
top:12px;
left:12px;
right:12px;
height:54px;
z-index:1000;

display:flex;
align-items:center;
gap:8px;
padding:6px;

background:rgba(28,28,28,.90);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,.25);
}

.logo{
color:white;
font-size:25px;
font-weight:700;
white-space:nowrap;
margin-left:8px;
margin-right:8px;
}

#selectedLayer{
flex:1;
min-width:0;
height:42px;

border:0;
outline:0;
border-radius:12px;

background:#292929;
color:white;

padding:0 14px;

font-size:17px;
font-weight:650;

text-align:left;

display:flex;
align-items:center;
justify-content:space-between;

gap:8px;
}

#selectedLayerName{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

#selectedLayerArrow{
flex:none;
font-size:14px;
opacity:.7;
transition:transform .25s ease;
}

#selectedLayer.open #selectedLayerArrow{
transform:rotate(180deg);
}

.icon-btn{
flex:none;

width:42px;
height:42px;

border:0;
outline:0;
border-radius:12px;

background:#292929;
color:white;

font-size:21px;

display:flex;
align-items:center;
justify-content:center;

transition:transform .15s ease;
}

.icon-btn:active{
transform:scale(.94);
}

/* =========================================================
   DRAWER
========================================================= */

#layerDrawer{
position:absolute;

top:72px;
left:50%;

width:calc(100% - 24px);
max-width:520px;

z-index:1100;

transform:translate(-50%,-18px) scale(.98);
opacity:0;
pointer-events:none;

padding:10px;

border-radius:15px;

background:rgba(25,25,25,.96);

backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);

box-shadow:0 10px 35px rgba(0,0,0,.35);

transition:
transform .28s cubic-bezier(.22,.61,.36,1),
opacity .22s ease;
}

#layerDrawer.open{
transform:translate(-50%,0) scale(1);
opacity:1;
pointer-events:auto;
}

.drawer-header{
color:white;
font-size:14px;
font-weight:700;
padding:4px 7px 9px;
}

.layer-item{
width:100%;
min-height:48px;

border:0;
outline:0;
border-radius:11px;

background:#303030;
color:white;

display:flex;
align-items:center;
gap:10px;

padding:10px 12px;
margin-bottom:7px;

font-size:15px;
text-align:left;

transition:
background .15s ease,
transform .15s ease;
}

.layer-item:last-child{
margin-bottom:0;
}

.layer-item:active{
transform:scale(.985);
}

.layer-item.active{
background:#3b3b3b;
}

.layer-dot{
width:10px;
height:10px;
flex:none;
border-radius:50%;
background:#777;
}

.layer-item.active .layer-dot{
background:#36d67a;
box-shadow:0 0 8px rgba(54,214,122,.55);
}

/* =========================================================
   STATUS
========================================================= */

#status{
position:absolute;
left:14px;
top:74px;

z-index:900;

padding:6px 10px;

border-radius:8px;

background:rgba(20,20,20,.78);
color:white;

font-size:12px;

pointer-events:none;
opacity:.9;
}

/* =========================================================
   SETTINGS
========================================================= */

#settings{
position:absolute;

left:12px;
top:74px;

width:240px;

z-index:1200;

padding:12px;

border-radius:14px;

background:rgba(20,20,20,.96);
color:white;

box-shadow:0 8px 30px rgba(0,0,0,.35);

opacity:0;
visibility:hidden;
pointer-events:none;

transform:translateY(-10px) scale(.97);

max-height:0;
overflow:hidden;

transition:
opacity .25s ease,
transform .28s cubic-bezier(.22,.61,.36,1),
max-height .32s ease,
visibility 0s linear .32s;
}

#settings.open{
opacity:1;
visibility:visible;
pointer-events:auto;

transform:translateY(0) scale(1);

max-height:500px;

transition:
opacity .25s ease,
transform .28s cubic-bezier(.22,.61,.36,1),
max-height .32s ease,
visibility 0s linear 0s;
}

.settings-title{
font-size:15px;
font-weight:700;
margin-bottom:10px;
}

.settings-section{
margin-bottom:7px;
}

.settings-section:last-child{
margin-bottom:0;
}

.settings-section-btn{
width:100%;

height:40px;

border:0;
outline:0;

border-radius:10px;

background:#292929;
color:white;

font-size:14px;
font-weight:600;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 11px;

transition:
background .15s ease,
transform .15s ease;
}

.settings-section-btn:active{
transform:scale(.98);
}

.settings-section-arrow{
font-size:12px;
opacity:.65;

transition:
transform .25s ease;
}

.settings-section.open
.settings-section-arrow{
transform:rotate(180deg);
}

.settings-subpanel{
max-height:0;
opacity:0;

overflow:hidden;

transform:translateY(-4px);

transition:
max-height .3s ease,
opacity .2s ease,
transform .25s ease;

padding:0 2px;
}

.settings-section.open
.settings-subpanel{
max-height:180px;
opacity:1;

transform:translateY(0);

padding-top:7px;
padding-bottom:2px;
}

.theme-btn{
width:100%;

border:0;
outline:0;

padding:9px 10px;

margin-bottom:6px;

border-radius:9px;

background:#292929;
color:white;

text-align:left;

font-size:13px;
}

.theme-btn:last-child{
margin-bottom:0;
}

.frame-count-row{
display:flex;
align-items:center;
gap:9px;

padding:3px 1px 2px;
}

#frameCountSlider{
flex:1;
min-width:0;
}

#frameCountValue{
min-width:34px;

text-align:right;

font-size:13px;
font-weight:700;
color:white;
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline{
position:absolute;

left:50%;
bottom:14px;

transform:translateX(-50%);

width:min(680px,calc(100vw - 28px));

z-index:1000;

padding:8px 12px 9px;

border-radius:15px;

background:rgba(20,20,20,.90);

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.timeline-play{
width:100%;

display:flex;
justify-content:center;

margin-bottom:6px;
}

#playBtn{
width:38px;
height:30px;

border:0;
outline:0;

border-radius:8px;

background:#292929;
color:white;

font-size:14px;

display:flex;
align-items:center;
justify-content:center;

transition:
transform .15s ease,
background .15s ease;
}

#playBtn:active{
transform:scale(.92);
}

.timeline-controls{
display:flex;
align-items:center;
gap:7px;
}

.timeline-arrow{
width:36px;
height:32px;

flex:none;

border:0;
outline:0;

border-radius:8px;

background:#292929;
color:white;

font-size:15px;

display:flex;
align-items:center;
justify-content:center;

transition:transform .15s ease;
}

.timeline-arrow:active{
transform:scale(.92);
}

.timeline-slider-wrap{
flex:1;
min-width:0;

display:flex;
align-items:center;
}

#timeSlider{
width:100%;
min-width:0;
margin:0;
}

#timeLabel{
width:100%;

margin-top:5px;

text-align:center;

color:white;
font-size:11px;
opacity:.85;
}

/* =========================================================
   LOADING
========================================================= */

#loading{
position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

z-index:2000;

display:none;

padding:9px 13px;

border-radius:10px;

background:rgba(20,20,20,.92);

color:white;

font-size:13px;
}

/* =========================================================
   LIGHT
========================================================= */

body.light .top-panel,
body.light #layerDrawer,
body.light #settings,
body.light .timeline,
body.light #status{
background:rgba(255,255,255,.94);
}

body.light .logo,
body.light #status,
body.light .drawer-header{
color:#111;
}

body.light #selectedLayer,
body.light .icon-btn,
body.light .layer-item,
body.light .timeline-arrow,
body.light #playBtn,
body.light .theme-btn,
body.light .settings-section-btn{
background:#eeeeee;
color:#111;
}

body.light .layer-item.active{
background:#dddddd;
}

body.light #frameCountValue{
color:#111;
}

/* =========================================================
   GREEN
========================================================= */

body.green .top-panel,
body.green #layerDrawer,
body.green #settings,
body.green .timeline,
body.green #status{
background:rgba(8,35,22,.94);
}

body.green #selectedLayer,
body.green .icon-btn,
body.green .layer-item,
body.green .timeline-arrow,
body.green #playBtn,
body.green .theme-btn,
body.green .settings-section-btn{
background:#123d29;
color:white;
}

body.green .layer-item.active{
background:#185538;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

.top-panel{
top:8px;
left:8px;
right:8px;
height:54px;
gap:5px;
}

.logo{
font-size:21px;
margin-left:6px;
margin-right:3px;
}

#selectedLayer{
height:42px;
padding:0 11px;
font-size:16px;
}

.icon-btn{
width:38px;
height:38px;
border-radius:11px;
font-size:19px;
}

#layerDrawer{
top:70px;
width:calc(100% - 16px);
}

#status{
top:68px;
left:9px;
}

#settings{
left:8px;
top:68px;
width:235px;
}

.timeline{
bottom:8px;
width:calc(100vw - 16px);
}

#timeLabel{
font-size:10px;
}

.timeline-arrow{
width:35px;
}

}

</style>
</head>

<body>

<div id="map"></div>

<div class="top-panel">

GPTrad

Радар (RainViewer)

</div>

id="appearanceSection">

class="timeline-arrow">

Загрузка…

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   MAP
========================================================= */

const map=L.map("map",{

zoomControl:true,

attributionControl:true,

zoomSnap:0,

zoomDelta:.5,

zoomAnimation:false,

fadeAnimation:false,

markerZoomAnimation:false,

zoomAnimationThreshold:0,

touchZoom:true,

scrollWheelZoom:true,

wheelDebounceTime:20,

wheelPxPerZoomLevel:80,

doubleClickZoom:true,

dragging:true,

inertia:true,

inertiaDeceleration:3000,

easeLinearity:.2,

minZoom:2,

maxZoom:19

}).setView(
[55.75,37.61],
5
);


/* =========================================================
   OSM
========================================================= */

const osmLayer=L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

minZoom:2,

maxZoom:19,

tileSize:256,

updateWhenIdle:true,

updateWhenZooming:false,

keepBuffer:3,

attribution:"© OpenStreetMap"

}
).addTo(map);


/* =========================================================
   ELEMENTS
========================================================= */

const selectedLayer=
document.getElementById("selectedLayer");

const selectedLayerName=
document.getElementById("selectedLayerName");

const layerDrawer=
document.getElementById("layerDrawer");

const status=
document.getElementById("status");

const loading=
document.getElementById("loading");

const timeSlider=
document.getElementById("timeSlider");

const timeLabel=
document.getElementById("timeLabel");

const settings=
document.getElementById("settings");

const appearanceSection=
document.getElementById("appearanceSection");

const appearanceToggle=
document.getElementById("appearanceToggle");

const frameCountSection=
document.getElementById("frameCountSection");

const frameCountToggle=
document.getElementById("frameCountToggle");

const frameCountSlider=
document.getElementById("frameCountSlider");

const frameCountValue=
document.getElementById("frameCountValue");

const playBtn=
document.getElementById("playBtn");


/* =========================================================
   STATE
========================================================= */

let activeLayer="radar";

let radarLayer=null;


/*
RAINVIEWER
*/

let rainFrames=[];

let currentFrame=0;


/*
ОЯ — полный список времени,
полученный из GetCapabilities.
*/

let oyaAllTimes=[];


/*
ОЯ — выбранная часть времени.
*/

let oyaTimes=[];

let oyaFrameIndex=0;

let oyaFrameCount=0;


/*
ОЯ текущий overlay.
*/

let oyaImage=null;


/*
Кэш ОЯ.

Ключ:
время + область карты + размер изображения.

Значение:
Blob URL готового изображения.
*/

const oyaFrameCache=
new Map();


/*
Запросы, которые сейчас идут.

Они не отменяются при обычном
переключении кадров — если такой
кадр успеет загрузиться, он
останется в кэше.
*/

const oyaPendingRequests=
new Map();


let oyaCapabilitiesLoaded=false;

let oyaCapabilitiesLoading=false;

let oyaRefreshTimer=null;


/*
Поколение кэша.

При смене слоя или ручном
обновлении увеличивается.
*/

let oyaCacheGeneration=0;


/*
PLAYBACK
*/

let playing=false;

let playTimer=null;

let rainFrameRequestId=0;

let oyaFrameRequestId=0;


/* =========================================================
   HELPERS
========================================================= */

function setStatus(text){

status.textContent=text;

}


function showLoading(text){

loading.textContent=text;

loading.style.display="block";

}


function hideLoading(){

loading.style.display="none";

}


function formatTime(ts){

if(!ts)
return"—";

return new Date(ts*1000)
.toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =========================================================
   ISO → UNIX
========================================================= */

function isoToUnix(value){

const t=
Date.parse(value);

if(
Number.isNaN(t)
)
return null;

return Math.floor(
t/1000
);

}


/* =========================================================
   PARSE OЯ TIMES
========================================================= */

function parseOyaTimes(text){

if(
!text
)
return[];

const result=[];

const parts=
text
.split(",")
.map(x=>x.trim())
.filter(Boolean);

for(
const value of parts
){

const unix=
isoToUnix(value);

if(
unix!==null
){

result.push(unix);

}

}

return[
...new Set(result)
].sort(
(a,b)=>a-b
);

}


/* =========================================================
   OЯ LAYER
========================================================= */

const OYA_PROXY=
"/api/oya";

const OYA_LAYER=
"bufr_phenomena,"+
"bufr_novosib_phenomena,"+
"bufr_vlad_phenomena";


/* =========================================================
   WEB MERCATOR
========================================================= */

function lonToMercator(lon){

return lon*
20037508.34/
180;

}


function latToMercator(lat){

lat=Math.max(
-85.05112878,
Math.min(
85.05112878,
lat
)
);

return 6378137*
Math.log(
Math.tan(
Math.PI/4+
lat*Math.PI/360
)
);

}


/* =========================================================
   OЯ CACHE CLEAR
========================================================= */

function clearOyaCache(){

/*
Удаляем все Blob URLs,
чтобы браузер мог освободить
занятую память.
*/

for(
const value of
oyaFrameCache.values()
){

if(
value &&
value.blobUrl
){

URL.revokeObjectURL(
value.blobUrl
);

}

}

oyaFrameCache.clear();


/*
Также очищаем список ожидающих
запросов.
*/

oyaPendingRequests.clear();


/*
Новое поколение кэша.
*/

oyaCacheGeneration++;

}


/* =========================================================
   OЯ CACHE KEY
========================================================= */

function makeOyaCacheKey(
timeValue,
bounds,
width,
height
){

const sw=
bounds.getSouthWest();

const ne=
bounds.getNorthEast();

return[
timeValue,
sw.lat.toFixed(5),
sw.lng.toFixed(5),
ne.lat.toFixed(5),
ne.lng.toFixed(5),
width,
height
].join("|");

}


/* =========================================================
   OЯ REQUEST DATA
========================================================= */

function getOyaRequestData(timeValue){

const bounds=
map.getBounds();

const sw=
bounds.getSouthWest();

const ne=
bounds.getNorthEast();

const size=
map.getSize();


const width=
Math.max(
256,
Math.min(
1600,
Math.round(size.x)
)
);


const height=
Math.max(
256,
Math.min(
1200,
Math.round(size.y)
)
);


const bbox=[

lonToMercator(
sw.lng
),

latToMercator(
sw.lat
),

lonToMercator(
ne.lng
),

latToMercator(
ne.lat
)

].join(",");


const params=
new URLSearchParams({

action:"image",

SERVICE:"WMS",

VERSION:"1.1.1",

REQUEST:"GetMap",

LAYERS:OYA_LAYER,

STYLES:"",

SRS:"EPSG:3857",

BBOX:bbox,

WIDTH:String(width),

HEIGHT:String(height),

FORMAT:"image/png",

TRANSPARENT:"true",

EXCEPTIONS:
"application/vnd.ogc.se_inimage",

TIME:new Date(
timeValue*1000
).toISOString()

});


return{

url:
OYA_PROXY+
"?"+
params.toString(),

bounds,

width,

height

};

}


/* =========================================================
   OЯ CAPABILITIES
========================================================= */

async function loadOyaCapabilities(){

if(
oyaCapabilitiesLoaded
&&
oyaAllTimes.length
){

return true;

}


if(
oyaCapabilitiesLoading
){

/*
Ждём существующую загрузку.
*/

while(
oyaCapabilitiesLoading
){

await new Promise(
resolve=>
setTimeout(
resolve,
50
)
);

}

return(
oyaCapabilitiesLoaded &&
oyaAllTimes.length>0
);

}


oyaCapabilitiesLoading=true;

setStatus(
"Получение времени ОЯ…"
);


try{

const response=
await fetch(
OYA_PROXY+
"?action=capabilities",
{
cache:"no-store"
}
);


if(
!response.ok
){

throw new Error(
"Capabilities "+response.status
);

}


const xmlText=
await response.text();


const parser=
new DOMParser();

const xml=
parser.parseFromString(
xmlText,
"text/xml"
);


const parserError=
xml.querySelector(
"parsererror"
);

if(
parserError
){

throw new Error(
"Ошибка XML"
);

}


let times=[];


/*
Ищем нужный слой.
*/

const layers=
Array.from(
xml.getElementsByTagName(
"Layer"
)
);


for(
const layer of layers
){

const nameNode=
Array.from(
layer.children
)
.find(
node=>node.localName==="Name"
);


if(
!nameNode
)
continue;


const name=
nameNode.textContent.trim();


if(
name!=="bufr_phenomena" &&
!name.startsWith(
"bufr_phenomena"
)
){

continue;

}


/*
Extent / Dimension.
*/

const extentNodes=
Array.from(
layer.children
)
.filter(
node=>
node.localName==="Extent" ||
node.localName==="Dimension"
);


for(
const node of extentNodes
){

const name=
node.getAttribute(
"name"
);

if(
name &&
name.toLowerCase()!=="time"
)
continue;


const text=
node.textContent.trim();


const parsed=
parseOyaTimes(text);

if(
parsed.length
){

times.push(
...parsed
);

}

}


/*
Ищем глубже.
*/

const descendants=
Array.from(
layer.getElementsByTagName("*")
);


for(
const node of descendants
){

if(
node.localName!=="Extent" &&
node.localName!=="Dimension"
)
continue;


const name=
node.getAttribute(
"name"
);

if(
name &&
name.toLowerCase()!=="time"
)
continue;


const parsed=
parseOyaTimes(
node.textContent.trim()
);

if(
parsed.length
){

times.push(
...parsed
);

}

}

}


/*
Убираем дубликаты.
*/

times=[
...new Set(times)
].sort(
(a,b)=>a-b
);


/*
Поддержка интервала:
start/end/period.
*/

if(
!times.length
){

for(
const node of
Array.from(
xml.getElementsByTagName("*")
)
){

if(
node.localName!=="Extent" &&
node.localName!=="Dimension"
)
continue;


const name=
node.getAttribute(
"name"
);

if(
name &&
name.toLowerCase()!=="time"
)
continue;


const value=
node.textContent.trim();


if(
!value.includes("/")
)
continue;


const parts=
value.split("/");


if(
parts.length<2
)
continue;


const start=
isoToUnix(
parts[0]
);

const end=
isoToUnix(
parts[1]
);


if(
start===null ||
end===null
)
continue;


let step=600;


if(
parts[2]
){

const match=
parts[2].match(
/PT(\d+)M/i
);


if(
match
){

step=
Math.max(
60,
Number(match[1])*60
);

}

}


for(
let t=start;
t<=end;
t+=step
){

times.push(t);

}

}

}


times=[
...new Set(times)
].sort(
(a,b)=>a-b
);


if(
!times.length
){

throw new Error(
"В GetCapabilities нет времени"
);

}


/*
Сохраняем ПОЛНЫЙ список.
*/

oyaAllTimes=times;

oyaCapabilitiesLoaded=true;


/*
Если количество кадров
ещё не выбрано — берём всё.
*/

const savedCount=
Number(
localStorage.getItem(
"gptrad-oya-frame-count"
)
);


if(
Number.isFinite(savedCount) &&
savedCount>=1
){

oyaFrameCount=
Math.min(
savedCount,
oyaAllTimes.length
);

}else{

oyaFrameCount=
oyaAllTimes.length;

}


/*
Настраиваем маленький
ползунок количества кадров.
*/

frameCountSlider.min=1;

frameCountSlider.max=
oyaAllTimes.length;

frameCountSlider.value=
oyaFrameCount;

frameCountValue.textContent=
oyaFrameCount;


/*
Формируем выбранный список.
*/

applyOyaFrameCount(
oyaFrameCount,
false
);


setStatus(
"Опасные явления"
);

return true;

}catch(error){

console.error(
"OЯ capabilities:",
error
);

setStatus(
"Ошибка времени ОЯ"
);

return false;

}finally{

oyaCapabilitiesLoading=false;

}

}


/* =========================================================
   APPLY OЯ FRAME COUNT
========================================================= */

function applyOyaFrameCount(
count,
preserveCurrent=true
){

if(
!oyaAllTimes.length
)
return;


const oldTime=
preserveCurrent &&
oyaTimes.length &&
oyaTimes[oyaFrameIndex]
?
oyaTimes[oyaFrameIndex]
:null;


oyaFrameCount=
Math.max(
1,
Math.min(
Number(count),
oyaAllTimes.length
)
);


/*
Берём последние N кадров.
*/

oyaTimes=
oyaAllTimes.slice(
-oyaFrameCount
);


/*
Пытаемся сохранить
текущий момент времени.
*/

let newIndex=
oyaTimes.length-1;


if(
oldTime!==null
){

const found=
oyaTimes.indexOf(
oldTime
);

if(
found!==-1
){

newIndex=found;

}

}


oyaFrameIndex=newIndex;


/*
Главный таймлайн.
*/

timeSlider.min=0;

timeSlider.max=
Math.max(
0,
oyaTimes.length-1
);

timeSlider.value=
oyaFrameIndex;

updateTimeLabel();


frameCountSlider.value=
oyaFrameCount;

frameCountValue.textContent=
oyaFrameCount;

}

========================================================= */

function createOyaOverlay(

){

/* =========================================================
   OЯ LOAD FRAME
========================================================= */

async function loadOyaFrame(index){

if(
activeLayer!=="oya"
)
return;


if(
!oyaTimes.length
){

const ready=
await loadOyaCapabilities();

if(
!ready ||
!oyaTimes.length
)
return;

}


/*
Защита индекса.
*/

if(
index<0 ||
index>=oyaTimes.length
)
return;


oyaFrameIndex=index;

timeSlider.value=index;

updateTimeLabel();


const timeValue=
oyaTimes[index];

const requestData=
getOyaRequestData(
timeValue
);

const cacheKey=
makeOyaCacheKey(
timeValue,
requestData.bounds,
requestData.width,
requestData.height
);


/* =====================================================
   КАДР УЖЕ В КЭШЕ
===================================================== */

const cached=
oyaFrameCache.get(
cacheKey
);


if(
cached &&
cached.blobUrl
){

if(
activeLayer!=="oya"
)
return;


const oldImage=
oyaImage;

const newOverlay=
createOyaOverlay(
cached.blobUrl,
requestData.bounds
);


/*
Удаляем только текущий
визуальный overlay.

Сам кэш не трогаем.
*/

if(
oldImage &&
map.hasLayer(
oldImage
)
){

map.removeLayer(
oldImage
);

}


oyaImage=
newOverlay;

setStatus(
"Опасные явления"
);

return;

}


/* =====================================================
   ТАКОЙ ЗАПРОС УЖЕ ИДЁТ
===================================================== */

if(
oyaPendingRequests.has(
cacheKey
)
){

try{

const result=
await oyaPendingRequests.get(
cacheKey
);

if(
!result
)
return;


if(
activeLayer!=="oya"
)
return;


if(
oyaTimes[oyaFrameIndex]!==timeValue
)
return;


const oldImage=
oyaImage;

const newOverlay=
createOyaOverlay(
result.blobUrl,
requestData.bounds
);


if(
oldImage &&
map.hasLayer(
oldImage
)
){

map.removeLayer(
oldImage
);

}


oyaImage=
newOverlay;

setStatus(
"Опасные явления"
);

}catch(error){

console.error(
"OЯ pending:",
error
);

}

return;

}


/* =====================================================
   НОВЫЙ ЗАПРОС
===================================================== */

const requestId=
++oyaFrameRequestId;

const generation=
oyaCacheGeneration;


setStatus(
"Загрузка ОЯ…"
);


const promise=
(async()=>{

try{

const response=
await fetch(
requestData.url,
{
cache:"force-cache"
}
);


if(
!response.ok
){

throw new Error(
"ОЯ image "+response.status
);

}


const blob=
await response.blob();


/*
Если пользователь сменил слой
или очистил кэш во время запроса,
не сохраняем этот результат.
*/

if(
generation!==oyaCacheGeneration
){

return null;

}


const blobUrl=
URL.createObjectURL(
blob
);


/*
Кладём изображение в кэш.

Оно останется там до смены
слоя или очистки страницы.
*/

oyaFrameCache.set(
cacheKey,
{
blobUrl,
timeValue
}
);


return{
blobUrl
};

}catch(error){

console.error(
"OЯ frame:",
error
);

return null;

}

})();


oyaPendingRequests.set(
cacheKey,
promise
);


try{

const result=
await promise;


/*
Удаляем promise из списка
только после завершения.
*/

oyaPendingRequests.delete(
cacheKey
);


if(
!result
)
return;


if(
requestId!==oyaFrameRequestId ||
activeLayer!=="oya"
){

/*
Кадр всё равно остался
в кэше.

Просто сейчас его
не показываем.
*/

return;

}


/*
Проверяем, что пользователь
по-прежнему находится на этом
времени.
*/

if(
oyaTimes[oyaFrameIndex]!==timeValue
){

return;

}


const oldImage=
oyaImage;


const newOverlay=
createOyaOverlay(
result.blobUrl,
requestData.bounds
);


/*
Старый видимый overlay
удаляем только после того,
как новый успешно создан.
*/

if(
oldImage &&
map.hasLayer(
oldImage
)
){

map.removeLayer(
oldImage
);

}


oyaImage=
newOverlay;


setStatus(
"Опасные явления"
);

}catch(error){

oyaPendingRequests.delete(
cacheKey
);

if(
requestId===oyaFrameRequestId
){

setStatus(
"Ошибка ОЯ"
);

}

}

}

rainFrames[index];

newLayer
)

newLayer
);

radarLayer;

newLayer;

oldLayer &&
map.hasLayer(
oldLayer
)
){

oldLayer
);

}
);

setTimeout(
()=>{

requestId!==rainFrameRequestId
)
return;

if(
radarLayer!==newLayer
){

if(
map.hasLayer(
newLayer
)
){

map.removeLayer(
newLayer
);

}

}

},
15000
);


newLayer.once(
"load",
()=>{

clearTimeout(
cleanupTimer
);

);

}

()=>{

const open=
layerDrawer.classList.toggle(
"open"
);

selectedLayer.classList.toggle(
"open",
open
);

});


document
.querySelectorAll(
".layer-item"
)
.forEach(
button=>{

button.addEventListener(
"click",
()=>{

const type=
button.dataset.layer;


document
.querySelectorAll(
".layer-item"
)
.forEach(
x=>{

x.classList.remove(
"active"
);

}
);


button.classList.add(
"active"
);


stopPlayback();


if(
type==="oya"
){

activeLayer=
"oya";

selectedLayerName.textContent=
"Опасные явления";

showOya();

}


if(
type==="radar"
){

activeLayer=
"radar";

selectedLayerName.textContent=
"Радар (RainViewer)";

showRadar();

}


layerDrawer.classList.remove(
"open"
);

selectedLayer.classList.remove(
"open"
);

}
);

}
);


/* =========================================================
   CLOSE LAYER DRAWER
========================================================= */

map.on(
"click",
()=>{

layerDrawer.classList.remove(
"open"
);

selectedLayer.classList.remove(
"open"
);

});


/* =========================================================
   PAGE UNLOAD
========================================================= */

window.addEventListener(
"beforeunload",
()=>{

/*
Освобождаем Blob URLs.
*/

for(
const value of
oyaFrameCache.values()
){

if(
value &&
value.blobUrl
){

URL.revokeObjectURL(
value.blobUrl
);

}

}

});


/* =========================================================
   START
========================================================= */

loadRainViewer();

</script>

</body>
</html>
