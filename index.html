<head>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background: #111;
}

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #d9d9d9;
}

.topbar {
  position: fixed;
  z-index: 1000;
  top: 10px;
  left: 10px;
  right: 10px;
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  background: rgba(20,20,20,.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,.28);
  color: white;
}

.logo {
  font-size: 16px;
  font-weight: 700;
  margin-left: 5px;
}

.top-spacer {
  flex: 1;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border: 0;
  outline: 0;
  border-radius: 8px;
  background: rgba(255,255,255,.08);
  color: white;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon-btn:active {
  background: rgba(255,255,255,.18);
}

/* =========================================================
   RADAR PANEL
========================================================= */

.radar-panel {
  position: fixed;
  z-index: 1100;
  top: 64px;
  right: 10px;
  width: 245px;
  background: rgba(20,20,20,.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 10px;
  padding: 11px;
  color: white;
  box-shadow: 0 8px 30px rgba(0,0,0,.35);
  transform: translateX(calc(100% + 20px));
  transition: transform .22s ease;
}

.radar-panel.open {
  transform: translateX(0);
}

.panel-head {
  display: flex;
  align-items: center;
  height: 30px;
  margin-bottom: 8px;
}

.panel-close {
  width: 28px;
  height: 28px;
  margin-right: 4px;
  border: 0;
  outline: 0;
  background: transparent;
  color: rgba(255,255,255,.9);
  border-radius: 7px;
  font-size: 25px;
  line-height: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.panel-close:active {
  background: rgba(255,255,255,.12);
}

.panel-title {
  font-size: 14px;
  font-weight: 700;
}

.panel-section {
  padding: 8px 0;
  border-top: 1px solid rgba(255,255,255,.08);
}

.panel-section:first-of-type {
  border-top: 0;
}

.panel-label {
  font-size: 11px;
  opacity: .58;
  margin-bottom: 7px;
}

.layer-row {
  display: flex;
  align-items: center;
  min-height: 34px;
  font-size: 13px;
}

.layer-row input {
  width: 16px;
  height: 16px;
  margin: 0 8px 0 0;
  accent-color: white;
}

.layer-row span {
  flex: 1;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-panel {
  position: fixed;
  z-index: 1300;
  top: 64px;
  right: 10px;
  width: 245px;
  background: rgba(20,20,20,.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 10px;
  padding: 11px;
  color: white;
  box-shadow: 0 8px 30px rgba(0,0,0,.35);
  transform: translateX(calc(100% + 20px));
  transition: transform .22s ease;
}

.settings-panel.open {
  transform: translateX(0);
}

.settings-head {
  display: flex;
  align-items: center;
  height: 30px;
  margin-bottom: 8px;
}

.settings-close {
  width: 28px;
  height: 28px;
  margin-right: 4px;
  border: 0;
  outline: 0;
  background: transparent;
  color: rgba(255,255,255,.9);
  border-radius: 7px;
  font-size: 25px;
  line-height: 25px;
  display: flex;
  align-items: center;
  justify-content: center;

}

.settings-close:active {

}

.settings-title {

}

.settings-section {
  padding: 8px 0;

}

.settings-section:first-of-type {

}

.settings-label {

}

========================================================= */

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   CONFIG
========================================================= */

const WMS_URL = "/baltrad_wsgi";
const VECTOR_URL = "/vector_wsgi";

const TARGET_LAYER = "bufr_dbz1";

const VECTOR_TITLE =
  "bufr_dbz1,bufr_novosib_dbz1,bufr_vlad_dbz1";

const FRAME_STEP =
  10 * 60 * 1000;

const MAX_FRAMES = 32;

const INITIAL_PRELOAD = 14;

const PRELOAD_CONCURRENCY = 2;

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {
  zoomControl: true,
  attributionControl: true,
  preferCanvas: true
}).setView(
  [54.74, 55.97],
  6
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 18,
    attribution: "© OpenStreetMap"
  }
).addTo(map);

/* =========================================================
   STATE
========================================================= */

let times = [];

let currentTime = null;

let currentRadarLayer = null;

let radarRequestId = 0;

let vectorRequestId = 0;

let playing = false;

let playTimer = null;

let autoFollowLatest = true;

const radarCache = new Map();

let preloadStarted = false;

/* =========================================================
   RADAR OPACITY
========================================================= */

let radarOpacity = 0.72;

/* =========================================================
   DOM
========================================================= */

const radarPanel =
  document.getElementById("radarPanel");

const panelBtn =
  document.getElementById("panelBtn");

const panelClose =
  document.getElementById("panelClose");

const radarToggle =
  document.getElementById("radarToggle");

const vectorToggle =
  document.getElementById("vectorToggle");

const statusEl =
  document.getElementById("status");

const timeSlider =
  document.getElementById("timeSlider");

const timeValue =
  document.getElementById("timeValue");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const playBtn =
  document.getElementById("playBtn");

const pixelInfo =
  document.getElementById("pixelInfo");

const pixelPoint =
  document.getElementById("pixelPoint");

const pixelClose =
  document.getElementById("pixelClose");

const pixelValue =
  document.getElementById("pixelValue");

const pixelTime =
  document.getElementById("pixelTime");

const pixelCoords =
  document.getElementById("pixelCoords");

const settingsBtn =
  document.getElementById("settingsBtn");

const settingsPanel =
  document.getElementById("settingsPanel");

const settingsClose =
  document.getElementById("settingsClose");

const opacitySlider =
  document.getElementById("opacitySlider");

const opacityValue =
  document.getElementById("opacityValue");

/* =========================================================
   PANEL
========================================================= */

panelBtn.addEventListener("click", () => {

  radarPanel.classList.toggle("open");

  if (
    radarPanel.classList.contains("open")
  ) {

    settingsPanel.classList.remove(
      "open"
    );
  }
});

panelClose.addEventListener("click", () => {

  radarPanel.classList.remove("open");

});

/* =========================================================
   SETTINGS
========================================================= */

settingsBtn.addEventListener(
  "click",
  () => {

    settingsPanel.classList.toggle(
      "open"
    );

    if (
      settingsPanel.classList.contains(
        "open"
      )
    ) {

      radarPanel.classList.remove(
        "open"
      );
    }
  }
);

settingsClose.addEventListener(
  "click",
  () => {

    settingsPanel.classList.remove(
      "open"
    );
  }
);

opacitySlider.addEventListener(
  "input",
  () => {

    const value =
      Number(
        opacitySlider.value
      );

    radarOpacity =
      value / 100;

    opacityValue.textContent =
      value + "%";

    if (
      currentRadarLayer &&
      radarToggle.checked
    ) {

      currentRadarLayer.setOpacity(
        radarOpacity
      );
    }
  }
);

/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

  statusEl.textContent = text;

}

/* =========================================================
   TIME
========================================================= */

function formatTime(iso) {

  const d = new Date(iso);

  if (Number.isNaN(d.getTime())) {

    return "—";

  }

  return d.toLocaleTimeString(
    "ru-RU",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function formatDateTime(iso) {

  const d = new Date(iso);

  if (Number.isNaN(d.getTime())) {

    return "—";

  }

  return d.toLocaleString(
    "ru-RU",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

function isUsableTime(date) {

  return date.getTime()
    <= Date.now() + 30 * 1000;

}

/* =========================================================
   CAPABILITIES
========================================================= */

function extractTimesFromText(text) {

  const result = [];

  try {

    const parser =
      new DOMParser();

    const xml =
      parser.parseFromString(
        text,
        "text/xml"
      );

    const layers =
      Array.from(
        xml.getElementsByTagName("Layer")
      );

    let targetLayer = null;

    for (const layer of layers) {

      const names =
        Array.from(
          layer.children
        ).filter(
          el =>
            el.localName &&
            el.localName.toLowerCase() === "name"
        );

      if (
        names.length &&
        names[0].textContent.trim() === TARGET_LAYER
      ) {

        targetLayer = layer;
        break;
      }
    }

    if (targetLayer) {

      const nodes =
        Array.from(
          targetLayer.querySelectorAll(
            "Dimension, Extent"
          )
        );

      for (const node of nodes) {

        const name =
          (
            node.getAttribute("name") ||
            ""
          ).toLowerCase();

        if (name !== "time") {
          continue;
        }

        parseTimeValue(
          node.textContent.trim(),
          result
        );
      }
    }

  } catch (e) {

    console.warn(
      "XML parse error",
      e
    );

  }

  if (!result.length) {

    const regex =
      /20\d\d-\d\d-\d\dT\d\d:\d\d(?::\d\d)?(?:\.\d+)?Z/g;

    const matches =
      text.match(regex) || [];

    for (const value of matches) {

      const d =
        new Date(value);

      if (!Number.isNaN(d.getTime())) {

        result.push(
          d.toISOString()
        );

      }
    }
  }

  return [
    ...new Set(result)
  ]
    .map(
      value => new Date(value)
    )
    .filter(
      isUsableTime
    )
    .sort(
      (a,b) =>
        a.getTime() -
        b.getTime()
    )
    .map(
      d => d.toISOString()
    );
}

function parseTimeValue(value, result) {

  if (!value) {
    return;
  }

  if (
    value.includes(",") &&
    !value.includes("/")
  ) {

    for (
      const part of value.split(",")
    ) {

      const d =
        new Date(
          part.trim()
        );

      if (
        !Number.isNaN(d.getTime())
      ) {

        result.push(
          d.toISOString()
        );

      }
    }

    return;
  }

  const parts =
    value.split("/");

  if (parts.length >= 2) {

    const start =
      new Date(parts[0]);

    const end =
      new Date(parts[1]);

    if (
      !Number.isNaN(start.getTime()) &&
      !Number.isNaN(end.getTime())
    ) {

      let step =
        FRAME_STEP;

      if (parts[2]) {

        const match =
          parts[2].match(
            /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/i
          );

        if (match) {

          const hours =
            Number(match[1] || 0);

          const minutes =
            Number(match[2] || 0);

          const seconds =
            Number(match[3] || 0);

          step =
            (
              hours * 3600 +
              minutes * 60 +
              seconds
            ) * 1000;
        }
      }

      const max =
        Math.min(
          end.getTime(),
          Date.now() + 30 * 1000
        );

      for (
        let t = start.getTime();
        t <= max;
        t += step
      ) {

        result.push(
          new Date(t).toISOString()
        );

      }
    }
  }
}

/* =========================================================
   GET CAPABILITIES
========================================================= */

async function loadCapabilities() {

  setStatus(
    "Загрузка радара…"
  );

  const url =
    WMS_URL +
    "?SERVICE=WMS" +
    "&VERSION=1.1.1" +
    "&REQUEST=GetCapabilities";

  try {

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const text =
      await response.text();

    let parsed =
      extractTimesFromText(text);

    if (
      parsed.length >
      MAX_FRAMES
    ) {

      parsed =
        parsed.slice(
          -MAX_FRAMES
        );
    }

    times = parsed;

    timeSlider.min = 0;

    timeSlider.max =
      Math.max(
        0,
        times.length - 1
      );

    if (!times.length) {

      throw new Error(
        "Временные кадры не найдены"
      );

    }

    const newest =
      times[times.length - 1];

    if (!currentTime) {

      await selectTime(
        newest,
        false,
        true
      );

      startInitialPreload();

    } else if (
      autoFollowLatest &&
      currentTime !== newest
    ) {

      await selectTime(
        newest,
        false,
        true
      );

    } else {

      updateTimelinePosition();

    }

    setStatus("Готово");

  } catch (error) {

    console.error(
      "Capabilities error:",
      error
    );

    setStatus(
      "Ошибка загрузки радара"
    );
  }
}

/* =========================================================
   EPSG:3857
========================================================= */

function project3857(lat, lon) {

  const point =
    L.CRS.EPSG3857.project(
      L.latLng(lat, lon)
    );

  return point;
}

function getProjectedBounds() {

  const bounds =
    map.getBounds();

  const sw =
    project3857(
      bounds.getSouth(),
      bounds.getWest()
    );

  const ne =
    project3857(
      bounds.getNorth(),
      bounds.getEast()
    );

  return {

    south: sw.y,

    west: sw.x,

    north: ne.y,

    east: ne.x,

    latLngBounds:
      L.latLngBounds(
        [
          bounds.getSouth(),
          bounds.getWest()
        ],
        [
          bounds.getNorth(),
          bounds.getEast()
        ]
      )
  };
}

/* =========================================================
   RADAR REQUEST
========================================================= */

function getRadarRequest(time) {

  const projected =
    getProjectedBounds();

  const size =
    map.getSize();

  const bbox = [
    projected.west,
    projected.south,
    projected.east,
    projected.north
  ].join(",");

  const width =
    Math.max(
      256,
      Math.round(size.x)
    );

  const height =
    Math.max(
      256,
      Math.round(size.y)
    );

  const params =
    new URLSearchParams({

      SERVICE: "WMS",

      VERSION: "1.1.1",

      REQUEST: "GetMap",

      LAYERS: TARGET_LAYER,

      STYLES: "",

      FORMAT: "image/png",

      TRANSPARENT: "true",

      SRS: "EPSG:3857",

      BBOX: bbox,

      WIDTH: width,

      HEIGHT: height,

      TIME: time
    });

  return {

    url:
      WMS_URL +
      "?" +
      params.toString(),

    bounds:
      projected.latLngBounds
  };
}

/* =========================================================
   IMAGE
========================================================= */

function loadImage(url) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      img.onload = () => {

        if (
          !img.naturalWidth ||
          !img.naturalHeight
        ) {

          reject(
            new Error(
              "Пустое изображение"
            )
          );

          return;
        }

        resolve(img);
      };

      img.onerror = () => {

        reject(
          new Error(
            "Изображение не загрузилось"
          )
        );

      };

      img.src = url;

    }
  );
}

function loadImageCached(url) {

  if (
    radarCache.has(url)
  ) {

    return radarCache.get(url);
  }

  const promise =
    loadImage(url)
      .catch(error => {

        radarCache.delete(url);

        throw error;

      });

  radarCache.set(
    url,
    promise
  );

  return promise;
}

/* =========================================================
   CANDIDATES
========================================================= */

function getCandidateTimes(time) {

  const index =
    times.indexOf(time);

  if (index < 0) {

    return [time];

  }

  return times
    .slice(
      0,
      index + 1
    )
    .reverse();
}

/* =========================================================
   APPLY RADAR
========================================================= */

function applyRadarImage(
  img,
  bounds
) {

  if (!radarToggle.checked) {

    return;

  }

  if (!currentRadarLayer) {

    currentRadarLayer =
      L.imageOverlay(
        img.src,
        bounds,
        {
          opacity: radarOpacity,
          interactive: false
        }
      ).addTo(map);

    return;
  }

  currentRadarLayer.setUrl(
    img.src
  );

  currentRadarLayer.setBounds(
    bounds
  );

  currentRadarLayer.setOpacity(
    radarOpacity
  );
}

/* =========================================================
   SELECT TIME
========================================================= */

async function selectTime(
  requestedTime,
  fromMapMove = false,
  allowFallback = true
) {

  if (!requestedTime) {

    return;

  }

  const requestId =
    ++radarRequestId;

  const candidates =
    allowFallback
      ? getCandidateTimes(requestedTime)
      : [requestedTime];

  for (
    const candidateTime of candidates
  ) {

    if (
      requestId !== radarRequestId
    ) {

      return;

    }

    const request =
      getRadarRequest(
        candidateTime
      );

    try {

      if (!fromMapMove) {

        setStatus(
          "Загрузка " +
          formatTime(candidateTime) +
          "…"
        );

      }

      const img =
        await loadImageCached(
          request.url
        );

      if (
        requestId !== radarRequestId
      ) {

        return;

      }

      try {

        if (img.decode) {

          await img.decode();

        }

      } catch (_) {}

      if (
        requestId !== radarRequestId
      ) {

        return;

      }

      applyRadarImage(
        img,
        request.bounds
      );

      currentTime =
        candidateTime;

      updateTimelinePosition();

      hidePixelInfo();

      if (!fromMapMove) {

        setStatus(
          "Отражаемость · " +
          formatTime(currentTime)
        );

      }

      if (
        vectorToggle.checked
      ) {

        loadVectors(
          currentTime
        );

      }

      return;

    } catch (error) {

      console.warn(
        "Frame unavailable:",
        candidateTime,
        error
      );

      continue;

    }
  }

  if (
    requestId === radarRequestId
  ) {

    updateTimelinePosition();

    setStatus(
      "Кадр временно недоступен"
    );

  }
}

/* =========================================================
   PRELOAD
========================================================= */

async function startInitialPreload() {

  if (preloadStarted) {

    return;

  }

  preloadStarted = true;

  const start =
    Math.max(
      0,
      times.length - INITIAL_PRELOAD
    );

  const preloadTimes =
    times.slice(
      start,
      times.length - 1
    );

  let cursor = 0;

  async function worker() {

    while (
      cursor <
      preloadTimes.length
    ) {

      const index =
        cursor++;

      const time =
        preloadTimes[index];

      const request =
        getRadarRequest(
          time
        );

      try {

        await loadImageCached(
          request.url
        );

      } catch (error) {

        console.warn(
          "Preload failed:",
          time,
          error
        );

      }
    }
  }

  const workers = [];

  for (
    let i = 0;
    i < Math.min(
      PRELOAD_CONCURRENCY,
      preloadTimes.length
    );
    i++
  ) {

    workers.push(
      worker()
    );

  }

  await Promise.all(
    workers
  );
}

/* =========================================================
   TIMELINE
========================================================= */

function updateTimelinePosition() {

  if (
    !currentTime ||
    !times.length
  ) {

    return;

  }

  let index =
    times.indexOf(
      currentTime
    );

  if (index < 0) {

    let bestIndex = 0;

    let bestDiff =
      Infinity;

    const target =
      new Date(
        currentTime
      ).getTime();

    for (
      let i = 0;
      i < times.length;
      i++
    ) {

      const diff =
        Math.abs(
          new Date(
            times[i]
          ).getTime() -
          target
        );

      if (
        diff < bestDiff
      ) {

        bestDiff = diff;

        bestIndex = i;

      }
    }

    index =
      bestIndex;
  }

  timeSlider.value =
    index;

  timeValue.textContent =
    formatDateTime(
      currentTime
    );
}

timeSlider.addEventListener(
  "input",
  () => {

    const index =
      Number(
        timeSlider.value
      );

    if (!times[index]) {

      return;

    }

    autoFollowLatest =
      index ===
      times.length - 1;

    selectTime(
      times[index],
      false,
      true
    );
  }
);

prevBtn.addEventListener(
  "click",
  () => {

    if (!times.length) {

      return;

    }

    let index =
      Number(
        timeSlider.value
      );

    index =
      Math.max(
        0,
        index - 1
      );

    timeSlider.value =
      index;

    autoFollowLatest =
      index ===
      times.length - 1;

    selectTime(
      times[index],
      false,
      true
    );
  }
);

nextBtn.addEventListener(
  "click",
  () => {

    if (!times.length) {

      return;

    }

    let index =
      Number(
        timeSlider.value
      );

    index =
      Math.min(
        times.length - 1,
        index + 1
      );

    timeSlider.value =
      index;

    autoFollowLatest =
      index ===
      times.length - 1;

    selectTime(
      times[index],
      false,
      true
    );
  }
);

playBtn.addEventListener(
  "click",
  () => {

    if (!times.length) {

      return;

    }

    if (playing) {

      playing = false;

      clearInterval(
        playTimer
      );

      playTimer = null;

      playBtn.textContent =
        "▶";

      return;
    }

    playing = true;

    playBtn.textContent =
      "❚❚";

    playTimer =
      setInterval(
        () => {

          let index =
            Number(
              timeSlider.value
            );

          index++;

          if (
            index >=
            times.length
          ) {

            index = 0;

          }

          timeSlider.value =
            index;

          autoFollowLatest =
            index ===
            times.length - 1;

          selectTime(
            times[index],
            false,
            true
          );

        },
        900
      );
  }
);

/* =========================================================

radarToggle.addEventListener(

/* =========================================================
   VECTORS
========================================================= */

const vectorLayer =
  L.layerGroup().addTo(map);

function destination(
  lon,
  lat,
  dist,
  bearing
) {

  const R =
    6371;

  const brng =
    bearing *
    Math.PI /
    180;

  const lat1 =
    lat *
    Math.PI /
    180;

  const lon1 =
    lon *
    Math.PI /
    180;

  const d =
    dist / R;

  const lat2 =
    Math.asin(
      Math.sin(lat1) *
      Math.cos(d) +
      Math.cos(lat1) *
      Math.sin(d) *
      Math.cos(brng)
    );

  const lon2 =
    lon1 +
    Math.atan2(
      Math.sin(brng) *
      Math.sin(d) *
      Math.cos(lat1),

      Math.cos(d) -
      Math.sin(lat1) *
      Math.sin(lat2)
    );

  return [
    lon2 * 180 / Math.PI,
    lat2 * 180 / Math.PI
  ];
}

function createVector(
  lat,
  lon,
  dist,
  head
) {

  const end =
    destination(
      lon,
      lat,
      dist,
      head
    );

  const points = [
    [lat, lon],
    [end[1], end[0]]
  ];

  const outline =
    L.polyline(
      points,
      {
        color: "#000000",
        weight: 3,
        opacity: .95,
        interactive: false
      }
    );

  const line =
    L.polyline(
      points,
      {
        color: "#ffffff",
        weight: 1.5,
        opacity: 1,
        interactive: false
      }
    );

  return L.layerGroup([
    outline,
    line
  ]);
}

async function loadVectors(time) {

  if (
    !vectorToggle.checked
  ) {

    vectorLayer.clearLayers();

    return;

  }

  const requestId =
    ++vectorRequestId;

  const url =
    VECTOR_URL +
    "?time=" +
    encodeURIComponent(time) +
    "&title=" +
    encodeURIComponent(
      VECTOR_TITLE
    );

  try {

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    if (
      requestId !== vectorRequestId ||
      time !== currentTime ||
      !vectorToggle.checked
    ) {

      return;

    }

    vectorLayer.clearLayers();

    if (!Array.isArray(data)) {

      return;

    }

    for (
      const item of data
    ) {

      if (
        !Array.isArray(item) ||
        item.length < 4
      ) {

        continue;

      }

      const lat =
        Number(item[0]);

      const lon =
        Number(item[1]);

      const dist =
        Number(item[2]) * 3.6;

      const head =
        Number(item[3]);

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(dist) ||
        !Number.isFinite(head)
      ) {

        continue;

      }

      if (
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
      ) {

        continue;

      }

      vectorLayer.addLayer(
        createVector(
          lat,
          lon,
          dist,
          head
        )
      );
    }

  } catch (error) {

    console.warn(
      "Vector error:",
      error
    );

  }
}

vectorToggle.addEventListener(
  "change",
  () => {

    if (
      !vectorToggle.checked
    ) {

      ++vectorRequestId;

      vectorLayer.clearLayers();

      return;

    }

    if (currentTime) {

      loadVectors(
        currentTime
      );

    }
  }
);

let moveTimer = null;

function refreshRadarAfterMapChange() {

  clearTimeout(
    moveTimer
  );

  moveTimer =
    setTimeout(
      () => {

        if (!currentTime) {

          return;

        }

        selectTime(
          currentTime,
          true,
          false
        );

      },
      180
    );
}

map.on(
  "moveend",
  refreshRadarAfterMapChange
);

/* =========================================================
   PIXEL INFO HELPERS
========================================================= */

function hidePixelInfo() {

  pixelInfo.style.display =
    "none";

  pixelPoint.style.display =
    "none";

}

function showPixelPoint(
  containerPoint
) {

  pixelPoint.style.left =
    containerPoint.x + "px";

  pixelPoint.style.top =
    containerPoint.y + "px";

  pixelPoint.style.display =
    "block";
}

/*
 * Прямоугольник теперь всегда строится
 * непосредственно под точкой.
 */

function positionPixelInfo(
  containerPoint
) {

  const width =
    190;

  const estimatedHeight =
    120;

  const margin =
    10;

  let left =
    containerPoint.x -
    width / 2;

  let top =
    containerPoint.y +
    14;

  if (
    left < margin
  ) {

    left =
      margin;

  }

  if (
    left + width >
    window.innerWidth - margin
  ) {

    left =
      window.innerWidth -
      width -
      margin;

  }

  /*
   * Если снизу уже нет места,
   * показываем над точкой.
   */

  if (
    top + estimatedHeight >
    window.innerHeight - margin
  ) {

    top =
      containerPoint.y -
      estimatedHeight -
      14;

  }

  pixelInfo.style.left =
    left + "px";

  pixelInfo.style.top =
    top + "px";
}

   CLOSE PIXEL INFO

pixelClose.addEventListener(

/* =========================================================
   GET FEATURE INFO
========================================================= */

map.on(
  "click",
  async event => {

    if (
      !currentTime ||
      !radarToggle.checked
    ) {

      return;

    }

    /*
     * Сначала сразу показываем точку.
     * Она остаётся на месте клика,
     * пока идёт запрос.
     */

    const clickedPoint =
      map.latLngToContainerPoint(
        event.latlng
      );

    showPixelPoint(
      clickedPoint
    );

    pixelValue.textContent =
      "Загрузка…";

    pixelTime.textContent =
      formatDateTime(
        currentTime
      );

    pixelCoords.textContent =
      event.latlng.lat.toFixed(4) +
      "°, " +
      event.latlng.lng.toFixed(4) +
      "°";

    pixelInfo.style.display =
      "block";

    positionPixelInfo(
      clickedPoint
    );

    const projected =
      getProjectedBounds();

    const size =
      map.getSize();

    const point =
      map.latLngToContainerPoint(
        event.latlng
      );

    const params =
      new URLSearchParams({

        SERVICE: "WMS",

        VERSION: "1.1.1",

        REQUEST: "GetFeatureInfo",

        LAYERS: TARGET_LAYER,

        QUERY_LAYERS: TARGET_LAYER,

        STYLES: "",

        INFO_FORMAT:
          "text/html",

        SRS:
          "EPSG:3857",

        BBOX:
          [
            projected.west,
            projected.south,
            projected.east,
            projected.north
          ].join(","),

        WIDTH:
          Math.round(size.x),

        HEIGHT:
          Math.round(size.y),

        X:
          Math.round(point.x),

        Y:
          Math.round(point.y),

        TIME:
          currentTime
      });

    const url =
      WMS_URL +
      "?" +
      params.toString();

    try {

      const response =
        await fetch(
          url,
          {
            cache: "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }

      const text =
        await response.text();

      const dbz =
        parseDbz(text);

      /*
       * Если пользователь уже закрыл
       * информацию во время запроса —
       * ничего обратно не открываем.
       */

      if (
        pixelInfo.style.display ===
        "none"
      ) {

        return;

      }

      if (
        dbz === null
      ) {

        pixelValue.textContent =
          "Нет данных";

      } else {

        pixelValue.textContent =
          dbz.toFixed(1) +
          " dBZ";

      }

      pixelTime.textContent =
        formatDateTime(
          currentTime
        );

      pixelCoords.textContent =
        event.latlng.lat.toFixed(4) +
        "°, " +
        event.latlng.lng.toFixed(4) +
        "°";

      positionPixelInfo(
        clickedPoint
      );

    } catch (error) {

      console.warn(
        "GetFeatureInfo error:",
        error
      );

      pixelValue.textContent =
        "Нет данных";

    }
  }
);

/* =========================================================
   DBZ PARSER
========================================================= */

function parseDbz(text) {

  if (!text) {

    return null;

  }

  /*
   * -------------------------------------------------------
   * 1. JSON
   * -------------------------------------------------------
   */

  try {

    const json =
      JSON.parse(text);

    const candidates = [];

    function collect(
      value,
      key = ""
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return;

      }

      if (
        typeof value === "number"
      ) {

        candidates.push({
          key: key.toLowerCase(),
          value: value
        });

        return;

      }

      if (
        typeof value === "string"
      ) {

        const n =
          Number(value);

        if (
          Number.isFinite(n)
        ) {

          candidates.push({
            key: key.toLowerCase(),
            value: n
          });

        }

        return;

      }

      if (
        Array.isArray(value)
      ) {

        for (
          const item of value
        ) {

          collect(
            item,
            key
          );

        }

        return;

      }

      if (
        typeof value === "object"
      ) {

        for (
          const [k, v] of
          Object.entries(value)
        ) {

          collect(
            v,
            k
          );

        }

      }
    }

    collect(json);

    const preferred =
      candidates.find(
        item =>
          /dbz|dbzh|reflect|reflectivity|bufr_dbz1|value_0/.test(
            item.key
          )
      );

    if (preferred) {

      const value =
        convertRadarValue(
          preferred.value
        );

      if (value !== null) {

        return value;

      }

    }

  } catch (_) {

    /*
     * Ответ не JSON.
     * Переходим к HTML/XML.
     */

  }

  /*
   * -------------------------------------------------------
   * 2. HTML/XML
   * -------------------------------------------------------
   */

  const parser =
    new DOMParser();

  let doc = null;

  try {

    doc =
      parser.parseFromString(
        text,
        "text/html"
      );

  } catch (_) {}

  if (doc) {

    const rows =
      Array.from(
        doc.querySelectorAll(
          "tr"
        )
      );

    for (
      const row of rows
    ) {

      const cells =
        Array.from(
          row.querySelectorAll(
            "td,th"
          )
        )
        .map(
          cell =>
            cell.textContent
              .trim()
        );

      if (
        cells.length < 2
      ) {

        continue;

      }

      const label =
        cells[0].toLowerCase();

      if (
        /dbz|dbzh|reflect|reflectivity|bufr_dbz1/.test(
          label
        )
      ) {

        for (
          let i = 1;
          i < cells.length;
          i++
        ) {

          const match =
            cells[i].match(
              /-?\d+(?:\.\d+)?/
            );

          if (!match) {

            continue;

          }

          const value =
            convertRadarValue(
              Number(match[0])
            );

          if (value !== null) {

            return value;

          }
        }
      }
    }

    /*
     * Иногда сервер отдаёт XML/GML,
     * поэтому ищем элементы с понятными
     * названиями.
     */

    const allElements =
      Array.from(
        doc.querySelectorAll("*")
      );

    for (
      const element of allElements
    ) {

      const name =
        (
          element.getAttribute(
            "name"
          ) ||
          element.getAttribute(
            "property"
          ) ||
          element.getAttribute(
            "type"
          ) ||
          element.tagName ||
          ""
        ).toLowerCase();

      if (
        !/dbz|dbzh|reflect|reflectivity|bufr_dbz1|value_0/.test(
          name
        )
      ) {

        continue;

      }

      const valueText =
        element.textContent.trim();

      const match =
        valueText.match(
          /-?\d+(?:\.\d+)?/
        );

      if (!match) {

        continue;

      }

      const value =
        convertRadarValue(
          Number(match[0])
        );

      if (value !== null) {

        return value;

      }
    }
  }

  /*
   * -------------------------------------------------------
   * 3. Прямой текстовый поиск
   * -------------------------------------------------------
   */

  const patterns = [

    /(?:dBZ|dBZH|DBZH|reflectivity)[^0-9-]*(-?\d+(?:\.\d+)?)/i,

    /(?:bufr_dbz1)[^0-9-]*(-?\d+(?:\.\d+)?)/i,

    /(?:value_0)[^0-9-]*(-?\d+(?:\.\d+)?)/i,

    /(?:dbzh|dbz)[^0-9-]*(-?\d+(?:\.\d+)?)/i

  ];

  for (
    const pattern of patterns
  ) {

    const match =
      text.match(pattern);

    if (!match) {

      continue;

    }

    const raw =
      Number(match[1]);

    const value =
      convertRadarValue(raw);

    if (value !== null) {

      return value;

    }
  }

  return null;
}

/* =========================================================
   RADAR VALUE CONVERSION
========================================================= */

function convertRadarValue(raw) {

  if (
    !Number.isFinite(raw)
  ) {

    return null;

  }

  /*
   * Уже нормальное значение dBZ.
   *
   * BALTRAD/Nowcast может отдавать
   * значение непосредственно в dBZ.
   */

  if (
    raw >= -100 &&
    raw <= 100
  ) {

    return raw;

  }

  /*
   * Если значение хранится как
   * 8-bit код:
   *
   * dBZ = raw * 0.5 - 32
   */

  if (
    raw >= 0 &&
    raw <= 254
  ) {

    const dbz =
      raw * 0.5 - 32;

    if (
      dbz >= -100 &&
      dbz <= 100
    ) {

      return dbz;

    }
  }

  return null;
}

/* =========================================================
   CLOSE INFO WHEN MAP MOVES
========================================================= */

map.on(
  "movestart",
  () => {

    hidePixelInfo();

  }
);

/* =========================================================
   GEOLOCATION
========================================================= */

document
  .getElementById("locateBtn")
  .addEventListener(
    "click",
    () => {

      if (
        !navigator.geolocation
      ) {

        return;

      }

      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;

          map.setView(
            [lat, lon],
            Math.max(
              map.getZoom(),
              8
            )
          );

        },

        error => {

          console.warn(
            "Geolocation error:",
            error
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }

      );
    }
  );

/* =========================================================
   SEARCH
========================================================= */

document
  .getElementById("searchBtn")
  .addEventListener(
    "click",
    () => {

      const value =
        prompt(
          "Введите координаты:\n\nНапример:\n54.74, 55.97"
        );

      if (!value) {

        return;

      }

      const parts =
        value
          .replace(";", ",")
          .split(",");

      if (
        parts.length < 2
      ) {

        alert(
          "Неверный формат координат"
        );

        return;

      }

      const lat =
        Number(
          parts[0].trim()
        );

      const lon =
        Number(
          parts[1].trim()
        );

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
      ) {

        alert(
          "Неверные координаты"
        );

        return;

      }

      map.setView(
        [lat, lon],
        Math.max(
          map.getZoom(),
          8
        )
      );

    }
  );

/* =========================================================
   UPDATE
========================================================= */

setInterval(
  () => {

    loadCapabilities();

  },
  60 * 1000
);

/* =========================================================
   START
========================================================= */

loadCapabilities();

</script>
