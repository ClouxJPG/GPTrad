<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GPTrad</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html,body,#map{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#map{
  background:#dfe8ef;
}

.top{
  position:absolute;
  z-index:1000;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,.95);
  border-radius:12px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}

.logo{
  font-weight:700;
  font-size:16px;
  margin-right:4px;
}

select{
  border:1px solid #ccc;
  border-radius:8px;
  padding:6px 8px;
  background:white;
}

button{
  border:0;
  background:#eee;
  border-radius:8px;
  width:34px;
  height:34px;
  font-size:18px;
}

button:active{
  background:#ddd;
}

#status{
  position:absolute;
  z-index:1000;
  top:65px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,.9);
  padding:5px 10px;
  border-radius:8px;
  font-size:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.timeline{
  position:absolute;
  z-index:1000;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(92%,700px);
  background:rgba(255,255,255,.95);
  border-radius:12px;
  padding:8px 10px;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
  display:flex;
  align-items:center;
  gap:8px;
}

.timeline button{
  flex:none;
}

#time{
  flex:1;
  min-width:0;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top">
  <div class="logo">GPTrad</div>

  <select id="layer">
    <option value="radar">Радар (RainViewer)</option>
    <option value="warnings">Опасные явления</option>
  </select>

  <button id="locate">⌖</button>
  <button id="reload">↻</button>
</div>

<div id="status">Загрузка…</div>

<div class="timeline">
  <button id="back">◀</button>
  <button id="play">▶</button>
  <button id="forward">▶</button>
  <input id="time" type="range" min="0" max="0" value="0">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {
  zoomControl:true,
  attributionControl:true,

  // КРИТИЧНО:
  // Leaflet больше не делает плавный fade кадров.
  fadeAnimation:false,
  zoomAnimation:false,
  markerZoomAnimation:false
});

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);

map.setView([54.7,55.99],6);


/* =========================================================
   ELEMENTS
========================================================= */

const layerSelect = document.getElementById("layer");
const statusEl    = document.getElementById("status");
const timeSlider  = document.getElementById("time");
const playBtn     = document.getElementById("play");
const backBtn     = document.getElementById("back");
const forwardBtn  = document.getElementById("forward");
const reloadBtn   = document.getElementById("reload");
const locateBtn   = document.getElementById("locate");


/* =========================================================
   RAINVIEWER
========================================================= */

const RV_API =
  "https://api.rainviewer.com/public/weather-maps.json";

let radarFrames = [];
let radarIndex = 0;

let radarLayer = null;
let radarPendingLayer = null;
let radarSwitchId = 0;


/* =========================================================
   OЯ WMS
========================================================= */

/*
   Реальный WMS из radar-wms / nowcast demo.

   В оригинальном demo используются:
   /baltrad_wsgi
   и слой:

   bufr_phenomena,
   bufr_novosib_phenomena,
   bufr_vlad_phenomena
*/

const OYA_WMS =
  "https://www.nowcast.ru/baltrad_wsgi";

const OYA_LAYERS =
  "bufr_phenomena,bufr_novosib_phenomena,bufr_vlad_phenomena";

const OYA_CAPABILITIES =
  OYA_WMS +
  "?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetCapabilities";

let oyaTimes = [];
let oyaLayer = null;
let oyaPendingLayer = null;
let oyaSwitchId = 0;


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){
  statusEl.textContent = text;
}


/* =========================================================
   RAINVIEWER API
========================================================= */

async function loadRainViewer(){

  try{

    setStatus("Загрузка радара…");

    const response = await fetch(
      RV_API + "?_=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error(
        "RainViewer HTTP " + response.status
      );
    }

    const data = await response.json();

    const frames = [];

    if(data.radar && Array.isArray(data.radar.past)){
      frames.push(...data.radar.past);
    }

    if(data.radar && Array.isArray(data.radar.nowcast)){
      frames.push(...data.radar.nowcast);
    }

    radarFrames = frames
      .filter(x =>
        x &&
        typeof x.time === "number" &&
        x.path
      )
      .sort((a,b) => a.time - b.time);

    if(!radarFrames.length){
      throw new Error("Нет radar frames");
    }

    radarIndex = radarFrames.length - 1;

    timeSlider.min = 0;
    timeSlider.max = radarFrames.length - 1;
    timeSlider.value = radarIndex;

    await showRadarFrame(radarIndex);

    updateStatus();

  }catch(err){

    console.error("RainViewer:",err);

    setStatus("Ошибка загрузки радара");
  }
}


/* =========================================================
   RAINVIEWER TILE LAYER
========================================================= */

function createRadarLayer(frame){

  const url =
    "https://tilecache.rainviewer.com" +
    frame.path +
    "/256/{z}/{x}/{y}/2/1_1.png";

  return L.tileLayer(url,{
    tileSize:256,
    opacity:1,
    maxZoom:18,
    zIndex:10,

    // Дополнительно отключаем задержку появления.
    updateWhenIdle:false,
    updateWhenZooming:false,
    keepBuffer:2
  });
}


/* =========================================================
   WAIT FOR TILE LAYER
========================================================= */

function waitForLayer(layer){

  return new Promise(resolve => {

    let done = false;

    const finish = () => {

      if(done) return;

      done = true;

      layer.off("load",finish);

      resolve();
    };

    layer.once("load",finish);

    /*
      Если часть тайлов уже есть в кеше,
      load может прийти очень быстро.
    */

    setTimeout(finish,7000);
  });
}


/* =========================================================
   SHOW RAINVIEWER FRAME
========================================================= */

async function showRadarFrame(index){

  if(!radarFrames[index]) return;

  const frame = radarFrames[index];

  const requestId = ++radarSwitchId;

  /*
    Если пользователь быстро двигает ползунок,
    старый pending layer больше не нужен.
  */

  if(radarPendingLayer){

    try{
      map.removeLayer(radarPendingLayer);
    }catch(e){}

    radarPendingLayer = null;
  }

  const nextLayer = createRadarLayer(frame);

  radarPendingLayer = nextLayer;

  /*
    ВАЖНО:
    новый слой сразу opacity=1.

    Старый слой остаётся под ним до тех пор,
    пока новый не загрузится.

    Никакого fade 0 -> 1.
  */

  nextLayer.addTo(map);

  await waitForLayer(nextLayer);

  /*
    Пока новый кадр грузился, пользователь мог
    выбрать другой кадр.
  */

  if(requestId !== radarSwitchId){

    try{
      map.removeLayer(nextLayer);
    }catch(e){}

    if(radarPendingLayer === nextLayer){
      radarPendingLayer = null;
    }

    return;
  }

  /*
    Новый кадр готов.
    Только теперь убираем старый.
  */

  const oldLayer = radarLayer;

  radarLayer = nextLayer;
  radarPendingLayer = null;

  if(oldLayer && oldLayer !== nextLayer){

    try{
      map.removeLayer(oldLayer);
    }catch(e){}
  }
}


/* =========================================================
   OЯ GETCAPABILITIES
========================================================= */

function getDirectChild(element,name){

  for(const child of element.children){

    if(
      child.localName === name ||
      child.nodeName === name
    ){
      return child;
    }
  }

  return null;
}


async function loadOyaTimes(){

  try{

    const response = await fetch(
      OYA_CAPABILITIES + "&_=" + Date.now(),
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error(
        "WMS HTTP " + response.status
      );
    }

    const text = await response.text();

    const xml =
      new DOMParser().parseFromString(
        text,
        "text/xml"
      );

    /*
      Ищем именно bufr_phenomena.
      Не vector_wsgi.
    */

    const allLayers =
      Array.from(
        xml.getElementsByTagNameNS("*","Layer")
      );

    let targetLayer = null;

    for(const layer of allLayers){

      const nameEl =
        getDirectChild(layer,"Name");

      if(
        nameEl &&
        nameEl.textContent.trim() === "bufr_phenomena"
      ){
        targetLayer = layer;
        break;
      }
    }

    if(!targetLayer){

      throw new Error(
        "bufr_phenomena не найден в GetCapabilities"
      );
    }

    /*
      У WMS demo времени находятся
      в непосредственном child <Extent>.
    */

    let extent = null;

    for(const child of targetLayer.children){

      if(child.localName === "Extent"){

        const name =
          (child.getAttribute("name") || "")
            .toLowerCase();

        if(!name || name === "time"){

          extent = child;
          break;
        }
      }
    }

    if(!extent){

      throw new Error(
        "Extent времени ОЯ не найден"
      );
    }

    const raw =
      extent.textContent.trim();

    const times =
      raw
        .split(",")
        .map(x => x.trim())
        .filter(x => {
          const t = Date.parse(x);
          return Number.isFinite(t);
        })
        .map(x => ({
          iso:x,
          ms:Date.parse(x)
        }))
        .sort((a,b) => a.ms - b.ms);

    /*
      Убираем дубли.
    */

    const unique = [];

    const seen = new Set();

    for(const item of times){

      if(!seen.has(item.ms)){

        seen.add(item.ms);
        unique.push(item);
      }
    }

    oyaTimes = unique;

    console.log(
      "OЯ timestamps:",
      oyaTimes.length,
      oyaTimes
    );

    if(!oyaTimes.length){

      throw new Error(
        "Времена ОЯ отсутствуют"
      );
    }

    setStatus(
      "ОЯ: " + oyaTimes.length + " кадров"
    );

    /*
      Если сейчас выбран ОЯ —
      сразу показать ближайший кадр.
    */

    if(layerSelect.value === "warnings"){

      await showOyaForRadarTime(
        radarFrames[radarIndex]?.time
      );
    }

  }catch(err){

    console.error(
      "OЯ GetCapabilities:",
      err
    );

    /*
      Не ломаем радар.
    */

    oyaTimes = [];

    if(layerSelect.value === "warnings"){

      setStatus(
        "ОЯ: не удалось получить времена WMS"
      );

      /*
        Всё равно пробуем показать
        последний WMS-кадр без TIME.
      */

      await showOyaLatest();
    }
  }
}


/* =========================================================
   FIND NEAREST OЯ TIME
========================================================= */

function nearestOyaTime(unixSeconds){

  if(!oyaTimes.length) return null;

  const target =
    Number(unixSeconds) * 1000;

  let best = oyaTimes[0];

  let bestDistance =
    Math.abs(best.ms - target);

  for(let i=1;i<oyaTimes.length;i++){

    const distance =
      Math.abs(
        oyaTimes[i].ms - target
      );

    if(distance < bestDistance){

      best = oyaTimes[i];
      bestDistance = distance;
    }
  }

  return best;
}


/* =========================================================
   CREATE OЯ WMS
========================================================= */

function createOyaLayer(time){

  const params = {

    layers:OYA_LAYERS,

    format:"image/png",

    transparent:true,

    version:"1.1.1",

    styles:"",

    opacity:1,

    zIndex:30
  };

  /*
    TIME добавляем только если
    реально получили timestamp.
  */

  if(time){
    params.time = time;
  }

  return L.tileLayer.wms(
    OYA_WMS,
    params
  );
}


/* =========================================================
   SHOW OЯ
========================================================= */

async function showOyaForRadarTime(
  radarUnixSeconds
){

  /*
    Если времена ещё не пришли —
    сначала пытаемся их получить.
  */

  if(!oyaTimes.length){

    await loadOyaTimes();

    if(!oyaTimes.length){

      await showOyaLatest();

      return;
    }
  }

  const nearest =
    nearestOyaTime(radarUnixSeconds);

  if(!nearest){

    await showOyaLatest();

    return;
  }

  await showOyaTime(nearest.iso);
}


/* =========================================================
   SHOW EXACT OЯ TIME
========================================================= */

async function showOyaTime(time){

  const requestId =
    ++oyaSwitchId;

  if(oyaPendingLayer){

    try{
      map.removeLayer(oyaPendingLayer);
    }catch(e){}

    oyaPendingLayer = null;
  }

  const next =
    createOyaLayer(time);

  oyaPendingLayer = next;

  /*
    Старый ОЯ остаётся до полной загрузки нового.
    fadeAnimation выключен.
  */

  next.addTo(map);

  await waitForLayer(next);

  if(requestId !== oyaSwitchId){

    try{
      map.removeLayer(next);
    }catch(e){}

    return;
  }

  const old = oyaLayer;

  oyaLayer = next;
  oyaPendingLayer = null;

  if(old && old !== next){

    try{
      map.removeLayer(old);
    }catch(e){}
  }

  setStatus(
    "ОЯ: " +
    new Date(
      Date.parse(time)
    ).toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    )
  );
}


/* =========================================================
   FALLBACK — LATEST OЯ
========================================================= */

async function showOyaLatest(){

  const requestId =
    ++oyaSwitchId;

  if(oyaPendingLayer){

    try{
      map.removeLayer(oyaPendingLayer);
    }catch(e){}

    oyaPendingLayer = null;
  }

  /*
    Без TIME WMS отдаёт доступный
    актуальный слой, если сервер его предоставляет.
  */

  const next =
    createOyaLayer(null);

  oyaPendingLayer = next;

  next.addTo(map);

  await waitForLayer(next);

  if(requestId !== oyaSwitchId){

    try{
      map.removeLayer(next);
    }catch(e){}

    return;
  }

  const old = oyaLayer;

  oyaLayer = next;
  oyaPendingLayer = null;

  if(old && old !== next){

    try{
      map.removeLayer(old);
    }catch(e){}
  }

  setStatus("ОЯ");
}


/* =========================================================
   UPDATE STATUS
========================================================= */

function updateStatus(){

  if(!radarFrames[radarIndex]) return;

  const time =
    radarFrames[radarIndex].time * 1000;

  const date =
    new Date(time);

  if(layerSelect.value === "radar"){

    setStatus(
      "Радар: " +
      date.toLocaleTimeString(
        "ru-RU",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )
    );

  }else{

    const nearest =
      nearestOyaTime(
        radarFrames[radarIndex].time
      );

    if(nearest){

      setStatus(
        "ОЯ: " +
        new Date(
          nearest.ms
        ).toLocaleTimeString(
          "ru-RU",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        )
      );

    }else{

      setStatus("ОЯ");
    }
  }
}


/* =========================================================
   TIMELINE
========================================================= */

timeSlider.addEventListener(
  "input",
  async () => {

    radarIndex =
      Number(timeSlider.value);

    updateStatus();

    if(layerSelect.value === "radar"){

      await showRadarFrame(radarIndex);

    }else{

      await showOyaForRadarTime(
        radarFrames[radarIndex]?.time
      );
    }
  }
);


/* =========================================================
   BACK
========================================================= */

backBtn.addEventListener(
  "click",
  async () => {

    if(!radarFrames.length) return;

    radarIndex =
      Math.max(
        0,
        radarIndex - 1
      );

    timeSlider.value =
      radarIndex;

    updateStatus();

    if(layerSelect.value === "radar"){

      await showRadarFrame(
        radarIndex
      );

    }else{

      await showOyaForRadarTime(
        radarFrames[radarIndex]?.time
      );
    }
  }
);


/* =========================================================
   FORWARD
========================================================= */

forwardBtn.addEventListener(
  "click",
  async () => {

    if(!radarFrames.length) return;

    radarIndex =
      Math.min(
        radarFrames.length - 1,
        radarIndex + 1
      );

    timeSlider.value =
      radarIndex;

    updateStatus();

    if(layerSelect.value === "radar"){

      await showRadarFrame(
        radarIndex
      );

    }else{

      await showOyaForRadarTime(
        radarFrames[radarIndex]?.time
      );
    }
  }
);


/* =========================================================
   PLAY
========================================================= */

let playing = false;
let playTimer = null;

playBtn.addEventListener(
  "click",
  () => {

    if(!radarFrames.length) return;

    playing = !playing;

    playBtn.textContent =
      playing ? "❚❚" : "▶";

    if(!playing){

      clearInterval(playTimer);

      playTimer = null;

      return;
    }

    playTimer =
      setInterval(
        async () => {

          if(!playing) return;

          radarIndex++;

          if(
            radarIndex >=
            radarFrames.length
          ){

            radarIndex = 0;
          }

          timeSlider.value =
            radarIndex;

          updateStatus();

          if(layerSelect.value === "radar"){

            await showRadarFrame(
              radarIndex
            );

          }else{

            await showOyaForRadarTime(
              radarFrames[radarIndex]?.time
            );
          }

        },
        700
      );
  }
);


/* =========================================================
   LAYER SWITCH
========================================================= */

layerSelect.addEventListener(
  "change",
  async () => {

    /*
      RADAR
    */

    if(layerSelect.value === "radar"){

      ++oyaSwitchId;

      if(oyaPendingLayer){

        try{
          map.removeLayer(
            oyaPendingLayer
          );
        }catch(e){}

        oyaPendingLayer = null;
      }

      if(oyaLayer){

        try{
          map.removeLayer(
            oyaLayer
          );
        }catch(e){}
      }

      if(radarLayer){

        radarLayer.addTo(map);

      }else if(radarFrames.length){

        await showRadarFrame(
          radarIndex
        );
      }

      updateStatus();

      return;
    }


    /*
      ОЯ
    */

    ++radarSwitchId;

    if(radarPendingLayer){

      try{
        map.removeLayer(
          radarPendingLayer
        );
      }catch(e){}

      radarPendingLayer = null;
    }

    if(radarLayer){

      try{
        map.removeLayer(
          radarLayer
        );
      }catch(e){}
    }

    /*
      Если времён ОЯ ещё нет —
      пытаемся получить их.
    */

    if(!oyaTimes.length){

      await loadOyaTimes();

    }else{

      await showOyaForRadarTime(
        radarFrames[radarIndex]?.time
      );
    }

    updateStatus();
  }
);


/* =========================================================
   LOCATE
========================================================= */

locateBtn.addEventListener(
  "click",
  () => {

    if(!navigator.geolocation){

      setStatus(
        "Геолокация недоступна"
      );

      return;
    }

    setStatus("Определяем местоположение…");

    navigator.geolocation.getCurrentPosition(

      position => {

        const lat =
          position.coords.latitude;

        const lon =
          position.coords.longitude;

        map.setView(
          [lat,lon],
          8
        );

        setStatus(
          "Местоположение определено"
        );
      },

      () => {

        setStatus(
          "Не удалось определить местоположение"
        );
      },

      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:60000
      }
    );
  }
);


/* =========================================================
   RELOAD
========================================================= */

reloadBtn.addEventListener(
  "click",
  async () => {

    ++radarSwitchId;
    ++oyaSwitchId;

    radarFrames = [];
    oyaTimes = [];

    if(radarPendingLayer){

      try{
        map.removeLayer(
          radarPendingLayer
        );
      }catch(e){}

      radarPendingLayer = null;
    }

    if(oyaPendingLayer){

      try{
        map.removeLayer(
          oyaPendingLayer
        );
      }catch(e){}

      oyaPendingLayer = null;
    }

    if(radarLayer){

      try{
        map.removeLayer(
          radarLayer
        );
      }catch(e){}

      radarLayer = null;
    }

    if(oyaLayer){

      try{
        map.removeLayer(
          oyaLayer
        );
      }catch(e){}

      oyaLayer = null;
    }

    await loadRainViewer();

    /*
      ОЯ загружаем отдельно,
      чтобы ошибка WMS не ломала радар.
    */

    loadOyaTimes();
  }
);


/* =========================================================
   INITIAL
========================================================= */

(async function(){

  await loadRainViewer();

  /*
    Загружаем настоящие времена ОЯ
    параллельно после запуска радара.
  */

  loadOyaTimes();

})();
</script>

</body>
</html>
