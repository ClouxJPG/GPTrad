<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071827"><title>COOLrad — радар России</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.4.0/ol.css">
<style>
:root{--bg:#071827;--panel:rgba(7,22,37,.92);--line:#2d526c;--text:#eaf7ff;--muted:#9db8ca;--accent:#58d5ff;--ok:#a9f2c2;--err:#ffc5c5}*{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}#map{position:absolute;inset:0;background:#122233}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:0 16px 40px #02081799;backdrop-filter:blur(14px)}button,select,input{font:inherit}.btn{border:1px solid var(--line);border-radius:10px;background:#0c2b42;color:var(--text);padding:9px 11px;cursor:pointer;font-weight:700}.btn:hover,.btn.active{border-color:var(--accent);background:#10425e}.btn:disabled{opacity:.5;cursor:wait}#top{position:absolute;z-index:10;inset:14px 14px auto;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.brand,.toolbar{pointer-events:auto}.brand{border-radius:14px;padding:11px 15px;font-weight:900;letter-spacing:.12em}.brand b{color:var(--accent)}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:4px;letter-spacing:.05em}.toolbar{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}#panel{position:absolute;z-index:11;right:14px;top:74px;width:min(390px,calc(100vw - 28px));max-height:calc(100vh - 150px);overflow:auto;border-radius:15px;padding:16px;transform:translateX(calc(100% + 25px));transition:transform .2s}.open{transform:translateX(0)!important}.panel-title{display:flex;justify-content:space-between;font-weight:800;font-size:18px}.close{border:0;background:none;color:var(--muted);font-size:24px;cursor:pointer}.row{margin:15px 0}.row label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}select,input[type=range]{width:100%}select{padding:9px;background:#0b2a40;border:1px solid var(--line);border-radius:9px;color:var(--text)}input[type=range]{accent-color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.hint{color:var(--muted);font-size:11px;line-height:1.5}.sep{height:1px;background:var(--line);margin:14px 0}#status{position:absolute;z-index:10;left:14px;bottom:101px;padding:9px 12px;border-radius:10px;color:var(--muted);font-size:12px;max-width:calc(100% - 28px)}#status.ok{color:var(--ok)}#status.err{color:var(--err)}#timeline{position:absolute;z-index:10;left:14px;right:14px;bottom:14px;border-radius:14px;padding:10px 14px}#timelineHead{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:5px}#slider{width:100%;accent-color:var(--accent)}.ol-zoom{left:14px!important;top:115px!important}.ol-control button{background:#0a2438e8!important;color:#fff!important;border:1px solid var(--line)!important;border-radius:8px!important}.ol-attribution{right:7px!important;bottom:4px!important}@media(max-width:650px){#top{inset:9px 9px auto}.brand{padding:9px 11px;font-size:12px}.brand small{font-size:8px}.btn{padding:8px;font-size:11px}#status{left:9px;bottom:87px}#timeline{left:9px;right:9px;bottom:9px}}
</style></head>
<body>
<div id="map"></div>
<header id="top"><div class="brand glass"><b>●</b> COOLrad<small>LIVE RADAR • РОССИЯ</small></div><div class="toolbar"><button class="btn glass" id="refresh">↻ Обновить</button><button class="btn glass" id="play">▶ Анимация</button><button class="btn glass" id="locate">⌖ Россия</button><button class="btn glass" id="settings">⚙ Панель</button></div></header>
<aside id="panel" class="glass"><div class="panel-title">Управление <button class="close" id="close">×</button></div><div class="row"><label>Регион</label><select id="city"><option value="100,61,3">Вся Россия</option><option value="37.62,55.75,7">Москва</option><option value="30.31,59.94,7">Санкт-Петербург</option><option value="56.84,60.61,7">Екатеринбург</option><option value="82.92,55.03,6">Новосибирск</option><option value="49.11,55.79,7">Казань</option><option value="39.70,47.24,7">Ростов-на-Дону</option></select></div><div class="row"><label>Прозрачность радара <span id="opacityText">78%</span></label><input id="opacity" type="range" min="0" max="100" value="78"></div><div class="row"><label>Подложка</label><div class="grid"><button class="btn active" data-base="light">Светлая</button><button class="btn" data-base="dark">Тёмная</button></div></div><div class="row"><label>Управление</label><div class="grid"><button class="btn" id="fullscreen">⛶ Экран</button><button class="btn" id="source">↗ Источник</button></div></div><div class="sep"></div><div class="hint">Радарный кадр загружается только вручную и кэшируется на сервере. Карта не делает запросы при перемещении, чтобы не нагружать источник.</div><div class="hint" id="debug" style="margin-top:10px">Состояние: ожидание</div></aside>
<div id="status" class="glass">Подключение к карте…</div><div id="timeline" class="glass"><div id="timelineHead"><span>РАДАРНЫЙ КОМПОЗИТ</span><span id="time">—</span></div><input id="slider" type="range" min="0" max="11" value="11"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@7.4.0/dist/ol.js"></script>
<script>
"use strict";
const API="/api/meteoinfo";const state={radar:null,url:null,opacity:.78,playing:false,timer:null,frames:12,index:11,lastLoad:0};
const status=document.getElementById("status"),debug=document.getElementById("debug"),slider=document.getElementById("slider"),time=document.getElementById("time");
const light=new ol.layer.Tile({source:new ol.source.OSM({attributions:"© OpenStreetMap contributors"})});
const dark=new ol.layer.Tile({source:new ol.source.OSM({attributions:"© OpenStreetMap contributors"}),opacity:1});dark.setClassName("dark");
const map=new ol.Map({target:"map",layers:[light],view:new ol.View({center:ol.proj.fromLonLat([100,61]),zoom:3,minZoom:2,maxZoom:10}),controls:ol.control.defaults({rotate:false})});
const radarExtent=ol.proj.transformExtent([20,35,180,82],"EPSG:4326","EPSG:3857");
function say(text,type=""){status.className="glass"+(type?" "+type:"");status.textContent=text}function setDebug(text){debug.textContent="Состояние: "+text}function updateTime(){const d=new Date(Date.now()-(state.frames-1-state.index)*5*60000);time.textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
function center(value){const [lon,lat,zoom]=value.split(",").map(Number);map.getView().animate({center:ol.proj.fromLonLat([lon,lat]),zoom,duration:450})}
async function loadRadar(){if(Date.now()-state.lastLoad<3000)return;state.lastLoad=Date.now();const button=document.getElementById("refresh");button.disabled=true;say("Загрузка радарного кадра…");setDebug("запрос источника");try{const response=await fetch(`${API}?_=${Math.floor(Date.now()/300000)}`,{cache:"no-store"});if(!response.ok)throw Error(`HTTP ${response.status}`);const blob=await response.blob();if(!blob.type.toLowerCase().startsWith("image/"))throw Error("сервер вернул не изображение");const nextUrl=URL.createObjectURL(blob);const source=new ol.source.ImageStatic({url:nextUrl,imageExtent:radarExtent,projection:"EPSG:3857"});const next=new ol.layer.Image({source,opacity:state.opacity});if(state.radar)map.removeLayer(state.radar);if(state.url)URL.revokeObjectURL(state.url);state.radar=next;state.url=nextUrl;map.addLayer(next);updateTime();say("Реальный радарный композит отображён","ok");setDebug("готово")}catch(error){console.error(error);say("⚠ Радар не загрузился: "+error.message,"err");setDebug(error.message)}finally{button.disabled=false}}
function togglePlay(){state.playing=!state.playing;const button=document.getElementById("play");button.textContent=state.playing?"Ⅱ Пауза":"▶ Анимация";clearInterval(state.timer);if(state.playing){state.timer=setInterval(()=>{state.index=(state.index+1)%state.frames;slider.value=state.index;updateTime();loadRadar()},12000)}}
document.getElementById("refresh").onclick=loadRadar;document.getElementById("play").onclick=togglePlay;document.getElementById("locate").onclick=()=>center("100,61,3");document.getElementById("city").onchange=e=>center(e.target.value);document.getElementById("settings").onclick=()=>document.getElementById("panel").classList.toggle("open");document.getElementById("close").onclick=()=>document.getElementById("panel").classList.remove("open");document.getElementById("opacity").oninput=e=>{state.opacity=Number(e.target.value)/100;document.getElementById("opacityText").textContent=e.target.value+"%";if(state.radar)state.radar.setOpacity(state.opacity)};document.querySelectorAll("[data-base]").forEach(button=>button.onclick=()=>{const isDark=button.dataset.base==="dark";map.getLayers().setAt(0,isDark?dark:light);document.querySelectorAll("[data-base]").forEach(x=>x.classList.toggle("active",x===button))});document.getElementById("fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.getElementById("source").onclick=()=>window.open("https://meteoinfo.ru/radanim","_blank","noopener");slider.oninput=()=>{state.index=Number(slider.value);updateTime()};
updateTime();say("Карта готова. Загружаю радар…");loadRadar();
</script></body></html>
