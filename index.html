<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071827" />
    <title>COOLrad | Real Russia radar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.4.0/ol.css" />
    <style>
      :root {
        --bg: #071827;
        --panel: rgba(8, 18, 31, 0.84);
        --panel-border: rgba(148, 163, 184, 0.22);
        --primary: #64d2ff;
        --primary-strong: #32b7ff;
        --text: #e6f3ff;
        --muted: #9bb4c9;
        --shadow: rgba(2, 6, 23, 0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      #map {
        position: absolute;
        inset: 0;
        background: #0d1a2d;
      }

      #brand {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 10;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 14px;
        background: rgba(7, 24, 39, 0.8);
        border: 1px solid var(--panel-border);
        box-shadow: 0 16px 32px var(--shadow);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.85rem;
      }

      #brand::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8be9fd, #3cc8ff);
        box-shadow: 0 0 14px rgba(100, 210, 255, 0.9);
      }

      #status {
        position: absolute;
        left: 18px;
        top: 72px;
        z-index: 10;
        max-width: min(420px, calc(100vw - 200px));
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(8, 18, 31, 0.8);
        border: 1px solid var(--panel-border);
        color: var(--muted);
        font-size: 0.8rem;
        backdrop-filter: blur(10px);
      }

      #controls {
        position: absolute;
        top: 18px;
        right: 18px;
        z-index: 10;
        display: flex;
        gap: 10px;
      }

      .control-btn {
        appearance: none;
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: rgba(8, 18, 31, 0.82);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 30px var(--shadow);
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }

      .control-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(100, 210, 255, 0.9);
      }

      .control-btn.primary {
        background: linear-gradient(135deg, rgba(20, 126, 195, 0.68), rgba(17, 94, 146, 0.8));
      }

      .ol-zoom {
        position: absolute;
        left: 18px !important;
        bottom: 18px !important;
        top: auto !important;
      }

      .ol-control button {
        background: rgba(9, 18, 31, 0.86) !important;
        color: var(--text) !important;
        border: 1px solid rgba(148, 163, 184, 0.25) !important;
      }

      .ol-attribution {
        right: 10px !important;
        bottom: 10px !important;
        background: rgba(9, 18, 31, 0.7) !important;
        border-radius: 8px;
      }

      .ol-attribution a {
        color: #d9f4ff !important;
      }

      @media (max-width: 640px) {
        #brand {
          padding: 8px 12px;
          font-size: 0.72rem;
          letter-spacing: 0.06em;
        }

        #status {
          top: 62px;
          max-width: min(320px, calc(100vw - 140px));
          font-size: 0.72rem;
        }

        #controls {
          top: auto;
          bottom: 18px;
          right: 18px;
        }

        .control-btn {
          padding: 8px 10px;
          font-size: 0.78rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="brand">COOLrad</div>
    <div id="status">Реальные радарные данные • nowcast.ru • Россия</div>

    <div id="controls">
      <button id="refreshBtn" class="control-btn primary">Обновить</button>
      <button id="centerBtn" class="control-btn">Россия</button>
    </div>

    <div id="map" aria-label="Карта метеорадара"></div>

    <script src="https://cdn.jsdelivr.net/npm/ol@7.4.0/dist/ol.js"></script>
    <script>
      const OYA_PROXY = "/api/oya";
      const FALLBACK_LAYER_NAMES = [
        "radar",
        "oya",
        "precip",
        "russia_radar",
        "weather_radar",
        "rain",
        "reflectivity"
      ];

      let radarLayer = null;
      let selectedLayerName = null;

      const map = new ol.Map({
        target: "map",
        layers: [
          new ol.layer.Tile({
            source: new ol.source.OSM({
              attributions: "© OpenStreetMap contributors"
            })
          })
        ],
        view: new ol.View({
          center: ol.proj.fromLonLat([100, 61]),
          zoom: 3,
          minZoom: 2,
          maxZoom: 9
        })
      });

      const statusEl = document.getElementById("status");

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.style.color = isError ? "#ffd7d7" : "#9bb4c9";
      }

      function getCurrentExtent() {
        const size = map.getSize() || [1200, 800];
        return map.getView().calculateExtent(size);
      }

      function buildGetMapUrl(layerName, extent, size) {
        const params = new URLSearchParams({
          action: "image",
          SERVICE: "WMS",
          VERSION: "1.1.1",
          REQUEST: "GetMap",
          LAYERS: layerName,
          STYLES: "",
          SRS: "EPSG:3857",
          BBOX: extent.join(","),
          WIDTH: String(size[0]),
          HEIGHT: String(size[1]),
          FORMAT: "image/png",
          TRANSPARENT: "true",
          TIME: new Date().toISOString()
        });

        return `${OYA_PROXY}?${params.toString()}`;
      }

      function createRadarImageLayer(url, extent) {
        const source = new ol.source.ImageStatic({
          url,
          imageExtent: extent,
          projection: "EPSG:3857"
        });

        const layer = new ol.layer.Image({
          source,
          opacity: 0.9
        });

        return layer;
      }

      async function parseCapabilities() {
        const response = await fetch(`${OYA_PROXY}?action=capabilities`, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`Nowcast capabilities: ${response.status}`);
        }

        const xmlText = await response.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, "application/xml");
        const allNames = [...xml.querySelectorAll("Name")].map((node) =>
          node.textContent.trim()
        );

        const layered = allNames.filter(Boolean).map((name) => name.toLowerCase());

        for (const candidate of FALLBACK_LAYER_NAMES) {
          if (layered.some((item) => item.includes(candidate))) {
            return allNames.find((name) => name.toLowerCase().includes(candidate));
          }
        }

        return allNames[0] || null;
      }

      function renderRadarLayer() {
        const size = map.getSize() || [1200, 800];
        const extent = getCurrentExtent();

        if (!selectedLayerName) {
          return;
        }

        const radarUrl = buildGetMapUrl(selectedLayerName, extent, size);

        const nextLayer = createRadarImageLayer(radarUrl, extent);

        if (radarLayer) {
          map.removeLayer(radarLayer);
        }

        radarLayer = nextLayer;
        map.addLayer(radarLayer);
      }

      async function initRadar() {
        try {
          setStatus("Подключаю реальный радар Nowcast.ru…");
          selectedLayerName = await parseCapabilities();

          if (!selectedLayerName) {
            throw new Error("Не удалось определить слой радарных данных");
          }

          renderRadarLayer();
          setStatus(`Live radar • ${selectedLayerName.toUpperCase()} • Russia`);
        } catch (error) {
          console.error(error);
          setStatus(
            "Proxy Nowcast не отвечает. Проверьте /api/oya и доступность nowcast.ru.",
            true
          );
        }
      }

      document.getElementById("refreshBtn").addEventListener("click", () => {
        renderRadarLayer();
        setStatus(`Обновление • ${selectedLayerName ? selectedLayerName.toUpperCase() : "radar"}`);
      });

      document.getElementById("centerBtn").addEventListener("click", () => {
        map.getView().animate({
          center: ol.proj.fromLonLat([100, 61]),
          zoom: 3,
          duration: 500
        });
      });

      map.on("moveend", () => {
        if (selectedLayerName) {
          renderRadarLayer();
        }
      });

      initRadar();
    </script>
  </body>
</html>
