<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>GPTrad — Nowcast</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
html,body,#map{
  width:100%;
  height:100%;
  margin:0;
}

body{
  background:#111;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#map{
  background:#222;
}

#panel{
  position:absolute;
  z-index:1000;
  top:10px;
  left:10px;
  right:10px;
  padding:10px;
  background:rgba(20,20,20,.9);
  color:white;
  border-radius:10px;
}

button,select{
  margin:3px;
  padding:7px;
  border-radius:6px;
  border:0;
}

#status{
  font-size:12px;
  margin-top:5px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="panel">

  <select id="layer">
    <option value="bufr_phenomena">
      BUFR phenomena
    </option>

    <option value="bufr_novosib_phenomena">
      Novosibirsk phenomena
    </option>

    <option value="bufr_vlad_phenomena">
      Vladivostok phenomena
    </option>

    <option value="bufr_phenomena,bufr_novosib_phenomena,bufr_vlad_phenomena">
      Все
    </option>
  </select>

  <select id="time"></select>

  <button onclick="loadData()">Обновить</button>

  <div id="status">Получение токена...</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const NOWCAST = "https://www.nowcast.ru";

let token = null;
let wms = null;
let vectorLayer = L.layerGroup();

const map = L.map("map").setView([55,60],4);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);

vectorLayer.addTo(map);


/* =========================
   TOKEN
========================= */

async function getToken(){

  statusText("Получение Nowcast token...");

  const r = await fetch(
    NOWCAST + "/get_token",
    {
      cache:"no-store",
      credentials:"include"
    }
  );

  if(!r.ok){
    throw new Error(
      "get_token HTTP " + r.status
    );
  }

  const data = await r.json();

  if(!data.token){
    throw new Error(
      "Nowcast не вернул token"
    );
  }

  token = data.token;

  statusText("Token получен");

  return token;
}


/* =========================
   WMS
========================= */

function updateWMS(){

  const layer =
    document.getElementById("layer").value;

  const time =
    document.getElementById("time").value;

  if(wms){
    map.removeLayer(wms);
  }

  wms = L.tileLayer.wms(
    NOWCAST + "/baltrad_wsgi",
    {
      layers:layer,
      format:"image/png",
      transparent:true,
      version:"1.1.1",
      time:time,
      token:token,
      opacity:1
    }
  );

  wms.addTo(map);

  statusText(
    "WMS: " + layer +
    " | " + time
  );
}


/* =========================
   VECTOR DATA
========================= */

async function loadVector(){

  const layer =
    document.getElementById("layer").value;

  const time =
    document.getElementById("time").value;

  const url =
    NOWCAST +
    "/vector_wsgi" +
    "?time=" +
    encodeURIComponent(time) +
    "&title=" +
    encodeURIComponent(layer);

  const r = await fetch(
    url,
    {
      cache:"no-store",
      credentials:"include"
    }
  );

  if(!r.ok){
    throw new Error(
      "vector_wsgi HTTP " +
      r.status
    );
  }

  const data = await r.json();

  vectorLayer.clearLayers();

  for(const p of data){

    if(!Array.isArray(p) || p.length < 4)
      continue;

    const lat = Number(p[0]);
    const lon = Number(p[1]);
    const speed = Number(p[2]);
    const heading = Number(p[3]);

    if(
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ) continue;

    const len = Math.min(
      Math.max(speed * 0.02,0.02),
      0.5
    );

    const rad =
      heading * Math.PI / 180;

    const lat2 =
      lat + Math.cos(rad) * len;

    const lon2 =
      lon + Math.sin(rad) *
      len /
      Math.max(Math.cos(lat*Math.PI/180),0.2);

    L.polyline(
      [
        [lat,lon],
        [lat2,lon2]
      ],
      {
        weight:2,
        opacity:.9
      }
    ).addTo(vectorLayer);
  }

  statusText(
    "Получено объектов: " +
    data.length
  );
}


/* =========================
   TIMES
========================= */

async function loadTimes(){

  statusText(
    "Получение времён из WMS..."
  );

  /*
   * GetCapabilities.
   */

  const url =
    NOWCAST +
    "/baltrad_wsgi" +
    "?SERVICE=WMS" +
    "&VERSION=1.1.1" +
    "&REQUEST=GetCapabilities" +
    "&token=" +
    encodeURIComponent(token);

  const r = await fetch(
    url,
    {
      cache:"no-store",
      credentials:"include"
    }
  );

  if(!r.ok){
    throw new Error(
      "GetCapabilities HTTP " +
      r.status
    );
  }

  const xml = await r.text();

  /*
   * Ищем TIME значения.
   */

  const matches =
    [...xml.matchAll(
      /<Dimension[^>]*name=["']time["'][^>]*>([\s\S]*?)<\/Dimension>/gi
    )];

  const select =
    document.getElementById("time");

  select.innerHTML="";

  let values=[];

  for(const m of matches){

    const text =
      m[1]
        .replace(/<[^>]+>/g,"")
        .trim();

    if(!text) continue;

    values.push(
      ...text.split(",")
    );
  }

  values =
    [...new Set(
      values.map(x=>x.trim())
        .filter(Boolean)
    )];

  /*
   * Если сервер не отдал TIME,
   * используем последние часы.
   */

  if(!values.length){

    const now =
      Date.now();

    for(let i=0;i<12;i++){

      const d =
        new Date(
          now -
          i*10*60*1000
        );

      values.push(
        d.toISOString()
      );
    }
  }

  values.reverse();

  for(const value of values){

    const option =
      document.createElement("option");

    option.value=value;
    option.textContent=value;

    select.appendChild(option);
  }

  statusText(
    "Времён: " + values.length
  );
}


/* =========================
   MAIN
========================= */

async function loadData(){

  try{

    if(!token){
      await getToken();
    }

    if(
      !document.getElementById("time").value
    ){
      await loadTimes();
    }

    updateWMS();

    await loadVector();

  }catch(e){

    console.error(e);

    statusText(
      "Ошибка: " +
      e.message
    );
  }
}


/* =========================
   EVENTS
========================= */

document
  .getElementById("layer")
  .addEventListener(
    "change",
    loadData
  );

document
  .getElementById("time")
  .addEventListener(
    "change",
    loadData
  );


function statusText(text){

  document.getElementById(
    "status"
  ).textContent=text;
}


/* =========================
   START
========================= */

(async()=>{

  try{

    await getToken();

    await loadTimes();

    updateWMS();

    await loadVector();

  }catch(e){

    console.error(e);

    statusText(
      "Nowcast недоступен: " +
      e.message
    );
  }

})();
</script>

</body>
</html>
