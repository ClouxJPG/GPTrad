<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPTrad — Radar</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
}

#map {
    position: absolute;
    inset: 0;
    z-index: 1;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    position: fixed;
    z-index: 1000;
    top: 12px;
    left: 12px;
    right: 12px;

    height: 48px;

    display: flex;
    align-items: center;
    gap: 8px;

    pointer-events: none;
}

.logo {
    height: 42px;
    padding: 0 15px;

    display: flex;
    align-items: center;

    border-radius: 14px;

    background: rgba(20,20,20,.88);
    color: white;

    font-size: 18px;
    font-weight: 800;

    box-shadow: 0 5px 20px rgba(0,0,0,.3);

    pointer-events: auto;
}

.topbutton {
    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 14px;

    background: rgba(20,20,20,.88);
    color: white;

    font-size: 20px;

    box-shadow: 0 5px 20px rgba(0,0,0,.3);

    pointer-events: auto;
}

/* =========================
   SEARCH
========================= */

.search-box {
    position: fixed;
    z-index: 1100;

    top: 68px;
    right: 12px;

    width: min(360px, calc(100vw - 24px));

    display: none;

    background: rgba(20,20,20,.96);
    border-radius: 16px;

    padding: 10px;

    box-shadow: 0 10px 35px rgba(0,0,0,.4);
}

.search-box.active {
    display: block;
}

.search-input {
    width: 100%;
    height: 44px;

    border: 0;
    outline: 0;

    border-radius: 11px;

    padding: 0 13px;

    background: #2b2b2b;
    color: white;

    font-size: 16px;
}

.search-results {
    margin-top: 8px;
    max-height: 320px;
    overflow-y: auto;
}

.search-result {
    padding: 11px 12px;
    border-radius: 10px;

    color: white;
    cursor: pointer;
}

.search-result:active {
    background: #3b3b3b;
}

.search-main {
    font-size: 15px;
}

.search-sub {
    margin-top: 3px;
    font-size: 12px;
    color: #999;
}

/* =========================
   RADAR PANEL
========================= */

.radar-panel {
    position: fixed;
    z-index: 1050;

    top: 70px;
    right: 12px;

    width: 290px;

    background: rgba(20,20,20,.95);
    color: white;

    border-radius: 17px;

    padding: 14px;

    box-shadow: 0 10px 35px rgba(0,0,0,.4);

    display: none;
}

.radar-panel.active {
    display: block;
}

.panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 12px;
}

.panel-title {
    font-size: 17px;
    font-weight: 700;
}

.close {
    border: 0;
    background: transparent;
    color: #aaa;

    font-size: 26px;
    line-height: 20px;
}

.layer-row {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 9px 0;

    font-size: 15px;
}

.layer-row input {
    width: 18px;
    height: 18px;
}

/* =========================
   STATUS
========================= */

.status {
    position: fixed;
    z-index: 900;

    left: 12px;
    bottom: 105px;

    padding: 8px 12px;

    border-radius: 12px;

    background: rgba(20,20,20,.85);
    color: white;

    font-size: 12px;

    box-shadow: 0 5px 20px rgba(0,0,0,.25);

    pointer-events: none;
}

/* =========================
   TIMELINE
========================= */

.timeline {
    position: fixed;
    z-index: 1000;

    left: 12px;
    right: 12px;
    bottom: 15px;

    height: 70px;

    border-radius: 18px;

    background: rgba(20,20,20,.94);

    box-shadow: 0 7px 30px rgba(0,0,0,.4);

    display: flex;
    align-items: center;

    padding: 10px 12px;

    color: white;
}

.time-buttons {
    display: flex;
    gap: 6px;
}

.time-button {
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 11px;

    background: #303030;
    color: white;

    font-size: 17px;
}

.play-button {
    width: 42px;
    height: 42px;
}

.slider-wrap {
    flex: 1;
    margin-left: 10px;
}

#timeSlider {
    width: 100%;
}

.time-label {
    text-align: center;
    margin-top: 2px;

    font-size: 12px;
    color: #ddd;
}

/* =========================
   PIXEL INFO
========================= */

.pixel-info {
    position: fixed;
    z-index: 1000;

    top: 70px;
    left: 12px;

    min-width: 135px;

    padding: 9px 12px;

    border-radius: 12px;

    background: rgba(20,20,20,.88);
    color: white;

    font-size: 12px;

    display: none;

    pointer-events: none;
}

.pixel-info.active {
    display: block;
}

/* =========================
   RADAR IMAGE
========================= */

/*
   ВАЖНО:

   Никакого fade.
   Никакой принудительной opacity:1.

   Leaflet сам масштабирует ImageOverlay
   вместе с картой.
*/

.leaflet-image-layer.gptrad-radar {
    transition: none !important;
    will-change: transform;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .logo {
        font-size: 16px;
        padding: 0 12px;
    }

    .status {
        bottom: 98px;
    }

    .timeline {
        height: 66px;
    }

    .radar-panel {
        width: calc(100vw - 24px);
    }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="topbar">

    <div class="logo">
        GPTrad
    </div>

    <button class="topbutton" id="locateBtn">
        ⌖
    </button>

    <button class="topbutton" id="searchBtn">
        🔍
    </button>

    <button class="topbutton" id="radarBtn">
        ☁
    </button>

</div>


<!-- SEARCH -->

<div class="search-box" id="searchBox">

    <input
        id="searchInput"
        class="search-input"
        type="text"
        autocomplete="off"
        placeholder="Город, посёлок, деревня…">

    <div id="searchResults" class="search-results"></div>

</div>


<!-- RADAR PANEL -->

<div class="radar-panel" id="radarPanel">

    <div class="panel-head">

        <div class="panel-title">
            Радар
        </div>

        <button class="close" id="radarClose">
            ×
        </button>

    </div>

    <label class="layer-row">

        <input
            type="checkbox"
            id="reflectivityToggle"
            checked>

        <span>
            Отражаемость
        </span>

    </label>

    <label class="layer-row">

        <input
            type="checkbox"
            id="vectorToggle"
            checked>

        <span>
            Векторы движения
        </span>

    </label>

</div>


<!-- STATUS -->

<div class="status" id="status">
    Загрузка…
</div>


<!-- PIXEL INFO -->

<div class="pixel-info" id="pixelInfo">
    —
</div>


<!-- TIMELINE -->

<div class="timeline">

    <div class="time-buttons">

        <button
            class="time-button"
            id="prevBtn">
            ‹
        </button>

        <button
            class="time-button play-button"
            id="playBtn">
            ▶
        </button>

        <button
            class="time-button"
            id="nextBtn">
            ›
        </button>

    </div>

    <div class="slider-wrap">

        <input
            id="timeSlider"
            type="range"
            min="0"
            max="31"
            value="31"
            step="1">

        <div
            class="time-label"
            id="timeLabel">
            —
        </div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   CONFIG
========================================================= */

const WMS_URL = "/baltrad_wsgi";
const VECTOR_URL = "/vector_wsgi";

const TARGET_LAYER = "bufr_dbz1";

const FRAME_STEP =
    10 * 60 * 1000;


/*
   32 КАДРА
*/

const MAX_FRAMES = 32;


/*
   Кадры 17–32:
   индексы 16–31
*/

const INITIAL_PRELOAD_START = 16;


/*
   Одновременно грузим 3 изображения.
*/

const PRELOAD_CONCURRENCY = 3;


/*
   ПРОЗРАЧНОСТЬ РАДАРА.

   Здесь можно менять:
   0.50 = сильнее прозрачный
   0.58 = текущий вариант
   0.65 = плотнее
*/

const RADAR_OPACITY = 0.58;


/* =========================================================
   MAP
========================================================= */

const map =
    L.map(
        "map",
        {
            zoomControl: true,
            attributionControl: true,
            preferCanvas: true
        }
    ).setView(
        [54.74, 55.97],
        6
    );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            "© OpenStreetMap contributors"
    }
).addTo(map);


/* =========================================================
   DOM
========================================================= */

const statusEl =
    document.getElementById(
        "status"
    );

const timeSlider =
    document.getElementById(
        "timeSlider"
    );

const timeLabel =
    document.getElementById(
        "timeLabel"
    );

const pixelInfo =
    document.getElementById(
        "pixelInfo"
    );

const reflectivityToggle =
    document.getElementById(
        "reflectivityToggle"
    );

const vectorToggle =
    document.getElementById(
        "vectorToggle"
    );

const radarPanel =
    document.getElementById(
        "radarPanel"
    );

const searchBox =
    document.getElementById(
        "searchBox"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const searchResults =
    document.getElementById(
        "searchResults"
    );


/* =========================================================
   STATE
========================================================= */

let times = [];

let currentIndex = -1;

let currentTime = null;

let radarOverlay = null;

let playing = false;

let playTimer = null;

let capabilitiesText = "";


/*
   PNG cache
*/

const imageCache =
    new Map();


/*
   Уже загружающиеся PNG
*/

const imageLoading =
    new Map();


/*
   Векторный cache
*/

const vectorCache =
    new Map();


/*
   Защита от старых запросов.
*/

let selectionRequestId = 0;


/*
   Слой векторов
*/

const vectorLayer =
    L.layerGroup().addTo(map);


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusEl.textContent =
        text;

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(date) {

    if (!date)
        return "—";

    return date.toLocaleString(
        "ru-RU",
        {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   ISO
========================================================= */

function isoTime(date) {

    return date.toISOString();

}


/* =========================================================
   WMS REQUEST
========================================================= */

function getRadarRequest(time) {

    const bounds =
        map.getBounds();

    const size =
        map.getSize();


    const west =
        bounds.getWest();

    const south =
        bounds.getSouth();

    const east =
        bounds.getEast();

    const north =
        bounds.getNorth();


    const width =
        Math.max(
            256,
            Math.round(size.x)
        );

    const height =
        Math.max(
            256,
            Math.round(size.y)
        );


    const params =
        new URLSearchParams({

            SERVICE:
                "WMS",

            VERSION:
                "1.1.1",

            REQUEST:
                "GetMap",

            LAYERS:
                TARGET_LAYER,

            STYLES:
                "",

            FORMAT:
                "image/png",

            TRANSPARENT:
                "TRUE",

            SRS:
                "EPSG:4326",

            BBOX:
                `${west},${south},${east},${north}`,

            WIDTH:
                width,

            HEIGHT:
                height,

            TIME:
                isoTime(time)

        });


    return (
        WMS_URL +
        "?" +
        params.toString()
    );

}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImageCached(time) {

    const key =
        isoTime(time);


    /*
       Уже есть в cache.
    */

    if (
        imageCache.has(key)
    ) {

        return Promise.resolve(
            imageCache.get(key)
        );

    }


    /*
       Уже загружается.
    */

    if (
        imageLoading.has(key)
    ) {

        return imageLoading.get(key);

    }


    const promise =
        new Promise(
            (resolve, reject) => {

                const img =
                    new Image();

                img.crossOrigin =
                    "anonymous";

                img.decoding =
                    "async";


                img.onload =
                    () => {

                        imageCache.set(
                            key,
                            img
                        );

                        imageLoading.delete(
                            key
                        );

                        resolve(
                            img
                        );

                    };


                img.onerror =
                    () => {

                        imageLoading.delete(
                            key
                        );

                        reject(
                            new Error(
                                "Radar image failed"
                            )
                        );

                    };


                img.src =
                    getRadarRequest(
                        time
                    );

            }
        );


    imageLoading.set(
        key,
        promise
    );


    return promise;

}


/* =========================================================
   APPLY RADAR IMAGE
========================================================= */

/*
   КЛЮЧЕВАЯ ЧАСТЬ.

   Старый слой НЕ удаляется,
   пока новый реально не появился.

   Новый слой получает те же географические
   bounds, что и запрос WMS.

   Leaflet после этого сам масштабирует
   его при zoom/pan.
*/

function applyRadarImage(
    img,
    time
) {

    if (!img)
        return;


    const bounds =
        map.getBounds();


    const newOverlay =
        L.imageOverlay(
            img.src,
            bounds,
            {
                opacity:
                    RADAR_OPACITY,

                interactive:
                    false,

                className:
                    "gptrad-radar"
            }
        );


    /*
       Сохраняем старый слой.
    */

    const oldOverlay =
        radarOverlay;


    /*
       Ставим новый поверх старого.
    */

    newOverlay.addTo(map);


    /*
       Применяем opacity после создания.
    */

    newOverlay.setOpacity(
        reflectivityToggle.checked
            ? RADAR_OPACITY
            : 0
    );


    /*
       Новый слой теперь основной.
    */

    radarOverlay =
        newOverlay;


    /*
       Старый удаляем только после
       того, как браузер получил шанс
       отрисовать новый.
    */

    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    if (
                        oldOverlay &&
                        oldOverlay !==
                        radarOverlay
                    ) {

                        map.removeLayer(
                            oldOverlay
                        );

                    }

                }
            );

        }
    );

}


/* =========================================================
   CHECK TIME
========================================================= */

function isUsableTime(date) {

    return (
        date.getTime() <=
        Date.now() + 30 * 1000
    );

}


/* =========================================================
   CANDIDATE TIMES
========================================================= */

function getCandidateTimes(time) {

    const candidates = [];

    const index =
        times.findIndex(
            t =>
                t.getTime() ===
                time.getTime()
        );


    if (index >= 0) {

        candidates.push(
            times[index]
        );


        for (
            let i = index - 1;

            i >= 0 &&
            candidates.length < 8;

            i--
        ) {

            candidates.push(
                times[i]
            );

        }

    } else {

        candidates.push(
            time
        );

    }


    return candidates;

}


/* =========================================================
   SELECT TIME
========================================================= */

async function selectTime(
    time,
    fromMapMove = false,
    updateSlider = true
) {

    if (!time)
        return;


    /*
       Каждый новый выбор получает
       собственный ID.

       Если пользователь быстро
       нажал несколько кадров,
       старый запрос больше не сможет
       перерисовать карту.
    */

    const requestId =
        ++selectionRequestId;


    const index =
        times.findIndex(
            t =>
                t.getTime() ===
                time.getTime()
        );


    if (index >= 0) {

        currentIndex =
            index;

        currentTime =
            times[index];


        if (updateSlider) {

            timeSlider.value =
                String(index);

        }

    } else {

        currentTime =
            time;

    }


    timeLabel.textContent =
        formatTime(time);


    setStatus(
        "Загрузка радара…"
    );


    try {

        /*
           Сначала полностью загружаем PNG.
        */

        const img =
            await loadImageCached(
                time
            );


        /*
           Если за это время пользователь
           выбрал другой кадр — ничего
           не меняем.
        */

        if (
            requestId !==
            selectionRequestId
        ) {

            return;

        }


        /*
           Новый кадр ставится только
           после полной загрузки.
        */

        applyRadarImage(
            img,
            time
        );


        /*
           Векторы.
        */

        if (
            vectorToggle.checked
        ) {

            loadVectors(
                time
            );

        }


        setStatus(
            "Радар: " +
            formatTime(time)
        );


    } catch (error) {

        console.error(
            error
        );


        /*
           Старый кадр остаётся.
        */

        setStatus(
            "Не удалось загрузить кадр"
        );

    }

}


/* =========================================================
   CAPABILITIES
========================================================= */

async function loadCapabilities() {

    setStatus(
        "Получение времён радара…"
    );


    try {

        const response =
            await fetch(
                WMS_URL +
                "?SERVICE=WMS" +
                "&VERSION=1.1.1" +
                "&REQUEST=GetCapabilities"
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        capabilitiesText =
            await response.text();


        parseCapabilities(
            capabilitiesText
        );


    } catch (error) {

        console.error(
            error
        );


        buildFallbackTimes();

    }

}


/* =========================================================
   PARSE CAPABILITIES
========================================================= */

function parseCapabilities(text) {

    const parser =
        new DOMParser();


    const xml =
        parser.parseFromString(
            text,
            "text/xml"
        );


    let target = null;


    const layers =
        Array.from(
            xml.getElementsByTagName(
                "Layer"
            )
        );


    for (
        const layer of layers
    ) {

        const names =
            Array.from(
                layer.getElementsByTagName(
                    "Name"
                )
            );


        for (
            const name of names
        ) {

            if (
                name.textContent.trim() ===
                TARGET_LAYER
            ) {

                target =
                    layer;

                break;

            }

        }


        if (target)
            break;

    }


    if (!target) {

        console.warn(
            "bufr_dbz1 not found"
        );

        buildFallbackTimes();

        return;

    }


    let values = [];


    const dimensions =
        Array.from(
            target.getElementsByTagName(
                "Dimension"
            )
        );


    const extents =
        Array.from(
            target.getElementsByTagName(
                "Extent"
            )
        );


    const allTimeNodes =
        dimensions.concat(
            extents
        );


    for (
        const node of allTimeNodes
    ) {

        const name =
            (
                node.getAttribute(
                    "name"
                ) ||
                node.getAttribute(
                    "Name"
                ) ||
                ""
            ).toLowerCase();


        if (
            name !== "time"
        )
            continue;


        const value =
            node.textContent.trim();


        values =
            values.concat(
                parseTimeDimension(
                    value
                )
            );

    }


    values =
        uniqueDates(values)
        .filter(isUsableTime)
        .sort(
            (a,b) =>
                a.getTime() -
                b.getTime()
        );


    if (
        values.length < 2
    ) {

        buildFallbackTimes();

        return;

    }


    /*
       Берём последние 32.
    */

    times =
        values.slice(
            -MAX_FRAMES
        );


    timeSlider.max =
        String(
            times.length - 1
        );


    /*
       Последний кадр.
    */

    const latest =
        times[
            times.length - 1
        ];


    currentIndex =
        times.length - 1;

    currentTime =
        latest;


    timeSlider.value =
        String(
            currentIndex
        );


    timeLabel.textContent =
        formatTime(
            latest
        );


    /*
       Показываем последний.
    */

    selectTime(
        latest,
        false,
        true
    );


    /*
       И параллельно грузим 17–32.
    */

    preloadFrames();

}


/* =========================================================
   PARSE TIME DIMENSION
========================================================= */

function parseTimeDimension(value) {

    const result = [];


    if (!value)
        return result;


    const parts =
        value.split(",");


    for (
        const partRaw of parts
    ) {

        const part =
            partRaw.trim();


        if (!part)
            continue;


        /*
           start/end/step
        */

        if (
            part.includes("/") &&
            part.split("/").length === 3
        ) {

            const pieces =
                part.split("/");


            const start =
                new Date(
                    pieces[0]
                );


            const end =
                new Date(
                    pieces[1]
                );


            const step =
                parseISO8601Duration(
                    pieces[2]
                );


            if (
                !isNaN(start) &&
                !isNaN(end) &&
                step > 0
            ) {

                for (
                    let t =
                        start.getTime();

                    t <=
                    end.getTime();

                    t += step
                ) {

                    result.push(
                        new Date(t)
                    );

                }

            }


            continue;

        }


        const date =
            new Date(part);


        if (
            !isNaN(
                date.getTime()
            )
        ) {

            result.push(
                date
            );

        }

    }


    return result;

}


/* =========================================================
   ISO DURATION
========================================================= */

function parseISO8601Duration(value) {

    const match =
        value.match(
            /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/
        );


    if (!match)
        return 0;


    const days =
        Number(
            match[1] || 0
        );


    const hours =
        Number(
            match[2] || 0
        );


    const minutes =
        Number(
            match[3] || 0
        );


    const seconds =
        Number(
            match[4] || 0
        );


    return (
        (
            days * 86400 +
            hours * 3600 +
            minutes * 60 +
            seconds
        ) *
        1000
    );

}


/* =========================================================
   UNIQUE DATES
========================================================= */

function uniqueDates(arr) {

    const map =
        new Map();


    for (
        const date of arr
    ) {

        map.set(
            date.getTime(),
            date
        );

    }


    return Array.from(
        map.values()
    );

}


/* =========================================================
   FALLBACK TIMES
========================================================= */

function buildFallbackTimes() {

    const now =
        Date.now();


    const rounded =
        Math.floor(
            now /
            FRAME_STEP
        ) *
        FRAME_STEP;


    times = [];


    for (
        let i = 0;
        i < MAX_FRAMES;
        i++
    ) {

        times.push(
            new Date(
                rounded -
                (
                    MAX_FRAMES -
                    1 -
                    i
                ) *
                FRAME_STEP
            )
        );

    }


    currentIndex =
        times.length - 1;


    currentTime =
        times[
            currentIndex
        ];


    timeSlider.max =
        String(
            times.length - 1
        );


    timeSlider.value =
        String(
            currentIndex
        );


    timeLabel.textContent =
        formatTime(
            currentTime
        );


    selectTime(
        currentTime,
        false,
        true
    );


    preloadFrames();

}


/* =========================================================
   PRELOAD 17–32
========================================================= */

async function preloadFrames() {

    if (!times.length)
        return;


    const indexes = [];


    /*
       16 = кадр №17
       31 = кадр №32
    */

    for (
        let i =
            INITIAL_PRELOAD_START;

        i <
        times.length;

        i++
    ) {

        indexes.push(i);

    }


    let pointer = 0;


    async function worker() {

        while (
            pointer <
            indexes.length
        ) {

            const index =
                indexes[
                    pointer++
                ];


            const time =
                times[index];


            try {

                await loadImageCached(
                    time
                );

            } catch (error) {

                console.warn(
                    "Preload failed:",
                    time,
                    error
                );

            }

        }

    }


    const workers = [];


    for (
        let i = 0;

        i <
        PRELOAD_CONCURRENCY;

        i++
    ) {

        workers.push(
            worker()
        );

    }


    await Promise.all(
        workers
    );

}

/* =========================================================
   VECTORS
========================================================= */

function destination(
    lon,
    lat,
    distanceKm,
    bearingDeg
) {

    const R =
        6371;


    const d =
        distanceKm / R;


    const bearing =
        bearingDeg *
        Math.PI /
        180;


    const lat1 =
        lat *
        Math.PI /
        180;


    const lon1 =
        lon *
        Math.PI /
        180;


    const lat2 =
        Math.asin(
            Math.sin(lat1) *
            Math.cos(d) +

            Math.cos(lat1) *
            Math.sin(d) *
            Math.cos(bearing)
        );


    const lon2 =
        lon1 +
        Math.atan2(

            Math.sin(bearing) *
            Math.sin(d) *
            Math.cos(lat1),

            Math.cos(d) -
            Math.sin(lat1) *
            Math.sin(lat2)

        );


    return [

        lon2 *
        180 /
        Math.PI,

        lat2 *
        180 /
        Math.PI

    ];

}


/* =========================================================
   LOAD VECTORS
========================================================= */

async function loadVectors(time) {

    const key =
        isoTime(time);


    if (
        vectorCache.has(key)
    ) {

        drawVectors(
            vectorCache.get(key)
        );

        return;

    }


    try {

        const params =
            new URLSearchParams({

                time:
                    isoTime(time),

                title:
                    TARGET_LAYER

            });


        const response =
            await fetch(
                VECTOR_URL +
                "?" +
                params.toString()
            );


        if (!response.ok) {

            throw new Error(
                "Vector HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        vectorCache.set(
            key,
            data
        );


        if (
            currentTime &&
            currentTime.getTime() ===
            time.getTime()
        ) {

            drawVectors(
                data
            );

        }

    } catch (error) {

        console.warn(
            "Vector error:",
            error
        );

    }

}


/* =========================================================
   DRAW VECTORS
========================================================= */

function drawVectors(data) {

    vectorLayer.clearLayers();


    if (
        !vectorToggle.checked
    )
        return;


    if (
        !Array.isArray(data)
    )
        return;


    for (
        const item of data
    ) {

        if (
            !Array.isArray(item) ||
            item.length < 4
        )
            continue;


        const lat =
            Number(item[0]);


        const lon =
            Number(item[1]);


        const speed =
            Number(item[2]) *
            3.6;


        const heading =
            Number(item[3]);


        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon) ||
            !Number.isFinite(speed) ||
            !Number.isFinite(heading)
        )
            continue;


        const end =
            destination(
                lon,
                lat,
                speed,
                heading
            );


        const points = [

            [lat, lon],

            [
                end[1],
                end[0]
            ]

        ];


        L.polyline(
            points,
            {
                color: "#000",
                weight: 3,
                opacity: 0.9,
                interactive: false
            }
        ).addTo(
            vectorLayer
        );


        L.polyline(
            points,
            {
                color: "#fff",
                weight: 1.5,
                opacity: 1,
                interactive: false
            }
        ).addTo(
            vectorLayer
        );

    }

}

/* =========================================================
   PERFORM SEARCH
========================================================= */

async function performSearch(query) {

    if (
        query === lastSearch
    )
        return;


    const now =
        Date.now();


    const wait =
        Math.max(
            0,
            1000 -
            (
                now -
                searchRequestTime
            )
        );


    if (wait > 0) {

        setTimeout(
            () =>
                performSearch(
                    query
                ),
            wait
        );

        return;

    }


    lastSearch =
        query;


    searchRequestTime =
        Date.now();


    searchResults.innerHTML =
        `
        <div class="search-result">
            Поиск…
        </div>
        `;


    try {

        const params =
            new URLSearchParams({

                q:
                    query,

                format:
                    "jsonv2",

                addressdetails:
                    "1",

                limit:
                    "10",

                featureType:
                    "settlement",

                "accept-language":
                    "ru"

            });


        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search?" +
                params.toString()
            );


        if (!response.ok) {

            throw new Error(
                "Search HTTP " +
                response.status
            );

        }


        const results =
            await response.json();


        const normalized =
            query.toLowerCase();


        results.sort(
            (a,b) => {

                const an =
                    (
                        a.display_name ||
                        ""
                    ).toLowerCase();


                const bn =
                    (
                        b.display_name ||
                        ""
                    ).toLowerCase();


                const as =
                    an.startsWith(
                        normalized
                    )
                        ? 0
                        : 1;


                const bs =
                    bn.startsWith(
                        normalized
                    )
                        ? 0
                        : 1;


                return as - bs;

            }
        );


        searchResults.innerHTML =
            "";


        if (
            !results.length
        ) {

            searchResults.innerHTML =
                `
                <div class="search-result">
                    Ничего не найдено
                </div>
                `;

            return;

        }


        for (
            const item of results
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "search-result";


            const main =
                item.name ||
                item.display_name ||
                "Место";


            const sub =
                item.display_name ||
                "";


            div.innerHTML =
                `
                <div class="search-main">
                    ${escapeHtml(main)}
                </div>

                <div class="search-sub">
                    ${escapeHtml(sub)}
                </div>
                `;


            div.addEventListener(
                "click",
                () => {

                    const lat =
                        Number(
                            item.lat
                        );


                    const lon =
                        Number(
                            item.lon
                        );


                    map.flyTo(
                        [lat, lon],
                        10,
                        {
                            duration: 1
                        }
                    );


                    searchBox.classList.remove(
                        "active"
                    );


                    searchInput.value =
                        "";


                    searchResults.innerHTML =
                        "";

                }
            );


            searchResults.appendChild(
                div
            );

        }

    } catch (error) {

        console.error(
            error
        );


        searchResults.innerHTML =
            `
            <div class="search-result">
                Ошибка поиска
            </div>
            `;

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   PIXEL INFO
========================================================= */

map.on(
    "click",
    async event => {

        if (
            !radarOverlay ||
            !currentTime
        )
            return;


        try {

            const img =
                imageCache.get(
                    isoTime(
                        currentTime
                    )
                );


            if (!img)
                return;


            const canvas =
                document.createElement(
                    "canvas"
                );


            const ctx =
                canvas.getContext(
                    "2d"
                );


            canvas.width =
                img.naturalWidth;


            canvas.height =
                img.naturalHeight;


            ctx.drawImage(
                img,
                0,
                0
            );


            /*
               Используем bounds,
               которые соответствуют
               текущему запросу.
            */

            const bounds =
                map.getBounds();


            const x =
                (
                    event.latlng.lng -
                    bounds.getWest()
                ) /
                (
                    bounds.getEast() -
                    bounds.getWest()
                ) *
                canvas.width;


            const y =
                (
                    bounds.getNorth() -
                    event.latlng.lat
                ) /
                (
                    bounds.getNorth() -
                    bounds.getSouth()
                ) *
                canvas.height;


            if (
                x < 0 ||
                y < 0 ||
                x >= canvas.width ||
                y >= canvas.height
            )
                return;


            const pixel =
                ctx.getImageData(
                    Math.floor(x),
                    Math.floor(y),
                    1,
                    1
                ).data;


            const alpha =
                pixel[3];


            if (
                alpha === 0
            ) {

                pixelInfo.textContent =
                    "Нет данных";

            } else {

                pixelInfo.textContent =
                    `RGB: ${pixel[0]}, ${pixel[1]}, ${pixel[2]}`;

            }


            pixelInfo.style.left =
                Math.min(
                    window.innerWidth - 150,
                    event.originalEvent.clientX + 12
                ) + "px";


            pixelInfo.style.top =
                Math.min(
                    window.innerHeight - 60,
                    event.originalEvent.clientY + 12
                ) + "px";


            pixelInfo.classList.add(
                "active"
            );


            setTimeout(
                () => {

                    pixelInfo.classList.remove(
                        "active"
                    );

                },
                2500
            );


        } catch (error) {

            console.warn(
                "Pixel info error:",
                error
            );

        }

    }
);
