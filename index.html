<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROCKET Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #e8e8e8;
    overflow: hidden;
  }

  /* ===== КАРТА — ОБЫЧНАЯ, СВЕТЛАЯ ===== */
  #map {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* ===== ЛЕГЕНДА РГМЦ ===== */
  #legend {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid #bbb;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 11px;
    font-family: "Segoe UI", Arial, sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    min-width: 140px;
  }

  #legend .title {
    font-weight: 700;
    font-size: 11px;
    margin-bottom: 6px;
    color: #222;
    border-bottom: 1px solid #ccc;
    padding-bottom: 4px;
  }

  #legend .row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 3px 0;
    line-height: 1.2;
  }

  #legend .sw {
    width: 16px;
    height: 12px;
    border: 1px solid #888;
    flex-shrink: 0;
  }

  #legend .txt {
    color: #222;
    font-size: 10px;
  }

  /* ===== ТАЙМЛАЙН ===== */
  #timeline {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid #bbb;
    border-radius: 4px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    width: min(520px, calc(100% - 24px));
  }

  #timeline button {
    width: 30px;
    height: 30px;
    border: 1px solid #aaa;
    border-radius: 3px;
    background: #f5f5f5;
    color: #333;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  #timeline button:hover { background: #e0e0e0; }
  #timeline button:active { background: #ccc; }

  #slider {
    flex: 1;
    accent-color: #2980b9;
    cursor: pointer;
    min-width: 0;
  }

  #ts-label {
    font-size: 10px;
    color: #555;
    min-width: 40px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ===== СТАТУС ===== */
  #status {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid #bbb;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 10px;
    color: #555;
    font-family: monospace;
  }

  /* ===== КООРДИНАТЫ ===== */
  #coords {
    position: absolute;
    bottom: 16px;
    right: 12px;
    z-index: 1000;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid #bbb;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 10px;
    color: #555;
    font-family: monospace;
    line-height: 1.4;
  }

  /* ===== АДАПТИВ ===== */
  @media (max-width: 500px) {
    #legend {
      padding: 6px 8px;
      min-width: 120px;
      font-size: 10px;
    }
    #legend .sw { width: 14px; height: 10px; }
    #legend .txt { font-size: 9px; }

    #timeline {
      padding: 6px 8px;
      gap: 5px;
      bottom: 10px;
    }
    #timeline button { width: 28px; height: 28px; font-size: 11px; }
    #slider { min-width: 60px; }

    #coords { display: none; }
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- ЛЕГЕНДА РГМЦ (градации из документации ГИМЕТ-2010) -->
<div id="legend">
  <div class="title">Интенсивность осадков (мм/ч)</div>
  <div class="row">
    <span class="sw" style="background:#ADD8E6"></span>
    <span class="txt">слабые (0.03–0.2)</span>
  </div>
  <div class="row">
    <span class="sw" style="background:#90EE90"></span>
    <span class="txt">умеренные (0.2–0.5)</span>
  </div>
  <div class="row">
    <span class="sw" style="background:#FFD700"></span>
    <span class="txt">сильные (&gt;0.5)</span>
  </div>
  <div class="row">
    <span class="sw" style="background:#FF8C00"></span>
    <span class="txt">ливень слабый (1–3.6)</span>
  </div>
  <div class="row">
    <span class="sw" style="background:#FF4500"></span>
    <span class="txt">ливень умеренный (3.6–10)</span>
  </div>
  <div class="row">
    <span class="sw" style="background:#DC143C"></span>
    <span class="txt">ливень сильный (&gt;10)</span>
  </div>
  <div class="row">
    <span class="sw" style="background:#8B0000"></span>
    <span class="txt">гроза / град</span>
  </div>
</div>

<div id="status">загрузка...</div>
<div id="coords">—</div>

<div id="timeline">
  <button id="playBtn" title="Воспроизведение">▶</button>
  <button id="prevBtn" title="Назад">◀</button>
  <input type="range" id="slider" min="0" max="0" value="0">
  <button id="nextBtn" title="Вперёд">▶</button>
  <span id="ts-label">--:--</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ===== НАСТРОЙКИ =====
const API_BASE = "";
const REFRESH_MS = 600000;       // 10 минут
const PLAY_MS = 500;             // скорость анимации
const MAP_BOUNDS = [[41.0, 19.0], [82.0, 190.0]];  // границы радарного слоя (подстрой при необходимости)

// ===== СОСТОЯНИЕ =====
let map, radarLayer;
let frames = [];
let idx = 0;
let playing = false;
let playTimer = null;

// ===== КАРТА =====
function initMap() {
  // Обычная Leaflet-карта, светлые OSM-тайлы
  map = L.map("map", {
    zoomControl: true,
    attributionControl: true,
  }).setView([58, 50], 5);

  // Стандартные OSM-тайлы (без CartoDB)
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 10,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  radarLayer = L.layerGroup().addTo(map);

  // Координаты под курсором
  map.on("mousemove", (e) => {
    document.getElementById("coords").textContent =
      `${e.latlng.lat.toFixed(2)}°N  ${e.latlng.lng.toFixed(2)}°E`;
  });

  map.on("mouseout", () => {
    document.getElementById("coords").textContent = "—";
  });
}

// ===== ЗАГРУЗКА КАДРОВ =====
async function loadFrames() {
  const statusEl = document.getElementById("status");
  try {
    const r = await fetch(`${API_BASE}/api/frames`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();

    frames = data.frames || [];
    if (!frames.length) {
      statusEl.textContent = "нет кадров";
      return;
    }

    statusEl.textContent = `${frames.length} кадров`;

    const slider = document.getElementById("slider");
    slider.max = frames.length - 1;
    idx = frames.length - 1;
    slider.value = idx;

    render();
    updateLabel();
  } catch (e) {
    statusEl.textContent = "ошибка";
    console.error(e);
  }
}

// ===== ОТРИСОВКА КАДРА =====
function render() {
  if (!frames.length) return;
  radarLayer.clearLayers();

  const f = frames[idx];
  L.imageOverlay(f.url, MAP_BOUNDS, {
    opacity: 0.85,
    interactive: false,
  }).addTo(radarLayer);
}

// ===== МЕТКА ВРЕМЕНИ =====
function updateLabel() {
  if (!frames.length) return;
  const name = frames[idx].name;
  const ts = parseInt(name.split("_")[0]);
  if (isNaN(ts)) return;

  const d = new Date(ts * 1000);
  document.getElementById("ts-label").textContent =
    `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

// ===== ПЕРЕКЛЮЧЕНИЕ =====
function goTo(i) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, i));
  document.getElementById("slider").value = idx;
  render();
  updateLabel();
}

function togglePlay() {
  playing = !playing;
  document.getElementById("playBtn").textContent = playing ? "❚❚" : "▶";
  if (playing) {
    playTimer = setInterval(() => {
      goTo(idx + 1 >= frames.length ? 0 : idx + 1);
    }, PLAY_MS);
  } else {
    clearInterval(playTimer);
  }
}

// ===== СОБЫТИЯ =====
document.getElementById("playBtn").onclick = togglePlay;
document.getElementById("prevBtn").onclick = () => goTo(idx - 1);
document.getElementById("nextBtn").onclick = () => goTo(idx + 1);
document.getElementById("slider").oninput = (e) => goTo(parseInt(e.target.value));

// Клавиатура
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft")  goTo(idx - 1);
  if (e.key === "ArrowRight") goTo(idx + 1);
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
});

// ===== СТАРТ =====
initMap();
loadFrames();
setInterval(loadFrames, REFRESH_MS);
</script>
</body>
</html>
