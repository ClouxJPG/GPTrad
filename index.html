<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>GPTrad</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --ui-bg:rgba(255,255,255,.95);
  --ui-bg-solid:#ffffff;
  --ui-text:#111111;
  --ui-border:#d5d5d5;
  --ui-button:#eeeeee;
  --ui-button-active:#dddddd;
  --ui-shadow:rgba(0,0,0,.20);
  --accent:#1976d2;
}

*{
  box-sizing:border-box;
}

html,
body,
#map{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#dfe8ef;
}

#map{
  background:#dfe8ef;
}

/* =====================================================
   TOP
===================================================== */

.top{
  position:absolute;
  z-index:1000;
  top:10px;
  left:50%;
  transform:translateX(-50%);

  background:var(--ui-bg);

  border-radius:12px;
  padding:8px 10px;

  display:flex;
  align-items:center;
  gap:8px;

  box-shadow:0 2px 10px var(--ui-shadow);
}

.logo{
  color:var(--ui-text);
  font-weight:700;
  font-size:16px;
  margin-right:4px;
}

select{
  border:1px solid var(--ui-border);
  border-radius:8px;
  padding:6px 8px;

  background:var(--ui-bg-solid);
  color:var(--ui-text);

  outline:none;
}

button{
  border:0;
  background:var(--ui-button);
  color:var(--ui-text);

  border-radius:8px;

  width:34px;
  height:34px;

  font-size:18px;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

button:active{
  background:var(--ui-button-active);
}

/* =====================================================
   STATUS
===================================================== */

#status{
  position:absolute;
  z-index:1000;

  top:65px;
  left:50%;

  transform:translateX(-50%);

  background:var(--ui-bg);
  color:var(--ui-text);

  padding:5px 10px;

  border-radius:8px;

  font-size:12px;

  box-shadow:0 2px 8px var(--ui-shadow);

  white-space:nowrap;
}

/* =====================================================
   TIMELINE
===================================================== */

.timeline{
  position:absolute;
  z-index:1000;

  bottom:12px;
  left:50%;

  transform:translateX(-50%);

  width:min(92%,700px);

  background:var(--ui-bg);

  border-radius:12px;

  padding:8px 10px;

  box-shadow:0 2px 10px var(--ui-shadow);

  display:flex;
  align-items:center;

  gap:8px;
}

.timeline button{
  flex:none;
}

#time{
  flex:1;
  min-width:0;
}

/* =====================================================
   SETTINGS BUTTON
===================================================== */

#settingsButton{
  font-size:18px;
}

/* =====================================================
   SETTINGS PANEL
===================================================== */

#settingsPanel{
  position:absolute;

  z-index:2000;

  top:58px;
  right:10px;

  width:230px;

  background:var(--ui-bg-solid);
  color:var(--ui-text);

  border:1px solid var(--ui-border);

  border-radius:14px;

  padding:12px;

  box-shadow:0 5px 25px rgba(0,0,0,.25);

  display:none;
}

#settingsPanel.open{
  display:block;
}

.settingsTitle{
  font-size:15px;
  font-weight:700;

  margin-bottom:10px;
}

.settingsLabel{
  font-size:12px;
  opacity:.7;

  margin-bottom:7px;
}

.themeList{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.themeButton{
  width:100%;
  height:38px;

  display:flex;
  align-items:center;

  justify-content:flex-start;

  padding:0 10px;

  font-size:14px;

  background:var(--ui-button);
}

.themeButton.selected{
  outline:2px solid var(--accent);
}

/* =====================================================
   DARK THEME
===================================================== */

body.theme-dark{
  --ui-bg:rgba(30,30,30,.94);
  --ui-bg-solid:#202020;
  --ui-text:#f2f2f2;
  --ui-border:#444;
  --ui-button:#333;
  --ui-button-active:#444;
  --ui-shadow:rgba(0,0,0,.45);
  --accent:#5fa8ff;
}

/* =====================================================
   GREEN THEME
===================================================== */

body.theme-green{
  --ui-bg:rgba(235,248,238,.96);
  --ui-bg-solid:#effaf1;
  --ui-text:#173b24;
  --ui-border:#9ac5a5;
  --ui-button:#d9efdf;
  --ui-button-active:#c5e4cc;
  --ui-shadow:rgba(25,70,35,.22);
  --accent:#248a45;
}

/* =====================================================
   LEAFLET
===================================================== */

.leaflet-container{
  background:#dfe8ef;
}

.leaflet-control-zoom a{
  -webkit-tap-highlight-color:transparent;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top">

  <div class="logo">
    GPTrad
  </div>

  <select id="layer">
    <option value="radar">
      Радар (RainViewer)
    </option>

    <option value="warnings">
      Опасные явления
    </option>
  </select>

  <button id="locate">
    ⌖
  </button>

  <button id="reload">
    ↻
  </button>

  <button id="settingsButton">
    ⚙
  </button>

</div>

<div id="status">
  Загрузка…
</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div id="settingsPanel">

  <div class="settingsTitle">
    Настройки
  </div>

  <div class="settingsLabel">
    Цветовая схема
  </div>

  <div class="themeList">

    <button class="themeButton"
            data-theme="light">
      Светлая
    </button>

    <button class="themeButton"
            data-theme="dark">
      Тёмная
    </button>

    <button class="themeButton"
            data-theme="green">
      Зелёная
    </button>

  </div>

</div>


<!-- =====================================================
     TIMELINE
===================================================== -->

<div class="timeline">

  <button id="back">
    ◀
  </button>

  <button id="play">
    ▶
  </button>

  <button id="forward">
    ▶
  </button>

  <input id="time"
         type="range"
         min="0"
         max="0"
         value="0">

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
   SETTINGS
===================================================== */

const settingsButton =
  document.getElementById("settingsButton");

const settingsPanel =
  document.getElementById("settingsPanel");

const themeButtons =
  document.querySelectorAll(".themeButton");


settingsButton.addEventListener(
  "click",
  function(){

    settingsPanel.classList.toggle("open");

  }
);


/* Закрываем настройки при клике вне панели */

document.addEventListener(
  "click",
  function(event){

    if(
      !settingsPanel.contains(event.target) &&
      event.target !== settingsButton
    ){

      settingsPanel.classList.remove("open");

    }

  }
);


/* =====================================================
   THEME
===================================================== */

function applyTheme(theme){

  document.body.classList.remove(
    "theme-dark",
    "theme-green"
  );

  if(theme === "dark"){

    document.body.classList.add(
      "theme-dark"
    );

  }

  if(theme === "green"){

    document.body.classList.add(
      "theme-green"
    );

  }

  localStorage.setItem(
    "gptrad-theme",
    theme
  );

  themeButtons.forEach(
    button => {

      button.classList.toggle(
        "selected",
        button.dataset.theme === theme
      );

    }
  );

}


/* Загружаем сохранённую тему */

const savedTheme =
  localStorage.getItem("gptrad-theme") ||
  "light";

applyTheme(savedTheme);


themeButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      function(){

        applyTheme(
          button.dataset.theme
        );

      }
    );

  }
);


/* =====================================================
   MAP
===================================================== */

/*
  Здесь основные исправления дёрганности.

  zoomSnap: 0
  ----------------
  Leaflet больше не будет насильно
  округлять pinch zoom до целого уровня.

  zoomDelta: 0.5
  ----------------
  Кнопки меняют масштаб мягче.

  zoomAnimation:false
  ----------------
  Убираем скачивающую анимацию.

  fadeAnimation:false
  ----------------
  Убираем fade тайлов.

  wheelDebounceTime:20
  ----------------
  Карта быстрее реагирует на колесо.

  wheelPxPerZoomLevel:80
  ----------------
  Более контролируемый масштаб.

  maxZoom:19
  ----------------
  Не даём OSM уйти в бессмысленный
  сверхзум.
*/

const map =
  L.map("map", {

    zoomControl:true,
    attributionControl:true,

    zoomSnap:0,
    zoomDelta:0.5,

    zoomAnimation:false,
    fadeAnimation:false,
    markerZoomAnimation:false,

    zoomAnimationThreshold:0,

    touchZoom:true,
    scrollWheelZoom:true,

    wheelDebounceTime:20,
    wheelPxPerZoomLevel:80,

    doubleClickZoom:true,

    dragging:true,

    inertia:true,
    inertiaDeceleration:3000,
    easeLinearity:0.2,

    minZoom:2,
    maxZoom:19

  });


/* =====================================================
   OSM
===================================================== */

const osm =
  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

      minZoom:2,
      maxZoom:19,

      tileSize:256,

      updateWhenIdle:true,
      updateWhenZooming:false,

      keepBuffer:3,

      attribution:
        "© OpenStreetMap"

    }
  );

osm.addTo(map);


/* =====================================================
   INITIAL VIEW
===================================================== */

map.setView(
  [54.7,55.99],
  6,
  {
    animate:false
  }
);


/* =====================================================
   ELEMENTS
===================================================== */

const layerSelect =
  document.getElementById("layer");

const statusEl =
  document.getElementById("status");

const timeSlider =
  document.getElementById("time");

const playBtn =
  document.getElementById("play");

const backBtn =
  document.getElementById("back");

const forwardBtn =
  document.getElementById("forward");

const reloadBtn =
  document.getElementById("reload");

const locateBtn =
  document.getElementById("locate");


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

  statusEl.textContent =
    text;

}


/* =====================================================
   RAINVIEWER
===================================================== */

const RV_API =
  "https://api.rainviewer.com/public/weather-maps.json";

let radarFrames = [];

let radarIndex = 0;

let radarLayer = null;

let radarPendingLayer = null;

let radarSwitchId = 0;


/* =====================================================
   RAINVIEWER LOAD
===================================================== */

async function loadRainViewer(){

  try{

    setStatus(
      "Загрузка радара…"
    );

    const response =
      await fetch(
        RV_API +
        "?_=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "RainViewer HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    const frames = [];


    if(
      data.radar &&
      Array.isArray(
        data.radar.past
      )
    ){

      frames.push(
        ...data.radar.past
      );

    }


    /*
      Если nowcast существует —
      добавляем его.

      Если API его не отдаёт,
      просто продолжаем с past.
    */

    if(
      data.radar &&
      Array.isArray(
        data.radar.nowcast
      )
    ){

      frames.push(
        ...data.radar.nowcast
      );

    }


    radarFrames =
      frames
        .filter(
          frame =>
            frame &&
            typeof frame.time ===
              "number" &&
            frame.path
        )
        .sort(
          (a,b) =>
            a.time - b.time
        );


    if(
      !radarFrames.length
    ){

      throw new Error(
        "Нет кадров радара"
      );

    }


    radarIndex =
      radarFrames.length - 1;


    timeSlider.min =
      0;

    timeSlider.max =
      radarFrames.length - 1;

    timeSlider.value =
      radarIndex;


    await showRadarFrame(
      radarIndex
    );

    updateStatus();


  }catch(error){

    console.error(
      "RainViewer:",
      error
    );

    setStatus(
      "Ошибка загрузки радара"
    );

  }

}


/* =====================================================
   RAINVIEWER LAYER
===================================================== */

function createRadarLayer(frame){

  const url =
    "https://tilecache.rainviewer.com" +
    frame.path +
    "/256/{z}/{x}/{y}/2/1_1.png";


  return L.tileLayer(
    url,
    {

      tileSize:256,

      opacity:1,

      minZoom:2,
      maxZoom:18,

      zIndex:10,

      /*
        Очень важно:
        не заставляем Leaflet постоянно
        перестраивать слой во время zoom.
      */

      updateWhenIdle:true,
      updateWhenZooming:false,

      keepBuffer:3

    }
  );

}


/* =====================================================
   WAIT FOR LAYER
===================================================== */

function waitForLayer(layer){

  return new Promise(
    resolve => {

      let finished = false;


      function finish(){

        if(finished)
          return;

        finished = true;

        layer.off(
          "load",
          finish
        );

        resolve();

      }


      layer.once(
        "load",
        finish
      );


      /*
        Защита от зависшего тайла.
      */

      setTimeout(
        finish,
        8000
      );

    }
  );

}


/* =====================================================
   SHOW RADAR FRAME
===================================================== */

async function showRadarFrame(index){

  if(!radarFrames[index])
    return;


  const frame =
    radarFrames[index];


  const requestId =
    ++radarSwitchId;


  /*
    Удаляем старый pending,
    если пользователь быстро
    двигает ползунок.
  */

  if(radarPendingLayer){

    try{

      map.removeLayer(
        radarPendingLayer
      );

    }catch(e){}

    radarPendingLayer =
      null;

  }


  const next =
    createRadarLayer(
      frame
    );


  radarPendingLayer =
    next;


  /*
    НОВЫЙ СЛОЙ СРАЗУ НЕПРОЗРАЧНЫЙ.

    Старый остаётся снизу.
  */

  next.addTo(map);


  await waitForLayer(
    next
  );


  /*
    Пользователь уже мог выбрать
    другой кадр.
  */

  if(
    requestId !==
    radarSwitchId
  ){

    try{

      map.removeLayer(
        next
      );

    }catch(e){}

    return;

  }


  const old =
    radarLayer;


  radarLayer =
    next;


  radarPendingLayer =
    null;


  if(
    old &&
    old !== next
  ){

    try{

      map.removeLayer(
        old
      );

    }catch(e){}

  }

}


/* =====================================================
   OЯ WMS
===================================================== */

const OYA_WMS =
  "https://www.nowcast.ru/baltrad_wsgi";


const OYA_LAYERS =
  "bufr_phenomena," +
  "bufr_novosib_phenomena," +
  "bufr_vlad_phenomena";


const OYA_CAPABILITIES =
  OYA_WMS +
  "?SERVICE=WMS" +
  "&VERSION=1.1.1" +
  "&REQUEST=GetCapabilities";


let oyaTimes = [];

let oyaLayer = null;

let oyaPendingLayer = null;

let oyaSwitchId = 0;


/* =====================================================
   OЯ LAYER
===================================================== */

function createOyaLayer(time){

  const params = {

    layers:OYA_LAYERS,

    format:"image/png",

    transparent:true,

    version:"1.1.1",

    styles:"",

    opacity:1,

    zIndex:30

  };


  if(time){

    params.time =
      time;

  }


  return L.tileLayer.wms(
    OYA_WMS,
    params
  );

}


/* =====================================================
   OЯ FALLBACK
===================================================== */

async function showOyaLatest(){

  const id =
    ++oyaSwitchId;


  if(oyaPendingLayer){

    try{

      map.removeLayer(
        oyaPendingLayer
      );

    }catch(e){}

  }


  const next =
    createOyaLayer();


  oyaPendingLayer =
    next;


  next.addTo(map);


  await waitForLayer(
    next
  );


  if(
    id !==
    oyaSwitchId
  ){

    try{

      map.removeLayer(
        next
      );

    }catch(e){}

    return;

  }


  const old =
    oyaLayer;


  oyaLayer =
    next;

  oyaPendingLayer =
    null;


  if(old){

    try{

      map.removeLayer(
        old
      );

    }catch(e){}

  }


  setStatus(
    "ОЯ"
  );

}


/* =====================================================
   GETCAPABILITIES
===================================================== */

async function loadOyaTimes(){

  try{

    const response =
      await fetch(
        OYA_CAPABILITIES +
        "&_=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "WMS HTTP " +
        response.status
      );

    }


    const text =
      await response.text();


    const xml =
      new DOMParser()
        .parseFromString(
          text,
          "text/xml"
        );


    const layers =
      Array.from(
        xml.getElementsByTagNameNS(
          "*",
          "Layer"
        )
      );


    let target =
      null;


    for(
      const layer
      of layers
    ){

      const children =
        Array.from(
          layer.children
        );


      const name =
        children.find(
          child =>
            child.localName ===
            "Name"
        );


      if(
        name &&
        name.textContent.trim() ===
        "bufr_phenomena"
      ){

        target =
          layer;

        break;

      }

    }


    if(!target){

      throw new Error(
        "bufr_phenomena отсутствует"
      );

    }


    const extent =
      Array.from(
        target.children
      ).find(
        child =>
          child.localName ===
          "Extent"
      );


    if(!extent){

      throw new Error(
        "Extent времени отсутствует"
      );

    }


    const raw =
      extent.textContent.trim();


    oyaTimes =
      raw
        .split(",")
        .map(
          x => x.trim()
        )
        .filter(
          x =>
            Number.isFinite(
              Date.parse(x)
            )
        )
        .map(
          x => ({
            iso:x,
            ms:Date.parse(x)
          })
        )
        .sort(
          (a,b) =>
            a.ms - b.ms
        );


    /*
      Убираем дубли.
    */

    const seen =
      new Set();


    oyaTimes =
      oyaTimes.filter(
        item => {

          if(
            seen.has(
              item.ms
            )
          ){

            return false;

          }

          seen.add(
            item.ms
          );

          return true;

        }
      );


    console.log(
      "OЯ frames:",
      oyaTimes
    );


    if(
      !oyaTimes.length
    ){

      throw new Error(
        "Времена ОЯ отсутствуют"
      );

    }


    if(
      layerSelect.value ===
      "warnings"
    ){

      await showOyaForRadarTime(
        radarFrames[
          radarIndex
        ]?.time
      );

    }


  }catch(error){

    console.error(
      "OЯ:",
      error
    );


    /*
      Даже если GetCapabilities
      заблокирован CORS,
      пытаемся показать
      текущий WMS слой.
    */

    oyaTimes = [];


    if(
      layerSelect.value ===
      "warnings"
    ){

      await showOyaLatest();

    }

  }

}


/* =====================================================
   NEAREST OЯ TIME
===================================================== */

function nearestOyaTime(
  unixSeconds
){

  if(
    !oyaTimes.length
  )
    return null;


  const target =
    Number(unixSeconds) *
    1000;


  let best =
    oyaTimes[0];


  let distance =
    Math.abs(
      best.ms -
      target
    );


  for(
    let i=1;
    i<oyaTimes.length;
    i++
  ){

    const current =
      Math.abs(
        oyaTimes[i].ms -
        target
      );


    if(
      current <
      distance
    ){

      distance =
        current;

      best =
        oyaTimes[i];

    }

  }


  return best;

}


/* =====================================================
   SHOW OЯ TIME
===================================================== */

async function showOyaTime(
  time
){

  const id =
    ++oyaSwitchId;


  if(oyaPendingLayer){

    try{

      map.removeLayer(
        oyaPendingLayer
      );

    }catch(e){}

  }


  const next =
    createOyaLayer(
      time
    );


  oyaPendingLayer =
    next;


  next.addTo(map);


  await waitForLayer(
    next
  );


  if(
    id !==
    oyaSwitchId
  ){

    try{

      map.removeLayer(
        next
      );

    }catch(e){}

    return;

  }


  const old =
    oyaLayer;


  oyaLayer =
    next;

  oyaPendingLayer =
    null;


  if(old){

    try{

      map.removeLayer(
        old
      );

    }catch(e){}

  }


  setStatus(
    "ОЯ: " +
    new Date(
      Date.parse(time)
    ).toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    )
  );

}


/* =====================================================
   SHOW OЯ FOR RADAR TIME
===================================================== */

async function showOyaForRadarTime(
  unixSeconds
){

  if(
    !oyaTimes.length
  ){

    await loadOyaTimes();

    if(
      !oyaTimes.length
    ){

      await showOyaLatest();

      return;

    }

  }


  const nearest =
    nearestOyaTime(
      unixSeconds
    );


  if(!nearest){

    await showOyaLatest();

    return;

  }


  await showOyaTime(
    nearest.iso
  );

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(){

  const frame =
    radarFrames[
      radarIndex
    ];


  if(!frame)
    return;


  const date =
    new Date(
      frame.time * 1000
    );


  if(
    layerSelect.value ===
    "radar"
  ){

    setStatus(
      "Радар: " +
      date.toLocaleTimeString(
        "ru-RU",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )
    );

  }else{

    const nearest =
      nearestOyaTime(
        frame.time
      );


    if(nearest){

      setStatus(
        "ОЯ: " +
        new Date(
          nearest.ms
        ).toLocaleTimeString(
          "ru-RU",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        )
      );

    }else{

      setStatus(
        "ОЯ"
      );

    }

  }

}


/* =====================================================
   SLIDER
===================================================== */

timeSlider.addEventListener(
  "input",
  async function(){

    radarIndex =
      Number(
        timeSlider.value
      );


    updateStatus();


    if(
      layerSelect.value ===
      "radar"
    ){

      await showRadarFrame(
        radarIndex
      );

    }else{

      await showOyaForRadarTime(
        radarFrames[
          radarIndex
        ]?.time
      );

    }

  }
);


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  async function(){

    if(
      !radarFrames.length
    )
      return;


    radarIndex =
      Math.max(
        0,
        radarIndex - 1
      );


    timeSlider.value =
      radarIndex;


    updateStatus();


    if(
      layerSelect.value ===
      "radar"
    ){

      await showRadarFrame(
        radarIndex
      );

    }else{

      await showOyaForRadarTime(
        radarFrames[
          radarIndex
        ]?.time
      );

    }

  }
);


/* =====================================================
   FORWARD
===================================================== */

forwardBtn.addEventListener(
  "click",
  async function(){

    if(
      !radarFrames.length
    )
      return;


    radarIndex =
      Math.min(
        radarFrames.length - 1,
        radarIndex + 1
      );


    timeSlider.value =
      radarIndex;


    updateStatus();


    if(
      layerSelect.value ===
      "radar"
    ){

      await showRadarFrame(
        radarIndex
      );

    }else{

      await showOyaForRadarTime(
        radarFrames[
          radarIndex
        ]?.time
      );

    }

  }
);


/* =====================================================
   PLAY
===================================================== */

let playing =
  false;

let playTimer =
  null;


playBtn.addEventListener(
  "click",
  function(){

    if(
      !radarFrames.length
    )
      return;


    playing =
      !playing;


    playBtn.textContent =
      playing
      ? "❚❚"
      : "▶";


    if(!playing){

      clearInterval(
        playTimer
      );

      playTimer =
        null;

      return;

    }


    playTimer =
      setInterval(
        async function(){

          if(!playing)
            return;


          radarIndex++;


          if(
            radarIndex >=
            radarFrames.length
          ){

            radarIndex =
              0;

          }


          timeSlider.value =
            radarIndex;


          updateStatus();


          if(
            layerSelect.value ===
            "radar"
          ){

            await showRadarFrame(
              radarIndex
            );

          }else{

            await showOyaForRadarTime(
              radarFrames[
                radarIndex
              ]?.time
            );

          }

        },
        700
      );

  }
);


/* =====================================================
   LAYER SWITCH
===================================================== */

layerSelect.addEventListener(
  "change",
  async function(){

    if(
      layerSelect.value ===
      "radar"
    ){

      ++oyaSwitchId;


      if(oyaPendingLayer){

        try{

          map.removeLayer(
            oyaPendingLayer
          );

        }catch(e){}

      }


      if(oyaLayer){

        try{

          map.removeLayer(
            oyaLayer
          );

        }catch(e){}

      }


      if(radarLayer){

        radarLayer.addTo(
          map
        );

      }else{

        await showRadarFrame(
          radarIndex
        );

      }


      updateStatus();

      return;

    }


    /*
      Переход на ОЯ.
    */

    ++radarSwitchId;


    if(radarPendingLayer){

      try{

        map.removeLayer(
          radarPendingLayer
        );

      }catch(e){}

    }


    if(radarLayer){

      try{

        map.removeLayer(
          radarLayer
        );

      }catch(e){}

    }


    if(
      oyaTimes.length
    ){

      await showOyaForRadarTime(
        radarFrames[
          radarIndex
        ]?.time
      );

    }else{

      /*
        Сначала пытаемся получить
        реальные времена.
      */

      await loadOyaTimes();


      /*
        Если CORS мешает —
        showOyaLatest() уже вызывается
        внутри обработчика ошибки.
      */

    }

  }
);


/* =====================================================
   GEOLOCATION
===================================================== */

locateBtn.addEventListener(
  "click",
  function(){

    if(
      !navigator.geolocation
    ){

      setStatus(
        "Геолокация недоступна"
      );

      return;

    }


    setStatus(
      "Определяем местоположение…"
    );


    navigator.geolocation.getCurrentPosition(

      function(position){

        const lat =
          position.coords.latitude;

        const lon =
          position.coords.longitude;


        /*
          Только кнопка геолокации
          меняет view.

          Обычный zoom пользователя
          НИКОГДА не вызывает setView.
        */

        map.setView(
          [lat,lon],
          8,
          {
            animate:false
          }
        );


        setStatus(
          "Местоположение определено"
        );

      },


      function(){

        setStatus(
          "Не удалось определить местоположение"
        );

      },


      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:60000
      }

    );

  }
);


/* =====================================================
   RELOAD
===================================================== */

reloadBtn.addEventListener(
  "click",
  async function(){

    ++radarSwitchId;
    ++oyaSwitchId;


    if(radarPendingLayer){

      try{

        map.removeLayer(
          radarPendingLayer
        );

      }catch(e){}

    }


    if(oyaPendingLayer){

      try{

        map.removeLayer(
          oyaPendingLayer
        );

      }catch(e){}

    }


    if(radarLayer){

      try{

        map.removeLayer(
          radarLayer
        );

      }catch(e){}

      radarLayer =
        null;

    }


    if(oyaLayer){

      try{

        map.removeLayer(
          oyaLayer
        );

      }catch(e){}

      oyaLayer =
        null;

    }


    radarFrames = [];
    oyaTimes = [];


    await loadRainViewer();


    loadOyaTimes();

  }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

(async function(){

  await loadRainViewer();

  /*
    ОЯ грузим отдельно,
    чтобы проблема WMS не блокировала
    обычный радар.
  */

  loadOyaTimes();

})();

</script>
