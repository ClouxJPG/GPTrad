
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <title>Quantum Storm — 3D Simulator</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101722;
      color: #edf4ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }

    .panel {
      position: fixed;
      z-index: 5;
      left: 12px;
      top: max(12px, env(safe-area-inset-top));
      width: min(310px, calc(100vw - 24px));
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      padding: 15px;
      border: 1px solid #ffffff20;
      border-radius: 16px;
      background: #101722df;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 35px #0004;
    }

    .brand {
      margin: 0;
      font-size: 18px;
      font-weight: 850;
      letter-spacing: 1.2px;
    }

    .subtitle {
      margin: 5px 0 14px;
      color: #91a4bc;
      font-size: 12px;
    }

    .section-title {
      margin: 14px 0 7px;
      color: #9db2ce;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    select, button {
      width: 100%;
      min-height: 40px;
      padding: 10px;
      border: 1px solid #ffffff1c;
      border-radius: 10px;
      color: #eef5ff;
      background: #202d3e;
      font: inherit;
      font-size: 13px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      touch-action: manipulation;
    }

    button:active { transform: scale(.985); }

    .primary {
      margin-top: 8px;
      background: #176de0;
      border-color: #3989f8;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .control {
      margin-top: 12px;
    }

    .control-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: #d9e5f5;
      font-size: 12px;
    }

    .control-head output {
      color: #70b5ff;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #3994ff;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      border: 1px solid #ffffff12;
      border-radius: 10px;
      background: #ffffff08;
    }

    .metric-label {
      color: #91a4bc;
      font-size: 10px;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 17px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    #status {
      margin-top: 12px;
      color: #a7bad1;
      font-size: 11px;
      line-height: 1.45;
    }

    #loading {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #101722;
    }

    #loading h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    #loading p {
      max-width: 380px;
      color: #9eb0c8;
      font-size: 13px;
      line-height: 1.6;
    }

    #loading.error {
      background: #1a1017;
    }

    #errorDetails {
      max-width: 500px;
      color: #ff9eae;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .hint {
      position: fixed;
      z-index: 4;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      max-width: calc(100vw - 24px);
      padding: 10px 13px;
      border: 1px solid #ffffff18;
      border-radius: 12px;
      background: #101722bb;
      color: #d5e2f4;
      font-size: 11px;
      pointer-events: none;
    }

    @media (max-width: 520px) {
      .panel {
        width: min(275px, calc(100vw - 24px));
        padding: 12px;
      }

      .brand { font-size: 16px; }
      .subtitle { margin-bottom: 8px; }
      .section-title { margin-top: 10px; }
      .control { margin-top: 8px; }
      .metric { padding: 8px; }
      .metric-value { font-size: 15px; }

      .hint {
        left: 12px;
        right: 12px;
        bottom: max(10px, env(safe-area-inset-bottom));
        width: fit-content;
      }
    }
  </style>
</head>

<body>
  <canvas id="scene" aria-label="Интерактивная 3D-симуляция грозы"></canvas>

  <div id="loading">
    <h2 id="loadingTitle">QUANTUM STORM</h2>
    <p id="loadingText">Создаём 3D-сцену, траву и грозовые облака…</p>
    <div id="errorDetails"></div>
  </div>

  <aside class="panel">
    <h1 class="brand">QUANTUM STORM</h1>
    <p class="subtitle">Процедурный симулятор гроз · 3D</p>

    <div class="section-title">Тип конвекции</div>
    <select id="stormType">
      <option value="random">Случайная гроза</option>
      <option value="tower">Мощная башня</option>
      <option value="supercell">Суперячейка</option>
      <option value="multicell">Мультиячейковая гроза</option>
      <option value="squall">Шкваловая линия</option>
    </select>

    <button id="newStorm" class="primary">Сгенерировать новую грозу</button>

    <div class="button-row">
      <button id="pause">Пауза</button>
      <button id="lightning">Молния: вкл.</button>
    </div>

    <div class="section-title">Атмосферные параметры</div>

    <div class="control">
      <div class="control-head">
        <label for="cape">CAPE</label>
        <output id="capeValue">2200 Дж/кг</output>
      </div>
      <input id="cape" type="range" min="200" max="5000" step="100" value="2200">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="shear">Вертикальный сдвиг ветра</label>
        <output id="shearValue">20 м/с</output>
      </div>
      <input id="shear" type="range" min="0" max="40" step="1" value="20">
    </div>

    <div class="control">
      <div class="control-head">
        <label for="humidity">Влажность</label>
        <output id="humidityValue">75%</output>
      </div>
      <input id="humidity" type="range" min="20" max="100" step="1" value="75">
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Вершина облака</div>
        <div class="metric-value" id="cloudHeight">— км</div>
      </div>
      <div class="metric">
        <div class="metric-label">Ячеек</div>
        <div class="metric-value" id="cellCount">—</div>
      </div>
    </div>

    <div id="status">Инициализация…</div>
  </aside>

  <div class="hint">Поворачивай сцену пальцем · Своди два пальца, чтобы приблизить</div>

  <script>
    window.showStormError = function (error) {
      const loading = document.getElementById("loading");
      loading.classList.add("error");
      document.getElementById("loadingTitle").textContent = "НЕ УДАЛОСЬ ЗАПУСТИТЬ";
      document.getElementById("loadingText").textContent =
        "Сцена не загрузилась. Проверь интернет-соединение и открой сайт ещё раз.";
      document.getElementById("errorDetails").textContent =
        error && (error.stack || error.message || String(error))
          ? String(error.stack || error.message || error)
          : "Неизвестная ошибка";
    };

    window.hideStormLoading = function () {
      document.getElementById("loading").style.display = "none";
    };

    window.addEventListener("error", function (event) {
      if (document.getElementById("loading").style.display !== "none") {
        window.showStormError(event.message || "Ошибка JavaScript");
      }
    });

    window.addEventListener("unhandledrejection", function (event) {
      window.showStormError(event.reason || "Не удалось загрузить модуль");
    });

    import("./sim.js").catch(window.showStormError);
  </script>
</body>
</html>
