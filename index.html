<html lang="ru">
<head>

<title>GPTrad</title>

<link

/>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background: #111;
}

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #d9d9d9;
}

/* =========================
   TOP BAR
========================= */

.topbar {
  position: fixed;
  z-index: 1000;
  top: 10px;
  left: 10px;
  right: 10px;

  height: 44px;

  display: flex;
  align-items: center;

  padding: 0 8px;

  background: rgba(20,20,20,.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border-radius: 10px;

  box-shadow:
    0 4px 20px rgba(0,0,0,.28);

  color: white;
}

.logo {
  font-size: 16px;
  font-weight: 700;
  margin-left: 5px;
}

.top-spacer {
  flex: 1;
}

.icon-btn {
  width: 34px;
  height: 34px;

  border: 0;
  outline: 0;

  border-radius: 8px;

  background: rgba(255,255,255,.08);
  color: white;

  font-size: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.icon-btn:active {
  background: rgba(255,255,255,.18);
}

/* =========================
   SEARCH
========================= */

.search-panel {
  position: fixed;
  z-index: 1150;

  top: 60px;
  left: 10px;

  width: min(380px, calc(100vw - 20px));

  background: rgba(20,20,20,.95);

  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  border-radius: 10px;

  padding: 10px;

  box-shadow:
    0 8px 30px rgba(0,0,0,.4);

  transform: translateY(-8px);
  opacity: 0;
  pointer-events: none;

  transition:
    opacity .18s ease,
    transform .18s ease;
}

.search-panel.open {
  transform: translateY(0);
  opacity: 1;
  pointer-events: auto;
}

.search-input-wrap {
  position: relative;
}

#placeSearch {
  width: 100%;
  height: 38px;

  padding: 0 38px 0 11px;

  border: 0;
  outline: 0;

  border-radius: 8px;

  background: rgba(255,255,255,.1);
  color: white;

  font-size: 14px;
}

#placeSearch::placeholder {
  color: rgba(255,255,255,.45);
}

.search-clear {
  position: absolute;

  right: 5px;
  top: 5px;

  width: 28px;
  height: 28px;

  border: 0;
  border-radius: 6px;

  background: transparent;
  color: rgba(255,255,255,.7);

  font-size: 20px;

  display: none;
  align-items: center;
  justify-content: center;
}

.search-results {
  margin-top: 7px;

  max-height: 330px;

  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.search-result {
  padding: 9px 10px;

  border-radius: 7px;

  color: white;

  cursor: pointer;
}

.search-result:active {
  background: rgba(255,255,255,.15);
}

.search-result-name {
  font-size: 14px;
  font-weight: 600;
}

.search-result-desc {
  margin-top: 3px;

  font-size: 10px;

  color: rgba(255,255,255,.55);

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.search-message {
  padding: 10px;

  color: rgba(255,255,255,.5);

  font-size: 11px;
}

.search-attribution {
  margin-top: 7px;
  padding: 3px 2px 0;

  font-size: 9px;

  color: rgba(255,255,255,.38);
}

/* =========================
   RADAR PANEL
========================= */

.radar-panel {
  position: fixed;
  z-index: 1100;

  top: 64px;
  right: 10px;

  width: 245px;

  background: rgba(20,20,20,.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  border-radius: 10px;

  color: white;

}

.radar-panel.open {

}

.panel-head {

}

.panel-close {

  justify-content: center;

}

.panel-close:active {

}

.panel-section:first-of-type {

.panel-label {

}

.layer-row {

.layer-row input {

}

.layer-row span {

}

========================= */

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   CONFIG
========================================================= */

const WMS_URL = "/baltrad_wsgi";
const VECTOR_URL = "/vector_wsgi";

const TARGET_LAYER = "bufr_dbz1";

const VECTOR_TITLE =
  "bufr_dbz1,bufr_novosib_dbz1,bufr_vlad_dbz1";

const FRAME_STEP =
  10 * 60 * 1000;


/*
 * ВСЕГО 32 КАДРА.
 */
const MAX_FRAMES = 32;


/*
 * Кадры 17–32 загружаются
 * сразу после открытия сайта.
 *
 * В массиве:
 *
 * 1  = index 0
 * 17 = index 16
 * 32 = index 31
 */
const PRELOAD_FROM_INDEX = 16;


/*
 * Максимум одновременно
 * загружающихся кадров.
 */
const PRELOAD_CONCURRENCY = 2;


/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {
  zoomControl: true,
  attributionControl: true,
  preferCanvas: true
}).setView(
  [54.74, 55.97],
  6
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 18,
    attribution: "© OpenStreetMap"
  }
).addTo(map);


/* =========================================================
   STATE
========================================================= */

let times = [];

let currentTime = null;

let currentRadarLayer = null;

let radarRequestId = 0;

let vectorRequestId = 0;

let playing = false;

let playTimer = null;

let autoFollowLatest = true;

let preloadStarted = false;


/*
 * Кэш кадров.
 *
 * Теперь ключом является ВРЕМЯ,
 * а не BBOX.
 *
 * Это важно:
 * один кадр = одно WMS-изображение.
 */
const radarCache =
  new Map();


/*
 * Кэш Promise для кадров,
 * которые сейчас загружаются.
 */
const radarLoading =
  new Map();


/* =========================================================
   DOM
========================================================= */

const radarPanel =
  document.getElementById("radarPanel");

const panelBtn =
  document.getElementById("panelBtn");

const panelClose =
  document.getElementById("panelClose");

const radarToggle =
  document.getElementById("radarToggle");

const vectorToggle =
  document.getElementById("vectorToggle");

const statusEl =
  document.getElementById("status");

const timeSlider =
  document.getElementById("timeSlider");

const timeValue =
  document.getElementById("timeValue");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const playBtn =
  document.getElementById("playBtn");

const pixelInfo =
  document.getElementById("pixelInfo");

const pixelValue =
  document.getElementById("pixelValue");

const pixelTime =
  document.getElementById("pixelTime");

const pixelCoords =
  document.getElementById("pixelCoords");

const searchPanel =
  document.getElementById("searchPanel");

const searchBtn =
  document.getElementById("searchBtn");

const placeSearch =
  document.getElementById("placeSearch");

const searchResults =
  document.getElementById("searchResults");

const searchClear =
  document.getElementById("searchClear");


/* =========================================================
   PANEL
========================================================= */

panelBtn.addEventListener(
  "click",
  () => {

    radarPanel.classList.toggle(
      "open"
    );

    searchPanel.classList.remove(
      "open"
    );
  }
);


panelClose.addEventListener(
  "click",
  () => {

    radarPanel.classList.remove(
      "open"
    );
  }
);


/* =========================================================
   SEARCH PANEL
========================================================= */

searchBtn.addEventListener(
  "click",
  () => {

    searchPanel.classList.toggle(
      "open"
    );

    radarPanel.classList.remove(
      "open"
    );

    if (
      searchPanel.classList.contains(
        "open"
      )
    ) {

      setTimeout(
        () => placeSearch.focus(),
        50
      );
    }
  }
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {
  statusEl.textContent = text;
}


/* =========================================================
   TIME HELPERS
========================================================= */

function formatTime(iso) {

  const d =
    new Date(iso);

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {

    return "—";
  }

  return d.toLocaleTimeString(
    "ru-RU",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function formatDateTime(iso) {

  const d =
    new Date(iso);

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {

    return "—";
  }

  return d.toLocaleString(
    "ru-RU",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function isUsableTime(date) {

  return date.getTime()
    <= Date.now() + 30 * 1000;
}


/* =========================================================
   CAPABILITIES
========================================================= */

function extractTimesFromText(text) {

  const result = [];

  try {

    const parser =
      new DOMParser();

    const xml =
      parser.parseFromString(
        text,
        "text/xml"
      );

    const layers =
      Array.from(
        xml.getElementsByTagName(
          "Layer"
        )
      );

    let targetLayer = null;


    for (
      const layer of layers
    ) {

      const names =
        Array.from(
          layer.children
        ).filter(
          el =>
            el.localName &&
            el.localName.toLowerCase() ===
            "name"
        );


      if (
        names.length &&
        names[0].textContent.trim() ===
        TARGET_LAYER
      ) {

        targetLayer = layer;
        break;
      }
    }


    if (targetLayer) {

      const nodes =
        Array.from(
          targetLayer.querySelectorAll(
            "Dimension, Extent"
          )
        );


      for (
        const node of nodes
      ) {

        const name =
          (
            node.getAttribute("name") ||
            ""
          ).toLowerCase();


        if (
          name !== "time"
        ) {

          continue;
        }


        parseTimeValue(
          node.textContent.trim(),
          result
        );
      }
    }

  } catch (error) {

    console.warn(
      "Capabilities parse error:",
      error
    );
  }


  /*
   * Fallback.
   */

  if (
    !result.length
  ) {

    const regex =
      /20\d\d-\d\d-\d\dT\d\d:\d\d(?::\d\d)?(?:\.\d+)?Z/g;

    const matches =
      text.match(regex) || [];


    for (
      const value of matches
    ) {

      const d =
        new Date(value);


      if (
        !Number.isNaN(
          d.getTime()
        )
      ) {

        result.push(
          d.toISOString()
        );
      }
    }
  }


  return [
    ...new Set(result)
  ]
    .map(
      value =>
        new Date(value)
    )
    .filter(
      isUsableTime
    )
    .sort(
      (a,b) =>
        a.getTime() -
        b.getTime()
    )
    .map(
      d =>
        d.toISOString()
    );
}


function parseTimeValue(
  value,
  result
) {

  if (!value) {
    return;
  }


  /*
   * Список времён.
   */

  if (
    value.includes(",") &&
    !value.includes("/")
  ) {

    for (
      const part of value.split(",")
    ) {

      const d =
        new Date(
          part.trim()
        );


      if (
        !Number.isNaN(
          d.getTime()
        )
      ) {

        result.push(
          d.toISOString()
        );
      }
    }


    return;
  }


  /*
   * Интервал start/end/step.
   */

  const parts =
    value.split("/");


  if (
    parts.length >= 2
  ) {

    const start =
      new Date(parts[0]);

    const end =
      new Date(parts[1]);


    if (
      Number.isNaN(
        start.getTime()
      ) ||
      Number.isNaN(
        end.getTime()
      )
    ) {

      return;
    }


    let step =
      FRAME_STEP;


    if (
      parts[2]
    ) {

      const match =
        parts[2].match(
          /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/i
        );


      if (match) {

        const hours =
          Number(
            match[1] || 0
          );

        const minutes =
          Number(
            match[2] || 0
          );

        const seconds =
          Number(
            match[3] || 0
          );


        step =
          (
            hours * 3600 +
            minutes * 60 +
            seconds
          ) * 1000;
      }
    }


    const max =
      Math.min(
        end.getTime(),
        Date.now() + 30 * 1000
      );


    for (
      let t = start.getTime();
      t <= max;
      t += step
    ) {

      result.push(
        new Date(t).toISOString()
      );
    }
  }
}


/* =========================================================
   LOAD CAPABILITIES
========================================================= */

async function loadCapabilities() {

  setStatus(
    "Загрузка радара…"
  );


  const url =
    WMS_URL +
    "?SERVICE=WMS" +
    "&VERSION=1.1.1" +
    "&REQUEST=GetCapabilities";


  try {

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const text =
      await response.text();


    let parsed =
      extractTimesFromText(
        text
      );


    /*
     * Берём последние 32.
     */

    if (
      parsed.length >
      MAX_FRAMES
    ) {

      parsed =
        parsed.slice(
          -MAX_FRAMES
        );
    }


    times =
      parsed;


    timeSlider.min = 0;

    timeSlider.max =
      Math.max(
        0,
        times.length - 1
      );


    if (
      !times.length
    ) {

      throw new Error(
        "Временные кадры не найдены"
      );
    }


    const newest =
      times[
        times.length - 1
      ];


    /*
     * Первый запуск.
     */

    if (
      !currentTime
    ) {

      await selectTime(
        newest,
        false,
        true
      );


      /*
       * После появления первого кадра
       * начинаем фоновую загрузку
       * кадров 17–32.
       */
      startInitialPreload();

    }

    else if (
      autoFollowLatest &&
      currentTime !== newest
    ) {

      await selectTime(
        newest,
        false,
        true
      );

    }

    else {

      updateTimelinePosition();
    }


    setStatus(
      "Готово"
    );

  } catch (error) {

    console.error(
      "Capabilities error:",
      error
    );

    setStatus(
      "Ошибка загрузки радара"
    );
  }
}


/* =========================================================
   RADAR WMS
========================================================= */

/*
 * Теперь WMS работает как настоящий
 * слой карты.
 *
 * Это принципиально отличается
 * от старого ImageOverlay:
 *
 * ImageOverlay = одна картинка
 * на географических bounds.
 *
 * WMS TileLayer = карта сама просит
 * нужные тайлы при каждом zoom/pan.
 */

function createRadarLayer(time) {

  const layer =
    L.tileLayer.wms(
      WMS_URL,
      {
        layers:
          TARGET_LAYER,

        styles:
          "",

        format:
          "image/png",

        transparent:
          true,

        version:
          "1.1.1",

        srs:
          "EPSG:3857",

        time:
          time,

        opacity:
          .72,

        tileSize:
          256,

        updateWhenZooming:
          true,

        updateWhenIdle:
          true,

        keepBuffer:
          1,

        crossOrigin:
          true
      }
    );


  return layer;
}


/*
 * Для каждого времени создаём
 * собственный WMS layer.
 */
const radarLayers =
  new Map();


function getRadarLayer(time) {

  if (
    radarLayers.has(time)
  ) {

    return radarLayers.get(time);
  }


  const layer =
    createRadarLayer(
      time
    );


  radarLayers.set(
    time,
    layer
  );


  return layer;
}


/* =========================================================
   LOAD / PRELOAD RADAR FRAME
========================================================= */

function preloadRadarFrame(time) {

  if (
    radarCache.has(time)
  ) {

    return Promise.resolve(
      radarCache.get(time)
    );
  }


  if (
    radarLoading.has(time)
  ) {

    return radarLoading.get(time);
  }


  /*
   * Для фоновой загрузки используем
   * WMS GetMap текущего viewport.
   *
   * Полученное изображение сохраняем
   * как готовый кадр.
   *
   * При реальном отображении карта
   * использует WMS TileLayer.
   */

  const bounds =
    map.getBounds();

  const size =
    map.getSize();


  const params =
    new URLSearchParams({

      SERVICE:
        "WMS",

      VERSION:
        "1.1.1",

      REQUEST:
        "GetMap",

      LAYERS:
        TARGET_LAYER,

      STYLES:
        "",

      FORMAT:
        "image/png",

      TRANSPARENT:
        "true",

      SRS:
        "EPSG:3857",

      BBOX:
        getProjectedBBox(
          bounds
        ),

      WIDTH:
        Math.max(
          256,
          Math.round(
            size.x
          )
        ),

      HEIGHT:
        Math.max(
          256,
          Math.round(
            size.y
          )
        ),

      TIME:
        time
    });


  const url =
    WMS_URL +
    "?" +
    params.toString();


  const promise =
    loadImage(
      url
    )
    .then(
      img => {

        radarCache.set(
          time,
          {
            src:
              img.src,

            loadedAt:
              Date.now()
          }
        );


        return radarCache.get(
          time
        );
      }
    )
    .catch(
      error => {

        console.warn(
          "Preload failed:",
          time,
          error
        );

        throw error;

      }
    )
    .finally(
      () => {

        radarLoading.delete(
          time
        );
      }
    );


  radarLoading.set(
    time,
    promise
  );


  return promise;
}


/* =========================================================
   PROJECTED BBOX
========================================================= */

function getProjectedBBox(
  bounds
) {

  const sw =
    map.options.crs.project(
      bounds.getSouthWest()
    );

  const ne =
    map.options.crs.project(
      bounds.getNorthEast()
    );


  return [
    sw.x,
    sw.y,
    ne.x,
    ne.y
  ].join(",");
}


/* =========================================================
   IMAGE LOADER
========================================================= */

function loadImage(url) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();


      img.onload =
        () => {

          if (
            !img.naturalWidth ||
            !img.naturalHeight
          ) {

            reject(
              new Error(
                "Пустое изображение"
              )
            );

            return;
          }


          resolve(img);
        };


      img.onerror =
        () => {

          reject(
            new Error(
              "Изображение не загрузилось"
            )
          );
        };


      img.src =
        url;
    }
  );
}


/* =========================================================
   GET CANDIDATE TIMES
========================================================= */

function getCandidateTimes(
  time
) {

  const index =
    times.indexOf(
      time
    );


  if (
    index < 0
  ) {

    return [time];
  }


  return times
    .slice(
      0,
      index + 1
    )
    .reverse();
}


/* =========================================================
   SELECT RADAR TIME
========================================================= */

async function selectTime(
  requestedTime,
  fromMapMove = false,
  allowFallback = true
) {

  if (
    !requestedTime
  ) {

    return;
  }


  const requestId =
    ++radarRequestId;


  const candidates =
    allowFallback
      ? getCandidateTimes(
          requestedTime
        )
      : [requestedTime];


  for (
    const candidateTime of candidates
  ) {

    if (
      requestId !== radarRequestId
    ) {

      return;
    }


    try {

      if (
        !fromMapMove
      ) {

        setStatus(
          "Загрузка " +
          formatTime(
            candidateTime
          ) +
          "…"
        );
      }


      /*
       * Если кадр уже был
       * загружен заранее —
       * сразу используем его.
       */
      if (
        radarCache.has(
          candidateTime
        )
      ) {

        /*
         * Удаляем старый WMS layer.
         */
        if (
          currentRadarLayer
        ) {

          map.removeLayer(
            currentRadarLayer
          );
        }


        currentRadarLayer =
          getRadarLayer(
            candidateTime
          );


        if (
          radarToggle.checked
        ) {

          currentRadarLayer.addTo(
            map
          );
        }


        currentTime =
          candidateTime;


        updateTimelinePosition();


        pixelInfo.style.display =
          "none";


        if (
          vectorToggle.checked
        ) {

          loadVectors(
            currentTime
          );
        }


        return;
      }


      /*
       * Кадр ещё не загружен.
       *
       * Для пользователя делаем
       * приоритетную загрузку.
       *
       * Загружаем WMS слой.
       */
      const layer =
        getRadarLayer(
          candidateTime
        );


      /*
       * Старый слой пока оставляем.
       */
      layer.addTo(
        map
      );


      /*
       * Делаем новый слой невидимым
       * до завершения первой загрузки.
       */
      layer.setOpacity(
        0
      );


      /*
       * Ждём первый tile.
       */
      await new Promise(
        (resolve, reject) => {

          let finished =
            false;


          const timeout =
            setTimeout(
              () => {

                if (
                  finished
                ) {

                  return;
                }


                finished = true;

                reject(
                  new Error(
                    "WMS timeout"
                  )
                );

              },
              20000
            );


          const done =
            () => {

              if (
                finished
              ) {

                return;
              }


              finished = true;

              clearTimeout(
                timeout
              );

              resolve();
            };


          layer.once(
            "tileload",
            done
          );


          layer.once(
            "tileerror",
            () => {

              if (
                finished
              ) {

                return;
              }


              finished = true;

              clearTimeout(
                timeout
              );

              reject(
                new Error(
                  "WMS tile error"
                )
              );
            }
          );
        }
      );


      if (
        requestId !== radarRequestId
      ) {

        map.removeLayer(
          layer
        );

        return;
      }


      /*
       * Теперь новый слой можно
       * показывать.
       */
      layer.setOpacity(
        radarToggle.checked
          ? .72
          : 0
      );


      /*
       * Старый слой убираем
       * только после успешной загрузки.
       */
      if (
        currentRadarLayer &&
        currentRadarLayer !== layer
      ) {

        map.removeLayer(
          currentRadarLayer
        );
      }


      currentRadarLayer =
        layer;


      currentTime =
        candidateTime;


      /*
       * Помечаем время как загруженное.
       *
       * TileLayer сам хранит тайлы
       * внутри браузерного кэша.
       */
      radarCache.set(
        candidateTime,
        {
          layer: true,
          loadedAt: Date.now()
        }
      );


      updateTimelinePosition();


      pixelInfo.style.display =
        "none";


      if (
        vectorToggle.checked
      ) {

        loadVectors(
          currentTime
        );
      }


      if (
        !fromMapMove
      ) {

        setStatus(
          "Отражаемость · " +
          formatTime(
            currentTime
          )
        );
      }


      return;

    } catch (error) {

      console.warn(
        "Frame unavailable:",
        candidateTime,
        error
      );


      const layer =
        radarLayers.get(
          candidateTime
        );


      if (
        layer &&
        layer !== currentRadarLayer
      ) {

        map.removeLayer(
          layer
        );
      }


      continue;
    }
  }


  if (
    requestId === radarRequestId
  ) {

    setStatus(
      "Кадр временно недоступен"
    );
  }
}


/* =========================================================
   INITIAL PRELOAD 17–32
========================================================= */

async function startInitialPreload() {

  if (
    preloadStarted
  ) {

    return;
  }


  preloadStarted =
    true;


  /*
   * 32 кадра:
   *
   * index 0  = кадр 1
   * index 15 = кадр 16
   * index 16 = кадр 17
   * index 31 = кадр 32
   *
   * Поэтому берём slice(16).
   */
  const preloadTimes =
    times.slice(
      PRELOAD_FROM_INDEX
    );


  if (
    !preloadTimes.length
  ) {

    return;
  }


  /*
   * Самый новый кадр №32
   * уже отображён на карте.
   *
   * Его можно исключить из
   * отдельной фоновой загрузки.
   */
  const newest =
    times[
      times.length - 1
    ];


  const queue =
    preloadTimes.filter(
      time =>
        time !== newest
    );


  let cursor = 0;


  async function worker() {

    while (
      cursor <
      queue.length
    ) {

      const index =
        cursor++;


      const time =
        queue[index];


      /*
       * Если пользователь уже
       * загрузил этот кадр —
       * ничего не делаем.
       */
      if (
        radarCache.has(
          time
        )
      ) {

        continue;
      }


      try {

        /*
         * Фоновая загрузка.
         */
        await preloadRadarFrame(
          time
        );

      } catch (_) {

        /*
         * Ошибка одного кадра
         * не останавливает остальные.
         */
      }
    }
  }


  const workers = [];


  for (
    let i = 0;
    i < Math.min(
      PRELOAD_CONCURRENCY,
      queue.length
    );
    i++
  ) {

    workers.push(
      worker()
    );
  }


  await Promise.all(
    workers
  );


  console.log(
    "Фоновая загрузка кадров 17–32 завершена"
  );
}


/* =========================================================
   TIMELINE
========================================================= */

function updateTimelinePosition() {

  if (
    !currentTime ||
    !times.length
  ) {

    return;
  }


  let index =
    times.indexOf(
      currentTime
    );


  if (
    index < 0
  ) {

    let bestIndex = 0;

    let bestDiff =
      Infinity;


    const target =
      new Date(
        currentTime
      ).getTime();


    for (
      let i = 0;
      i < times.length;
      i++
    ) {

      const diff =
        Math.abs(
          new Date(
            times[i]
          ).getTime()
          -
          target
        );


      if (
        diff < bestDiff
      ) {

        bestDiff =
          diff;

        bestIndex =
          i;
      }
    }


    index =
      bestIndex;
  }


  timeSlider.value =
    index;


  timeValue.textContent =
    formatDateTime(
      currentTime
    );
}

/* =========================================================
   VECTOR LAYER
========================================================= */

const vectorLayer =
  L.layerGroup()
    .addTo(map);


/* =========================================================
   DESTINATION
========================================================= */

function destination(
  lon,
  lat,
  dist,
  bearing
) {

  const R =
    6371;


  const brng =
    bearing *
    Math.PI /
    180;


  const lat1 =
    lat *
    Math.PI /
    180;


  const lon1 =
    lon *
    Math.PI /
    180;


  const d =
    dist / R;


  const lat2 =
    Math.asin(
      Math.sin(lat1) *
      Math.cos(d) +

      Math.cos(lat1) *
      Math.sin(d) *
      Math.cos(brng)
    );


  const lon2 =
    lon1 +
    Math.atan2(
      Math.sin(brng) *
      Math.sin(d) *
      Math.cos(lat1),

      Math.cos(d) -
      Math.sin(lat1) *
      Math.sin(lat2)
    );


  return [
    lon2 *
      180 /
      Math.PI,

    lat2 *
      180 /
      Math.PI
  ];
}


/* =========================================================
   CREATE VECTOR
========================================================= */

function createVector(
  lat,
  lon,
  dist,
  head
) {

  /*
   * BALTRAD:
   * speed приходит в m/s.
   *
   * Переводим в km/h.
   */
  const speed =
    dist;


  /*
   * Минимальная длина нужна,
   * чтобы слабые векторы тоже
   * были заметны на карте.
   */
  const vectorDistance =
    Math.max(
      speed,
      3
    );


  const end =
    destination(
      lon,
      lat,
      vectorDistance,
      head
    );


  const points = [
    [lat, lon],
    [end[1], end[0]]
  ];


  /*
   * Чёрная обводка.
   */
  const outline =
    L.polyline(
      points,
      {
        color:
          "#000000",

        weight:
          4,

        opacity:
          .95,

        interactive:
          false
      }
    );


  /*
   * Белая линия.
   */
  const line =
    L.polyline(
      points,
      {
        color:
          "#ffffff",

        weight:
          1.8,

        opacity:
          1,

        interactive:
          false
      }
    );


  return L.layerGroup([
    outline,
    line
  ]);
}


/* =========================================================
   LOAD VECTORS
========================================================= */

async function loadVectors(
  time
) {

  if (
    !vectorToggle.checked
  ) {

    vectorLayer.clearLayers();

    return;
  }


  const requestId =
    ++vectorRequestId;


  /*
   * Сначала пробуем точный запрос
   * исходного демо.
   */
  const urls = [
    VECTOR_URL +
      "?time=" +
      encodeURIComponent(
        time
      ) +
      "&title=" +
      encodeURIComponent(
        VECTOR_TITLE
      )
  ];


  /*
   * Если ответ пустой,
   * дополнительно попробуем
   * отдельные названия.
   */
  const individualTitles = [
    "bufr_dbz1",
    "bufr_novosib_dbz1",
    "bufr_vlad_dbz1"
  ];


  try {

    let data =
      [];


    let firstResponse =
      await fetch(
        urls[0],
        {
          cache:
            "no-store"
        }
      );


    if (
      !firstResponse.ok
    ) {

      throw new Error(
        "HTTP " +
        firstResponse.status
      );
    }


    const firstData =
      await firstResponse.json();


    if (
      Array.isArray(
        firstData
      )
    ) {

      data =
        firstData;
    }


    /*
     * Если общий запрос пустой,
     * пробуем отдельные title.
     */
    if (
      !data.length
    ) {

      for (
        const title of individualTitles
      ) {

        try {

          const response =
            await fetch(
              VECTOR_URL +
                "?time=" +
                encodeURIComponent(
                  time
                ) +
                "&title=" +
                encodeURIComponent(
                  title
                ),
              {
                cache:
                  "no-store"
              }
            );


          if (
            !response.ok
          ) {

            continue;
          }


          const part =
            await response.json();


          if (
            Array.isArray(
              part
            )
          ) {

            data =
              data.concat(
                part
              );
          }

        } catch (
          error
        ) {

          console.warn(
            "Vector fallback error:",
            title,
            error
          );
        }
      }
    }


    /*
     * Проверяем актуальность.
     */
    if (
      requestId !==
        vectorRequestId ||

      time !==
        currentTime ||

      !vectorToggle.checked
    ) {

      return;
    }


    vectorLayer.clearLayers();


    if (
      !Array.isArray(
        data
      )
    ) {

      return;
    }


    /*
     * Чтобы одинаковые векторы
     * из fallback не дублировались.
     */
    const seen =
      new Set();


    for (
      const item of data
    ) {

      if (
        !Array.isArray(
          item
        ) ||
        item.length < 4
      ) {

        continue;
      }


      const lat =
        Number(
          item[0]
        );

      const lon =
        Number(
          item[1]
        );

      const speedMps =
        Number(
          item[2]
        );

      const head =
        Number(
          item[3]
        );


      if (
        !Number.isFinite(
          lat
        ) ||

        !Number.isFinite(
          lon
        ) ||

        !Number.isFinite(
          speedMps
        ) ||

        !Number.isFinite(
          head
        )
      ) {

        continue;
      }


      if (
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
      ) {

        continue;
      }


      const key =
        [
          lat.toFixed(5),
          lon.toFixed(5),
          speedMps.toFixed(2),
          head.toFixed(1)
        ].join("|");


      if (
        seen.has(
          key
        )
      ) {

        continue;
      }


      seen.add(
        key
      );


      const speedKmh =
        speedMps *
        3.6;


      const vector =
        createVector(
          lat,
          lon,
          speedKmh,
          head
        );


      vectorLayer.addLayer(
        vector
      );
    }


    console.log(
      "Vectors:",
      data.length
    );

  } catch (error) {

    console.warn(
      "Vector error:",
      error
    );
  }
}


/* =========================================================
   VECTOR TOGGLE
========================================================= */

vectorToggle.addEventListener(
  "change",
  () => {

    if (
      !vectorToggle.checked
    ) {

      ++vectorRequestId;

      vectorLayer.clearLayers();

      return;
    }


    if (
      currentTime
    ) {

      loadVectors(
        currentTime
      );
    }
  }
);


/* =========================================================
   MAP MOVE
========================================================= */

let moveTimer = null;


map.on(
  "moveend",
  () => {

    clearTimeout(
      moveTimer
    );


    moveTimer =
      setTimeout(
        () => {

          if (
            currentTime
          ) {

            /*
             * WMS TileLayer теперь
             * самостоятельно подгружает
             * правильные тайлы при zoom/pan.
             *
             * Поэтому здесь НЕ надо
             * заново менять BBOX картинки.
             */
            if (
              currentRadarLayer
            ) {

              currentRadarLayer.redraw();
            }
          }

        },
        150
      );
  }
);


/* =========================================================
   GETFEATUREINFO
========================================================= */

map.on(
  "click",
  async event => {

    if (
      !currentTime ||
      !radarToggle.checked
    ) {

      return;
    }


    const bounds =
      map.getBounds();

    const size =
      map.getSize();


    const point =
      map.latLngToContainerPoint(
        event.latlng
      );


    const params =
      new URLSearchParams({

        SERVICE:
          "WMS",

        VERSION:
          "1.1.1",

        REQUEST:
          "GetFeatureInfo",

        LAYERS:
          TARGET_LAYER,

        QUERY_LAYERS:
          TARGET_LAYER,

        STYLES:
          "",

        INFO_FORMAT:
          "text/html",

        SRS:
          "EPSG:3857",

        BBOX:
          getProjectedBBox(
            bounds
          ),

        WIDTH:
          Math.round(
            size.x
          ),

        HEIGHT:
          Math.round(
            size.y
          ),

        X:
          Math.round(
            point.x
          ),

        Y:
          Math.round(
            point.y
          ),

        TIME:
          currentTime
      });


    const url =
      WMS_URL +
      "?" +
      params.toString();


    try {

      const response =
        await fetch(
          url,
          {
            cache:
              "no-store"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      const text =
        await response.text();


      const dbz =
        parseDbz(
          text
        );


      if (
        dbz === null
      ) {

        pixelValue.textContent =
          "Нет данных";

      } else {

        pixelValue.textContent =
          dbz.toFixed(1) +
          " dBZ";
      }


      pixelTime.textContent =
        formatDateTime(
          currentTime
        );


      pixelCoords.textContent =
        event.latlng.lat.toFixed(
          4
        ) +
        "°, " +
        event.latlng.lng.toFixed(
          4
        ) +
        "°";


      pixelInfo.style.display =
        "block";


      const margin =
        10;


      let left =
        event.containerPoint.x +
        15;


      let top =
        event.containerPoint.y +
        15;


      if (
        left + 190 >
        window.innerWidth -
        margin
      ) {

        left =
          event.containerPoint.x -
          205;
      }


      if (
        top + 130 >
        window.innerHeight -
        margin
      ) {

        top =
          event.containerPoint.y -
          145;
      }


      pixelInfo.style.left =
        left + "px";

      pixelInfo.style.top =
        top + "px";

    } catch (error) {

      console.warn(
        "GetFeatureInfo error:",
        error
      );
    }
  }
);


/* =========================================================
   DBZ PARSER
========================================================= */

function parseDbz(
  text
) {

  const explicit =
    text.match(
      /dBZ[^0-9-]*(-?\d+(?:\.\d+)?)/i
    );


  if (
    explicit
  ) {

    const value =
      Number(
        explicit[1]
      );


    if (
      Number.isFinite(
        value
      )
    ) {

      return value;
    }
  }


  const rawMatch =
    text.match(
      /(?:value_0|value|dbzh|dbz|bufr_dbz1|reflectivity)[^0-9-]*(-?\d+(?:\.\d+)?)/i
    );


  if (
    !rawMatch
  ) {

    return null;
  }


  const raw =
    Number(
      rawMatch[1]
    );


  if (
    !Number.isFinite(
      raw
    )
  ) {

    return null;
  }


  if (
    raw >= 0 &&
    raw <= 254
  ) {

    return (
      raw *
      .5 -
      32
    );
  }


  return null;
}


/* =========================================================
   CLOSE PIXEL INFO
========================================================= */

map.on(
  "movestart",
  () => {

    pixelInfo.style.display =
      "none";
  }
);


/* =========================================================
   GEOLOCATION
========================================================= */

document
  .getElementById(
    "locateBtn"
  )
  .addEventListener(
    "click",
    () => {

      if (
        !navigator.geolocation
      ) {

        return;
      }


      navigator.geolocation.getCurrentPosition(
        position => {

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;


          map.setView(
            [lat, lon],
            Math.max(
              map.getZoom(),
              8
            )
          );
        },

        error => {

          console.warn(
            "Geolocation error:",
            error
          );
        },

        {
          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            30000
        }
      );
    }
  );


/* =========================================================
   PLACE SEARCH
========================================================= */

let searchTimer =
  null;

let searchController =
  null;

let lastSearchTime =
  0;


/*
 * Не чаще примерно одного запроса
 * в секунду к публичному Nominatim.
 */
const SEARCH_MIN_INTERVAL =
  1100;


function normalizeSearch(
  value
) {

  return value
    .trim()
    .toLocaleLowerCase(
      "ru-RU"
    );
}


function getPlaceType(
  result
) {

  const type =
    (
      result.type ||
      result.addresstype ||
      ""
    ).toLowerCase();


  const address =
    result.address ||
    {};


  if (
    type === "city" ||
    address.city
  ) {

    return "Город";
  }


  if (
    type === "town" ||
    address.town
  ) {

    return "Город";
  }


  if (
    type === "village" ||
    address.village
  ) {

    return "Деревня / село";
  }


  if (
    type === "hamlet" ||
    address.hamlet
  ) {

    return "Деревня / хутор";
  }


  if (
    type === "municipality"
  ) {

    return "Муниципалитет";
  }


  if (
    type === "suburb" ||
    type === "neighbourhood"
  ) {

    return "Район";
  }


  return "Населённый пункт";
}


function getPlaceName(
  result
) {

  if (
    result.name
  ) {

    return result.name;
  }


  const address =
    result.address ||
    {};


  return (
    address.city ||
    address.town ||
    address.village ||
    address.hamlet ||
    result.display_name ||
    "Без названия"
  );
}


function getPlaceDescription(
  result
) {

  const address =
    result.address ||
    {};


  const parts = [];


  const region =
    address.state ||
    address.region;


  const district =
    address.county ||
    address.city_district;


  const country =
    address.country;


  if (
    region
  ) {

    parts.push(
      region
    );
  }


  if (
    district
  ) {

    parts.push(
      district
    );
  }


  if (
    country
  ) {

    parts.push(
      country
    );
  }


  if (
    parts.length
  ) {

    return parts.join(
      " · "
    );
  }


  return result.display_name ||
    "";
}


/*
 * Сортируем так, чтобы
 *
 * "Моск"
 *
 * прежде всего показывал
 *
 * "Москва"
 *
 * а не случайные совпадения.
 */
function sortSearchResults(
  results,
  query
) {

  const normalized =
    normalizeSearch(
      query
    );


  return results
    .map(
      (result, index) => {

        const name =
          normalizeSearch(
            getPlaceName(
              result
            )
          );


        let score =
          0;


        if (
          name === normalized
        ) {

          score =
            1000;

        } else if (
          name.startsWith(
            normalized
          )
        ) {

          score =
            900;

        } else if (
          name.includes(
            normalized
          )
        ) {

          score =
            700;
        }


        score +=
          Number(
            result.importance ||
            0
          ) * 10;


        return {
          result,
          score,
          index
        };
      }
    )
    .sort(
      (a,b) => {

        if (
          b.score !==
          a.score
        ) {

          return b.score -
            a.score;
        }


        return a.index -
          b.index;
      }
    )
    .map(
      item =>
        item.result
    );
}


function showSearchMessage(
  text
) {

  searchResults.innerHTML =
    "";


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "search-message";


  div.textContent =
    text;


  searchResults.appendChild(
    div
  );
}


function renderSearchResults(
  results
) {

  searchResults.innerHTML =
    "";


  if (
    !results.length
  ) {

    showSearchMessage(
      "Ничего не найдено"
    );

    return;
  }


  for (
    const result of results
  ) {

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "search-result";


    const name =
      document.createElement(
        "div"
      );


    name.className =
      "search-result-name";


    name.textContent =
      getPlaceName(
        result
      );


    const desc =
      document.createElement(
        "div"
      );


    desc.className =
      "search-result-desc";


    desc.textContent =
      getPlaceType(
        result
      ) +
      " · " +
      getPlaceDescription(
        result
      );


    item.appendChild(
      name
    );


    item.appendChild(
      desc
    );


    item.addEventListener(
      "click",
      () => {

        const lat =
          Number(
            result.lat
          );

        const lon =
          Number(
            result.lon
          );


        if (
          !Number.isFinite(
            lat
          ) ||
          !Number.isFinite(
            lon
          )
        ) {

          return;
        }


        map.flyTo(
          [lat, lon],
          Math.max(
            map.getZoom(),
            10
          ),
          {
            duration:
              .7
          }
        );


        searchPanel.classList.remove(
          "open"
        );


        placeSearch.blur();


        pixelInfo.style.display =
          "none";
      }
    );


    searchResults.appendChild(
      item
    );
  }
}


async function searchPlaces(
  query
) {

  const normalized =
    normalizeSearch(
      query
    );


  if (
    normalized.length < 2
  ) {

    searchResults.innerHTML =
      "";

    return;
  }


  /*
   * Отменяем предыдущий запрос.
   */
  if (
    searchController
  ) {

    searchController.abort();
  }


  searchController =
    new AbortController();


  /*
   * Соблюдаем паузу между запросами.
   */
  const elapsed =
    Date.now() -
    lastSearchTime;


  if (
    elapsed <
    SEARCH_MIN_INTERVAL
  ) {

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          SEARCH_MIN_INTERVAL -
          elapsed
        )
    );
  }


  lastSearchTime =
    Date.now();


  showSearchMessage(
    "Поиск…"
  );


  try {

    const params =
      new URLSearchParams({

        q:
          query.trim(),

        format:
          "jsonv2",

        addressdetails:
          "1",

        namedetails:
          "1",

        limit:
          "10",

        featureType:
          "settlement",

        "accept-language":
          "ru"
      });


    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/search?" +
        params.toString(),
        {
          signal:
            searchController.signal,

          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    /*
     * Проверяем, что пользователь
     * не успел изменить запрос.
     */
    if (
      normalizeSearch(
        placeSearch.value
      ) !==
      normalized
    ) {

      return;
    }


    const sorted =
      sortSearchResults(
        Array.isArray(data)
          ? data
          : [],
        query
      );


    renderSearchResults(
      sorted
    );

  } catch (error) {

    if (
      error.name ===
      "AbortError"
    ) {

      return;
    }


    console.warn(
      "Place search error:",
      error
    );


    showSearchMessage(
      "Ошибка поиска"
    );
  }
}


/* =========================================================
   SEARCH INPUT
========================================================= */

placeSearch.addEventListener(
  "input",
  () => {

    const value =
      placeSearch.value.trim();


    searchClear.style.display =
      value
        ? "flex"
        : "none";


    clearTimeout(
      searchTimer
    );


    if (
      value.length < 2
    ) {

      searchResults.innerHTML =
        "";

      return;
    }


    searchTimer =
      setTimeout(
        () => {

          searchPlaces(
            value
          );

        },
        650
      );
  }
);


/* =========================================================
   SEARCH CLEAR
========================================================= */

searchClear.addEventListener(
  "click",
  () => {

    placeSearch.value =
      "";

    searchResults.innerHTML =
      "";

    searchClear.style.display =
      "none";


    placeSearch.focus();
  }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      searchPanel.classList.remove(
        "open"
      );

      radarPanel.classList.remove(
        "open"
      );
    }
  }
);


/* =========================================================
   PERIODIC UPDATE
========================================================= */

setInterval(
  () => {

    loadCapabilities();

  },
  60 * 1000
);


/* =========================================================
   START
========================================================= */

loadCapabilities();

</script>
