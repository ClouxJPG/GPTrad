<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPTrad</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#111;
}

#map{
position:absolute;
inset:0;
z-index:1;
}

/* TOP */

.top-panel{
position:absolute;
top:12px;
left:12px;
right:12px;
height:54px;
z-index:1000;

display:flex;
align-items:center;
gap:8px;
padding:6px;

background:rgba(28,28,28,.90);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,.25);
}

.logo{
color:white;
font-size:25px;
font-weight:700;
white-space:nowrap;
margin-left:8px;
margin-right:8px;
}

#selectedLayer{
flex:1;
min-width:0;
height:42px;

border:0;
outline:0;
border-radius:12px;

background:#292929;
color:white;

padding:0 14px;

font-size:17px;
font-weight:650;

text-align:left;

display:flex;
align-items:center;
justify-content:space-between;

gap:8px;
}

#selectedLayerName{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

#selectedLayerArrow{
flex:none;
font-size:14px;
opacity:.7;
transition:transform .25s ease;
}

#selectedLayer.open #selectedLayerArrow{
transform:rotate(180deg);
}

.icon-btn{
flex:none;

width:42px;
height:42px;

border:0;
outline:0;
border-radius:12px;

background:#292929;
color:white;

font-size:21px;

display:flex;
align-items:center;
justify-content:center;

transition:transform .15s ease;
}

.icon-btn:active{
transform:scale(.94);
}

/* DRAWER */

#layerDrawer{
position:absolute;

top:72px;
left:50%;

width:calc(100% - 24px);
max-width:520px;

z-index:1100;

transform:translate(-50%,-18px) scale(.98);
opacity:0;
pointer-events:none;

padding:10px;

border-radius:15px;

background:rgba(25,25,25,.96);

backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);

box-shadow:0 10px 35px rgba(0,0,0,.35);

transition:
transform .28s cubic-bezier(.22,.61,.36,1),
opacity .22s ease;
}

#layerDrawer.open{
transform:translate(-50%,0) scale(1);
opacity:1;
pointer-events:auto;
}

.drawer-header{
color:white;
font-size:14px;
font-weight:700;
padding:4px 7px 9px;
}

.layer-item{
width:100%;
min-height:48px;

border:0;
outline:0;
border-radius:11px;

background:#303030;
color:white;

display:flex;
align-items:center;
gap:10px;

padding:10px 12px;
margin-bottom:7px;

font-size:15px;
text-align:left;

transition:
background .15s ease,
transform .15s ease;
}

.layer-item:last-child{
margin-bottom:0;
}

.layer-item:active{
transform:scale(.985);
}

.layer-item.active{
background:#3b3b3b;
}

.layer-dot{
width:10px;
height:10px;
flex:none;
border-radius:50%;
background:#777;
}

.layer-item.active .layer-dot{
background:#36d67a;
box-shadow:0 0 8px rgba(54,214,122,.55);
}

/* STATUS */

#status{
position:absolute;
left:14px;
top:74px;

z-index:900;

padding:6px 10px;

border-radius:8px;

background:rgba(20,20,20,.78);
color:white;

font-size:12px;

pointer-events:none;
opacity:.9;
}

/* SETTINGS */

#settings{
position:absolute;

left:12px;
top:74px;

width:220px;

z-index:1200;

display:none;

padding:12px;

border-radius:14px;

background:rgba(20,20,20,.96);
color:white;

box-shadow:0 8px 30px rgba(0,0,0,.35);
}

#settings.open{
display:block;
}

.settings-title{
font-size:14px;
font-weight:700;
margin-bottom:9px;
}

.theme-btn{
width:100%;

border:0;
outline:0;

padding:10px;
margin-bottom:6px;

border-radius:9px;

background:#292929;
color:white;

text-align:left;
}

/* TIMELINE */

.timeline{
position:absolute;

left:50%;
bottom:14px;

transform:translateX(-50%);

width:min(680px,calc(100vw - 28px));

z-index:1000;

padding:10px 12px;

border-radius:15px;

background:rgba(20,20,20,.90);

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.timeline-controls{
display:flex;
align-items:center;
gap:8px;
}

.timeline button{
width:36px;
height:32px;

border:0;
outline:0;

border-radius:8px;

background:#292929;
color:white;

font-size:15px;
}

#timeSlider{
flex:1;
min-width:0;
}

#timeLabel{
width:100px;
text-align:right;
color:white;
font-size:11px;
opacity:.85;
}

/* LOADING */

#loading{
position:absolute;

left:50%;
top:50%;

transform:translate(-50%,-50%);

z-index:2000;

display:none;

padding:9px 13px;

border-radius:10px;

background:rgba(20,20,20,.92);

color:white;

font-size:13px;
}

/* LIGHT */

body.light .top-panel,
body.light #layerDrawer,
body.light #settings,
body.light .timeline,
body.light #status{
background:rgba(255,255,255,.94);
}

body.light .logo,
body.light #status,
body.light .drawer-header{
color:#111;
}

body.light #selectedLayer,
body.light .icon-btn,
body.light .layer-item,
body.light .timeline button,
body.light .theme-btn{
background:#eeeeee;
color:#111;
}

body.light .layer-item.active{
background:#dddddd;
}

/* GREEN */

body.green .top-panel,
body.green #layerDrawer,
body.green #settings,
body.green .timeline,
body.green #status{
background:rgba(8,35,22,.94);
}

body.green #selectedLayer,
body.green .icon-btn,
body.green .layer-item,
body.green .timeline button,
body.green .theme-btn{
background:#123d29;
color:white;
}

body.green .layer-item.active{
background:#185538;
}

/* MOBILE */

@media(max-width:600px){

.top-panel{
top:8px;
left:8px;
right:8px;
height:54px;
gap:5px;
}

.logo{
font-size:21px;
margin-left:6px;
margin-right:3px;
}

#selectedLayer{
height:42px;
padding:0 11px;
font-size:16px;
}

.icon-btn{
width:38px;
height:38px;
border-radius:11px;
font-size:19px;
}

#layerDrawer{
top:70px;
width:calc(100% - 16px);
}

#status{
top:68px;
left:9px;
}

.timeline{
bottom:8px;
width:calc(100vw - 16px);
}

#timeLabel{
width:85px;
font-size:10px;
}

}

</style>
</head>

<body>

<div id="map"></div>

<!-- TOP -->

<div class="top-panel">

<div class="logo">
GPTrad
</div>

<button id="selectedLayer">

<span id="selectedLayerName">
Радар (RainViewer)
</span>

<span id="selectedLayerArrow">
▾
</span>

</button>

<button id="locateBtn" class="icon-btn">
⌖
</button>

<button id="reloadBtn" class="icon-btn">
↻
</button>

<button id="settingsBtn" class="icon-btn">
⚙
</button>

</div>


<!-- LAYERS -->

<div id="layerDrawer">

<div class="drawer-header">
Слои
</div>

<button class="layer-item active"
data-layer="radar">

<span class="layer-dot"></span>

<span>
Радар (RainViewer)
</span>

</button>

<button class="layer-item"
data-layer="oya">

<span class="layer-dot"></span>

<span>
Опасные явления
</span>

</button>

</div>


<div id="status">
Загрузка…
</div>


<div id="settings">

<div class="settings-title">
Оформление
</div>

<button class="theme-btn" data-theme="dark">
Тёмная
</button>

<button class="theme-btn" data-theme="light">
Светлая
</button>

<button class="theme-btn" data-theme="green">
Зелёная
</button>

</div>


<div class="timeline">

<div class="timeline-controls">

<button id="backBtn">
◀
</button>

<button id="playBtn">
▶
</button>

<button id="forwardBtn">
▶
</button>

<input id="timeSlider"
type="range"
min="0"
max="0"
value="0">

<div id="timeLabel">
—
</div>

</div>

</div>


<div id="loading">
Загрузка…
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   MAP
========================================================= */

const map=L.map("map",{

zoomControl:true,

attributionControl:true,

zoomSnap:0,

zoomDelta:.5,

zoomAnimation:false,

fadeAnimation:false,

markerZoomAnimation:false,

zoomAnimationThreshold:0,

touchZoom:true,

scrollWheelZoom:true,

wheelDebounceTime:20,

wheelPxPerZoomLevel:80,

doubleClickZoom:true,

dragging:true,

inertia:true,

inertiaDeceleration:3000,

easeLinearity:.2,

minZoom:2,

maxZoom:19

}).setView(
[55.75,37.61],
5
);


/* =========================================================
   OSM
========================================================= */

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

minZoom:2,

maxZoom:19,

tileSize:256,

updateWhenIdle:true,

updateWhenZooming:false,

keepBuffer:3,

attribution:"© OpenStreetMap"

}
).addTo(map);


/* =========================================================
   ELEMENTS
========================================================= */

const selectedLayer=
document.getElementById("selectedLayer");

const selectedLayerName=
document.getElementById("selectedLayerName");

const layerDrawer=
document.getElementById("layerDrawer");

const status=
document.getElementById("status");

const loading=
document.getElementById("loading");

const timeSlider=
document.getElementById("timeSlider");

const timeLabel=
document.getElementById("timeLabel");

const settings=
document.getElementById("settings");


/* =========================================================
   STATE
========================================================= */

let activeLayer="radar";

let radarLayer=null;

let oyaImage=null;

let oyaLoading=false;

let oyaRequestId=0;

let oyaRefreshTimer=null;

let rainFrames=[];

let currentFrame=0;

let playing=false;

let playTimer=null;

let rainFrameRequestId=0;


/* =========================================================
   HELPERS
========================================================= */

function setStatus(text){

status.textContent=text;

}


function showLoading(text){

loading.textContent=text;

loading.style.display="block";

}


function hideLoading(){

loading.style.display="none";

}


function formatTime(ts){

if(!ts)
return"—";

return new Date(ts*1000)
.toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =========================================================
   RAINVIEWER
========================================================= */

async function loadRainViewer(){

showLoading("Загрузка радара…");

try{

const r=await fetch(
"https://api.rainviewer.com/public/weather-maps.json",
{
cache:"no-store"
}
);

if(!r.ok)
throw new Error(
"RainViewer "+r.status
);

const data=await r.json();

rainFrames=
Array.isArray(data.radar?.past)
?data.radar.past
:[];

if(!rainFrames.length)
throw new Error(
"Нет кадров"
);


/*
Сортируем строго по времени.
*/

rainFrames.sort(
(a,b)=>a.time-b.time
);


/*
Текущий = последний доступный кадр.
*/

currentFrame=
rainFrames.length-1;


/*
RainViewer с 2026 года
имеет максимум zoom 7.
*/

timeSlider.min=0;

timeSlider.max=
rainFrames.length-1;

timeSlider.value=
currentFrame;

updateTimeLabel();

showRainFrame(
currentFrame
);

setStatus(
"Радар RainViewer"
);

}catch(e){

console.error(e);

setStatus(
"Ошибка RainViewer"
);

}finally{

hideLoading();

}

}


/* =========================================================
   REMOVE ALL RAIN LAYERS
========================================================= */

function removeAllRainLayers(){

map.eachLayer(
layer=>{

if(
layer instanceof L.TileLayer &&
layer!==osmLayer
){

const url=
layer.getTileUrl
?layer.getTileUrl({
x:0,
y:0,
z:0
})
:"";

if(
typeof url==="string" &&
url.includes("rainviewer")
){

map.removeLayer(layer);

}

}

}
);

}


/* =========================================================
   RAIN TILE
========================================================= */

function makeRainLayer(frame){

return L.tileLayer(

"https://tilecache.rainviewer.com"+
frame.path+
"/256/{z}/{x}/{y}/2/1_1.png",

{

tileSize:256,

opacity:1,

minZoom:2,

maxZoom:7,

zIndex:10,

updateWhenIdle:true,

updateWhenZooming:false,

keepBuffer:2,

noWrap:false

}

);

}


/* =========================================================
   RAIN FRAME
========================================================= */

function showRainFrame(index){

if(
!rainFrames[index]
)
return;

const frame=
rainFrames[index];

const requestId=
++rainFrameRequestId;


/*
Сразу убираем старый кадр.
*/

if(
radarLayer &&
map.hasLayer(
radarLayer
)
){

map.removeLayer(
radarLayer
);

}

radarLayer=null;


/*
Создаём только один
новый слой.
*/

const newLayer=
makeRainLayer(frame);

radarLayer=
newLayer;

newLayer.addTo(map);


/*
Если пользователь уже выбрал
другой кадр — ничего не делаем.
*/

newLayer.once(
"load",
()=>{

if(
requestId!==rainFrameRequestId
){

if(
map.hasLayer(newLayer)
){

map.removeLayer(newLayer);

}

return;

}

}
);


updateTimeLabel();

}


/* =========================================================
   OЯ WMS
========================================================= */

const OYA_WMS=
"https://www.nowcast.ru/baltrad_wsgi";

const OYA_LAYER=
"bufr_phenomena,"+
"bufr_novosib_phenomena,"+
"bufr_vlad_phenomena";


/* =========================================================
   WEB MERCATOR
========================================================= */

function lonToMercator(lon){

return lon*
20037508.34/
180;

}


function latToMercator(lat){

lat=Math.max(
-85.05112878,
Math.min(
85.05112878,
lat
)
);

return 6378137*
Math.log(
Math.tan(
Math.PI/4+
lat*Math.PI/360
)
);

}


/* =========================================================
   OЯ URL
========================================================= */

function makeOyaUrl(){

const bounds=
map.getBounds();

const sw=
bounds.getSouthWest();

const ne=
bounds.getNorthEast();

const size=
map.getSize();


const width=
Math.max(
256,
Math.min(
1600,
Math.round(size.x)
)
);


const height=
Math.max(
256,
Math.min(
1200,
Math.round(size.y)
)
);


const bbox=[

lonToMercator(
sw.lng
),

latToMercator(
sw.lat
),

lonToMercator(
ne.lng
),

latToMercator(
ne.lat
)

].join(",");


const params=
new URLSearchParams({

SERVICE:"WMS",

VERSION:"1.1.1",

REQUEST:"GetMap",

LAYERS:OYA_LAYER,

STYLES:"",

SRS:"EPSG:3857",

BBOX:bbox,

WIDTH:String(width),

HEIGHT:String(height),

FORMAT:"image/png",

TRANSPARENT:"true",

EXCEPTIONS:"application/vnd.ogc.se_inimage"

});


return OYA_WMS+
"?"+
params.toString();

}


/* =========================================================
   OЯ LOAD
========================================================= */

function loadOya(){

const requestId=
++oyaRequestId;

oyaLoading=true;

setStatus(
"Загрузка ОЯ…"
);


const url=
makeOyaUrl();

console.log(
"OЯ GetMap:",
url
);


const img=
new Image();


/*
Важно для внешнего WMS:
не отправляем Referer.
*/

img.referrerPolicy=
"no-referrer";


let finished=false;


const timeout=
setTimeout(
()=>{

if(finished)
return;

finished=true;

oyaLoading=false;

if(
requestId===
oyaRequestId
){

setStatus(
"ОЯ: сервер не ответил"
);

}

},
10000
);


img.onload=()=>{

if(finished)
return;

finished=true;

clearTimeout(
timeout
);


if(
requestId!==oyaRequestId
){

return;

}


const bounds=
map.getBounds();


const overlay=
L.imageOverlay(
url,
bounds,
{

opacity:.75,

interactive:false,

zIndex:50

}
);


overlay.addTo(map);


/*
Старый слой удаляем только
после успешной загрузки.
*/

if(
oyaImage &&
map.hasLayer(
oyaImage
)
){

map.removeLayer(
oyaImage
);

}


oyaImage=
overlay;

oyaLoading=false;

setStatus(
"Опасные явления"
);

};


img.onerror=()=>{

if(finished)
return;

finished=true;

clearTimeout(
timeout
);

oyaLoading=false;


if(
requestId===
oyaRequestId
){

setStatus(
"Ошибка ОЯ"
);

}

};


img.src=url;

}


/* =========================================================
   SHOW OЯ
========================================================= */

function showOya(){

/*
Убираем RainViewer.
*/

if(
radarLayer &&
map.hasLayer(
radarLayer
)
){

map.removeLayer(
radarLayer
);

}

radarLayer=null;


/*
Первый запрос OЯ.
*/

loadOya();

}


/* =========================================================
   OЯ REFRESH
========================================================= */

function scheduleOyaRefresh(){

if(
activeLayer!=="oya"
)
return;


clearTimeout(
oyaRefreshTimer
);


oyaRefreshTimer=
setTimeout(
()=>{

loadOya();

},
600
);

}


map.on(
"moveend",
scheduleOyaRefresh
);


/* =========================================================
   LAYER MENU
========================================================= */

selectedLayer.addEventListener(
"click",
()=>{

const open=
layerDrawer.classList.toggle(
"open"
);

selectedLayer.classList.toggle(
"open",
open
);

}
);


/* =========================================================
   SELECT LAYER
========================================================= */

document
.querySelectorAll(".layer-item")
.forEach(
button=>{

button.addEventListener(
"click",
()=>{

const type=
button.dataset.layer;


document
.querySelectorAll(".layer-item")
.forEach(
x=>{

x.classList.remove(
"active"
);

}
);


button.classList.add(
"active"
);


if(
type==="oya"
){

activeLayer=
"oya";

selectedLayerName.textContent=
"Опасные явления";

showOya();

}


if(
type==="radar"
){

activeLayer=
"radar";

selectedLayerName.textContent=
"Радар (RainViewer)";

showRadar();

}


layerDrawer.classList.remove(
"open"
);

selectedLayer.classList.remove(
"open"
);

}
);

}
);


/* =========================================================
   SHOW RADAR
========================================================= */

function showRadar(){

/*
Отменяем старые OЯ-запросы.
*/

oyaRequestId++;


/*
Удаляем OЯ.
*/

if(
oyaImage &&
map.hasLayer(
oyaImage
)
){

map.removeLayer(
oyaImage
);

}

oyaImage=null;


/*
Показываем RainViewer.
*/

if(
rainFrames.length
){

showRainFrame(
currentFrame
);

setStatus(
"Радар RainViewer"
);

}else{

loadRainViewer();

}

}


/* =========================================================
   TIME
========================================================= */

function updateTimeLabel(){

if(
activeLayer==="radar" &&
rainFrames[currentFrame]
){

timeLabel.textContent=
formatTime(
rainFrames[currentFrame].time
);

}else{

timeLabel.textContent=
"Сейчас";

}

}


/* =========================================================
   SLIDER
========================================================= */

timeSlider.addEventListener(
"input",
()=>{

if(
activeLayer!=="radar"
)
return;

currentFrame=
Number(
timeSlider.value
);

showRainFrame(
currentFrame
);

}
);


/* =========================================================
   BACK
========================================================= */

document
.getElementById("backBtn")
.addEventListener(
"click",
()=>{

if(
activeLayer!=="radar"
)
return;

if(
!rainFrames.length
)
return;


currentFrame=
Math.max(
0,
currentFrame-1
);


timeSlider.value=
currentFrame;


showRainFrame(
currentFrame
);

}
);


/* =========================================================
   FORWARD
========================================================= */

document
.getElementById("forwardBtn")
.addEventListener(
"click",
()=>{

if(
activeLayer!=="radar"
)
return;

if(
!rainFrames.length
)
return;


currentFrame=
Math.min(
rainFrames.length-1,
currentFrame+1
);


timeSlider.value=
currentFrame;


showRainFrame(
currentFrame
);

}
);


/* =========================================================
   PLAY
========================================================= */

document
.getElementById("playBtn")
.addEventListener(
"click",
()=>{

if(
activeLayer!=="radar"
)
return;

if(
!rainFrames.length
)
return;


playing=
!playing;


document
.getElementById("playBtn")
.textContent=
playing
?"Ⅱ"
:"▶";


clearInterval(
playTimer
);


if(
playing
){

playTimer=
setInterval(
()=>{

currentFrame++;


if(
currentFrame>=
rainFrames.length
){

currentFrame=0;

}


timeSlider.value=
currentFrame;


showRainFrame(
currentFrame
);

},
600
);

}

}
);


/* =========================================================
   LOCATION
========================================================= */

document
.getElementById("locateBtn")
.addEventListener(
"click",
()=>{

if(
!navigator.geolocation
){

setStatus(
"Геолокация недоступна"
);

return;

}


setStatus(
"Определение местоположения…"
);


navigator.geolocation.getCurrentPosition(

position=>{

map.flyTo(

[
position.coords.latitude,
position.coords.longitude
],

Math.max(
map.getZoom(),
8
),

{
duration:.8
}

);


setStatus(
"Ваше местоположение"
);

},

()=>{

setStatus(
"Не удалось определить местоположение"
);

},

{

enableHighAccuracy:true,

timeout:10000

}

);

}
);


/* =========================================================
   RELOAD
========================================================= */

document
.getElementById("reloadBtn")
.addEventListener(
"click",
()=>{

if(
activeLayer==="oya"
){

loadOya();

}else{

loadRainViewer();

}

}
);


/* =========================================================
   SETTINGS
========================================================= */

document
.getElementById("settingsBtn")
.addEventListener(
"click",
()=>{

settings.classList.toggle(
"open"
);

}
);


document
.querySelectorAll(".theme-btn")
.forEach(
button=>{

button.addEventListener(
"click",
()=>{

const theme=
button.dataset.theme;


document.body.classList.remove(
"light",
"green"
);


if(
theme!=="dark"
){

document.body.classList.add(
theme
);

}


localStorage.setItem(
"gptrad-theme",
theme
);

}
);

}
);


/* =========================================================
   THEME
========================================================= */

const savedTheme=
localStorage.getItem(
"gptrad-theme"
);


if(
savedTheme
){

document.body.classList.remove(
"light",
"green"
);


if(
savedTheme!=="dark"
){

document.body.classList.add(
savedTheme
);

}

}


/* =========================================================
   CLOSE MENU
========================================================= */

map.on(
"click",
()=>{

layerDrawer.classList.remove(
"open"
);

selectedLayer.classList.remove(
"open"
);

}
);


/* =========================================================
   START
========================================================= */

const osmLayer=
map.eachLayer
?map._layers[
Object.keys(map._layers)[0]
]
:null;

loadRainViewer();

</script>

</body>
</html>
