<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг ДМРЛ</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #121212; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; }
        
        .status-card {
            position: absolute;
            top: 15px; left: 50px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(6px);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 13px;
        }
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="status-card">
    <div><span class="status-dot"></span><strong>Слой:</strong> Объединённый ДМРЛ (Эхо осадков)</div>
    <div style="color: #aaa; margin-top: 4px;">Тип: Радарная отражаемость (dBZ)</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Инициализация карты Leaflet
    const map = L.map('map', {
        center: [55.751244, 37.618423],
        zoom: 6,
        zoomControl: true
    });

    // 2. Тёмная контрастная подложка (чтобы радар выделялся)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 18,
        subdomains: 'abcd'
    }).addTo(map);

    // 3. Подключение WMS-слоя ДМРЛ
    // Стандартный WMS-запрос, создающий тайлы на лету по BBOX координат
    const dmrlRadar = L.tileLayer.wms('https://radar.rmc.ru/geoserver/wms', {
        layers: 'dmrl:composite',
        format: 'image/png',
        transparent: true,
        version: '1.1.1',
        opacity: 0.75,
        zIndex: 500
    });

    dmrlRadar.addTo(map);
</script>

</body>
</html>
