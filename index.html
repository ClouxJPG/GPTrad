<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COOLrad</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.4.0/ol.css"><style>:root{--p:#081c2edd;--l:#2e526c;--a:#58d5ff;--t:#eaf7ff;--m:#9db8ca}*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}body{background:#0b1724;color:var(--t);font:14px Arial,sans-serif}#map{position:absolute;inset:0}.glass{background:var(--p);border:1px solid var(--l);box-shadow:0 14px 35px #02081799;backdrop-filter:blur(12px)}#top{position:absolute;z-index:5;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.brand,.tools{pointer-events:auto}.brand{padding:11px 15px;border-radius:13px;font-weight:900;letter-spacing:.12em}.brand b{color:var(--a)}small{display:block;color:var(--m);font-size:9px;margin-top:4px}.tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--l);border-radius:9px;background:#0d2a40;color:var(--t);padding:9px 11px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--a)}#panel{position:absolute;z-index:6;right:14px;top:70px;width:min(360px,calc(100% - 28px));padding:15px;border-radius:14px;transform:translateX(120%);transition:.2s}.open{transform:translateX(0)!important}.row{margin:13px 0}.row label{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin-bottom:6px}select,input{width:100%}select{padding:8px;background:#0b293e;color:var(--t);border:1px solid var(--l);border-radius:8px}#status{position:absolute;z-index:6;left:14px;bottom:94px;padding:9px 11px;border-radius:9px;color:var(--m);font-size:12px}#status.ok{color:#aaf2c2}#status.err{color:#ffc5c5}#timeline{position:absolute;z-index:6;left:14px;right:14px;bottom:14px;padding:9px 13px;border-radius:13px}#timelineHead{display:flex;justify-content:space-between;color:var(--m);font-size:11px;margin-bottom:4px}#slider{accent-color:var(--a)}.ol-zoom{left:14px!important;top:105px!important}.ol-control button{background:#09243a!important;color:white!important;border:1px solid var(--l)!important}@media(max-width:600px){#top{top:9px;left:9px;right:9px}.brand{padding:9px;font-size:12px}.btn{padding:8px;font-size:11px}#status{left:9px;bottom:84px}#timeline{left:9px;right:9px;bottom:9px}}</style></head>
<body><div id="map"></div><header id="top"><div class="brand glass"><b>●</b> COOLrad<small>REAL RADAR • РОССИЯ</small></div><div class="tools"><button class="btn glass" id="refresh">↻ Обновить</button><button class="btn glass" id="locate">⌖ Россия</button><button class="btn glass" id="settings">⚙ Панель</button></div></header><aside id="panel" class="glass"><b style="font-size:17px">Управление</b><button class="btn" id="close" style="float:right">×</button><div class="row"><label>Город</label><select id="city"><option value="100,61,3">Вся Россия</option><option value="37.62,55.75,7">Москва</option><option value="30.31,59.94,7">Санкт-Петербург</option><option value="56.84,60.61,7">Екатеринбург</option><option value="82.92,55.03,6">Новосибирск</option><option value="49.11,55.79,7">Казань</option></select></div><div class="row"><label>Прозрачность <span id="opacityText">78%</span></label><input id="opacity" type="range" min="0" max="100" value="78"></div><div class="row"><button class="btn" id="fullscreen">⛶ Полный экран</button> <button class="btn" id="source">↗ Источник</button></div><div style="color:var(--m);font-size:11px;line-height:1.5">Запросы выполняются только вручную. Данные: опубликованный радарный композит Meteoinfo/Росгидромета.</div></aside><div id="status" class="glass">Инициализация карты…</div><div id="timeline" class="glass"><div id="timelineHead"><span>РАДАРНЫЙ КОМПОЗИТ</span><span id="time">—</span></div><input id="slider" type="range" min="0" max="0" value="0" disabled></div>
<script src="https://cdn.jsdelivr.net/npm/ol@7.4.0/dist/ol.js"></script><script>
"use strict";
const status=document.getElementById("status");let radar=null,radarUrl=null;const light=new ol.layer.Tile({source:new ol.source.OSM({attributions:"© OpenStreetMap contributors"})});const dark=new ol.layer.Tile({source:new ol.source.OSM()});dark.setClassName("dark");const map=new ol.Map({target:"map",layers:[light],view:new ol.View({center:ol.proj.fromLonLat([100,61]),zoom:3,minZoom:2,maxZoom:10}),controls:ol.control.defaults({rotate:false})});const extent=ol.proj.transformExtent([20,35,180,82],"EPSG:4326","EPSG:3857");function say(t,c=""){status.className="glass "+c;status.textContent=t}function center(v){const [x,y,z]=v.split(",").map(Number);map.getView().animate({center:ol.proj.fromLonLat([x,y]),zoom:z,duration:400})}async function loadRadar(){const b=document.getElementById("refresh");b.disabled=true;say("Загрузка радарного композита…");try{const r=await fetch("/api/meteoinfo?request="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const blob=await r.blob();if(!blob.type.startsWith("image/"))throw Error("сервер вернул не изображение");const nextUrl=URL.createObjectURL(blob);const next=new ol.layer.Image({source:new ol.source.ImageStatic({url:nextUrl,imageExtent:extent,projection:"EPSG:3857"}),opacity:Number(document.getElementById("opacity").value)/100});if(radar)map.removeLayer(radar);if(radarUrl)URL.revokeObjectURL(radarUrl);radar=next;radarUrl=nextUrl;map.addLayer(radar);document.getElementById("time").textContent="последний кадр • "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});say("Радар отображён","ok")}catch(e){console.error(e);say("⚠ Радар не загрузился: "+e.message,"err")}finally{b.disabled=false}}document.getElementById("refresh").onclick=loadRadar;document.getElementById("locate").onclick=()=>center("100,61,3");document.getElementById("city").onchange=e=>center(e.target.value);document.getElementById("settings").onclick=()=>document.getElementById("panel").classList.toggle("open");document.getElementById("close").onclick=()=>document.getElementById("panel").classList.remove("open");document.getElementById("opacity").oninput=e=>{document.getElementById("opacityText").textContent=e.target.value+"%";if(radar)radar.setOpacity(e.target.value/100)};document.getElementById("fullscreen").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.getElementById("source").onclick=()=>window.open("https://meteoinfo.ru/radanim","_blank");loadRadar();
</script></body></html>
