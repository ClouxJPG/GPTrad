<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GPTrad</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.4.0/ol.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#111}
#map{position:absolute;inset:0;z-index:1;background:#d8d8d8}
.dark-osm-layer img,.dark-osm-layer canvas{filter:invert(1) hue-rotate(180deg) brightness(.72) contrast(1.05)}
.ol-zoom{position:absolute;top:82px;left:12px}
.ol-control{background:transparent!important;padding:0!important}
.ol-zoom button{display:block;width:38px;height:38px;margin:3px;border:0;border-radius:10px;background:rgba(28,28,28,.9)!important;color:white!important;font-size:22px;line-height:36px;cursor:pointer}
.ol-attribution{right:8px!important;bottom:4px!important}
.ol-attribution button{background:rgba(28,28,28,.8)!important;color:white!important;border-radius:8px}
#ui{position:absolute;inset:0;z-index:20;pointer-events:none}
button,input{font:inherit}
.ui-btn{pointer-events:auto;border:0;color:#fff;background:rgba(25,25,25,.9);border-radius:11px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#locateBtn{position:absolute;top:12px;left:12px}
#settingsBtn{position:absolute;top:62px;left:12px}
#searchBtn{position:absolute;top:12px;right:12px}
#sidePanel{position:absolute;right:0;top:0;height:100%;width:310px;transform:translateX(100%);transition:transform .2s ease;background:rgba(20,20,20,.96);color:#fff;pointer-events:auto;overflow-y:auto;padding:18px 16px 90px;box-shadow:-5px 0 20px rgba(0,0,0,.35)}
#sidePanel.open{transform:translateX(0)}
#panelToggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:30;width:28px;height:70px;border:0;border-radius:12px 0 0 12px;background:rgba(25,25,25,.9);color:#fff;pointer-events:auto}
#sidePanel h2{font-size:18px;margin:8px 0 18px}
.panel-row{margin:14px 0}

<script src="https://cdn.jsdelivr.net/npm/ol@7.4.0/dist/ol.js"></script>
<script>
"use strict";

const {
 Map:OlMap,
 View,
 TileLayer,
 ImageLayer,
 Tile,
 Image:OlImage,
 Overlay,
 proj,
 source,
 layer
}=ol;

const {
 OSM,
 XYZ,
 ImageStatic
}=source;

const OYA_PROXY="/api/oya";

const OYA_PALETTE_STORAGE_KEY="gptrad-oya-palette";
const REFLECTIVITY_PALETTE_STORAGE_KEY="gptrad-reflectivity-palette";
const OYA_OPACITY_STORAGE_KEY="gptrad-oya-opacity";

const DEFAULT_OYA_PALETTE=[
 {color:"#00ff00",min:0,max:10},
 {color:"#00cc00",min:10,max:20},
 {color:"#009900",min:20,max:30},
 {color:"#0066ff",min:30,max:40},
 {color:"#0033cc",min:40,max:50},
 {color:"#00ffff",min:50,max:60},
 {color:"#ffff00",min:60,max:70},
 {color:"#ff9900",min:70,max:80},
 {color:"#ff3300",min:80,max:90},
 {color:"#cc0000",min:90,max:100}
];

const DEFAULT_REFLECTIVITY_PALETTE=[
 {min:-10,max:0,color:"#7b7b7b"},
 {min:0,max:5,color:"#4aa3df"},
 {min:5,max:10,color:"#43c96b"},
 {min:10,max:15,color:"#7ed957"},
 {min:15,max:20,color:"#d5e84b"},
 {min:20,max:25,color:"#ffe34d"},
 {min:25,max:30,color:"#ffb52e"},
 {min:30,max:35,color:"#ff7a24"},
 {min:35,max:40,color:"#ff4b2b"},
 {min:40,max:45,color:"#ef3030"},
 {min:45,max:50,color:"#d51e3d"},
 {min:50,max:55,color:"#b51d68"},
 {min:55,max:60,color:"#8c2ca8"},
 {min:60,max:65,color:"#642cae"},
 {min:65,max:70,color:"#3e277f"}
];

let activeLayer="radar";
let radarLayer=null;
let reflectivityLayer=null;
let rainFrames=[];
let currentFrame=0;
let playing=false;
let playTimer=null;

let oyaAllTimes=[];
let oyaTimes=[];
let oyaFrameCount=50;
let oyaFrameIndex=0;
let oyaImage=null;
let oyaImageBlobUrl=null;

let reflectivityFrameIndex=0;
let reflectivityRequestId=0;
let oyaRequestId=0;

let oyaCapabilitiesLoaded=false;
let oyaCapabilitiesLoading=false;
let oyaPreloading=false;
let viewportTimer=null;
let oyaRefreshTimer=null;

const OYA_REFRESH_INTERVAL=10*60*1000;

const oyaLoadedTimes=new Set();
const reflectivityLoadedTimes=new Set();

const oyaFrameCache=new Map();
const reflectivityFrameCache=new Map();

const oyaPendingRequests=new Map();
const reflectivityPendingRequests=new Map();

let viewportGeneration=0;
let preloadGeneration=0;

let oyaOpacity=90;

let oyaPalette=loadPalette(
 OYA_PALETTE_STORAGE_KEY,
 DEFAULT_OYA_PALETTE
);

let reflectivityPalette=loadPalette(
 REFLECTIVITY_PALETTE_STORAGE_KEY,
 DEFAULT_REFLECTIVITY_PALETTE
);

const REFLECTIVITY_SOURCE_COLORS=DEFAULT_REFLECTIVITY_PALETTE.map(
 item=>hexToRgb(item.color)
);

let reflectivityPaletteVersion=0;

const map=new OlMap({
 target:"map",
 layers:[],
 view:new View({
  center:proj.fromLonLat([56.0,54.7]),
  zoom:5
 }),
 controls:ol.control.defaults({
  zoom:true,
  attribution:true,
  rotate:false
 })
});

const osmLayer=new TileLayer({
 source:new OSM()
});

osmLayer.setClassName("dark-osm-layer");

map.addLayer(osmLayer);

const oyaTimelineSegments=document.getElementById("oyaTimelineSegments");
const oyaTimelineProgress=document.getElementById("oyaTimelineProgress");
const oyaTimelineProgressFill=document.getElementById("oyaTimelineProgressFill");
const frameSlider=document.getElementById("frameSlider");
const timeLabel=document.getElementById("timeLabel");
const panelToggle=document.getElementById("panelToggle");
const sidePanel=document.getElementById("sidePanel");
const settingsBtn=document.getElementById("settingsBtn");
const oyaOpacitySlider=document.getElementById("oyaOpacitySlider");
const oyaOpacityValue=document.getElementById("oyaOpacityValue");
const frameCountInput=document.getElementById("frameCountInput");
const oyaPaletteRows=document.getElementById("oyaPaletteRows");
const reflectivityPaletteRows=document.getElementById("reflectivityPaletteRows");

function loadPalette(key,fallback){
 try{
  const value=JSON.parse(localStorage.getItem(key)||"");
  if(Array.isArray(value)&&value.length)return value;
 }catch(e){}
 return fallback.map(x=>({...x}));
}

function savePalette(key,value){
 try{
  localStorage.setItem(key,JSON.stringify(value));
 }catch(e){}
}

function hexToRgb(hex){
 const clean=String(hex||"").replace("#","");
 if(clean.length!==6)return {r:255,g:255,b:255};
 return{
  r:parseInt(clean.slice(0,2),16),
  g:parseInt(clean.slice(2,4),16),
  b:parseInt(clean.slice(4,6),16)
 };
}

function rgbToHex(r,g,b){
 return "#"+[r,g,b].map(
  x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")
 ).join("");
}

function nearestReflectivitySourceIndex(r,g,b){
 let best=0;
 let bestDistance=Infinity;

 for(let i=0;i<REFLECTIVITY_SOURCE_COLORS.length;i++){
  const c=REFLECTIVITY_SOURCE_COLORS[i];
  const dr=r-c.r;
  const dg=g-c.g;
  const db=b-c.b;
  const d=dr*dr+dg*dg+db*db;

  if(d<bestDistance){
   bestDistance=d;
   best=i;
  }
 }

 return best;
}

function getReflectivityColorForSourceIndex(index){
 const item=reflectivityPalette[index];
 return item?.color||DEFAULT_REFLECTIVITY_PALETTE[index]?.color||"#ffffff";
}

function renderReflectivityPalette(){
 reflectivityPaletteRows.innerHTML="";

 reflectivityPalette.forEach((item,index)=>{
  const row=document.createElement("div");
  row.className="palette-row";

  const color=document.createElement("input");
  color.type="color";
  color.value=item.color;

  const text=document.createElement("span");
  text.textContent=`${item.min}–${item.max} dBZ`;

  color.addEventListener("input",()=>{
   reflectivityPalette[index].color=color.value;
   reflectivityPaletteVersion++;
   savePalette(
    REFLECTIVITY_PALETTE_STORAGE_KEY,
    reflectivityPalette
   );
   invalidateReflectivityCacheForPalette();
   if(activeLayer==="reflectivity"){
    loadReflectivityFrame(reflectivityFrameIndex,{
     forceViewport:true,
     viewportGeneration
    });
   }
  });

  row.appendChild(color);
  row.appendChild(text);
  reflectivityPaletteRows.appendChild(row);
 });
}

function renderOyaPalette(){
 oyaPaletteRows.innerHTML="";

 oyaPalette.forEach((item,index)=>{
  const row=document.createElement("div");
  row.className="palette-row";

  const color=document.createElement("input");
  color.type="color";
  color.value=item.color;

  const text=document.createElement("span");
  text.textContent=`${item.min}–${item.max}`;

  color.addEventListener("input",()=>{
   oyaPalette[index].color=color.value;
   savePalette(OYA_PALETTE_STORAGE_KEY,oyaPalette);
   invalidateOyaProcessing();

   if(activeLayer==="oya"){
    loadOyaFrame(oyaFrameIndex,{
     forceViewport:true,
     viewportGeneration
    });
   }
  });

  row.appendChild(color);
  row.appendChild(text);
  oyaPaletteRows.appendChild(row);
 });
}

function setOyaOpacity(percent){
 let value=Number(percent);

 if(!Number.isFinite(value)){
  value=90;
 }

 value=Math.max(
  0,
  Math.min(100,Math.round(value))
 );

 oyaOpacity=value;
 oyaOpacitySlider.value=String(value);
 oyaOpacityValue.textContent=value+"%";

 localStorage.setItem(
  OYA_OPACITY_STORAGE_KEY,
  String(value)
 );

 if(oyaImage){
  oyaImage.setOpacity(value/100);
 }

 if(reflectivityLayer){
  reflectivityLayer.setOpacity(value/100);
 }

 map.render();
}

function getCurrentMapExtent(){
 const size=map.getSize();

 if(!size||!size[0]||!size[1]){
  return map.getView().calculateExtent([1024,768]);
 }

 return map.getView().calculateExtent(size);
}

function getCurrentMapSize(){
 const size=map.getSize();

 return[
  Math.max(256,Math.round(size?.[0]||1024)),
  Math.max(256,Math.round(size?.[1]||768))
 ];
}

function createWmsUrl(layerName,time,extent,size){
 const currentExtent=extent||getCurrentMapExtent();
 const currentSize=size||getCurrentMapSize();

 const params=new URLSearchParams({
  SERVICE:"WMS",
  VERSION:"1.1.1",
  REQUEST:"GetMap",
  LAYERS:layerName,
  STYLES:"",
  SRS:"EPSG:3857",
  BBOX:currentExtent.join(","),
  WIDTH:String(currentSize[0]),
  HEIGHT:String(currentSize[1]),
  FORMAT:"image/png",
  TRANSPARENT:"true",
  TIME:new Date(time*1000).toISOString()
 });

 return OYA_PROXY+"?action=image&"+params.toString();
}

function revokeUrl(url){
 if(url){
  try{
   URL.revokeObjectURL(url);
  }catch(e){}
 }
}

function waitForImageReady(url){
 return new Promise((resolve,reject)=>{
  const img=new Image();

  img.onload=()=>{
   requestAnimationFrame(()=>{
    resolve(img);
   });
  };

  img.onerror=()=>{
   reject(new Error("image load failed"));
  };

  img.src=url;
 });
}

async function fetchImageBlob(url){
 const response=await fetch(url,{
  cache:"no-store"
 });

 if(!response.ok){
  throw new Error("HTTP "+response.status);
 }

 return await response.blob();
}

async function blobToCleanUrl(blob,processor){
 const rawUrl=URL.createObjectURL(blob);

 try{
  const image=await waitForImageReady(rawUrl);

  const canvas=document.createElement("canvas");
  canvas.width=image.naturalWidth||image.width;
  canvas.height=image.naturalHeight||image.height;

  const ctx=canvas.getContext("2d",{
   willReadFrequently:true
  });

  ctx.drawImage(image,0,0);

  processor(ctx,canvas);

  const cleanBlob=await new Promise(resolve=>{
   canvas.toBlob(
    resolve,
    "image/png"
   );
  });

  if(!cleanBlob){
   throw new Error("canvas conversion failed");
  }

  const cleanUrl=URL.createObjectURL(cleanBlob);

  return{
   rawUrl,
   cleanUrl,
   width:canvas.width,
   height:canvas.height
  };

 }catch(error){
  revokeUrl(rawUrl);
  throw error;
 }
}

function processOyaCanvas(ctx,canvas){
 const imageData=ctx.getImageData(
  0,0,
  canvas.width,
  canvas.height
 );

 const data=imageData.data;

 for(let i=0;i<data.length;i+=4){
  const alpha=data[i+3];

  if(alpha===0)continue;

  const r=data[i];
  const g=data[i+1];
  const b=data[i+2];

  if(
   r>245&&
   g>245&&
   b>245
  ){
   data[i+3]=0;
   continue;
  }

  let best=null;

  for(const item of oyaPalette){
   const c=hexToRgb(item.color);
   const distance=
    (r-c.r)*(r-c.r)+
    (g-c.g)*(g-c.g)+
    (b-c.b)*(b-c.b);

   if(!best||distance<best.distance){
    best={
     distance,
     color:c
    };
   }
  }

  if(best){
   data[i]=best.color.r;
   data[i+1]=best.color.g;
   data[i+2]=best.color.b;
  }
 }

 ctx.putImageData(imageData,0,0);
}

function processReflectivityCanvas(ctx,canvas){
 const imageData=ctx.getImageData(
  0,0,
  canvas.width,
  canvas.height
 );

 const data=imageData.data;

 for(let i=0;i<data.length;i+=4){
  const alpha=data[i+3];

  if(alpha===0)continue;

  const r=data[i];
  const g=data[i+1];
  const b=data[i+2];

  const max=Math.max(r,g,b);
  const min=Math.min(r,g,b);

  /*
   * Gray/near-gray background from the WMS is transparent.
   */
  if(
   max-min<18&&
   max>70
  ){
   data[i+3]=0;
   continue;
  }

  const sourceIndex=nearestReflectivitySourceIndex(
   r,g,b
  );

  const source=REFLECTIVITY_SOURCE_COLORS[sourceIndex];

  const distance=Math.sqrt(
   (r-source.r)*(r-source.r)+
   (g-source.g)*(g-source.g)+
   (b-source.b)*(b-source.b)
  );

  /*
   * Keep unrelated pixels transparent rather than
   * inventing a dBZ classification.
   */
  if(distance>105){
   data[i+3]=0;
   continue;
  }

  const target=hexToRgb(
   getReflectivityColorForSourceIndex(sourceIndex)
  );

  data[i]=target.r;
  data[i+1]=target.g;
  data[i+2]=target.b;
 }

 ctx.putImageData(imageData,0,0);
}

function invalidateReflectivityCacheForPalette(){
 const keep=reflectivityLayer?.__reflectivityCleanUrl||null;

 for(const item of reflectivityFrameCache.values()){
  revokeUrl(item?.rawUrl);

  if(
   item?.cleanUrl&&
   item.cleanUrl!==keep
  ){
   revokeUrl(item.cleanUrl);
  }
 }

 reflectivityFrameCache.clear();
 reflectivityLoadedTimes.clear();

 renderOyaTimeline();
}

function invalidateOyaProcessing(){
 oyaRequestId++;
 reflectivityRequestId++;

 const keepOyaUrl=oyaImage?.__oyaCleanUrl||null;

 for(const item of oyaFrameCache.values()){
  revokeUrl(item?.rawUrl);

  if(
   item?.cleanUrl&&
   item.cleanUrl!==keepOyaUrl
  ){
   revokeUrl(item.cleanUrl);
  }
 }

 oyaFrameCache.clear();

 const keepReflectivityUrl=
  reflectivityLayer?.__reflectivityCleanUrl||null;

 for(const item of reflectivityFrameCache.values()){
  revokeUrl(item?.rawUrl);

  if(
   item?.cleanUrl&&
   item.cleanUrl!==keepReflectivityUrl
  ){
   revokeUrl(item.cleanUrl);
  }
 }

 reflectivityFrameCache.clear();

 resetLoadedTimeline();
}

function removeOyaDisplayedLayer(){
 if(oyaImage){
  try{
   map.removeLayer(oyaImage);
  }catch(e){}
 }

 oyaImage=null;
 oyaImageBlobUrl=null;

 removeRadarDataMaskImage();
}

function removeReflectivityDisplayedLayer(){
 if(reflectivityLayer){
  try{
   map.removeLayer(reflectivityLayer);
  }catch(e){}
 }

 reflectivityLayer=null;
}

function addImageLayer(cleanUrl,extent,opacity){
 const sourceObj=new ImageStatic({
  url:cleanUrl,
  imageExtent:extent,
  projection:"EPSG:3857"
 });

 const imageLayer=new ImageLayer({
  source:sourceObj,
  opacity:opacity
 });

 map.addLayer(imageLayer);

 return imageLayer;
}

function showOyaFrame(time,result,requestId){
 if(requestId!==oyaRequestId){
  return false;
 }

 const cleanUrl=result.cleanUrl;

 const newLayer=addImageLayer(
  cleanUrl,
  result.extent,
  oyaOpacity/100
 );

 newLayer.__oyaCleanUrl=cleanUrl;

 if(requestId!==oyaRequestId){
  try{
   map.removeLayer(newLayer);
  }catch(e){}
  return false;
 }

 const oldLayer=oyaImage;

 oyaImage=newLayer;
 oyaImageBlobUrl=cleanUrl;

 removeReflectivityDisplayedLayer();

 if(oldLayer){
  try{
   map.removeLayer(oldLayer);
  }catch(e){}
 }

 oyaFrameIndex=oyaTimes.indexOf(time);

 if(oyaFrameIndex<0){
  oyaFrameIndex=0;
 }

 frameSlider.value=String(oyaFrameIndex);

 updateTimeLabel();

 return true;
}

function showReflectivityFrame(time,result,requestId){
 if(requestId!==reflectivityRequestId){
  return false;
 }

 const cleanUrl=result.cleanUrl;

 const newLayer=addImageLayer(
  cleanUrl,
  result.extent,
  oyaOpacity/100
 );

 newLayer.__reflectivityCleanUrl=cleanUrl;

 if(requestId!==reflectivityRequestId){
  try{
   map.removeLayer(newLayer);
  }catch(e){}
  return false;
 }

 const oldLayer=reflectivityLayer;

 reflectivityLayer=newLayer;

 removeOyaDisplayedLayer();

 if(oldLayer){
  try{
   map.removeLayer(oldLayer);
  }catch(e){}
 }

 reflectivityFrameIndex=oyaTimes.indexOf(time);

 if(reflectivityFrameIndex<0){
  reflectivityFrameIndex=0;
 }

 frameSlider.value=String(reflectivityFrameIndex);

 updateTimeLabel();

 return true;
}

async function prepareOyaResult(
 time,
 result,
 requestId
){
 if(requestId!==oyaRequestId){
  return null;
 }

 if(result?.cleanUrl){
  return result;
 }

 const extent=result.extent;
 const size=result.size;
 const url=result.url;

 const blob=await fetchImageBlob(url);

 if(requestId!==oyaRequestId){
  return null;
 }

 const processed=await blobToCleanUrl(
  blob,
  processOyaCanvas
 );

 revokeUrl(processed.rawUrl);

 if(requestId!==oyaRequestId){
  revokeUrl(processed.cleanUrl);
  return null;
 }

 return{
  time,
  rawUrl:null,
  cleanUrl:processed.cleanUrl,
  extent,
  size
 };
}

async function prepareReflectivityResult(
 time,
 result,
 requestId
){
 if(requestId!==reflectivityRequestId){
  return null;
 }

 if(result?.cleanUrl){
  return result;
 }

 const blob=await fetchImageBlob(result.url);

 if(requestId!==reflectivityRequestId){
  return null;
 }

 const processed=await blobToCleanUrl(
  blob,
  processReflectivityCanvas
 );

 revokeUrl(processed.rawUrl);

 if(requestId!==reflectivityRequestId){
  revokeUrl(processed.cleanUrl);
  return null;
 }

 return{
  time,
  rawUrl:null,
  cleanUrl:processed.cleanUrl,
  extent:result.extent,
  size:result.size
 };
}

async function loadOyaFrame(index,options={}){
 if(activeLayer!=="oya")return;

 if(!oyaTimes.length)return;

 const time=oyaTimes[
  Math.max(
   0,
   Math.min(oyaTimes.length-1,index)
  )
 ];

 const requestId=++oyaRequestId;

 const generation=
  options.viewportGeneration??viewportGeneration;

 const extent=getCurrentMapExtent();
 const size=getCurrentMapSize();

 let cached=oyaFrameCache.get(time);

 if(
  cached&&
  !options.forceViewport
 ){
  if(
   showOyaFrame(
    time,
    cached,
    requestId
   )
  ){
   oyaLoadedTimes.add(time);
   renderOyaTimeline();
  }

  return;
 }

 /*
  * Even when the time is cached, a changed viewport
  * requires a new WMS image for the new extent.
  */
 if(options.forceViewport){
  cached=null;
 }

 if(oyaPendingRequests.has(time)&&!cached){
  try{
   const result=await oyaPendingRequests.get(time);

   if(
    requestId!==oyaRequestId||
    generation!==viewportGeneration
   ){
    return;
   }

   const prepared=await prepareOyaResult(
    time,
    result,
    requestId
   );

   if(!prepared)return;

   oyaFrameCache.set(time,prepared);
   oyaLoadedTimes.add(time);

   showOyaFrame(
    time,
    prepared,
    requestId
   );

   renderOyaTimeline();

  }catch(e){}

  return;
 }

 const url=createWmsUrl(
  "bufr_dbz1",
  time,
  extent,
  size
 );

 const requestPromise=(
  async()=>{
   const blob=await fetchImageBlob(url);

   const processed=await blobToCleanUrl(
    blob,
    processOyaCanvas
   );

   revokeUrl(processed.rawUrl);

   return{
    time,
    rawUrl:null,
    cleanUrl:processed.cleanUrl,
    extent,
    size
   };
  }
 )();

 oyaPendingRequests.set(
  time,
  requestPromise
 );

 try{
  const result=await requestPromise;

  if(
   requestId!==oyaRequestId||
   generation!==viewportGeneration
  ){
   if(
    !oyaFrameCache.has(time)
   ){
    revokeUrl(result.cleanUrl);
   }
   return;
  }

  oyaFrameCache.set(
   time,
   result
  );

  oyaLoadedTimes.add(time);

  showOyaFrame(
   time,
   result,
   requestId
  );

  renderOyaTimeline();

 }catch(e){

 }finally{
  if(
   oyaPendingRequests.get(time)===requestPromise
  ){
   oyaPendingRequests.delete(time);
  }
 }
}

function getLoadedSet(){
 return activeLayer==="reflectivity"
  ?reflectivityLoadedTimes
  :oyaLoadedTimes;
}

function resetLoadedTimeline(){
 oyaLoadedTimes.clear();
 reflectivityLoadedTimes.clear();

}

function renderOyaTimeline(){
 oyaTimelineSegments.innerHTML="";

 if(
  activeLayer!=="oya"&&
  activeLayer!=="reflectivity"
 ){
  oyaTimelineSegments.style.display="none";
  oyaTimelineProgress.style.display="none";
  return;
 }

 if(!oyaTimes.length){
  oyaTimelineSegments.style.display="none";
  oyaTimelineProgress.style.display="none";
  return;
 }

 const loadedSet=getLoadedSet();
 const total=oyaTimes.length;

 const currentIndex=
  activeLayer==="reflectivity"
   ?reflectivityFrameIndex
   :oyaFrameIndex;

 if(total>70){
  oyaTimelineSegments.style.display="none";
  oyaTimelineProgress.style.display="block";

  const loadedCount=oyaTimes.filter(
   time=>loadedSet.has(time)
  ).length;

  const percent=total
   ?Math.max(
    0,
    Math.min(
     100,
     loadedCount/total*100
    )
   )
   :0;

  oyaTimelineProgressFill.style.width=
   percent+"%";

  return;
 }

 oyaTimelineProgress.style.display="none";
 oyaTimelineSegments.style.display="flex";

 oyaTimes.forEach((time,index)=>{
  const segment=document.createElement("div");

  segment.className="oya-segment";

  if(loadedSet.has(time)){
   segment.classList.add("loaded");
  }

  if(index===currentIndex){
   segment.classList.add("active");
  }

  segment.addEventListener("click",()=>{
   if(activeLayer==="oya"){
    oyaFrameIndex=index;
    loadOyaFrame(index);
   }else if(activeLayer==="reflectivity"){
    reflectivityFrameIndex=index;
    loadReflectivityFrame(index);
   }
  });

  oyaTimelineSegments.appendChild(segment);
 });
}

function updateTimeLabel(){
 let time=null;

 if(activeLayer==="oya"){
  time=oyaTimes[oyaFrameIndex];
 }else if(activeLayer==="reflectivity"){
  time=oyaTimes[reflectivityFrameIndex];
 }else if(
  rainFrames.length&&
  rainFrames[currentFrame]
 ){
  time=rainFrames[currentFrame].time;
 }

 if(!time){
  timeLabel.textContent="—";
  return;
 }

 const date=new Date(
  typeof time==="number"
   ?time*1000
   :time
 );

  date.toLocaleString(

   {
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
   }
  );
}

function extractTimesFromCapabilities(xmlText){
 const xml=new DOMParser().parseFromString(
  xmlText,
  "text/xml"
 );

 const values=[];

 const dimensionNodes=[
  ...xml.getElementsByTagName("Dimension"),
  ...xml.getElementsByTagName("Extent")
 ];

 for(const node of dimensionNodes){
  const name=String(
   node.getAttribute("name")||""
  ).toLowerCase();

  if(name!=="time")continue;

  const text=String(
   node.textContent||""
  ).trim();

  if(!text)continue;

  for(const part of text.split(",")){
   const value=part.trim();

   if(!value)continue;

   if(value.includes("/")){
    const pieces=value.split("/");

    const start=Date.parse(pieces[0]);
    const end=Date.parse(pieces[1]);

    if(
     !Number.isFinite(start)||
     !Number.isFinite(end)
    ){
     continue;
    }

    let step=0;

    if(pieces[2]){
     step=parseIsoDuration(
      pieces[2]
    );
    }

    /*
     * The service advertises the real cadence.
     * Never manufacture 5-minute frames.
     */
    if(
     step>0&&
     step>=10*60*1000
    ){
     for(
      let t=start;
      t<=end;
      t+=step
     ){
      if(t<=Date.now()){
       values.push(
        Math.floor(t/1000)
       );
      }
     }

     if(end<=Date.now()){
      values.push(
       Math.floor(end/1000)
      );
     }

    }else{
     if(start<=Date.now()){
      values.push(
       Math.floor(start/1000)
      );
     }

     if(
      end<=Date.now()&&
      end!==start
     ){
      values.push(
       Math.floor(end/1000)
      );
     }
    }

   }else{
    const timestamp=Date.parse(value);

    if(
     Number.isFinite(timestamp)&&
     timestamp<=Date.now()
    ){
     values.push(
      Math.floor(timestamp/1000)
     );
    }
   }
  }
 }

 return[
  ...new Set(values)
 ].sort(
  (a,b)=>a-b
 );
}

function parseIsoDuration(value){
 const match=String(value).match(
  /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$/
 );

 if(!match)return 0;

 const days=Number(match[1]||0);
 const hours=Number(match[2]||0);
 const minutes=Number(match[3]||0);
 const seconds=Number(match[4]||0);

 return(
  days*86400000+
  hours*3600000+
  minutes*60000+
  seconds*1000
 );
}

async function loadOyaCapabilities(){
 if(oyaCapabilitiesLoading)return;
 oyaCapabilitiesLoading=true;

 try{
  const url=
   OYA_PROXY+
   "?action=capabilities";

  const response=await fetch(
   url,
   {
    cache:"no-store"
   }
  );

  if(!response.ok){
   throw new Error(
    "HTTP "+response.status
   );
  }

  const text=await response.text();

  const times=
   extractTimesFromCapabilities(text);

  oyaAllTimes=times;

  /*
   * Only real advertised times.
   * Latest frames are retained according to the
   * selected count, without fabricating timestamps.
   */
  const count=Math.max(
   1,
   Math.min(
    200,
    Number(oyaFrameCount)||50
   )
  );

  oyaTimes=
   times.slice(
    Math.max(
     0,
     times.length-count
    )
   );

  oyaCapabilitiesLoaded=true;

  if(oyaFrameIndex>=oyaTimes.length){
   oyaFrameIndex=
    Math.max(
     0,
     oyaTimes.length-1
    );
  }

  if(
   reflectivityFrameIndex>=oyaTimes.length
  ){
   reflectivityFrameIndex=
    Math.max(
     0,
     oyaTimes.length-1
    );
  }

  frameSlider.max=
   String(
    Math.max(0,oyaTimes.length-1)
   );

  renderOyaTimeline();
  updateTimeLabel();

 }catch(error){

 }finally{
  oyaCapabilitiesLoading=false;
 }
}

async function preloadOyaFrames(){
 if(oyaPreloading)return;
 if(!oyaTimes.length)return;

 oyaPreloading=true;

 const generation=++preloadGeneration;

 try{
  const times=[...oyaTimes];

  const queue=times.filter(
   time=>
    !oyaFrameCache.has(time)
  );

  const concurrency=6;
  let pointer=0;

  async function worker(){
   while(pointer<queue.length){
    if(generation!==preloadGeneration){
     return;
    }

    const index=pointer++;
    const time=queue[index];

    try{
     const extent=getCurrentMapExtent();
     const size=getCurrentMapSize();

     const url=createWmsUrl(
      "bufr_dbz1",
      time,
      extent,
      size
     );

     const blob=await fetchImageBlob(url);

     if(generation!==preloadGeneration){
      return;
     }

     const processed=
      await blobToCleanUrl(
       blob,
       activeLayer==="reflectivity"
        ?processReflectivityCanvas
        :processOyaCanvas
      );

     revokeUrl(processed.rawUrl);

     if(generation!==preloadGeneration){
      revokeUrl(processed.cleanUrl);
      return;
     }

     const result={
      time,
      rawUrl:null,
      cleanUrl:processed.cleanUrl,
      extent,
      size
     };

     if(activeLayer==="reflectivity"){
      reflectivityFrameCache.set(
       time,
       result
      );

      reflectivityLoadedTimes.add(time);
     }else{
      oyaFrameCache.set(
       time,
       result
      );

      oyaLoadedTimes.add(time);
     }

     renderOyaTimeline();

    }catch(e){}
   }
  }

  await Promise.all(
   Array.from(
    {length:Math.min(concurrency,queue.length)},
    worker
   )
  );

 }finally{
  if(generation===preloadGeneration){
   oyaPreloading=false;
  }
 }
}

function handleViewportChanged(){
 viewportGeneration++;
 preloadGeneration++;

 oyaPreloading=false;

 resetLoadedTimeline();

 if(viewportTimer){
  clearTimeout(viewportTimer);
 }

 const generation=viewportGeneration;

 viewportTimer=setTimeout(
  async()=>{
   if(generation!==viewportGeneration){
    return;
   }

   if(
    activeLayer==="oya"&&
    oyaTimes.length
   ){
    await loadOyaFrame(
     oyaFrameIndex,
     {
      forceViewport:true,
      viewportGeneration:generation
     }
    );

    if(
     generation===viewportGeneration
    ){
     preloadOyaFrames();
    }

   }else if(
    activeLayer==="reflectivity"&&
    oyaTimes.length
   ){
    await loadReflectivityFrame(
     reflectivityFrameIndex,
     {
      forceViewport:true,
      viewportGeneration:generation
     }
    );

    if(
     generation===viewportGeneration
    ){
     preloadOyaFrames();
    }
   }
  },
  120
 );
}
