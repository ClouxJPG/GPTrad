<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPTrad</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background: #111;
}

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #d9d9d9;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar {
  position: fixed;
  z-index: 1000;
  top: 10px;
  left: 10px;
  right: 10px;
  height: 44px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  background: rgba(20,20,20,.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,.28);
  color: white;
}

.logo {
  font-size: 16px;
  font-weight: 700;
  margin-left: 5px;
}

.top-spacer {
  flex: 1;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border: 0;
  outline: 0;
  border-radius: 8px;
  background: rgba(255,255,255,.08);
  color: white;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon-btn:active {
  background: rgba(255,255,255,.18);
}

/* =========================================================
   RADAR PANEL
========================================================= */

.radar-panel {
  position: fixed;
  z-index: 1100;
  top: 64px;
  right: 10px;
  width: 245px;
  background: rgba(20,20,20,.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 10px;
  padding: 11px;
  color: white;
  box-shadow: 0 8px 30px rgba(0,0,0,.35);
  transform: translateX(calc(100% + 20px));
  transition: transform .22s ease;
}

.radar-panel.open {
  transform: translateX(0);
}

.panel-head {
  display: flex;
  align-items: center;
  height: 30px;
  margin-bottom: 8px;
}

.panel-close {
  width: 28px;
  height: 28px;
  margin-right: 4px;
  border: 0;
  outline: 0;
  background: transparent;
  color: rgba(255,255,255,.9);
  border-radius: 7px;
  font-size: 25px;
  line-height: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.panel-close:active {
  background: rgba(255,255,255,.12);
}

.panel-title {
  font-size: 14px;
  font-weight: 700;
}

.panel-section {
  padding: 8px 0;
  border-top: 1px solid rgba(255,255,255,.08);
}

.panel-section:first-of-type {
  border-top: 0;
}

.panel-label {
  font-size: 11px;
  opacity: .58;
  margin-bottom: 7px;
}

.layer-row {
  display: flex;
  align-items: center;
  min-height: 34px;
  font-size: 13px;
}

.layer-row input {
  width: 16px;
  height: 16px;
  margin: 0 8px 0 0;
  accent-color: white;
}

.layer-row span {
  flex: 1;
}

/* =========================================================
   LIGHTNING ROW
========================================================= */

.lightning-row {
  display: flex;
  flex-direction: column;
}

.lightning-main {
  display: flex;
  align-items: center;
  width: 100%;
  min-height: 34px;
  cursor: pointer;
  user-select: none;
}

.lightning-main input {
  width: 16px;
  height: 16px;
  margin: 0 8px 0 0;
  accent-color: white;
  flex: 0 0 auto;
}

.lightning-main-label {
  flex: 1;
  font-size: 13px;
}

.lightning-chevron {
  width: 22px;
  text-align: center;
  font-size: 16px;
  opacity: .55;
  transition: transform .22s ease;
}

.lightning-row.open .lightning-chevron {
  transform: rotate(180deg);
}

/* =========================================================
   LIGHTNING SETTINGS
========================================================= */

.lightning-settings {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  padding: 0 4px 0 24px;
  transform: translateY(-5px);
  transition:
    max-height .25s ease,
    opacity .18s ease,
    padding .25s ease,
    transform .25s ease;
}

.lightning-row.open .lightning-settings {
  max-height: 240px;
  opacity: 1;
  padding-top: 7px;
  padding-bottom: 4px;
  transform: translateY(0);
}

.lightning-setting-title {
  font-size: 10px;
  opacity: .5;
  margin-bottom: 7px;
}

.lightning-modes {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lightning-mode {
  display: flex;
  align-items: center;
  min-height: 27px;
  font-size: 11px;
  opacity: .9;
  cursor: pointer;
}

.lightning-mode input {
  width: 14px;
  height: 14px;
  margin: 0 7px 0 0;
  accent-color: #ffd83d;
}

.lightning-control {
  margin-top: 8px;
}

.lightning-control-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  opacity: .65;
  margin-bottom: 4px;
}

#lightningSizeValue {
  opacity: .9;
}

#lightningSize {
  width: 100%;
  height: 18px;
  margin: 0;
}

.lightning-color-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 10px;
  opacity: .65;
}

#lightningColor {
  width: 38px;
  height: 25px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-panel {
  position: fixed;
  z-index: 1300;
  top: 64px;
  right: 10px;
  width: 245px;
  background: rgba(20,20,20,.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 10px;
  padding: 11px;
  color: white;
  box-shadow: 0 8px 30px rgba(0,0,0,.35);
  transform: translateX(calc(100% + 20px));
  transition: transform .22s ease;
}

.settings-panel.open {
  transform: translateX(0);
}

.settings-head {
  display: flex;
  align-items: center;
  height: 30px;
  margin-bottom: 8px;
}

.settings-close {
  width: 28px;
  height: 28px;
  margin-right: 4px;
  border: 0;
  outline: 0;
  background: transparent;
  color: rgba(255,255,255,.9);
  border-radius: 7px;
  font-size: 25px;
  line-height: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.settings-close:active {
  background: rgba(255,255,255,.12);
}

.settings-title {
  font-size: 14px;
  font-weight: 700;
}

.settings-section {
  padding: 8px 0;
  border-top: 1px solid rgba(255,255,255,.08);
}

.settings-section:first-of-type {
  border-top: 0;
}

.settings-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  opacity: .7;
  margin-bottom: 8px;
}

#opacityValue {
  font-size: 11px;
  opacity: .8;
}

#opacitySlider {
  width: 100%;
  height: 20px;
  margin: 0;
}

/* =========================================================
   STATUS
========================================================= */

.status {
  position: fixed;
  z-index: 1001;
  left: 10px;
  bottom: 94px;
  padding: 7px 10px;
  border-radius: 7px;
  background: rgba(20,20,20,.82);
  color: white;
  font-size: 11px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  pointer-events: none;
  opacity: .9;
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline {
  position: fixed;
  z-index: 1000;
  left: 10px;
  right: 10px;
  bottom: 10px;
  height: 68px;
  padding: 9px 12px 8px;
  background: rgba(20,20,20,.9);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 10px;
  color: white;
  box-shadow: 0 5px 25px rgba(0,0,0,.3);
}

.time-top {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}

.time-title {
  font-size: 10px;
  opacity: .55;
}

.time-value {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
}

.timeline-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.time-button {
  width: 29px;
  height: 27px;
  border: 0;
  outline: 0;
  border-radius: 6px;
  background: rgba(255,255,255,.08);
  color: white;
  font-size: 14px;
  cursor: pointer;
}

.time-button:active {
  background: rgba(255,255,255,.18);
}

#timeSlider {
  flex: 1;
  height: 20px;
  margin: 0;
}

/* =========================================================
   PIXEL INFO
========================================================= */

.pixel-info {
  position: fixed;
  z-index: 1200;
  display: none;
  width: 190px;
  padding: 11px 12px 12px;
  background: rgba(18,18,18,.94);
  color: white;
  border-radius: 6px;
  box-shadow: 0 6px 25px rgba(0,0,0,.4);
  pointer-events: auto;
}

.pixel-close {
  position: absolute;
  top: 4px;
  right: 5px;
  width: 24px;
  height: 24px;
  border: 0;
  outline: 0;
  border-radius: 6px;
  background: transparent;
  color: rgba(255,255,255,.75);
  font-size: 20px;
  line-height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.pixel-close:active {
  background: rgba(255,255,255,.12);
}

.pixel-value {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.05;
  padding-right: 20px;
}

.pixel-time {
  margin-top: 5px;
  font-size: 11px;
  opacity: .65;
}

.pixel-coords {
  margin-top: 4px;
  font-size: 9px;
  opacity: .5;
}

.pixel-phenomenon {
  margin-top: 6px;
  font-size: 11px;
  opacity: .8;
}

/* =========================================================
   CLICK POINT
========================================================= */

.pixel-point {
  position: fixed;
  z-index: 1199;
  display: none;
  width: 10px;
  height: 10px;
  margin-left: -5px;
  margin-top: -5px;
  border-radius: 50%;
  background: white;
  border: 2px solid #111;
  box-shadow:
    0 0 0 2px rgba(255,255,255,.65),
    0 2px 7px rgba(0,0,0,.5);
  pointer-events: none;
}

/* =========================================================
   LIGHTNING VISUALS
========================================================= */

.lightning-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.lightning-icon svg {
  display: block;
  overflow: visible;
}

.lightning-bolt {
  filter:
    drop-shadow(0 0 2px rgba(0,0,0,.65));
}

.lightning-flash {
  filter:
    drop-shadow(0 0 2px rgba(0,0,0,.65));
}

/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-zoom {
  margin-top: 65px !important;
}

.leaflet-control-attribution {
  font-size: 8px;
}

@media (max-width: 600px) {

  .topbar {
    top: 8px;
    left: 8px;
    right: 8px;
  }

  .radar-panel {
    top: 60px;
    right: 8px;
    width: 230px;
  }

  .settings-panel {
    top: 60px;
    right: 8px;
    width: 230px;
  }

  .timeline {
    left: 8px;
    right: 8px;
    bottom: 8px;
  }

  .status {
    left: 8px;
    bottom: 86px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="topbar">

  <div class="logo">GPTrad</div>

  <div class="top-spacer"></div>

  <button id="locateBtn" class="icon-btn">⌖</button>

  <button id="searchBtn" class="icon-btn">⌕</button>

  <button id="settingsBtn" class="icon-btn">⚙</button>

  <button id="panelBtn" class="icon-btn">☰</button>

</div>

<!-- =======================================================
     RADAR PANEL
======================================================= -->

<div id="radarPanel" class="radar-panel">

  <div class="panel-head">

    <button
      id="panelClose"
      class="panel-close"
      aria-label="Закрыть"
    >×</button>

    <div class="panel-title">
      Радар
    </div>

  </div>

  <div class="panel-section">

    <div class="panel-label">
      Отражаемость
    </div>

    <label class="layer-row">

      <input
        id="radarToggle"
        type="checkbox"
        checked
      >

      <span>Отражаемость</span>

    </label>

  </div>

  <div class="panel-section">

    <div class="panel-label">
      Грозопеленгатор
    </div>

    <div id="lightningRow" class="lightning-row">

      <div
        id="lightningMain"
        class="lightning-main"
      >

        <input
          id="lightningToggle"
          type="checkbox"
        >

        <span class="lightning-main-label">
          Молнии
        </span>

        <span class="lightning-chevron">
          ⌄
        </span>

      </div>

      <div
        id="lightningSettings"
        class="lightning-settings"
      >

        <div class="lightning-setting-title">
          Настройки молний
        </div>

        <div class="lightning-modes">

          <label class="lightning-mode">

            <input
              type="radio"
              name="lightningMode"
              value="bolt"
              checked
            >

            <span>Молнии</span>

          </label>

          <label class="lightning-mode">

            <input
              type="radio"
              name="lightningMode"
              value="dot"
            >

            <span>Точки</span>

          </label>

          <label class="lightning-mode">

            <input
              type="radio"
              name="lightningMode"
              value="flash"
            >

            <span>Вспышки</span>

          </label>

        </div>

        <div class="lightning-control">

          <div class="lightning-control-head">

            <span>
              Размер
            </span>

            <span id="lightningSizeValue">
              6
            </span>

          </div>

          <input
            id="lightningSize"
            type="range"
            min="3"
            max="14"
            value="6"
            step="1"
          >

        </div>

        <div class="lightning-color-row">

          <span>
            Цвет
          </span>

          <input
            id="lightningColor"
            type="color"
            value="#FFD83D"
          >

        </div>

      </div>

    </div>

  </div>

  <!-- =====================================================
       DANGEROUS PHENOMENA
  ====================================================== -->

  <div class="panel-section">

    <div class="panel-label">
      Опасные явления
    </div>

    <label class="layer-row">

      <input
        id="dangerToggle"
        type="checkbox"
      >

      <span id="dangerLabel">
        Опасные явления
      </span>

    </label>

  </div>

</div>

<!-- =======================================================
     SETTINGS
======================================================= -->

<div id="settingsPanel" class="settings-panel">

  <div class="settings-head">

    <button
      id="settingsClose"
      class="settings-close"
      aria-label="Закрыть"
    >×</button>

    <div class="settings-title">
      Настройки
    </div>

  </div>

  <div class="settings-section">

    <div class="settings-label">

      <span>
        Прозрачность отражаемости
      </span>

      <span id="opacityValue">
        72%
      </span>

    </div>

    <input
      id="opacitySlider"
      type="range"
      min="0"
      max="100"
      value="72"
      step="1"
    >

  </div>

</div>

<!-- =======================================================
     STATUS
======================================================= -->

<div id="status" class="status">
  Загрузка радара…
</div>

<!-- =======================================================
     PIXEL INFO
======================================================= -->

<div id="pixelPoint" class="pixel-point"></div>

<div id="pixelInfo" class="pixel-info">

  <button
    id="pixelClose"
    class="pixel-close"
    aria-label="Закрыть"
  >×</button>

  <div id="pixelValue" class="pixel-value">
    —
  </div>

  <div id="pixelTime" class="pixel-time">
    —
  </div>

  <div id="pixelCoords" class="pixel-coords">
    —
  </div>

  <div id="pixelPhenomenon" class="pixel-phenomenon">
    Отражаемость
  </div>

</div>

<!-- =======================================================
     TIMELINE
======================================================= -->

<div class="timeline">

  <div class="time-top">

    <div class="time-title">
      Время
    </div>

    <div id="timeValue" class="time-value">
      —
    </div>

  </div>

  <div class="timeline-controls">

    <button id="prevBtn" class="time-button">‹</button>

    <button id="playBtn" class="time-button">▶</button>

    <input
      id="timeSlider"
      type="range"
      min="0"
      max="0"
      value="0"
      step="1"
    >

    <button id="nextBtn" class="time-button">›</button>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   CONFIG
========================================================= */

const WMS_URL = "/baltrad_wsgi";

const TARGET_LAYER = "bufr_dbz1";

/*
 * Опасные явления.
 *
 * Точное имя слоя заранее не фиксируем:
 * оно автоматически определяется из GetCapabilities.
 */

let DANGER_LAYER = null;

const FRAME_STEP =
  10 * 60 * 1000;

const MAX_FRAMES = 32;

const INITIAL_PRELOAD = 14;

const PRELOAD_CONCURRENCY = 2;

/* =========================================================
   EUMETSAT
========================================================= */

const EUMETSAT_WMS =
  "https://view.eumetsat.int/geoserver/wms";

const LIGHTNING_LAYER =
  "mtg_fd:li_afa";

const LIGHTNING_STEP =
  5 * 60 * 1000;

const LIGHTNING_GRID =
  8;

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {
  zoomControl: true,
  attributionControl: true,
  preferCanvas: true
}).setView(
  [54.74, 55.97],
  6
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 18,
    attribution: "© OpenStreetMap"
  }
).addTo(map);

/* =========================================================
   LIGHTNING PANE
========================================================= */

map.createPane(
  "lightningPane"
);

map.getPane(
  "lightningPane"
).style.zIndex = 450;

/* =========================================================
   DANGER PANE
========================================================= */

map.createPane(
  "dangerPane"
);

map.getPane(
  "dangerPane"
).style.zIndex = 410;

/* =========================================================
   STATE
========================================================= */

let times = [];

let currentTime = null;

let currentRadarLayer = null;

let currentDangerLayer = null;

let radarRequestId = 0;

let dangerRequestId = 0;

let playing = false;

let playTimer = null;

let autoFollowLatest = true;

const radarCache = new Map();

const dangerCache = new Map();

let preloadStarted = false;

let radarOpacity = 0.72;

/* =========================================================
   LIGHTNING STATE
========================================================= */

const LIGHTNING_STORAGE =
  "gptrad_lightning_settings_v1";

let lightningSettings = {

  mode: "bolt",

  color: "#FFD83D",

  size: 6

};

let lightningRequestId = 0;

let lightningLoading = false;

let lightningLastKey = "";

const lightningLayer =
  L.layerGroup();

/* =========================================================
   DOM
========================================================= */

const radarPanel =
  document.getElementById("radarPanel");

const panelBtn =
  document.getElementById("panelBtn");

const panelClose =
  document.getElementById("panelClose");

const radarToggle =
  document.getElementById("radarToggle");

const dangerToggle =
  document.getElementById("dangerToggle");

const dangerLabel =
  document.getElementById("dangerLabel");

const statusEl =
  document.getElementById("status");

const timeSlider =
  document.getElementById("timeSlider");

const timeValue =
  document.getElementById("timeValue");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const playBtn =
  document.getElementById("playBtn");

const pixelInfo =
  document.getElementById("pixelInfo");

const pixelPoint =
  document.getElementById("pixelPoint");

const pixelClose =
  document.getElementById("pixelClose");

const pixelValue =
  document.getElementById("pixelValue");

const pixelTime =
  document.getElementById("pixelTime");

const pixelCoords =
  document.getElementById("pixelCoords");

const settingsBtn =
  document.getElementById("settingsBtn");

const settingsPanel =
  document.getElementById("settingsPanel");

const settingsClose =
  document.getElementById("settingsClose");

const opacitySlider =
  document.getElementById("opacitySlider");

const opacityValue =
  document.getElementById("opacityValue");

/* Lightning */

const lightningRow =
  document.getElementById(
    "lightningRow"
  );

const lightningMain =
  document.getElementById(
    "lightningMain"
  );

const lightningToggle =
  document.getElementById(
    "lightningToggle"
  );

const lightningSize =
  document.getElementById(
    "lightningSize"
  );

const lightningSizeValue =
  document.getElementById(
    "lightningSizeValue"
  );

const lightningColor =
  document.getElementById(
    "lightningColor"
  );

/* =========================================================
   LOAD LIGHTNING SETTINGS
========================================================= */

function loadLightningSettings() {

  try {

    const saved =
      localStorage.getItem(
        LIGHTNING_STORAGE
      );

    if (!saved) {
      return;
    }

    const parsed =
      JSON.parse(saved);

    if (
      parsed &&
      typeof parsed === "object"
    ) {

      if (
        parsed.mode === "bolt" ||
        parsed.mode === "dot" ||
        parsed.mode === "flash"
      ) {

        lightningSettings.mode =
          parsed.mode;

      }

      if (
        typeof parsed.color === "string" &&
        /^#[0-9a-f]{6}$/i.test(
          parsed.color
        )
      ) {

        lightningSettings.color =
          parsed.color;

      }

      if (
        Number.isFinite(
          Number(parsed.size)

    );

}

  ) {

    return "—";

  }

  return d.toLocaleTimeString(

      minute: "2-digit"
    }
  );

}

/* =========================================================
   DANGER LAYER DISCOVERY
========================================================= */

/*
 * Ищем слой опасных явлений в GetCapabilities.
 *
 * Приоритет:
 *
 * 1. название явно содержит danger/hazard
 * 2. название содержит "опас"
 * 3. title содержит danger/hazard
 * 4. title содержит "опас"
 * 5. phenomena + thunder/hail/etc.
 *
 * buf/dbz слои исключаются.
 */

function findDangerLayerFromCapabilities(text) {

  try {

    const parser =
      new DOMParser();

    const xml =
      parser.parseFromString(
        text,
        "text/xml"
      );

    const layers =
      Array.from(
        xml.getElementsByTagName(
          "Layer"
        )
      );

    const candidates =
      [];

    for (
      const layer of layers
    ) {

      const nameNode =
        Array.from(
          layer.children
        ).find(
          el =>
            el.localName &&
            el.localName.toLowerCase() ===
            "name"
        );

      if (!nameNode) {
        continue;
      }

      const name =
        nameNode.textContent
          .trim();

      if (!name) {
        continue;
      }

      const titleNode =
        Array.from(
          layer.children
        ).find(
          el =>
            el.localName &&
            el.localName.toLowerCase() ===
            "title"
        );

      const title =
        titleNode
          ? titleNode.textContent.trim()
          : "";

      const combined =
        (
          name +
          " " +
          title
        ).toLowerCase();

      if (
        name === TARGET_LAYER ||
        /dbz|reflect|отраж/.test(
          combined
        )
      ) {
        continue;
      }

      let score = 0;

      if (
        /danger|hazard|dangerous/.test(
          combined
        )
      ) {
        score += 100;
      }

      if (
        /опасн/.test(
          combined
        )
      ) {
        score += 100;
      }

      if (
        /phenomena|phenomenon/.test(
          combined
        )
      ) {
        score += 40;
      }

      if (
        /явлен/.test(
          combined
        )
      ) {
        score += 40;
      }

      if (
        /thunder|storm|hail|tornado/.test(
          combined
        )
      ) {
        score += 25;
      }

      if (
        /гроз|град|торнад|шторм/.test(
          combined
        )
      ) {
        score += 25;
      }

      if (
        score > 0
      ) {

        candidates.push({
          name,
          title,
          score
        });

      }

    }

    candidates.sort(
      (a,b) =>
        b.score -
        a.score
    );

    if (
      candidates.length
    ) {

      console.log(
        "Danger layer candidates:",
        candidates
      );

      return candidates[0].name;

    }

  } catch (error) {

    console.warn(
      "Danger layer discovery error:",
      error
    );

  }

  return null;

}

/* =========================================================
   CAPABILITIES
========================================================= */

function extractTimesFromText(text) {

  const result = [];

  try {

    const parser =
      new DOMParser();

    const xml =
      parser.parseFromString(
        text,
        "text/xml"
      );

    const layers =
      Array.from(
        xml.getElementsByTagName(
          "Layer"
        )
      );

    let targetLayer =
      null;

    for (
      const layer of layers
    ) {

      const names =
        Array.from(
          layer.children
        ).filter(
          el =>
            el.localName &&
            el.localName.toLowerCase() ===
            "name"
        );

      if (
        names.length &&
        names[0].textContent.trim() ===
        TARGET_LAYER
      ) {

        targetLayer =
          layer;

        break;

      }

    }

    if (targetLayer) {

      const nodes =
        Array.from(
          targetLayer.querySelectorAll(
            "Dimension, Extent"
          )
        );

      for (
        const node of nodes
      ) {

        const name =
          (
            node.getAttribute("name") ||
            ""
          ).toLowerCase();

        if (
          name !== "time"
        ) {
          continue;
        }

        parseTimeValue(
          node.textContent.trim(),
          result
        );

      }

    }

  } catch (e) {

    console.warn(
      "XML parse error",
      e
    );

  }

  if (
    !result.length
  ) {

    const regex =
      /20\d\d-\d\d-\d\dT\d\d:\d\d(?::\d\d)?(?:\.\d+)?Z/g;

    const matches =
      text.match(regex) || [];

    for (
      const value of matches
    ) {

      const d =
        new Date(value);

      if (
        !Number.isNaN(
          d.getTime()
        )
      ) {

        result.push(
          d.toISOString()
        );

      }

    }

  }

  return [
    ...new Set(result)
  ]
    .map(
      value =>
        new Date(value)
    )
    .filter(
      isUsableTime
    )
    .sort(
      (a,b) =>
        a.getTime() -
        b.getTime()
    )
    .map(
      d =>
        d.toISOString()
    );

}

function parseTimeValue(
  value,
  result
) {

  if (!value) {
    return;
  }

  if (
    value.includes(",") &&
    !value.includes("/")
  ) {

    for (
      const part of
      value.split(",")
    ) {

      const d =
        new Date(
          part.trim()
        );

      if (
        !Number.isNaN(
          d.getTime()
        )
      ) {

        result.push(
          d.toISOString()
        );

      }

    }

    return;

  }

  const parts =
    value.split("/");

  if (
    parts.length >= 2
  ) {

    const start =
      new Date(parts[0]);

    const end =
      new Date(parts[1]);

    if (
      !Number.isNaN(
        start.getTime()
      ) &&
      !Number.isNaN(
        end.getTime()
      )
    ) {

      let step =
        FRAME_STEP;

      if (parts[2]) {

        const match =
          parts[2].match(
            /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/i
          );

        if (match) {

          const hours =
            Number(
              match[1] || 0
            );

          const minutes =
            Number(
              match[2] || 0
            );

          const seconds =
            Number(
              match[3] || 0
            );

          step =
            (
              hours * 3600 +
              minutes * 60 +
              seconds
            ) * 1000;

        }

      }

      const max =
        Math.min(
          end.getTime(),
          Date.now() + 30 * 1000
        );

      for (
        let t =
          start.getTime();
        t <= max;
        t += step
      ) {

        result.push(
          new Date(t)
            .toISOString()
        );

      }

    }

  }

}

/* =========================================================
   LOAD CAPABILITIES
========================================================= */

async function loadCapabilities() {

  setStatus(
    "Загрузка радара…"
  );

  const url =
    WMS_URL +
    "?SERVICE=WMS" +
    "&VERSION=1.1.1" +
    "&REQUEST=GetCapabilities";

  try {

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const text =
      await response.text();

    /*
     * Ищем опасные явления
     * в том же GetCapabilities.
     */

    const discoveredDangerLayer =
      findDangerLayerFromCapabilities(
        text
      );

    if (
      discoveredDangerLayer
    ) {

      DANGER_LAYER =
        discoveredDangerLayer;

      console.log(
        "Selected danger layer:",
        DANGER_LAYER
      );

    }

    updateDangerLabel();

    let parsed =
      extractTimesFromText(
        text
      );

    if (
      parsed.length >
      MAX_FRAMES
    ) {

      parsed =
        parsed.slice(
          -MAX_FRAMES
        );

    }

    times =
      parsed;

    timeSlider.min =
      0;

    timeSlider.max =
      Math.max(
        0,
        times.length - 1
      );

    if (!times.length) {

      throw new Error(
        "Временные кадры не найдены"
      );

    }

    const newest =
      times[
        times.length - 1
      ];

    if (!currentTime) {

      await selectTime(
        newest,
        false,
        true
      );

      startInitialPreload();

    } else if (
      autoFollowLatest &&
      currentTime !== newest
    ) {

      await selectTime(
        newest,
        false,
        true
      );

    } else {

      updateTimelinePosition();

    }

    setStatus(
      "Готово"
    );

    if (
      lightningToggle.checked &&
      currentTime
    ) {

      refreshLightning(
        true
      );

    }

    if (
      dangerToggle.checked &&
      currentTime
    ) {

      refreshDanger(
        true
      );

    }

  } catch (error) {

    console.error(
      "Capabilities error:",
      error
    );

    setStatus(
      "Ошибка загрузки радара"
    );

  }

}

/* =========================================================
   EPSG:3857
========================================================= */

function project3857(
  lat,
  lon
) {

  return L.CRS.EPSG3857.project(
    L.latLng(
      lat,
      lon
    )
  );

}

function getProjectedBounds() {

  const bounds =
    map.getBounds();

  const sw =
    project3857(
      bounds.getSouth(),
      bounds.getWest()
    );

  const ne =
    project3857(
      bounds.getNorth(),
      bounds.getEast()
    );

  return {

    south: sw.y,

    west: sw.x,

    north: ne.y,

    east: ne.x,

    latLngBounds:
      L.latLngBounds(
        [
          bounds.getSouth(),
          bounds.getWest()
        ],
        [
          bounds.getNorth(),
          bounds.getEast()
        ]
      )

  };

}

/* =========================================================
   RADAR REQUEST
========================================================= */

function getRadarRequest(
  time
) {

  const projected =
    getProjectedBounds();

  const size =
    map.getSize();

  const bbox = [
    projected.west,
    projected.south,
    projected.east,
    projected.north
  ].join(",");

  const width =
    Math.max(
      256,
      Math.round(size.x)
    );

  const height =
    Math.max(
      256,
      Math.round(size.y)
    );

  const params =
    new URLSearchParams({

      SERVICE: "WMS",

      VERSION: "1.1.1",

      REQUEST: "GetMap",

      LAYERS:
        TARGET_LAYER,

      STYLES: "",

      FORMAT:
        "image/png",

      TRANSPARENT:
        "true",

      SRS:
        "EPSG:3857",

      BBOX:
        bbox,

      WIDTH:
        width,

      HEIGHT:
        height,

      TIME:
        time

    });

  return {

    url:
      WMS_URL +
      "?" +
      params.toString(),

    bounds:
      projected.latLngBounds

  };

}

/* =========================================================
   IMAGE
========================================================= */

function loadImage(
  url
) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      img.onload =
        () => {

          if (
            !img.naturalWidth ||
            !img.naturalHeight
          ) {

            reject(
              new Error(
                "Пустое изображение"
              )
            );

            return;

          }

          resolve(img);

        };

      img.onerror =
        () => {

          reject(
            new Error(
              "Изображение не загрузилось"
            )
          );

        };

      img.src =
        url;

    }
  );

}

function loadImageCached(
  url
) {

  if (
    radarCache.has(url)
  ) {

    return radarCache.get(url);

  }

  const promise =
    loadImage(url)
      .catch(
        error => {

          radarCache.delete(
            url
          );

          throw error;

        }
      );

  radarCache.set(
    url,
    promise
  );

  return promise;

}

/* =========================================================
   CANDIDATES
========================================================= */

function getCandidateTimes(
  time
) {

  const index =
    times.indexOf(
      time
    );

  if (
    index < 0
  ) {

    return [
      time
    ];

  }

  return times
    .slice(
      0,
      index + 1
    )
    .reverse();

}

/* =========================================================
   APPLY RADAR
========================================================= */

function applyRadarImage(
  img,
  bounds
) {

  if (
    !radarToggle.checked
  ) {

    return;

  }

  if (
    !currentRadarLayer
  ) {

    currentRadarLayer =
      L.imageOverlay(
        img.src,
        bounds,
        {
          opacity:
            radarOpacity,
          interactive:
            false
        }
      ).addTo(map);

    return;

  }

  currentRadarLayer.setUrl(
    img.src
  );

  currentRadarLayer.setBounds(
    bounds
  );

  currentRadarLayer.setOpacity(
    radarOpacity
  );

}

/* =========================================================
   SELECT TIME
========================================================= */

async function selectTime(
  requestedTime,
  fromMapMove = false,
  allowFallback = true
) {

  if (!requestedTime) {
    return;
  }

  const requestId =
    ++radarRequestId;

  const candidates =
    allowFallback
      ? getCandidateTimes(
          requestedTime
        )
      : [
          requestedTime
        ];

  for (
    const candidateTime of
    candidates
  ) {

    if (
      requestId !==
      radarRequestId
    ) {

      return;

    }

    const request =
      getRadarRequest(
        candidateTime
      );

    try {

      if (
        !fromMapMove
      ) {

        setStatus(
          "Загрузка " +
          formatTime(
            candidateTime
          ) +
          "…"
        );

      }

      const img =
        await loadImageCached(
          request.url
        );

      if (
        requestId !==
        radarRequestId
      ) {

        return;

      }

      try {

        if (img.decode) {
          await img.decode();
        }

      } catch (_) {}

      if (
        requestId !==
        radarRequestId
      ) {

        return;

      }

      applyRadarImage(
        img,
        request.bounds
      );

      currentTime =
        candidateTime;

      updateTimelinePosition();

      hidePixelInfo();

      if (
        !fromMapMove
      ) {

        if (
          dangerToggle.checked
        ) {

          setStatus(
            "Опасные явления · " +
            formatTime(
              currentTime
            )
          );

        } else {

          setStatus(
            "Отражаемость · " +
            formatTime(
              currentTime
            )
          );

        }

      }

      if (
        lightningToggle.checked
      ) {

        refreshLightning(
          true
        );

      }

      if (
        dangerToggle.checked
      ) {

        refreshDanger(
          true
        );

      }

      return;

    } catch (error) {

      console.warn(
        "Frame unavailable:",
        candidateTime,
        error
      );

      continue;

    }

  }

  if (
    requestId ===
    radarRequestId
  ) {

    updateTimelinePosition();

    setStatus(
      "Кадр временно недоступен"
    );

  }

}

/* =========================================================
   PRELOAD
========================================================= */

async function startInitialPreload() {

  if (
    preloadStarted
  ) {

    return;

  }

  preloadStarted =
    true;

  const start =
    Math.max(
      0,
      times.length -
      INITIAL_PRELOAD
    );

  const preloadTimes =
    times.slice(
      start,
      times.length - 1
    );

  let cursor =
    0;

  async function worker() {

    while (
      cursor <
      preloadTimes.length
    ) {

      const index =
        cursor++;

      const time =
        preloadTimes[
          index
        ];

      const request =
        getRadarRequest(
          time
        );

      try {

        await loadImageCached(
          request.url
        );

      } catch (error) {

        console.warn(
          "Preload failed:",
          time,
          error
        );

      }

    }

  }

  const workers =
    [];

  for (
    let i = 0;
    i <
    Math.min(
      PRELOAD_CONCURRENCY,
      preloadTimes.length
    );
    i++
  ) {

    workers.push(
      worker()
    );

  }

  await Promise.all(
    workers
  );

}

/* =========================================================
   TIMELINE
========================================================= */

function updateTimelinePosition() {

  if (
    !currentTime ||
    !times.length
  ) {

    return;

  }

  let index =
    times.indexOf(
      currentTime
    );

  if (
    index < 0
  ) {

    let bestIndex =
      0;

    let bestDiff =
      Infinity;

    const target =
      new Date(
        currentTime
      ).getTime();

    for (
      let i = 0;
      i < times.length;
      i++
    ) {

      const diff =
        Math.abs(
          new Date(
            times[i]
          ).getTime() -
          target
        );

      if (
        diff < bestDiff
      ) {

        bestDiff =
          diff;

        bestIndex =
          i;

      }

    }

    index =
      bestIndex;

  }

  timeSlider.value =
    index;

  timeValue.textContent =
    formatDateTime(
      currentTime
    );

}

timeSlider.addEventListener(
  "input",
  () => {

    const index =
      Number(
        timeSlider.value
      );

    if (
      !times[index]
    ) {

      return;

    }

    autoFollowLatest =
      index ===
      times.length - 1;

    selectTime(
      times[index],
      false,
      true
    );

  }
);

prevBtn.addEventListener(
  "click",
  () => {

    if (
      !times.length
    ) {

      return;

    }

    let index =
      Number(
        timeSlider.value
      );

    index =
      Math.max(
        0,
        index - 1
      );

    timeSlider.value =
      index;

    autoFollowLatest =
      index ===
      times.length - 1;

    selectTime(
      times[index],
      false,
      true
    );

  }
);

nextBtn.addEventListener(
  "click",
  () => {

    if (
      !times.length
    ) {

      return;

    }

    let index =
      Number(
        timeSlider.value
      );

    index =
      Math.min(
        times.length - 1,
        index + 1
      );

    timeSlider.value =
      index;

    autoFollowLatest =
      index ===
      times.length - 1;

    selectTime(
      times[index],
      false,
      true
    );

  }
);

playBtn.addEventListener(
  "click",
  () => {

    if (
      !times.length
    ) {

      return;

    }

    if (
      playing
    ) {

      playing =
        false;

      clearInterval(
        playTimer
      );

      playTimer =
        null;

      playBtn.textContent =
        "▶";

      return;

    }

    playing =
      true;

    playBtn.textContent =
      "❚❚";

    playTimer =
      setInterval(
        () => {

          let index =
            Number(
              timeSlider.value
            );

          index++;

          if (
            index >=
            times.length
          ) {

            index =
              0;

          }

          timeSlider.value =
            index;

          autoFollowLatest =
            index ===
            times.length - 1;

          selectTime(
            times[index],
            false,
            true
          );

        },
        900
      );

  }
);

/* =========================================================
   RADAR / DANGER MUTUAL EXCLUSION
========================================================= */

function disableDangerLayer() {

  ++dangerRequestId;

  if (
    currentDangerLayer
  ) {

    map.removeLayer(
      currentDangerLayer
    );

    currentDangerLayer =
      null;

  }

}

function disableRadarVisual() {

  if (
    currentRadarLayer
  ) {

    currentRadarLayer.setOpacity(
      0
    );

  }

}

/* =========================================================
   RADAR TOGGLE
========================================================= */

radarToggle.addEventListener(
  "change",
  () => {

    if (
      radarToggle.checked
    ) {

      /*
       * ВАЖНО:
       * отражаемость и опасные явления
       * не могут быть включены одновременно.
       */

      if (
        dangerToggle.checked
      ) {

        dangerToggle.checked =
          false;

        disableDangerLayer();

      }

      if (
        currentRadarLayer
      ) {

        currentRadarLayer.setOpacity(
          radarOpacity
        );

      } else if (
        currentTime
      ) {

        selectTime(
          currentTime,
          false,
          true
        );

      }

    } else {

      disableRadarVisual();

    }

  }
);

/* =========================================================
   DANGER REQUEST
========================================================= */

function getDangerRequest(
  time
) {

  if (
    !DANGER_LAYER
  ) {

    return null;

  }

  const projected =
    getProjectedBounds();

  const size =
    map.getSize();

  const bbox = [
    projected.west,
    projected.south,
    projected.east,
    projected.north
  ].join(",");

  const width =
    Math.max(
      256,
      Math.round(size.x)
    );

  const height =
    Math.max(
      256,
      Math.round(size.y)
    );

  const params =
    new URLSearchParams({

      SERVICE:
        "WMS",

      VERSION:
        "1.1.1",

      REQUEST:
        "GetMap",

      LAYERS:
        DANGER_LAYER,

      STYLES:
        "",

      FORMAT:
        "image/png",

      TRANSPARENT:
        "true",

      SRS:
        "EPSG:3857",

      BBOX:
        bbox,

      WIDTH:
        width,

      HEIGHT:
        height,

      TIME:
        time

    });

  return {

    url:
      WMS_URL +
      "?" +
      params.toString(),

    bounds:
      projected.latLngBounds

  };

}

/* =========================================================
   LOAD DANGER IMAGE
========================================================= */

function loadDangerImage(
  url
) {

  if (
    dangerCache.has(url)
  ) {

    return dangerCache.get(url);

  }

  const promise =
    loadImage(url)
      .catch(
        error => {

          dangerCache.delete(
            url
          );

          throw error;

        }
      );

  dangerCache.set(
    url,
    promise
  );

  return promise;

}

/* =========================================================
   APPLY DANGER
========================================================= */

function applyDangerImage(
  img,
  bounds
) {

  if (
    !dangerToggle.checked
  ) {

    return;

  }

  if (
    !currentDangerLayer
  ) {

    currentDangerLayer =
      L.imageOverlay(
        img.src,
        bounds,
        {
          opacity:
            1,
          interactive:
            false,
          pane:
            "dangerPane"
        }
      ).addTo(map);

    return;

  }

  currentDangerLayer.setUrl(
    img.src
  );

  currentDangerLayer.setBounds(
    bounds
  );

}

/* =========================================================
   REFRESH DANGER
========================================================= */

async function refreshDanger(
  force = false
) {

  if (
    !dangerToggle.checked ||
    !currentTime ||
    !DANGER_LAYER
  ) {

    return;

  }

  const request =
    getDangerRequest(
      currentTime
    );

  if (!request) {

    return;

  }

  const requestId =
    ++dangerRequestId;

  try {

    setStatus(
      "Опасные явления · " +
      formatTime(
        currentTime
      ) +
      "…"
    );

    const img =
      await loadDangerImage(
        request.url
      );

    if (
      requestId !==
      dangerRequestId
    ) {

      return;

    }

    if (
      !dangerToggle.checked
    ) {

      return;

    }

    applyDangerImage(
      img,
      request.bounds
    );

    setStatus(
      "Опасные явления · " +
      formatTime(
        currentTime
      )
    );

  } catch (error) {

    console.warn(
      "Danger layer error:",
      error
    );

    if (
      requestId ===
      dangerRequestId
    ) {

      setStatus(
        "Опасные явления: нет данных"
      );

    }

  }

}

/* =========================================================
   DANGER TOGGLE
========================================================= */

dangerToggle.addEventListener(
  "change",
  () => {

    if (
      dangerToggle.checked
    ) {

      /*
       * Главная логика:
       *
       * Опасные явления включаются
       * вместо отражаемости.
       */

      if (
        radarToggle.checked
      ) {

        radarToggle.checked =
          false;

      }

      disableRadarVisual();

      if (
        !DANGER_LAYER
      ) {

        setStatus(
          "Слой опасных явлений не найден"
        );

        dangerToggle.checked =
          false;

        return;

      }

      refreshDanger(
        true
      );

    } else {

      disableDangerLayer();

      if (
        currentTime
      ) {

        setStatus(
          "Готово"
        );

      }

    }

  }
);

/* =========================================================
   LIGHTNING TIME
========================================================= */

function getLightningTime(
  radarTime
) {

  const t =
    new Date(
      radarTime
    ).getTime();

  if (
    !Number.isFinite(t)
  ) {

    return null;

  }

  const rounded =
    Math.floor(
      t / LIGHTNING_STEP
    ) *
    LIGHTNING_STEP;

  return new Date(
    rounded
  ).toISOString();

}

/* =========================================================
   LIGHTNING BOUNDS
========================================================= */

function getLightningRequest() {

  const projected =
    getProjectedBounds();

  const size =
    map.getSize();

  const bbox = [
    projected.west,
    projected.south,
    projected.east,
    projected.north
  ].join(",");

  const width =
    Math.max(
      256,
      Math.min(
        900,
        Math.round(
          size.x
        )
      )
    );

  const height =
    Math.max(
      256,
      Math.min(
        900,
        Math.round(
          size.y
        )
      )
    );

  const time =
    getLightningTime(
      currentTime
    );

  const params =
    new URLSearchParams({

      service:
        "WMS",

      version:
        "1.3.0",

      request:

        LIGHTNING_LAYER,

      styles:
        "",

      crs:

      bbox:

      width:
        width,

    });

  return {

      EUMETSAT_WMS +
      "?" +
      params.toString(),

    bounds:
      projected.latLngBounds,

    width,

    height

  };

}

/* =========================================================
   SVG COLOR
========================================================= */

function escapeSvgColor(
  color
) {

  if (
    /^#[0-9a-f]{6}$/i.test(
      color
    )
  ) {

    return color;

  }

  return "#FFD83D";

}

/* =========================================================
   OUTLINE COLOR
========================================================= */

function getLightningOutline(
  color
) {

  const hex =
    color.replace(
      "#",
      ""
    );

  const r =
    parseInt(
      hex.substring(0,2),
      16
    );

  const g =
    parseInt(
      hex.substring(2,4),
      16
    );

  const b =
    parseInt(
      hex.substring(4,6),
      16
    );

  const darken =
    value =>
      Math.max(
        0,
        Math.round(
          value * 0.65
        )
      );

  return (
    "#" +
    darken(r)
      .toString(16)
      .padStart(2,"0") +
    darken(g)
      .toString(16)
      .padStart(2,"0") +
    darken(b)
      .toString(16)
      .padStart(2,"0")
  );

}

/* =========================================================
   CREATE LIGHTNING MARKER
========================================================= */

function createLightningMarker(
  lat,
  lon
) {

  const mode =
    lightningSettings.mode;

  const size =
    Number(
      lightningSettings.size
    );

  const color =
    lightningSettings.color;

  if (
    mode === "dot"
  ) {

    return L.circleMarker(
      [
        lat,
        lon
      ],
      {

        radius:
          Math.max(
            2,
            size * .55
          ),

        color:
          getLightningOutline(
            color
          ),

        weight:
          .7,

        opacity:
          1,

        fillColor:
          color,

        fillOpacity:
          .96,

        pane:
          "lightningPane",

        interactive:
          false

      }
    );

  }

  if (
    mode === "flash"
  ) {

    return L.marker(
      [
        lat,
        lon
      ],
      {

        icon:
          createLightningFlashIcon(
            size,
            color
          ),

        pane:
          "lightningPane",

        interactive:
          false

      }
    );

  }

  return L.marker(
    [
      lat,
      lon
    ],
    {

      icon:
        createLightningBoltIcon(
          size,
          color
        ),

      pane:
        "lightningPane",

      interactive:
        false

    }
  );

}

/* =========================================================
   PIXEL IS LIGHTNING
========================================================= */

function pixelLooksActive(
  r,
  g,
  b,
  a
) {

  if (
    a < 30
  ) {

    return false;

  }

  const max =
    Math.max(
      r,
      g,
      b
    );

  const min =
    Math.min(
      r,
      g,
      b
    );

  const saturation =
    max -
    min;

  if (
    max < 35
  ) {

    return false;

  }

  if (
    max < 55 &&
    saturation < 12
  ) {

    return false;

  }

  return true;

}

/* =========================================================
   CANVAS → POINTS
========================================================= */

function extractLightningPoints(
  img,
  request
) {

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    request.width;

  canvas.height =
    request.height;

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:
          true
      }
    );

  if (!ctx) {

    throw new Error(
      "Canvas недоступен"
    );

  }

  ctx.drawImage(
    img,
    0,
    0,
    request.width,
    request.height
  );

  let data;

  try {

    data =
      ctx.getImageData(
        0,
        0,
        request.width,
        request.height
      ).data;

  } catch (error) {

    throw new Error(
      "EUMETSAT не разрешил чтение изображения"
    );

  }

  const points =
    [];

  const grid =
    LIGHTNING_GRID;

  /*
   * ВАЖНО:
   * здесь используем именно bounds
   * текущего WMS-запроса.
   */

  const projected =
    project3857(
      request.bounds.getSouth(),
      request.bounds.getWest()
    );

  const projectedNE =
    project3857(
      request.bounds.getNorth(),
      request.bounds.getEast()
    );

  const west =
    projected.x;

  const east =
    projectedNE.x;

  const south =
    projected.y;

  const north =
    projectedNE.y;

  for (
    let y = 0;
    y < request.height;
    y += grid
  ) {

    for (
      let x = 0;
      x < request.width;
      x += grid
    ) {

      let best =
        null;

      const maxX =
        Math.min(
          request.width,
          x + grid
        );

      const maxY =
        Math.min(
          request.height,
          y + grid
        );

      for (
        let py = y;
        py < maxY;
        py++
      ) {

        for (
          let px = x;
          px < maxX;
          px++
        ) {

          const index =
            (
              py *
              request.width +
              px
            ) * 4;

          const r =
            data[index];

          const g =
            data[index + 1];

          const b =
            data[index + 2];

          const a =
            data[index + 3];

          if (
            !pixelLooksActive(
              r,
              g,
              b,
              a
            )
          ) {

            continue;

          }

          const score =
            a +
            Math.max(
              r,
              g,
              b
            );

          if (
            !best ||
            score >
            best.score
          ) {

            best = {

              px,
              py,
              score

            };

          }

        }

      }

      if (!best) {
        continue;
      }

      const mapX =
        west +
        (
          best.px /
          request.width
        ) *
        (
          east -
          west
        );

      const mapY =
        north -
        (
          best.py /
          request.height
        ) *
        (
          north -
          south
        );

      const latLng =
        L.CRS.EPSG3857.unproject(
          L.point(
            mapX,
            mapY
          )
        );

      if (
        !Number.isFinite(
          latLng.lat
        ) ||
        !Number.isFinite(
          latLng.lng
        )
      ) {

        continue;

      }

      if (
        latLng.lat < -90 ||
        latLng.lat > 90 ||
        latLng.lng < -180 ||
        latLng.lng > 180
      ) {

        continue;

      }

      points.push(
        [
          latLng.lat,
          latLng.lng
        ]
      );

    }

  }

  return points;

}

/* =========================================================
   LIGHTNING WMS IMAGE
========================================================= */

function loadCrossOriginImage(
  url
) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      img.crossOrigin =
        "anonymous";

      img.onload =
        () => {

          if (
            !img.naturalWidth ||
            !img.naturalHeight
          ) {

            reject(
              new Error(
                "Пустой EUMETSAT кадр"
              )
            );

            return;

          }

          resolve(img);

        };

      img.onerror =
        () => {

          reject(
            new Error(
              "EUMETSAT WMS image error"
            )
          );

        };

      img.src =
        url;

    }
  );

}

/* =========================================================
   REFRESH LIGHTNING
========================================================= */

async function refreshLightning(
  force = false
) {

  if (
    !lightningToggle.checked ||
    !currentTime
  ) {

    return;

  }

  const request =
    getLightningRequest();

  const key =
    [
      getLightningTime(
        currentTime
      ),
      request.url,
      lightningSettings.mode,
      lightningSettings.color,
      lightningSettings.size
    ].join("|");

  if (
    !force &&
    key ===
    lightningLastKey
  ) {

    return;

  }

  if (
    lightningLoading
  ) {

    ++lightningRequestId;

  }

  const requestId =
    ++lightningRequestId;

  lightningLoading =
    true;

  try {

    const img =
      await loadCrossOriginImage(
        request.url
      );

    if (
      requestId !==
      lightningRequestId
    ) {

      return;

    }

    if (
      !lightningToggle.checked
    ) {

      return;

    }

    const points =
      extractLightningPoints(
        img,
        request
      );

    if (
      requestId !==
      lightningRequestId
    ) {

      return;

    }

    lightningLayer.clearLayers();

    const maxPoints =
      900;

    const step =
      points.length >
      maxPoints
        ? Math.ceil(
            points.length /
            maxPoints
          )
        : 1;

    for (
      let i = 0;
      i < points.length;
      i += step
    ) {

      const point =
        points[i];

      lightningLayer.addLayer(
        createLightningMarker(
          point[0],
          point[1]
        )
      );

    }

    if (
      !map.hasLayer(
        lightningLayer
      )
    ) {

      lightningLayer.addTo(
        map
      );

    }

    lightningLastKey =
      key;

    console.log(
      "EUMETSAT lightning points:",
      points.length
    );

  } catch (error) {

    console.warn(
      "Lightning error:",
      error
    );

    lightningLayer.clearLayers();

  } finally {

    lightningLoading =
      false;

  }

}

/* =========================================================
   MAP MOVE / ZOOM
========================================================= */

let moveTimer =
  null;

function refreshRadarAfterMapChange() {

  clearTimeout(
    moveTimer
  );

  moveTimer =
    setTimeout(
      () => {

        if (
          !currentTime
        ) {

          return;

        }

        /*
         * Отражаемость обновляем только
         * если она активна.
         */

        if (
          radarToggle.checked
        ) {

          selectTime(
            currentTime,
            true,
            false
          );

        }

        /*
         * Опасные явления обновляем отдельно.
         */

        if (
          dangerToggle.checked
        ) {

          refreshDanger(
            true
          );

        }

        if (
          lightningToggle.checked
        ) {

          refreshLightning(
            true
          );

        }

      },
      180
    );

}

map.on(
  "moveend",
  refreshRadarAfterMapChange
);

   PIXEL INFO HELPERS

function hidePixelInfo() {

    "none";

  pixelPoint.style.display =
    "none";

}

function showPixelPoint(
  containerPoint
) {

  pixelPoint.style.left =
    containerPoint.x +
    "px";

  pixelPoint.style.top =
    containerPoint.y +
    "px";

  pixelPoint.style.display =
    "block";

}

function positionPixelInfo(
  containerPoint
) {

  const width =
    190;

  const estimatedHeight =
    120;

  const margin =
    10;

  let left =
    containerPoint.x -
    width / 2;

  let top =
    containerPoint.y +
    14;

  if (
    left < margin
  ) {

    left =
      margin;

  }

  if (
    left + width >
    window.innerWidth -
    margin
  ) {

    left =
      window.innerWidth -
      width -
      margin;

  }

  if (
    top + estimatedHeight >
    window.innerHeight -
    margin
  ) {

    top =
      containerPoint.y -
      estimatedHeight -
      14;

  }

  pixelInfo.style.left =
    left +
    "px";

  pixelInfo.style.top =
    top +
    "px";

}

/* =========================================================
   CLOSE PIXEL INFO
========================================================= */

pixelClose.addEventListener(
  "click",
  event => {

    event.stopPropagation();

    hidePixelInfo();

  }
);

/* =========================================================
   GET FEATURE INFO
========================================================= */

map.on(
  "click",
  async event => {

    /*
     * GetFeatureInfo относится только
     * к отражаемости.
     *
     * При активных опасных явлениях
     * dBZ-информация не показывается.
     */

    if (
      !currentTime ||
      !radarToggle.checked ||
      dangerToggle.checked
    ) {

      return;

    }

    const clickedPoint =
      map.latLngToContainerPoint(
        event.latlng
      );

    showPixelPoint(
      clickedPoint
    );

    pixelValue.textContent =
      "Загрузка…";

    pixelTime.textContent =
      formatDateTime(
        currentTime
      );

    pixelCoords.textContent =
      event.latlng.lat.toFixed(4) +
      "°, " +
      event.latlng.lng.toFixed(4) +
      "°";

    pixelInfo.style.display =
      "block";

    positionPixelInfo(
      clickedPoint
    );

    const projected =
      getProjectedBounds();

    const size =
      map.getSize();

    const point =
      map.latLngToContainerPoint(
        event.latlng
      );

    const params =
      new URLSearchParams({

        SERVICE:
          "WMS",

        VERSION:
          "1.1.1",

        REQUEST:
          "GetFeatureInfo",

        LAYERS:
          TARGET_LAYER,

        QUERY_LAYERS:
          TARGET_LAYER,

        STYLES:
          "",

        INFO_FORMAT:
          "text/html",

        SRS:
          "EPSG:3857",

        BBOX:
          [
            projected.west,
            projected.south,
            projected.east,
            projected.north
          ].join(","),

        WIDTH:
          Math.round(
            size.x
          ),

        HEIGHT:
          Math.round(
            size.y
          ),

        X:
          Math.round(
            point.x
          ),

        Y:
          Math.round(
            point.y
          ),

        TIME:
          currentTime

      });

    const url =
      WMS_URL +
      "?" +
      params.toString();

    try {

      const response =
        await fetch(
          url,
          {
            cache:
              "no-store"
          }
        );

      if (
        !response.ok
      ) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }

      const text =
        await response.text();

      const dbz =
        parseDbz(
          text
        );

      if (
        pixelInfo.style.display ===
        "none"
      ) {

        return;

      }

      if (
        dbz === null
      ) {

        pixelValue.textContent =
          "Нет данных";

      } else {

        pixelValue.textContent =
          dbz.toFixed(1) +
          " dBZ";

      }

      pixelTime.textContent =
        formatDateTime(
          currentTime
        );

      pixelCoords.textContent =
        event.latlng.lat.toFixed(4) +
        "°, " +
        event.latlng.lng.toFixed(4) +
        "°";

      positionPixelInfo(
        clickedPoint
      );

    } catch (error) {

      console.warn(
        "GetFeatureInfo error:",
        error
      );

      pixelValue.textContent =
        "Нет данных";

    }

  }
);

/* =========================================================
   DBZ PARSER
========================================================= */

function parseDbz(
  text
) {

  if (!text) {
    return null;
  }

  try {

    const json =
      JSON.parse(
        text
      );

    const candidates =
      [];

    function collect(
      value,
      key = ""
    ) {

      if (
        value === null ||
        value === undefined
      ) {
        return;
      }

      if (
        typeof value ===
        "number"
      ) {

        candidates.push({

          key:
            key.toLowerCase(),

          value

        });

        return;

      }

      if (
        typeof value ===
        "string"
      ) {

        const n =
          Number(value);

        if (
          Number.isFinite(n)
        ) {

          candidates.push({

            key:
              key.toLowerCase(),

            value:
              n

          });

        }

        return;

      }

      if (
        Array.isArray(value)
      ) {

        for (
          const item of value
        ) {

          collect(
            item,
            key
          );

        }

        return;

      }

      if (
        typeof value ===
        "object"
      ) {

        for (
          const [
            k,
            v
          ] of Object.entries(
            value
          )
        ) {

          collect(
            v,
            k
          );

        }

      }

    }

    collect(
      json
    );

    const preferred =
      candidates.find(
        item =>
          /dbz|dbzh|reflect|reflectivity|bufr_dbz1|value_0/.test(
            item.key
          )
      );

    if (
      preferred
    ) {

      const value =
        convertRadarValue(
          preferred.value
        );

      if (
        value !== null
      ) {

        return value;

      }

    }

  } catch (_) {}

  const parser =
    new DOMParser();

  let doc =
    null;

  try {

    doc =
      parser.parseFromString(
        text,
        "text/html"
      );

  } catch (_) {}

  if (doc) {

    const rows =
      Array.from(
        doc.querySelectorAll(
          "tr"
        )
      );

    for (
      const row of rows
    ) {

      const cells =
        Array.from(
          row.querySelectorAll(
            "td,th"
          )
        )
        .map(
          cell =>
            cell.textContent.trim()
        );

      if (
        cells.length < 2
      ) {
        continue;
      }

      const label =
        cells[0].toLowerCase();

      if (
        /dbz|dbzh|reflect|reflectivity|bufr_dbz1/.test(
          label
        )
      ) {

        for (
          let i = 1;
          i < cells.length;
          i++
        ) {

          const match =
            cells[i].match(
              /-?\d+(?:\.\d+)?/
            );

          if (!match) {
            continue;
          }

          const value =
            convertRadarValue(
              Number(
                match[0]
              )
            );

          if (
            value !== null
          ) {

            return value;

          }

        }

      }

    }

    const allElements =
      Array.from(
        doc.querySelectorAll(
          "*"
        )
      );

    for (
      const element of
      allElements
    ) {

      const name =
        (
          element.getAttribute(
            "name"
          ) ||
          element.getAttribute(
            "property"
          ) ||
          element.getAttribute(
            "type"
          ) ||
          element.tagName ||
          ""
        ).toLowerCase();

      if (
        !/dbz|dbzh|reflect|reflectivity|bufr_dbz1|value_0/.test(
          name
        )
      ) {

        continue;

      }

      const valueText =
        element.textContent.trim();

      const match =
        valueText.match(
          /-?\d+(?:\.\d+)?/
        );

      if (!match) {
        continue;
      }

      const value =
        convertRadarValue(
          Number(
            match[0]
          )
        );

      if (
        value !== null
      ) {

        return value;

      }

    }

  }

  const patterns = [

    /(?:dBZ|dBZH|DBZH|reflectivity)[^0-9-]*(-?\d+(?:\.\d+)?)/i,

    /(?:bufr_dbz1)[^0-9-]*(-?\d+(?:\.\d+)?)/i,

    /(?:value_0)[^0-9-]*(-?\d+(?:\.\d+)?)/i,

    /(?:dbzh|dbz)[^0-9-]*(-?\d+(?:\.\d+)?)/i

  ];

  for (
    const pattern of
    patterns
  ) {

    const match =
      text.match(
        pattern
      );

    if (!match) {
      continue;
    }

    const raw =
      Number(
        match[1]
      );

    const value =
      convertRadarValue(
        raw
      );

    if (
      value !== null
    ) {

      return value;

    }

  }

  return null;

}

/* =========================================================
   RADAR VALUE
========================================================= */

function convertRadarValue(
  raw
) {

  if (
    !Number.isFinite(
      raw
    )
  ) {

    return null;

  }

  if (
    raw >= -100 &&
    raw <= 100
  ) {

    return raw;

  }

  if (
    raw >= 0 &&
    raw <= 254
  ) {

    const dbz =
      raw * 0.5 -
      32;

    if (
      dbz >= -100 &&
      dbz <= 100
    ) {

      return dbz;

    }

  }

  return null;

}

/* =========================================================
   CLOSE INFO WHEN MAP MOVES
========================================================= */

map.on(
  "movestart",
  () => {

    hidePixelInfo();

  }
);

/* =========================================================
   GEOLOCATION
========================================================= */

document
  .getElementById(
    "locateBtn"
  )
  .addEventListener(
    "click",
    () => {

      if (
        !navigator.geolocation
      ) {

        return;

      }

      navigator.geolocation.getCurrentPosition(

        position => {

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;

          map.setView(
            [
              lat,
              lon
            ],
            Math.max(
              map.getZoom(),
              8
            )
          );

        },

        error => {

          console.warn(
            "Geolocation error:",
            error
          );

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            10000,

          maximumAge:
            30000

        }

      );

    }
  );

/* =========================================================
   SEARCH
========================================================= */

document
  .getElementById(
    "searchBtn"
  )
  .addEventListener(
    "click",
    () => {

      const value =
        prompt(
          "Введите координаты:\n\nНапример:\n54.74, 55.97"
        );

      if (!value) {
        return;
      }

      const parts =
        value
          .replace(
            ";",
            ","
          )
          .split(",");

      if (
        parts.length < 2
      ) {

        alert(
          "Неверный формат координат"
        );

        return;

      }

      const lat =
        Number(
          parts[0].trim()
        );

      const lon =
        Number(
          parts[1].trim()
        );

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
      ) {

        alert(
          "Неверные координаты"
        );

        return;

      }

      map.setView(
        [
          lat,
          lon
        ],
        Math.max(
          map.getZoom(),
          8
        )
      );

    }
  );

/* =========================================================
   UPDATE
========================================================= */

setInterval(
  () => {

    loadCapabilities();

  },
  60 * 1000
);

/* =========================================================
   START
========================================================= */

loadCapabilities();

</script>
