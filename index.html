<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPTrad</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background: #111;
}

#map {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #d9d9d9;
}

/* =========================
   TOP BAR
========================= */

.topbar {
  position: fixed;
  z-index: 1000;
  top: 10px;
  left: 10px;
  right: 10px;

  height: 44px;

  display: flex;
  align-items: center;

  padding: 0 8px;

  background: rgba(20,20,20,.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border-radius: 10px;

  box-shadow:
    0 4px 20px rgba(0,0,0,.28);

  color: white;
}

.logo {
  font-size: 16px;
  font-weight: 700;
  margin-left: 5px;
}

.top-spacer {
  flex: 1;
}

.icon-btn {
  width: 34px;
  height: 34px;

  border: 0;
  outline: 0;

  border-radius: 8px;

  background: rgba(255,255,255,.08);
  color: white;

  font-size: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.icon-btn:active {
  background: rgba(255,255,255,.18);
}

/* =========================
   RADAR PANEL
========================= */

.radar-panel {
  position: fixed;
  z-index: 1100;

  top: 64px;
  right: 10px;

  width: 245px;

  background: rgba(20,20,20,.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  border-radius: 10px;

  padding: 11px;

  color: white;

  box-shadow:
    0 8px 30px rgba(0,0,0,.35);

  transform: translateX(calc(100% + 20px));
  transition: transform .22s ease;
}

.radar-panel.open {
  transform: translateX(0);
}

.panel-head {
  display: flex;
  align-items: center;

  height: 30px;

  margin-bottom: 8px;
}

.panel-close {
  width: 28px;
  height: 28px;

  margin-right: 4px;

  border: 0;
  outline: 0;

  background: transparent;
  color: rgba(255,255,255,.9);

  border-radius: 7px;

  font-size: 25px;
  line-height: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.panel-close:active {
  background: rgba(255,255,255,.12);
}

.panel-title {
  font-size: 14px;
  font-weight: 700;
}

.panel-section {
  padding: 8px 0;
  border-top: 1px solid rgba(255,255,255,.08);
}

.panel-section:first-of-type {
  border-top: 0;
}

.panel-label {
  font-size: 11px;
  opacity: .58;
  margin-bottom: 7px;
}

.layer-row {
  display: flex;
  align-items: center;

  min-height: 34px;

  font-size: 13px;
}

.layer-row input {
  width: 16px;
  height: 16px;

  margin: 0 8px 0 0;

  accent-color: white;
}

.layer-row span {
  flex: 1;
}

/* =========================
   STATUS
========================= */

.status {
  position: fixed;
  z-index: 1001;

  left: 10px;
  bottom: 94px;

  padding: 7px 10px;

  border-radius: 7px;

  background: rgba(20,20,20,.82);
  color: white;

  font-size: 11px;

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  pointer-events: none;

  opacity: .9;
}

/* =========================
   TIME PANEL
========================= */

.timeline {
  position: fixed;
  z-index: 1000;

  left: 10px;
  right: 10px;
  bottom: 10px;

  height: 68px;

  padding: 9px 12px 8px;

  background: rgba(20,20,20,.9);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border-radius: 10px;

  color: white;

  box-shadow:
    0 5px 25px rgba(0,0,0,.3);
}

.time-top {
  display: flex;
  align-items: center;

  margin-bottom: 6px;
}

.time-title {
  font-size: 10px;
  opacity: .55;
}

.time-value {
  margin-left: auto;

  font-size: 12px;
  font-weight: 600;
}

.timeline-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.time-button {
  width: 29px;
  height: 27px;

  border: 0;
  outline: 0;

  border-radius: 6px;

  background: rgba(255,255,255,.08);
  color: white;

  font-size: 14px;

  cursor: pointer;
}

.time-button:active {
  background: rgba(255,255,255,.18);
}

#timeSlider {
  flex: 1;
  height: 20px;
  margin: 0;
}

/* =========================
   PIXEL INFO
========================= */

.pixel-info {
  position: fixed;
  z-index: 1200;

  display: none;

  width: 190px;

  padding: 11px 12px 12px;

  background: rgba(18,18,18,.94);

  color: white;

  border-radius: 6px;

  box-shadow:
    0 6px 25px rgba(0,0,0,.4);

  pointer-events: none;
}

.pixel-value {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.05;
}

.pixel-time {
  margin-top: 5px;

  font-size: 11px;
  opacity: .65;
}

.pixel-coords {
  margin-top: 4px;

  font-size: 9px;
  opacity: .5;
}

.pixel-phenomenon {
  margin-top: 6px;

  font-size: 11px;
  opacity: .8;
}

/* =========================
   LEAFLET
========================= */

.leaflet-control-zoom {
  margin-top: 65px !important;
}

.leaflet-control-attribution {
  font-size: 8px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .topbar {
    top: 8px;
    left: 8px;
    right: 8px;
  }

  .radar-panel {
    top: 60px;
    right: 8px;
    width: 230px;
  }

  .timeline {
    left: 8px;
    right: 8px;
    bottom: 8px;
  }

  .status {
    left: 8px;
    bottom: 86px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div class="topbar">

  <div class="logo">GPTrad</div>

  <div class="top-spacer"></div>

  <button
    id="locateBtn"
    class="icon-btn"
    title="Моё местоположение"
  >⌖</button>

  <button
    id="searchBtn"
    class="icon-btn"
    title="Поиск координат"
  >⌕</button>

  <button
    id="panelBtn"
    class="icon-btn"
    title="Радар"
  >☰</button>

</div>


<div
  id="radarPanel"
  class="radar-panel"
>

  <div class="panel-head">

    <button
      id="panelClose"
      class="panel-close"
      aria-label="Закрыть"
    >×</button>

    <div class="panel-title">
      Радар
    </div>

  </div>


  <div class="panel-section">

    <div class="panel-label">
      Отражаемость
    </div>

    <label class="layer-row">

      <input
        id="radarToggle"
        type="checkbox"
        checked
      >

      <span>
        Отражаемость
      </span>

    </label>

  </div>


  <div class="panel-section">

    <div class="panel-label">
      Движение
    </div>

    <label class="layer-row">

      <input
        id="vectorToggle"
        type="checkbox"
        checked
      >

      <span>
        Векторы движения
      </span>

    </label>

  </div>

</div>


<div
  id="status"
  class="status"
>
  Загрузка радара…
</div>


<div
  id="pixelInfo"
  class="pixel-info"
>

  <div
    id="pixelValue"
    class="pixel-value"
  >—</div>

  <div
    id="pixelTime"
    class="pixel-time"
  >—</div>

  <div
    id="pixelCoords"
    class="pixel-coords"
  >—</div>

  <div
    id="pixelPhenomenon"
    class="pixel-phenomenon"
  >
    Отражаемость
  </div>

</div>


<div class="timeline">

  <div class="time-top">

    <div class="time-title">
      Время
    </div>

    <div
      id="timeValue"
      class="time-value"
    >
      —
    </div>

  </div>


  <div class="timeline-controls">

    <button
      id="prevBtn"
      class="time-button"
    >‹</button>

    <button
      id="playBtn"
      class="time-button"
    >▶</button>

    <input
      id="timeSlider"
      type="range"
      min="0"
      max="0"
      value="0"
      step="1"
    >

    <button
      id="nextBtn"
      class="time-button"
    >›</button>

  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   CONFIG
========================================================= */

const WMS_URL = "/baltrad_wsgi";
const VECTOR_URL = "/vector_wsgi";

const TARGET_LAYER = "bufr_dbz1";

/*
 * Для векторов используем те же слои,
 * которые использует исходное демо.
 */
const VECTOR_TITLE =
  "bufr_dbz1,bufr_novosib_dbz1,bufr_vlad_dbz1";

/*
 * 10 минут между кадрами.
 */
const FRAME_STEP =
  10 * 60 * 1000;

/*
 * Всего показываем 28 кадров.
 *
 * 28 × 10 минут =
 * 4 часа 40 минут.
 */
const MAX_FRAMES = 28;

/*
 * При первом запуске заранее грузим
 * только последние 14 кадров.
 */
const INITIAL_PRELOAD = 14;

/*
 * Максимум одновременных фоновых
 * загрузок.
 *
 * Это важно для iPhone:
 * не отправляем сразу 14 тяжёлых WMS-запросов.
 */
const PRELOAD_CONCURRENCY = 2;


/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {
  zoomControl: true,
  attributionControl: true,
  preferCanvas: true
}).setView(
  [54.74, 55.97],
  6
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 18,
    attribution: "© OpenStreetMap"
  }
).addTo(map);


/* =========================================================
   STATE
========================================================= */

let times = [];

let currentTime = null;

let currentRadarLayer = null;

let radarRequestId = 0;

let vectorRequestId = 0;

let playing = false;

let playTimer = null;

let autoFollowLatest = true;

/*
 * Кеш WMS.
 *
 * Ключом является полный URL.
 *
 * Это важно, потому что URL содержит
 * BBOX текущего положения карты.
 */
const radarCache = new Map();

/*
 * Уже запущенная фоновая предзагрузка.
 */
let preloadStarted = false;


/* =========================================================
   DOM
========================================================= */

const radarPanel =
  document.getElementById("radarPanel");

const panelBtn =
  document.getElementById("panelBtn");

const panelClose =
  document.getElementById("panelClose");

const radarToggle =
  document.getElementById("radarToggle");

const vectorToggle =
  document.getElementById("vectorToggle");

const statusEl =
  document.getElementById("status");

const timeSlider =
  document.getElementById("timeSlider");

const timeValue =
  document.getElementById("timeValue");

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const playBtn =
  document.getElementById("playBtn");

const pixelInfo =
  document.getElementById("pixelInfo");

const pixelValue =
  document.getElementById("pixelValue");

const pixelTime =
  document.getElementById("pixelTime");

const pixelCoords =
  document.getElementById("pixelCoords");


/* =========================================================
   PANEL
========================================================= */

panelBtn.addEventListener("click", () => {
  radarPanel.classList.toggle("open");
});

panelClose.addEventListener("click", () => {
  radarPanel.classList.remove("open");
});


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {
  statusEl.textContent = text;
}


/* =========================================================
   TIME HELPERS
========================================================= */

function formatTime(iso) {

  const d = new Date(iso);

  if (Number.isNaN(d.getTime())) {
    return "—";
  }

  return d.toLocaleTimeString(
    "ru-RU",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function formatDateTime(iso) {

  const d = new Date(iso);

  if (Number.isNaN(d.getTime())) {
    return "—";
  }

  return d.toLocaleString(
    "ru-RU",
    {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function isUsableTime(date) {

  return date.getTime()
    <= Date.now() + 30 * 1000;
}


/* =========================================================
   PARSE CAPABILITIES
========================================================= */

function extractTimesFromText(text) {

  const result = [];

  try {

    const parser =
      new DOMParser();

    const xml =
      parser.parseFromString(
        text,
        "text/xml"
      );

    const layers =
      Array.from(
        xml.getElementsByTagName("Layer")
      );

    let targetLayer = null;

    for (const layer of layers) {

      const names =
        Array.from(
          layer.children
        ).filter(
          el =>
            el.localName.toLowerCase() === "name"
        );

      if (
        names.length &&
        names[0].textContent.trim() === TARGET_LAYER
      ) {

        targetLayer = layer;
        break;
      }
    }


    if (targetLayer) {

      const nodes =
        Array.from(
          targetLayer.querySelectorAll(
            "Dimension, Extent"
          )
        );

      for (const node of nodes) {

        const name =
          (
            node.getAttribute("name") ||
            ""
          ).toLowerCase();

        if (name !== "time") {
          continue;
        }

        parseTimeValue(
          node.textContent.trim(),
          result
        );
      }
    }

  } catch (e) {

    console.warn(
      "XML parse error",
      e
    );
  }


  /*
   * Fallback.
   */

  if (!result.length) {

    const regex =
      /20\d\d-\d\d-\d\dT\d\d:\d\d(?::\d\d)?(?:\.\d+)?Z/g;

    const matches =
      text.match(regex) || [];

    for (const value of matches) {

      const d =
        new Date(value);

      if (!Number.isNaN(d.getTime())) {

        result.push(
          d.toISOString()
        );
      }
    }
  }


  return [
    ...new Set(result)
  ]
    .map(
      value => new Date(value)
    )
    .filter(
      isUsableTime
    )
    .sort(
      (a,b) =>
        a.getTime() -
        b.getTime()
    )
    .map(
      d => d.toISOString()
    );
}


function parseTimeValue(
  value,
  result
) {

  if (!value) {
    return;
  }


  /*
   * Список времён.
   */

  if (
    value.includes(",") &&
    !value.includes("/")
  ) {

    for (
      const part of value.split(",")
    ) {

      const d =
        new Date(
          part.trim()
        );

      if (
        !Number.isNaN(d.getTime())
      ) {

        result.push(
          d.toISOString()
        );
      }
    }

    return;
  }


  /*
   * Интервал:
   *
   * start/end/step
   */

  const parts =
    value.split("/");

  if (parts.length >= 2) {

    const start =
      new Date(parts[0]);

    const end =
      new Date(parts[1]);

    if (
      !Number.isNaN(start.getTime()) &&
      !Number.isNaN(end.getTime())
    ) {

      let step =
        FRAME_STEP;


      if (parts[2]) {

        const match =
          parts[2].match(
            /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/i
          );

        if (match) {

          const hours =
            Number(match[1] || 0);

          const minutes =
            Number(match[2] || 0);

          const seconds =
            Number(match[3] || 0);

          step =
            (
              hours * 3600 +
              minutes * 60 +
              seconds
            ) * 1000;
        }
      }


      const max =
        Math.min(
          end.getTime(),
          Date.now() + 30 * 1000
        );


      for (
        let t = start.getTime();
        t <= max;
        t += step
      ) {

        result.push(
          new Date(t).toISOString()
        );
      }
    }
  }
}


/* =========================================================
   GET CAPABILITIES
========================================================= */

async function loadCapabilities() {

  setStatus(
    "Загрузка радара…"
  );


  const url =
    WMS_URL +
    "?SERVICE=WMS" +
    "&VERSION=1.1.1" +
    "&REQUEST=GetCapabilities";


  try {

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const text =
      await response.text();


    let parsed =
      extractTimesFromText(text);


    /*
     * Берём последние 28.
     */

    if (
      parsed.length >
      MAX_FRAMES
    ) {

      parsed =
        parsed.slice(
          -MAX_FRAMES
        );
    }


    times = parsed;


    timeSlider.min = 0;

    timeSlider.max =
      Math.max(
        0,
        times.length - 1
      );


    if (!times.length) {

      throw new Error(
        "Временные кадры не найдены"
      );
    }


    const newest =
      times[times.length - 1];


    /*
     * Первый запуск.
     */

    if (!currentTime) {

      await selectTime(
        newest,
        false,
        true
      );


      /*
       * Только после того как
       * первый кадр появился на карте,
       * запускаем фоновую загрузку
       * последних 14 кадров.
       */
      startInitialPreload();

    }

    else if (
      autoFollowLatest &&
      currentTime !== newest
    ) {

      await selectTime(
        newest,
        false,
        true
      );

    }

    else {

      updateTimelinePosition();
    }


    setStatus(
      "Готово"
    );

  } catch (error) {

    console.error(
      "Capabilities error:",
      error
    );

    setStatus(
      "Ошибка загрузки радара"
    );
  }
}


/* =========================================================
   RADAR REQUEST
========================================================= */

function getRadarRequest(time) {

  const bounds =
    map.getBounds();

  const south =
    bounds.getSouth();

  const west =
    bounds.getWest();

  const north =
    bounds.getNorth();

  const east =
    bounds.getEast();

  const size =
    map.getSize();


  const bbox = [
    west,
    south,
    east,
    north
  ].join(",");


  const width =
    Math.max(
      256,
      Math.round(size.x)
    );

  const height =
    Math.max(
      256,
      Math.round(size.y)
    );


  const params =
    new URLSearchParams({

      SERVICE: "WMS",

      VERSION: "1.1.1",

      REQUEST: "GetMap",

      LAYERS: TARGET_LAYER,

      STYLES: "",

      FORMAT: "image/png",

      TRANSPARENT: "true",

      SRS: "EPSG:4326",

      BBOX: bbox,

      WIDTH: width,

      HEIGHT: height,

      TIME: time
    });


  return {

    url:
      WMS_URL +
      "?" +
      params.toString(),

    /*
     * Очень важно:
     * границы принадлежат именно
     * этому WMS-запросу.
     */
    bounds:
      L.latLngBounds(
        [south, west],
        [north, east]
      )
  };
}


/* =========================================================
   IMAGE CACHE
========================================================= */

function loadImage(url) {

  return new Promise(
    (resolve, reject) => {

      const img =
        new Image();

      img.onload = () => {

        if (
          !img.naturalWidth ||
          !img.naturalHeight
        ) {

          reject(
            new Error(
              "Пустое изображение"
            )
          );

          return;
        }

        resolve(img);
      };


      img.onerror = () => {

        reject(
          new Error(
            "Изображение не загрузилось"
          )
        );
      };


      img.src = url;
    }
  );
}


function loadImageCached(url) {

  /*
   * Если этот URL уже грузится
   * или был загружен —
   * используем существующий Promise.
   */
  if (
    radarCache.has(url)
  ) {

    return radarCache.get(url);
  }


  const promise =
    loadImage(url)
      .catch(error => {

        /*
         * Ошибочные запросы не держим
         * в кеше — можно будет повторить.
         */
        radarCache.delete(url);

        throw error;
      });


  radarCache.set(
    url,
    promise
  );


  return promise;
}


/* =========================================================
   CANDIDATE FRAMES
========================================================= */

function getCandidateTimes(time) {

  const index =
    times.indexOf(time);


  if (index < 0) {
    return [time];
  }


  return times
    .slice(
      0,
      index + 1
    )
    .reverse();
}


/* =========================================================
   APPLY RADAR
========================================================= */

function applyRadarImage(
  img,
  bounds
) {

  if (!radarToggle.checked) {
    return;
  }


  if (!currentRadarLayer) {

    currentRadarLayer =
      L.imageOverlay(
        img.src,
        bounds,
        {
          opacity: .72,
          interactive: false
        }
      ).addTo(map);


    return;
  }


  const element =
    currentRadarLayer.getElement();


  if (element) {

    /*
     * Сначала заменяем картинку.
     */
    element.src =
      img.src;

    /*
     * И только после этого
     * устанавливаем ИМЕННО ТЕ bounds,
     * с которыми был сделан запрос.
     */
    currentRadarLayer.setBounds(
      bounds
    );

  } else {

    currentRadarLayer.setUrl(
      img.src
    );

    currentRadarLayer.setBounds(
      bounds
    );
  }
}


/* =========================================================
   SELECT RADAR TIME
========================================================= */

async function selectTime(
  requestedTime,
  fromMapMove = false,
  allowFallback = true
) {

  if (!requestedTime) {
    return;
  }


  const requestId =
    ++radarRequestId;


  const candidates =
    allowFallback
      ? getCandidateTimes(requestedTime)
      : [requestedTime];


  for (
    const candidateTime of candidates
  ) {

    if (
      requestId !== radarRequestId
    ) {

      return;
    }


    /*
     * BBOX создаём именно сейчас.
     *
     * Он будет сохранён вместе
     * с результатом загрузки.
     */
    const request =
      getRadarRequest(
        candidateTime
      );


    try {

      if (!fromMapMove) {

        setStatus(
          "Загрузка " +
          formatTime(candidateTime) +
          "…"
        );
      }


      /*
       * Грузим новый кадр,
       * но старый пока НЕ трогаем.
       */
      const img =
        await loadImageCached(
          request.url
        );


      if (
        requestId !== radarRequestId
      ) {

        return;
      }


      try {

        if (img.decode) {
          await img.decode();
        }

      } catch (_) {}


      if (
        requestId !== radarRequestId
      ) {

        return;
      }


      /*
       * Только теперь меняем изображение
       * на карте.
       */
      applyRadarImage(
        img,
        request.bounds
      );


      currentTime =
        candidateTime;


      updateTimelinePosition();


      pixelInfo.style.display =
        "none";


      if (!fromMapMove) {

        setStatus(
          "Отражаемость · " +
          formatTime(currentTime)
        );
      }


      /*
       * Векторы всегда привязаны
       * к реально показанному кадру.
       */
      if (
        vectorToggle.checked
      ) {

        loadVectors(
          currentTime
        );
      }


      return;

    } catch (error) {

      console.warn(
        "Frame unavailable:",
        candidateTime,
        error
      );


      /*
       * Если выбранный кадр недоступен —
       * пробуем предыдущий.
       */
      continue;
    }
  }


  if (
    requestId === radarRequestId
  ) {

    updateTimelinePosition();

    setStatus(
      "Кадр временно недоступен"
    );
  }
}


/* =========================================================
   INITIAL PRELOAD
========================================================= */

async function startInitialPreload() {

  if (preloadStarted) {
    return;
  }

  preloadStarted = true;


  /*
   * Последние 14 кадров.
   *
   * Самый последний уже был загружен
   * через selectTime(), поэтому начинаем
   * с предыдущих.
   */
  const start =
    Math.max(
      0,
      times.length - INITIAL_PRELOAD
    );


  const preloadTimes =
    times.slice(
      start,
      times.length - 1
    );


  /*
   * Очередь с ограничением
   * количества одновременных запросов.
   */
  let cursor = 0;


  async function worker() {

    while (
      cursor <
      preloadTimes.length
    ) {

      const index =
        cursor++;


      const time =
        preloadTimes[index];


      /*
       * Если пользователь уже двигает карту,
       * старый BBOX всё равно будет безопасен:
       * этот URL просто останется в кеше.
       */
      const request =
        getRadarRequest(
          time
        );


      try {

        await loadImageCached(
          request.url
        );

      } catch (error) {

        console.warn(
          "Preload failed:",
          time,
          error
        );
      }
    }
  }


  const workers = [];


  for (
    let i = 0;
    i < Math.min(
      PRELOAD_CONCURRENCY,
      preloadTimes.length
    );
    i++
  ) {

    workers.push(
      worker()
    );
  }


  await Promise.all(
    workers
  );
}


/* =========================================================
   TIMELINE POSITION
========================================================= */

function updateTimelinePosition() {

  if (!currentTime || !times.length) {
    return;
  }


  let index =
    times.indexOf(
      currentTime
    );


  if (index < 0) {

    let bestIndex = 0;

    let bestDiff =
      Infinity;

    const target =
      new Date(
        currentTime
      ).getTime();


    for (
      let i = 0;
      i < times.length;
      i++
    ) {

      const diff =
        Math.abs(
          new Date(
            times[i]
          ).getTime() -
          target
        );


      if (
        diff < bestDiff
      ) {

        bestDiff = diff;
        bestIndex = i;
      }
    }


    index =
      bestIndex;
  }


  timeSlider.value =
    index;


  timeValue.textContent =
    formatDateTime(
      currentTime
    );
}


/* =========================================================
   TIMELINE INPUT
========================================================= */

timeSlider.addEventListener(
  "input",
  () => {

    const index =
      Number(
        timeSlider.value
      );


    if (
      !times[index]
    ) {
      return;
    }


    autoFollowLatest =
      index ===
      times.length - 1;


    /*
     * Старый кадр теперь может быть
     * загружен лениво именно здесь.
     */
    selectTime(
      times[index],
      false,
      true
    );
  }
);


/* =========================================================
   PREVIOUS
========================================================= */

prevBtn.addEventListener(
  "click",
  () => {

    if (!times.length) {
      return;
    }


    let index =
      Number(
        timeSlider.value
      );


    index =
      Math.max(
        0,
        index - 1
      );


    timeSlider.value =
      index;


    autoFollowLatest =
      index ===
      times.length - 1;


    selectTime(
      times[index],
      false,
      true
    );
  }
);


/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener(
  "click",
  () => {

    if (!times.length) {
      return;
    }


    let index =
      Number(
        timeSlider.value
      );


    index =
      Math.min(
        times.length - 1,
        index + 1
      );


    timeSlider.value =
      index;


    autoFollowLatest =
      index ===
      times.length - 1;


    selectTime(
      times[index],
      false,
      true
    );
  }
);


/* =========================================================
   PLAY
========================================================= */

playBtn.addEventListener(
  "click",
  () => {

    if (!times.length) {
      return;
    }


    if (playing) {

      playing = false;

      clearInterval(
        playTimer
      );

      playTimer = null;

      playBtn.textContent =
        "▶";

      return;
    }


    playing = true;

    playBtn.textContent =
      "❚❚";


    playTimer =
      setInterval(
        () => {

          let index =
            Number(
              timeSlider.value
            );


          index++;


          if (
            index >=
            times.length
          ) {

            index = 0;
          }


          timeSlider.value =
            index;


          autoFollowLatest =
            index ===
            times.length - 1;


          selectTime(
            times[index],
            false,
            true
          );

        },
        900
      );
  }
);


/* =========================================================
   RADAR TOGGLE
========================================================= */

radarToggle.addEventListener(
  "change",
  () => {

    if (!currentRadarLayer) {
      return;
    }


    if (
      radarToggle.checked
    ) {

      currentRadarLayer.setOpacity(
        .72
      );

    } else {

      currentRadarLayer.setOpacity(
        0
      );
    }
  }
);


/* =========================================================
   VECTOR LAYER
========================================================= */

const vectorLayer =
  L.layerGroup().addTo(map);


/* =========================================================
   DESTINATION
========================================================= */

function destination(
  lon,
  lat,
  dist,
  bearing
) {

  const R =
    6371;


  const brng =
    bearing *
    Math.PI /
    180;


  const lat1 =
    lat *
    Math.PI /
    180;


  const lon1 =
    lon *
    Math.PI /
    180;


  const d =
    dist / R;


  const lat2 =
    Math.asin(
      Math.sin(lat1) *
      Math.cos(d) +
      Math.cos(lat1) *
      Math.sin(d) *
      Math.cos(brng)
    );


  const lon2 =
    lon1 +
    Math.atan2(
      Math.sin(brng) *
      Math.sin(d) *
      Math.cos(lat1),

      Math.cos(d) -
      Math.sin(lat1) *
      Math.sin(lat2)
    );


  return [
    lon2 * 180 / Math.PI,
    lat2 * 180 / Math.PI
  ];
}


/* =========================================================
   CREATE VECTOR
========================================================= */

function createVector(
  lat,
  lon,
  dist,
  head
) {

  const end =
    destination(
      lon,
      lat,
      dist,
      head
    );


  const points = [
    [lat, lon],
    [end[1], end[0]]
  ];


  /*
   * Чёрная обводка.
   */
  const outline =
    L.polyline(
      points,
      {
        color: "#000000",
        weight: 3,
        opacity: .95,
        interactive: false
      }
    );


  /*
   * Белая основная линия.
   */
  const line =
    L.polyline(
      points,
      {
        color: "#ffffff",
        weight: 1.5,
        opacity: 1,
        interactive: false
      }
    );


  return L.layerGroup([
    outline,
    line
  ]);
}


/* =========================================================
   LOAD VECTORS
========================================================= */

async function loadVectors(
  time
) {

  if (
    !vectorToggle.checked
  ) {

    vectorLayer.clearLayers();

    return;
  }


  const requestId =
    ++vectorRequestId;


  /*
   * ВАЖНО:
   * используем сразу три названия,
   * как в исходном демо.
   */
  const url =
    VECTOR_URL +
    "?time=" +
    encodeURIComponent(time) +
    "&title=" +
    encodeURIComponent(
      VECTOR_TITLE
    );


  try {

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    /*
     * Проверяем, что ответ ещё
     * относится к текущему кадру.
     */
    if (
      requestId !== vectorRequestId ||
      time !== currentTime ||
      !vectorToggle.checked
    ) {

      return;
    }


    vectorLayer.clearLayers();


    if (!Array.isArray(data)) {
      return;
    }


    for (
      const item of data
    ) {

      if (
        !Array.isArray(item) ||
        item.length < 4
      ) {

        continue;
      }


      const lat =
        Number(item[0]);

      const lon =
        Number(item[1]);

      const dist =
        Number(item[2]) * 3.6;

      const head =
        Number(item[3]);


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(dist) ||
        !Number.isFinite(head)
      ) {

        continue;
      }


      /*
       * Отбрасываем явно битые координаты.
       */
      if (
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
      ) {

        continue;
      }


      const vector =
        createVector(
          lat,
          lon,
          dist,
          head
        );


      vectorLayer.addLayer(
        vector
      );
    }


  } catch (error) {

    console.warn(
      "Vector error:",
      error
    );
  }
}


/* =========================================================
   VECTOR TOGGLE
========================================================= */

vectorToggle.addEventListener(
  "change",
  () => {

    if (
      !vectorToggle.checked
    ) {

      ++vectorRequestId;

      vectorLayer.clearLayers();

      return;
    }


    if (currentTime) {

      loadVectors(
        currentTime
      );
    }
  }
);


/* =========================================================
   MAP MOVE
========================================================= */

let moveTimer = null;


map.on(
  "moveend",
  () => {

    clearTimeout(
      moveTimer
    );


    moveTimer =
      setTimeout(
        () => {

          if (
            currentTime
          ) {

            /*
             * Новый запрос получает
             * новый BBOX карты.
             *
             * При этом время не меняется.
             */
            selectTime(
              currentTime,
              true,
              false
            );
          }

        },
        250
      );
  }
);


/* =========================================================
   MAP CLICK / PIXEL INFO
========================================================= */

map.on(
  "click",
  async event => {

    if (
      !currentTime ||
      !radarToggle.checked
    ) {

      return;
    }


    const bounds =
      map.getBounds();


    const size =
      map.getSize();


    const point =
      map.latLngToContainerPoint(
        event.latlng
      );


    const params =
      new URLSearchParams({

        SERVICE: "WMS",

        VERSION: "1.1.1",

        REQUEST: "GetFeatureInfo",

        LAYERS: TARGET_LAYER,

        QUERY_LAYERS: TARGET_LAYER,

        STYLES: "",

        INFO_FORMAT:
          "text/html",

        SRS: "EPSG:4326",

        BBOX:
          [
            bounds.getWest(),
            bounds.getSouth(),
            bounds.getEast(),
            bounds.getNorth()
          ].join(","),

        WIDTH:
          Math.round(size.x),

        HEIGHT:
          Math.round(size.y),

        X:
          Math.round(point.x),

        Y:
          Math.round(point.y),

        TIME: currentTime
      });


    const url =
      WMS_URL +
      "?" +
      params.toString();


    try {

      const response =
        await fetch(
          url,
          {
            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );
      }


      const text =
        await response.text();


      const dbz =
        parseDbz(
          text
        );


      if (
        dbz === null
      ) {

        pixelValue.textContent =
          "Нет данных";

      } else {

        pixelValue.textContent =
          dbz.toFixed(1) +
          " dBZ";
      }


      pixelTime.textContent =
        formatDateTime(
          currentTime
        );


      pixelCoords.textContent =
        event.latlng.lat.toFixed(4) +
        "°, " +
        event.latlng.lng.toFixed(4) +
        "°";


      pixelInfo.style.display =
        "block";


      const margin = 10;

      let left =
        event.containerPoint.x + 15;

      let top =
        event.containerPoint.y + 15;


      if (
        left + 190 >
        window.innerWidth - margin
      ) {

        left =
          event.containerPoint.x -
          205;
      }


      if (
        top + 130 >
        window.innerHeight - margin
      ) {

        top =
          event.containerPoint.y -
          145;
      }


      pixelInfo.style.left =
        left + "px";

      pixelInfo.style.top =
        top + "px";


    } catch (error) {

      console.warn(
        "GetFeatureInfo error:",
        error
      );
    }
  }
);


/* =========================================================
   DBZ PARSER
========================================================= */

function parseDbz(text) {

  const explicit =
    text.match(
      /dBZ[^0-9-]*(-?\d+(?:\.\d+)?)/i
    );


  if (explicit) {

    const value =
      Number(
        explicit[1]
      );


    if (
      Number.isFinite(value)
    ) {

      return value;
    }
  }


  const rawMatch =
    text.match(
      /(?:value_0|value|dbzh|dbz|bufr_dbz1|reflectivity)[^0-9-]*(-?\d+(?:\.\d+)?)/i
    );


  if (!rawMatch) {
    return null;
  }


  const raw =
    Number(
      rawMatch[1]
    );


  if (
    !Number.isFinite(raw)
  ) {

    return null;
  }


  /*
   * BALTRAD DBZH:
   *
   * dBZ = raw * 0.5 - 32
   *
   * 255 = NoData
   */
  if (
    raw >= 0 &&
    raw <= 254
  ) {

    return (
      raw * .5 - 32
    );
  }


  return null;
}


/* =========================================================
   CLOSE PIXEL INFO
========================================================= */

map.on(
  "movestart",
  () => {

    pixelInfo.style.display =
      "none";
  }
);


/* =========================================================
   GEOLOCATION
========================================================= */

document
  .getElementById("locateBtn")
  .addEventListener(
    "click",
    () => {

      if (
        !navigator.geolocation
      ) {

        return;
      }


      navigator.geolocation.getCurrentPosition(
        position => {

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;


          map.setView(
            [lat, lon],
            Math.max(
              map.getZoom(),
              8
            )
          );
        },

        error => {

          console.warn(
            "Geolocation error:",
            error
          );
        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }
      );
    }
  );


/* =========================================================
   COORDINATE SEARCH
========================================================= */

document
  .getElementById("searchBtn")
  .addEventListener(
    "click",
    () => {

      const value =
        prompt(
          "Введите координаты:\n\nНапример:\n54.74, 55.97"
        );


      if (!value) {
        return;
      }


      const parts =
        value
          .replace(
            ";",
            ","
          )
          .split(",");


      if (
        parts.length < 2
      ) {

        alert(
          "Неверный формат координат"
        );

        return;
      }


      const lat =
        Number(
          parts[0].trim()
        );

      const lon =
        Number(
          parts[1].trim()
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
      ) {

        alert(
          "Неверные координаты"
        );

        return;
      }


      map.setView(
        [lat, lon],
        Math.max(
          map.getZoom(),
          8
        )
      );
    }
  );


/* =========================================================
   PERIODIC UPDATE
========================================================= */

setInterval(
  () => {

    loadCapabilities();

  },
  60 * 1000
);


/* =========================================================
   START
========================================================= */

loadCapabilities();

</script>
