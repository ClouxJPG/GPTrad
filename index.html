<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>GPTrad</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  background:#111;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

/* =========================
   TOP PANEL
========================= */

.top-panel{
  position:absolute;
  top:12px;
  left:12px;
  z-index:1000;

  display:flex;
  align-items:center;
  gap:8px;

  padding:8px 10px;

  background:rgba(20,20,20,.88);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border-radius:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.25);
}

.logo{
  color:white;
  font-size:16px;
  font-weight:700;
  margin-right:3px;
}

.mode-select{
  appearance:none;
  -webkit-appearance:none;

  border:0;
  outline:0;

  background:#292929;
  color:white;

  border-radius:9px;
  padding:8px 30px 8px 11px;

  font-size:14px;
  font-weight:600;
}

.icon-btn{
  width:36px;
  height:36px;

  border:0;
  outline:0;

  border-radius:9px;

  background:#292929;
  color:white;

  font-size:20px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:active{
  transform:scale(.94);
}

/* =========================
   STATUS
========================= */

#status{
  position:absolute;
  top:72px;
  left:14px;

  z-index:1000;

  padding:6px 10px;

  border-radius:8px;

  background:rgba(20,20,20,.78);
  color:white;

  font-size:12px;

  pointer-events:none;
}

/* =========================
   LAYERS BUTTON
========================= */

#layersButton{
  position:absolute;
  right:14px;
  top:14px;

  z-index:1000;

  height:42px;

  padding:0 14px;

  border:0;
  outline:0;

  border-radius:12px;

  background:rgba(20,20,20,.88);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  color:white;

  font-size:14px;
  font-weight:600;

  box-shadow:0 4px 18px rgba(0,0,0,.25);

  transition:
    transform .2s ease,
    background .2s ease;
}

#layersButton:active{
  transform:scale(.95);
}

/* =========================
   LAYERS DRAWER
========================= */

#layersDrawer{
  position:absolute;

  top:66px;
  right:14px;

  z-index:1100;

  width:260px;

  max-width:calc(100vw - 28px);

  padding:12px;

  border-radius:15px;

  background:rgba(20,20,20,.94);

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  box-shadow:0 8px 30px rgba(0,0,0,.35);

  transform:translateX(calc(100% + 30px));
  opacity:0;

  pointer-events:none;

  transition:
    transform .28s cubic-bezier(.22,.61,.36,1),
    opacity .22s ease;
}

#layersDrawer.open{
  transform:translateX(0);
  opacity:1;
  pointer-events:auto;
}

.drawer-title{
  color:white;
  font-size:15px;
  font-weight:700;

  margin:2px 4px 10px;
}

.layer-item{
  width:100%;

  display:flex;
  align-items:center;
  gap:10px;

  padding:11px 10px;

  border:0;
  outline:0;

  border-radius:10px;

  background:#292929;
  color:white;

  margin-bottom:7px;

  text-align:left;

  font-size:14px;

  transition:
    background .15s ease,
    transform .15s ease;
}

.layer-item:last-child{
  margin-bottom:0;
}

.layer-item:active{
  transform:scale(.98);
}

.layer-item.active{
  background:#3a3a3a;
}

.layer-dot{
  width:9px;
  height:9px;

  border-radius:50%;

  background:#777;

  flex:none;
}

.layer-item.active .layer-dot{
  background:#36d67a;
}

/* =========================
   SETTINGS
========================= */

#settings{
  position:absolute;

  top:60px;
  left:12px;

  z-index:1200;

  width:220px;

  padding:12px;

  background:rgba(20,20,20,.94);

  border-radius:14px;

  color:white;

  display:none;

  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

#settings.open{
  display:block;
}

.settings-title{
  font-size:14px;
  font-weight:700;
  margin-bottom:9px;
}

.theme-btn{
  width:100%;

  border:0;
  outline:0;

  padding:9px;

  border-radius:9px;

  margin-bottom:6px;

  background:#292929;
  color:white;

  text-align:left;
}

/* =========================
   TIMELINE
========================= */

.timeline{
  position:absolute;

  left:50%;
  bottom:14px;

  transform:translateX(-50%);

  z-index:1000;

  width:min(680px,calc(100vw - 28px));

  padding:10px 12px;

  border-radius:15px;

  background:rgba(20,20,20,.90);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  box-shadow:0 5px 25px rgba(0,0,0,.3);

  color:white;
}

.timeline-controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.timeline button{
  width:36px;
  height:32px;

  border:0;
  outline:0;

  border-radius:8px;

  background:#292929;
  color:white;

  font-size:15px;
}

#timeSlider{
  flex:1;
  min-width:0;
}

#timeLabel{
  width:130px;

  text-align:right;

  font-size:12px;
  opacity:.85;
}

/* =========================
   LOADING
========================= */

#loading{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:2000;

  display:none;

  padding:9px 13px;

  border-radius:10px;

  background:rgba(20,20,20,.9);

  color:white;

  font-size:13px;
}

/* =========================
   LIGHT THEME
========================= */

body.light .top-panel,
body.light #layersButton,
body.light #layersDrawer,
body.light #settings,
body.light .timeline,
body.light #status{
  background:rgba(255,255,255,.94);
  color:#111;
}

body.light .logo,
body.light #status,
body.light .drawer-title{
  color:#111;
}

body.light .mode-select,
body.light .icon-btn,
body.light .layer-item,
body.light .timeline button,
body.light .theme-btn{
  background:#eeeeee;
  color:#111;
}

body.light .layer-item.active{
  background:#dddddd;
}

/* =========================
   GREEN THEME
========================= */

body.green .top-panel,
body.green #layersButton,
body.green #layersDrawer,
body.green #settings,
body.green .timeline,
body.green #status{
  background:rgba(8,35,22,.94);
}

body.green .mode-select,
body.green .icon-btn,
body.green .layer-item,
body.green .timeline button,
body.green .theme-btn{
  background:#123d29;
  color:white;
}

body.green .layer-item.active{
  background:#185538;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .top-panel{
    top:8px;
    left:8px;

    gap:5px;

    padding:6px 7px;
  }

  .logo{
    font-size:14px;
  }

  .mode-select{
    max-width:145px;
    font-size:12px;
    padding:7px 24px 7px 8px;
  }

  .icon-btn{
    width:32px;
    height:32px;
    font-size:17px;
  }

  #layersButton{
    top:8px;
    right:8px;

    height:36px;

    padding:0 11px;

    font-size:13px;
  }

  #layersDrawer{
    top:53px;
    right:8px;
    width:245px;
  }

  #status{
    top:57px;
    left:9px;
  }

  .timeline{
    bottom:8px;
    width:calc(100vw - 16px);
  }

  #timeLabel{
    width:90px;
    font-size:10px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOP -->

<div class="top-panel">

  <div class="logo">GPTrad</div>

  <select id="mode" class="mode-select">
    <option value="radar">Радар (RainViewer)</option>
    <option value="warnings">Опасные явления</option>
  </select>

  <button id="locateBtn" class="icon-btn">⌖</button>
  <button id="reloadBtn" class="icon-btn">↻</button>
  <button id="settingsBtn" class="icon-btn">⚙</button>

</div>

<div id="status">Загрузка…</div>

<!-- LAYERS -->

<button id="layersButton">☷ Слои</button>

<div id="layersDrawer">

  <div class="drawer-title">
    Слои
  </div>

  <button class="layer-item active"
          data-layer="oya">
    <span class="layer-dot"></span>
    Опасные явления
  </button>

  <button class="layer-item"
          data-layer="phenomena">
    <span class="layer-dot"></span>
    BUFR явления
  </button>

  <button class="layer-item"
          data-layer="novosib">
    <span class="layer-dot"></span>
    Новосибирск
  </button>

  <button class="layer-item"
          data-layer="vlad">
    <span class="layer-dot"></span>
    Владивосток
  </button>

</div>

<!-- SETTINGS -->

<div id="settings">

  <div class="settings-title">
    Оформление
  </div>

  <button class="theme-btn" data-theme="dark">
    Тёмная
  </button>

  <button class="theme-btn" data-theme="light">
    Светлая
  </button>

  <button class="theme-btn" data-theme="green">
    Зелёная
  </button>

</div>

<!-- TIMELINE -->

<div class="timeline">

  <div class="timeline-controls">

    <button id="backBtn">◀</button>

    <button id="playBtn">▶</button>

    <button id="forwardBtn">▶</button>

    <input
      id="timeSlider"
      type="range"
      min="0"
      max="0"
      value="0"
    >

    <div id="timeLabel">
      —
    </div>

  </div>

</div>

<div id="loading">
  Загрузка…
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   MAP
========================================================= */

const map = L.map("map", {

  zoomControl:true,
  attributionControl:true,

  zoomSnap:0,
  zoomDelta:0.5,

  zoomAnimation:false,
  fadeAnimation:false,
  markerZoomAnimation:false,
  zoomAnimationThreshold:0,

  touchZoom:true,
  scrollWheelZoom:true,

  wheelDebounceTime:20,
  wheelPxPerZoomLevel:80,

  doubleClickZoom:true,

  dragging:true,
  inertia:true,
  inertiaDeceleration:3000,
  easeLinearity:0.2,

  minZoom:2,
  maxZoom:19

}).setView([55.75,37.61],5);


/* =========================================================
   OSM
========================================================= */

const osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    minZoom:2,
    maxZoom:19,

    tileSize:256,

    updateWhenIdle:true,
    updateWhenZooming:false,

    keepBuffer:3,

    attribution:"© OpenStreetMap"
  }
).addTo(map);


/* =========================================================
   STATE
========================================================= */

let radarLayer = null;

let oyaLayer = null;

let oyaMode = "oya";

let rainFrames = [];

let currentFrame = 0;

let playing = false;

let playTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const mode = document.getElementById("mode");

const status = document.getElementById("status");

const timeSlider = document.getElementById("timeSlider");

const timeLabel = document.getElementById("timeLabel");

const loading = document.getElementById("loading");

const layersButton = document.getElementById("layersButton");

const layersDrawer = document.getElementById("layersDrawer");

const settings = document.getElementById("settings");


/* =========================================================
   HELPERS
========================================================= */

function setStatus(text){
  status.textContent = text;
}

function showLoading(text="Загрузка…"){
  loading.textContent = text;
  loading.style.display = "block";
}

function hideLoading(){
  loading.style.display = "none";
}

function formatTime(ts){

  if(!ts) return "—";

  const d = new Date(ts * 1000);

  return d.toLocaleTimeString("ru-RU",{
    hour:"2-digit",
    minute:"2-digit"
  });
}


/* =========================================================
   LAYERS DRAWER
========================================================= */

layersButton.addEventListener("click",()=>{

  layersDrawer.classList.toggle("open");

});


document.querySelectorAll(".layer-item").forEach(button=>{

  button.addEventListener("click",()=>{

    document.querySelectorAll(".layer-item")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    const layer = button.dataset.layer;

    setOyaLayer(layer);

    layersDrawer.classList.remove("open");

  });

});


/* =========================================================
   RAINVIEWER
========================================================= */

async function loadRainViewer(){

  showLoading("Получение радара…");

  try{

    const response = await fetch(
      "https://api.rainviewer.com/public/weather-maps.json",
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("RainViewer HTTP "+response.status);
    }

    const data = await response.json();

    rainFrames = [
      ...(data.radar?.past || [])
    ];

    if(!rainFrames.length){
      throw new Error("Нет кадров радара");
    }

    currentFrame = rainFrames.length - 1;

    timeSlider.min = 0;
    timeSlider.max = rainFrames.length - 1;
    timeSlider.value = currentFrame;

    updateTimeLabel();

    showRainFrame(currentFrame);

    setStatus("Радар загружен");

  }catch(error){

    console.error(error);

    setStatus("Ошибка загрузки радара");

  }finally{

    hideLoading();

  }

}


/* =========================================================
   RAINVIEWER FRAME
========================================================= */

function makeRainLayer(frame){

  const url =
    "https://tilecache.rainviewer.com" +
    frame.path +
    "/256/{z}/{x}/{y}/2/1_1.png";

  return L.tileLayer(url,{

    tileSize:256,

    opacity:1,

    minZoom:2,
    maxZoom:18,

    zIndex:10,

    updateWhenIdle:true,
    updateWhenZooming:false,

    keepBuffer:3,

    fadeAnimation:false
  });

}


function showRainFrame(index){

  if(!rainFrames[index]) return;

  const frame = rainFrames[index];

  const newLayer = makeRainLayer(frame);

  const oldLayer = radarLayer;

  radarLayer = newLayer;

  newLayer.addTo(map);

  let loaded = false;

  newLayer.once("load",()=>{

    loaded = true;

    if(oldLayer && map.hasLayer(oldLayer)){
      map.removeLayer(oldLayer);
    }

  });

  setTimeout(()=>{

    if(!loaded && oldLayer){

      if(map.hasLayer(newLayer)){
        map.removeLayer(newLayer);
      }

      radarLayer = oldLayer;

    }

  },8000);

  updateTimeLabel();

}


/* =========================================================
   OЯ WMS
========================================================= */

const OYA_WMS =
  "https://www.nowcast.ru/baltrad_wsgi";


const OYA_LAYERS = {

  oya:
    "bufr_phenomena",

  phenomena:
    "bufr_phenomena",

  novosib:
    "bufr_novosib_phenomena",

  vlad:
    "bufr_vlad_phenomena"

};


/* =========================================================
   CREATE OЯ
========================================================= */

function createOyaLayer(){

  const layerName =
    OYA_LAYERS[oyaMode] ||
    OYA_LAYERS.oya;

  return L.tileLayer.wms(

    OYA_WMS,

    {

      layers:layerName,

      format:"image/png",

      transparent:true,

      version:"1.1.1",

      styles:"",

      opacity:1,

      tiled:true,

      zIndex:50,

      updateWhenIdle:true,
      updateWhenZooming:false,

      keepBuffer:2

    }

  );

}


/* =========================================================
   SHOW OЯ
========================================================= */

function showOya(){

  if(radarLayer){

    map.removeLayer(radarLayer);

    radarLayer = null;

  }

  if(oyaLayer){

    map.removeLayer(oyaLayer);

    oyaLayer = null;

  }

  oyaLayer = createOyaLayer();

  oyaLayer.addTo(map);

  setStatus("Опасные явления");

}


/* =========================================================
   CHANGE OЯ LAYER
========================================================= */

function setOyaLayer(type){

  if(mode.value !== "warnings"){

    mode.value = "warnings";

  }

  oyaMode = type;

  showOya();

}


/* =========================================================
   MODE SWITCH
========================================================= */

mode.addEventListener("change",()=>{

  if(mode.value === "radar"){

    if(oyaLayer){

      map.removeLayer(oyaLayer);
      oyaLayer = null;

    }

    layersDrawer.classList.remove("open");

    if(rainFrames.length){

      showRainFrame(currentFrame);

    }else{

      loadRainViewer();

    }

    setStatus("Радар");

  }


  if(mode.value === "warnings"){

    if(radarLayer){

      map.removeLayer(radarLayer);
      radarLayer = null;

    }

    layersDrawer.classList.add("open");

    showOya();

  }

});


/* =========================================================
   TIMELINE
========================================================= */

function updateTimeLabel(){

  if(mode.value === "radar" && rainFrames[currentFrame]){

    timeLabel.textContent =
      formatTime(rainFrames[currentFrame].time);

  }else{

    timeLabel.textContent =
      "Сейчас";

  }

}


timeSlider.addEventListener("input",()=>{

  if(mode.value !== "radar") return;

  currentFrame =
    Number(timeSlider.value);

  showRainFrame(currentFrame);

});


document.getElementById("backBtn")
.addEventListener("click",()=>{

  if(mode.value !== "radar") return;

  currentFrame =
    Math.max(0,currentFrame-1);

  timeSlider.value = currentFrame;

  showRainFrame(currentFrame);

});


document.getElementById("forwardBtn")
.addEventListener("click",()=>{

  if(mode.value !== "radar") return;

  currentFrame =
    Math.min(
      rainFrames.length-1,
      currentFrame+1
    );

  timeSlider.value = currentFrame;

  showRainFrame(currentFrame);

});


document.getElementById("playBtn")
.addEventListener("click",()=>{

  if(mode.value !== "radar") return;

  playing = !playing;

  document.getElementById("playBtn")
    .textContent = playing ? "Ⅱ" : "▶";

  if(playing){

    clearInterval(playTimer);

    playTimer = setInterval(()=>{

      if(currentFrame >= rainFrames.length-1){

        currentFrame = 0;

      }else{

        currentFrame++;

      }

      timeSlider.value = currentFrame;

      showRainFrame(currentFrame);

    },600);

  }else{

    clearInterval(playTimer);

  }

});


/* =========================================================
   LOCATION
========================================================= */

document.getElementById("locateBtn")
.addEventListener("click",()=>{

  if(!navigator.geolocation){

    setStatus("Геолокация недоступна");

    return;

  }

  setStatus("Определение местоположения…");

  navigator.geolocation.getCurrentPosition(

    position=>{

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      map.flyTo(
        [lat,lon],
        Math.max(map.getZoom(),8),
        {
          duration:.8
        }
      );

      setStatus("Ваше местоположение");

    },

    ()=>{
      setStatus("Не удалось определить местоположение");
    },

    {
      enableHighAccuracy:true,
      timeout:10000
    }

  );

});


/* =========================================================
   RELOAD
========================================================= */

document.getElementById("reloadBtn")
.addEventListener("click",()=>{

  if(mode.value === "radar"){

    loadRainViewer();

  }else{

    showOya();

  }

});


/* =========================================================
   SETTINGS
========================================================= */

document.getElementById("settingsBtn")
.addEventListener("click",()=>{

  settings.classList.toggle("open");

});


document.querySelectorAll(".theme-btn")
.forEach(button=>{

  button.addEventListener("click",()=>{

    const theme =
      button.dataset.theme;

    document.body.classList.remove(
      "light",
      "green"
    );

    if(theme !== "dark"){

      document.body.classList.add(theme);

    }

    localStorage.setItem(
      "gptrad-theme",
      theme
    );

  });

});


const savedTheme =
  localStorage.getItem("gptrad-theme");

if(savedTheme){

  document.body.classList.remove(
    "light",
    "green"
  );

  if(savedTheme !== "dark"){

    document.body.classList.add(
      savedTheme
    );

  }

}


/* =========================================================
   MAP ZOOM
========================================================= */

map.on("zoomstart",()=>{

  map._gptradZooming = true;

});


map.on("zoomend",()=>{

  map._gptradZooming = false;

});


/* =========================================================
   START
========================================================= */

loadRainViewer();

</script>

</body>
</html>
