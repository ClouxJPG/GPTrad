<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>GPTrad</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#map{
  width:100%;
  height:100%;
  background:#111;
}

.top-panel{
  position:absolute;
  z-index:1000;
  top:10px;
  left:10px;
  right:10px;
  height:52px;

  display:flex;
  align-items:center;
  gap:8px;

  padding:8px 10px;

  background:rgba(20,20,20,.88);
  border-radius:12px;
  color:white;

  box-shadow:0 3px 15px rgba(0,0,0,.3);
}

.title{
  font-weight:700;
  margin-right:auto;
}

select,
button{
  border:0;
  outline:none;
}

select{
  height:34px;
  border-radius:8px;
  padding:0 8px;
  background:#333;
  color:white;
}

button{
  width:34px;
  height:34px;
  border-radius:8px;
  background:#333;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:active{
  transform:scale(.95);
}

.status{
  position:absolute;
  z-index:1000;

  top:70px;
  left:50%;
  transform:translateX(-50%);

  padding:5px 10px;

  border-radius:8px;

  background:rgba(20,20,20,.75);
  color:white;

  font-size:12px;

  pointer-events:none;
}

.timeline{
  position:absolute;
  z-index:1000;

  left:10px;
  right:10px;
  bottom:12px;

  height:54px;

  display:flex;
  align-items:center;
  gap:8px;

  padding:8px 10px;

  background:rgba(20,20,20,.88);
  border-radius:12px;

  box-shadow:0 3px 15px rgba(0,0,0,.3);
}

.timeline button{
  flex:0 0 34px;
}

#slider{
  flex:1;
}

#timeLabel{
  min-width:120px;
  text-align:center;
  color:white;
  font-size:12px;
}

.leaflet-control-attribution{
  font-size:9px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top-panel">

  <div class="title">GPTrad</div>

  <select id="layer">
    <option value="radar">Радар (RainViewer)</option>
    <option value="warnings">Опасные явления</option>
  </select>

  <button id="locate">⌖</button>
  <button id="reload">↻</button>

</div>

<div class="status" id="status">
  Загрузка…
</div>

<div class="timeline">

  <button id="back">‹</button>

  <input
    id="slider"
    type="range"
    min="0"
    max="0"
    value="0"
  >

  <button id="play">▶</button>

  <button id="forward">›</button>

  <div id="timeLabel">—</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ============================================================
   НАСТРОЙКИ
   ============================================================ */

/*
 * Реальный WMS источника ОЯ из radar-wms.
 *
 * Используется именно слой:
 *
 * bufr_phenomena
 * bufr_novosib_phenomena
 * bufr_vlad_phenomena
 */
const OYA_WMS =
  "https://www.nowcast.ru/baltrad_wsgi";


/* ============================================================
   КАРТА
   ============================================================ */

const map = L.map("map", {
  zoomControl:true,
  attributionControl:true
}).setView([54.74,55.97],5);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);


/* ============================================================
   UI
   ============================================================ */

const layerSelect = document.getElementById("layer");
const slider      = document.getElementById("slider");
const back        = document.getElementById("back");
const forward     = document.getElementById("forward");
const play        = document.getElementById("play");
const locate      = document.getElementById("locate");
const reload      = document.getElementById("reload");
const status      = document.getElementById("status");
const timeLabel   = document.getElementById("timeLabel");


/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */

let frames = [];

let currentIndex = 0;

let radarLayer = null;

let oyaLayer = null;

let playing = false;

let playTimer = null;


/*
 * Кэш только готовых кадров.
 */
const radarCache = new Map();


/*
 * Кэш WMS ОЯ.
 */
const oyaCache = new Map();


/* ============================================================
   СТАТУС
   ============================================================ */

function setStatus(text){
  status.textContent = text;
}


/* ============================================================
   ФОРМАТ ВРЕМЕНИ
   ============================================================ */

function formatTime(timestamp){

  const d = new Date(timestamp * 1000);

  return d.toLocaleString("ru-RU",{
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });

}


/* ============================================================
   RAINVIEWER
   ============================================================ */

async function loadFrames(){

  try{

    setStatus("Загрузка радара…");

    const response = await fetch(
      "https://api.rainviewer.com/public/weather-maps.json",
      {
        cache:"no-store"
      }
    );

    if(!response.ok){

      throw new Error(
        "RainViewer HTTP " +
        response.status
      );

    }

    const data = await response.json();

    const result = [];

    const past =
      data.radar?.past || [];

    /*
     * Публичный API может не отдавать nowcast.
     */
    const nowcast =
      data.radar?.nowcast || [];


    for(const f of past){

      result.push({
        time:f.time,
        path:f.path,
        forecast:false,
        url:
          data.host +
          f.path +
          "/256/{z}/{x}/{y}/2/1_1.png"
      });

    }


    for(const f of nowcast){

      result.push({
        time:f.time,
        path:f.path,
        forecast:true,
        url:
          data.host +
          f.path +
          "/256/{z}/{x}/{y}/2/1_1.png"
      });

    }


    if(!result.length){

      throw new Error(
        "Кадры не найдены"
      );

    }


    /*
     * Уникальные timestamps.
     */
    const seen = new Set();

    frames = result.filter(frame => {

      if(seen.has(frame.time)){
        return false;
      }

      seen.add(frame.time);

      return true;

    });


    slider.max =
      Math.max(
        0,
        frames.length - 1
      );


    currentIndex =
      Math.min(
        currentIndex,
        frames.length - 1
      );


    slider.value =
      currentIndex;


    /*
     * Показываем текущий кадр.
     */
    await showFrame(
      currentIndex,
      true
    );


    /*
     * В режиме ОЯ сразу обновляем WMS.
     */
    if(layerSelect.value === "warnings"){

      await showOya(
        currentIndex
      );

    }


    setStatus(
      layerSelect.value === "warnings"
        ? "Опасные явления"
        : "Радар готов"
    );


  }catch(error){

    console.error(error);

    setStatus(
      "Ошибка загрузки радара"
    );

  }

}


/* ============================================================
   СОЗДАНИЕ RADAR TILE LAYER
   ============================================================ */

function createRadarLayer(index){

  const frame =
    frames[index];

  if(!frame){
    return null;
  }

  const layer =
    L.tileLayer(
      frame.url,
      {
        opacity:1,
        tileSize:256,
        zIndex:5,

        /*
         * Не даём Leaflet лишний раз
         * перерисовывать слой во время zoom.
         */
        updateWhenZooming:false,
        updateWhenIdle:true,

        keepBuffer:2
      }
    );

  layer._gptradIndex =
    index;

  return layer;

}


/* ============================================================
   ОЖИДАНИЕ ПЕРВОГО КАДРА
   ============================================================ */

function waitForLayer(layer){

  return new Promise(resolve => {

    let done = false;

    const finish = () => {

      if(done){
        return;
      }

      done = true;

      resolve();

    };


    layer.once(
      "load",
      finish
    );


    /*
     * Если всё уже находится
     * в browser cache.
     */
    setTimeout(
      finish,
      6000
    );

  });

}


/* ============================================================
   БЕСШОВНАЯ СМЕНА RADAR КАДРА
   ============================================================ */

async function showFrame(
  index,
  force=false
){

  if(!frames.length){
    return;
  }


  index =
    Math.max(
      0,
      Math.min(
        index,
        frames.length - 1
      )
    );


  currentIndex =
    index;

  slider.value =
    index;


  const frame =
    frames[index];


  timeLabel.textContent =
    formatTime(
      frame.time
    );


  if(
    !force &&
    radarLayer &&
    radarLayer._gptradIndex === index
  ){

    return;

  }


  let next =
    radarCache.get(index);


  /*
   * Кадра нет в кэше.
   */
  if(!next){

    const layer =
      createRadarLayer(index);

    if(!layer){
      return;
    }


    /*
     * ВАЖНО:
     *
     * Слой создаём НЕ на карте.
     *
     * Leaflet начинает загружать его
     * только после addTo().
     */
    next = {
      layer:layer,
      loaded:false
    };


    radarCache.set(
      index,
      next
    );


    /*
     * Старый слой всё ещё находится
     * на карте.
     *
     * Новый добавляем поверх него.
     */
    layer.addTo(map);


    await waitForLayer(
      layer
    );


    next.loaded = true;

  }else{

    /*
     * Кэшированный слой.
     */
    if(!next.layer._map){

      next.layer.addTo(map);

    }

  }


  /*
   * ========================================================
   * КЛЮЧЕВОЙ МОМЕНТ
   * ========================================================
   *
   * Новый слой уже загружен.
   *
   * Его opacity ВСЕГДА = 1.
   *
   * Никаких fade-in.
   */
  next.layer.setOpacity(1);


  const old =
    radarLayer;


  radarLayer =
    next.layer;


  /*
   * Только теперь удаляем старый.
   */
  if(
    old &&
    old !== radarLayer
  ){

    map.removeLayer(
      old
    );

  }


  /*
   * Удаляем слишком старые
   * кэшированные кадры.
   */
  for(
    const [i,entry]
    of radarCache
  ){

    if(
      Math.abs(i-index) > 2 &&
      entry.layer !== radarLayer
    ){

      if(entry.layer._map){

        map.removeLayer(
          entry.layer
        );

      }

      radarCache.delete(i);

    }

  }


  /*
   * Тихая предзагрузка соседей.
   */
  preload(index - 1);
  preload(index + 1);

}


/* ============================================================
   ПРЕДЗАГРУЗКА
   ============================================================ */

function preload(index){

  if(
    index < 0 ||
    index >= frames.length
  ){

    return;

  }


  if(
    radarCache.has(index)
  ){

    return;

  }


  const layer =
    createRadarLayer(index);

  if(!layer){
    return;
  }


  /*
   * Прозрачным его НЕ показываем
   * как часть интерфейса.
   *
   * Он просто загружается.
   */
  layer.setOpacity(0);

  layer.addTo(map);


  const entry = {
    layer:layer,
    loaded:false
  };


  radarCache.set(
    index,
    entry
  );


  layer.once(
    "load",
    () => {

      entry.loaded = true;

      /*
       * Он остаётся невидимым
       * до фактического переключения.
       */
      if(
        radarLayer !== layer
      ){

        layer.setOpacity(0);

      }

    }
  );

}


/* ============================================================
   ОПАСНЫЕ ЯВЛЕНИЯ — WMS
   ============================================================ */

function createOyaLayer(timestamp){

  /*
   * WMS принимает ISO-время.
   */
  const iso =
    new Date(
      timestamp * 1000
    ).toISOString();


  /*
   * Реальный слой ОЯ из репозитория:
   *
   * bufr_phenomena
   * bufr_novosib_phenomena
   * bufr_vlad_phenomena
   */
  return L.tileLayer.wms(
    OYA_WMS,
    {
      layers:
        "bufr_phenomena," +
        "bufr_novosib_phenomena," +
        "bufr_vlad_phenomena",

      format:"image/png",

      transparent:true,

      version:"1.1.1",

      time:iso,

      opacity:1,

      zIndex:20,

      tiled:true
    }
  );

}


/* ============================================================
   ПОКАЗ ОЯ
   ============================================================ */

async function showOya(index){

  if(!frames[index]){
    return;
  }


  const timestamp =
    frames[index].time;


  setStatus(
    "Загрузка опасных явлений…"
  );


  /*
   * Если этот timestamp уже создавался,
   * используем готовый слой.
   */
  let layer =
    oyaCache.get(timestamp);


  if(!layer){

    layer =
      createOyaLayer(
        timestamp
      );

    oyaCache.set(
      timestamp,
      layer
    );

  }


  /*
   * Новый WMS слой добавляется
   * поверх старого.
   */
  layer.addTo(map);


  /*
   * Убираем предыдущий.
   */
  if(
    oyaLayer &&
    oyaLayer !== layer
  ){

    map.removeLayer(
      oyaLayer
    );

  }


  oyaLayer =
    layer;


  /*
   * Радар скрываем полностью,
   * но НЕ удаляем.
   */
  if(radarLayer){

    radarLayer.setOpacity(0);

  }


  /*
   * У WMS нет fade.
   */
  layer.setOpacity(1);


  setStatus(
    "Опасные явления"
  );

}


/* ============================================================
   ПЕРЕКЛЮЧЕНИЕ СЛОЁВ
   ============================================================ */

layerSelect.addEventListener(
  "change",
  async () => {

    if(
      layerSelect.value === "radar"
    ){

      /*
       * Убираем ОЯ.
       */
      if(oyaLayer){

        map.removeLayer(
          oyaLayer
        );

      }


      /*
       * Показываем радар.
       */
      if(radarLayer){

        radarLayer.setOpacity(1);

        if(!radarLayer._map){

          radarLayer.addTo(map);

        }

      }else{

        await showFrame(
          currentIndex,
          true
        );

      }


      setStatus(
        "Радар готов"
      );


    }else{

      /*
       * Радар остаётся в DOM,
       * но полностью скрыт.
       */
      if(radarLayer){

        radarLayer.setOpacity(0);

      }


      await showOya(
        currentIndex
      );

    }

  }
);


/* ============================================================
   SLIDER
   ============================================================ */

slider.addEventListener(
  "input",
  async () => {

    const index =
      Number(slider.value);


    currentIndex =
      index;


    if(frames[index]){

      timeLabel.textContent =
        formatTime(
          frames[index].time
        );

    }


    if(
      layerSelect.value === "radar"
    ){

      await showFrame(
        index
      );

    }else{

      await showOya(
        index
      );

    }

  }
);


/* ============================================================
   НАЗАД
   ============================================================ */

back.addEventListener(
  "click",
  () => {

    const next =
      Math.max(
        0,
        currentIndex - 1
      );

    slider.value =
      next;

    slider.dispatchEvent(
      new Event("input")
    );

  }
);


/* ============================================================
   ВПЕРЁД
   ============================================================ */

forward.addEventListener(
  "click",
  () => {

    const next =
      Math.min(
        frames.length - 1,
        currentIndex + 1
      );

    slider.value =
      next;

    slider.dispatchEvent(
      new Event("input")
    );

  }
);


/* ============================================================
   PLAY / PAUSE
   ============================================================ */

function stopPlayback(){

  playing =
    false;


  if(playTimer){

    clearInterval(
      playTimer
    );

    playTimer =
      null;

  }


  play.textContent =
    "▶";

}


function startPlayback(){

  if(playing){
    return;
  }


  playing =
    true;


  play.textContent =
    "Ⅱ";


  playTimer =
    setInterval(
      async () => {

        let next =
          currentIndex + 1;


        if(
          next >= frames.length
        ){

          next = 0;

        }


        slider.value =
          next;


        currentIndex =
          next;


        if(
          layerSelect.value === "radar"
        ){

          await showFrame(
            next
          );

        }else{

          await showOya(
            next
          );

        }

      },
      600
    );

}


play.addEventListener(
  "click",
  () => {

    if(playing){

      stopPlayback();

    }else{

      startPlayback();

    }

  }
);


/* ============================================================
   ГЕОЛОКАЦИЯ
   ============================================================ */

locate.addEventListener(
  "click",
  () => {

    if(
      !navigator.geolocation
    ){

      return;

    }


    navigator.geolocation.getCurrentPosition(
      position => {

        const lat =
          position.coords.latitude;

        const lon =
          position.coords.longitude;


        map.setView(
          [lat,lon],
          8
        );

      },
      error => {

        console.error(
          "Geolocation:",
          error
        );

      },
      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:60000
      }
    );

  }
);


/* ============================================================
   RELOAD
   ============================================================ */

reload.addEventListener(
  "click",
  async () => {

    const oldIndex =
      currentIndex;


    await loadFrames();


    currentIndex =
      Math.min(
        oldIndex,
        frames.length - 1
      );


    slider.value =
      currentIndex;


    if(
      layerSelect.value === "warnings"
    ){

      await showOya(
        currentIndex
      );

    }

  }
);


/* ============================================================
   АВТООБНОВЛЕНИЕ
   ============================================================ */

setInterval(
  async () => {

    await loadFrames();

  },
  10 * 60 * 1000
);


/* ============================================================
   СТАРТ
   ============================================================ */

loadFrames();

</script>

</body>
</html>
