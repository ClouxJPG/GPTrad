<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GPTrad</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/openlayers/7.4.0/ol.css">

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#111;
}

#map{
position:absolute;
inset:0;
z-index:1;
background:#d8d8d8;
}

.dark-osm-layer img,
.dark-osm-layer canvas{
filter:
invert(1)
hue-rotate(180deg)
brightness(.72)
contrast(1.05);
}

.ol-zoom{
position:absolute;
top:82px;
left:12px;
}

.ol-control{
background:transparent!important;
padding:0!important;
}

.ol-zoom button{
display:block;
width:38px;
height:38px;
margin:3px;
border:0;
border-radius:10px;
background:rgba(28,28,28,.9)!important;
color:white!important;
font-size:22px;
line-height:36px;
cursor:pointer;
}

.ol-attribution{
right:8px!important;
bottom:4px!important;
}

.ol-attribution button{
background:rgba(28,28,28,.8)!important;
color:white!important;
border-radius:7px;
}

.ol-attribution ul{
background:rgba(28,28,28,.8);
color:white;
border-radius:7px;
padding:4px 8px;
}

.top-panel{
position:absolute;
top:12px;
left:12px;
right:12px;
height:54px;
z-index:1000;
display:flex;
align-items:center;
gap:8px;
padding:6px;
background:rgba(28,28,28,.9);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,.25);
}

.logo{
color:white;
font-size:25px;
font-weight:700;
white-space:nowrap;
margin-left:8px;
margin-right:8px;
}

#selectedLayer{
flex:1;
min-width:0;
height:42px;
border:0;
outline:0;
border-radius:12px;
background:#292929;
color:white;
padding:0 14px;
font-size:17px;
font-weight:650;
text-align:left;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
}

#selectedLayerName{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

#selectedLayerArrow{
flex:none;
font-size:14px;
opacity:.7;
transition:transform .25s ease;
}

#selectedLayer.open #selectedLayerArrow{
transform:rotate(180deg);
}

.icon-btn{
flex:none;
width:42px;
height:42px;
border:0;
outline:0;
border-radius:12px;
background:#292929;
color:white;
font-size:21px;
display:flex;
align-items:center;
justify-content:center;
transition:transform .15s ease;
}

.icon-btn:active{
transform:scale(.94);
}

#layerDrawer{
position:absolute;
top:72px;
left:50%;
width:calc(100% - 24px);
max-width:520px;
z-index:1100;
transform:translate(-50%,-18px) scale(.98);
opacity:0;
pointer-events:none;
padding:10px;
border-radius:15px;
background:rgba(25,25,25,.96);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
box-shadow:0 10px 35px rgba(0,0,0,.35);
transition:
transform .28s cubic-bezier(.22,.61,.36,1),
opacity .22s ease;
}

#layerDrawer.open{
transform:translate(-50%,0) scale(1);
opacity:1;
pointer-events:auto;
}

.drawer-header{
color:white;
font-size:14px;
font-weight:700;
padding:4px 7px 9px;
}

.layer-item{
width:100%;
min-height:48px;
border:0;
outline:0;
border-radius:11px;
background:#303030;
color:white;
display:flex;
align-items:center;
gap:10px;
padding:10px 12px;
margin-bottom:7px;
font-size:15px;
text-align:left;
transition:background .15s ease,transform .15s ease;
}

.layer-item:last-child{
margin-bottom:0;
}

.layer-item:active{
transform:scale(.985);
}

.layer-item.active{
background:#3b3b3b;
}

.layer-dot{
width:10px;
height:10px;
flex:none;
border-radius:50%;
background:#777;
}

.layer-item.active .layer-dot{
background:#36d67a;
box-shadow:0 0 8px rgba(54,214,122,.55);
}

#status{
position:absolute;
left:14px;
top:74px;
z-index:900;
padding:6px 10px;
border-radius:8px;
background:rgba(20,20,20,.78);
color:white;
font-size:12px;
pointer-events:none;
opacity:.9;
}

#settings{
position:absolute;
left:12px;
top:74px;
width:240px;
z-index:1200;
padding:12px;
border-radius:14px;
background:rgba(20,20,20,.96);
color:white;
box-shadow:0 8px 30px rgba(0,0,0,.35);
opacity:0;
visibility:hidden;
pointer-events:none;
transform:translateY(-10px) scale(.97);
max-height:0;
overflow:hidden;
transition:
opacity .25s ease,
transform .28s cubic-bezier(.22,.61,.36,1),
max-height .32s ease,
visibility 0s linear .32s;
}

#settings.open{
opacity:1;
visibility:visible;
pointer-events:auto;
transform:translateY(0) scale(1);
max-height:760px;
transition:
opacity .25s ease,
transform .28s cubic-bezier(.22,.61,.36,1),
max-height .32s ease,
visibility 0s linear 0s;
}

.settings-title{
font-size:15px;
font-weight:700;
margin-bottom:10px;
}

.settings-section{
margin-bottom:7px;
}

.settings-section:last-child{
margin-bottom:0;
}

.settings-section-btn{
width:100%;
height:40px;
border:0;
outline:0;
border-radius:10px;
background:#292929;
color:white;
font-size:14px;
font-weight:600;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 11px;
}

.settings-section-btn:active{
transform:scale(.98);
}

.settings-section-arrow{
font-size:12px;
opacity:.65;
transition:transform .25s ease;
}

.settings-section.open .settings-section-arrow{
transform:rotate(180deg);
}

.settings-subpanel{
max-height:0;
opacity:0;
overflow:hidden;
transform:translateY(-4px);
transition:
max-height .3s ease,
opacity .2s ease,
transform .25s ease;
padding:0 2px;
}

.settings-section.open .settings-subpanel{
max-height:280px;
opacity:1;
transform:translateY(0);
padding-top:7px;
padding-bottom:2px;
}

.theme-btn,
.map-theme-btn,
.map-action-btn{
width:100%;
border:0;
outline:0;
padding:9px 10px;
margin-bottom:6px;
border-radius:9px;
background:#292929;
color:white;
text-align:left;
font-size:13px;
}

.theme-btn:last-child,
.map-theme-btn:last-child,
.map-action-btn:last-child{
margin-bottom:0;
}

.theme-btn.active,
.map-theme-btn.active{
background:#3b3b3b;
}

body.light .theme-btn.active,
body.light .map-theme-btn.active{
background:#d7d7d7;
}

.map-action-btn:active,
.map-theme-btn:active,
.theme-btn:active{
transform:scale(.98);
}

.frame-count-row{
display:flex;
align-items:center;
justify-content:center;
gap:6px;
padding:3px 1px 2px;
}

#frameCountInput{
width:76px;
height:30px;
flex:none;
border:0;
outline:0;
border-radius:8px;
background:#292929;
color:white;
text-align:center;
font-size:14px;
font-weight:700;
padding:0 7px;
appearance:textfield;
-webkit-appearance:none;
}

#frameCountInput::-webkit-inner-spin-button,
#frameCountInput::-webkit-outer-spin-button{
opacity:1;
margin:0;
}

#frameCountInput:focus{
box-shadow:0 0 0 2px rgba(69,201,239,.45);
}

.frame-count-arrow{
width:26px;
height:26px;
flex:none;
border:0;
outline:0;
border-radius:7px;
background:#292929;
color:white;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
padding:0;
}

.frame-count-arrow:disabled{
opacity:.35;
}

/* =====================================================
   ПРОЗРАЧНОСТЬ OYA
===================================================== */

.opacity-panel{
padding:4px 3px 2px;
}

.opacity-value-row{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:7px;
font-size:12px;
}

.opacity-value-label{
opacity:.65;
}

#oyaOpacityValue{
font-weight:700;
font-size:13px;
}

#oyaOpacitySlider{
width:100%;
height:20px;
margin:0;
appearance:none;
-webkit-appearance:none;
background:transparent;
}

#oyaOpacitySlider::-webkit-slider-runnable-track{
height:6px;
border-radius:999px;
background:#555;
}

#oyaOpacitySlider::-webkit-slider-thumb{
-webkit-appearance:none;
width:18px;
height:18px;
margin-top:-6px;
border-radius:50%;
border:2px solid white;
background:#fff;
box-shadow:0 1px 5px rgba(0,0,0,.45);
}

#oyaOpacitySlider::-moz-range-track{
height:6px;
border-radius:999px;
background:#555;
}

#oyaOpacitySlider::-moz-range-thumb{
width:18px;
height:18px;
border-radius:50%;
border:2px solid white;
background:#fff;
}

.opacity-hints{
display:flex;
justify-content:space-between;
font-size:10px;
opacity:.5;
margin-top:3px;
}

body.light #oyaOpacitySlider::-webkit-slider-runnable-track{
background:#c5c5c5;
}

body.light #oyaOpacitySlider::-moz-range-track{
background:#c5c5c5;
}

/* =====================================================
   СГЛАЖИВАНИЕ
===================================================== */

.smoothing-panel{
padding:4px 3px 2px;
}

.smoothing-value-row{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:7px;
font-size:12px;
}

.smoothing-value{
font-weight:700;
font-size:13px;
}

#oyaSmoothingSlider{
width:100%;
height:20px;
margin:0;
appearance:none;
-webkit-appearance:none;
background:transparent;
}

#oyaSmoothingSlider::-webkit-slider-runnable-track{
height:6px;
border-radius:999px;
background:#555;
}

#oyaSmoothingSlider::-webkit-slider-thumb{
-webkit-appearance:none;
width:18px;
height:18px;
margin-top:-6px;
border-radius:50%;
border:2px solid white;
background:#fff;
box-shadow:0 1px 5px rgba(0,0,0,.45);
}

#oyaSmoothingSlider::-moz-range-track{
height:6px;
border-radius:999px;
background:#555;
}

#oyaSmoothingSlider::-moz-range-thumb{
width:18px;
height:18px;
border-radius:50%;
border:2px solid white;
background:#fff;
}

.smoothing-hints{
display:flex;
justify-content:space-between;
font-size:10px;
opacity:.5;
margin-top:3px;
}

/* =====================================================
   РАДАРНЫЕ ЛУЧИ
===================================================== */

.radar-beam-button{
width:100%;
height:40px;
border:0;
outline:0;
border-radius:10px;
background:#292929;
color:white;
font-size:14px;
font-weight:600;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 11px;
margin-top:7px;
transition:
background .18s ease,
transform .15s ease;
}

.radar-beam-button:active{
transform:scale(.98);
}

.radar-beam-button .radar-beam-state{
font-size:12px;
opacity:.55;
}

.radar-beam-button.active{
background:#3b3b3b;
}

.radar-beam-button.active .radar-beam-state{
color:#69d99a;
opacity:1;
}

/* =====================================================
   ПАЛИТРА
===================================================== */

.palette-modal{
position:fixed;
inset:0;
z-index:4000;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
opacity:0;
visibility:hidden;
pointer-events:none;
transition:
opacity .22s ease,
visibility 0s linear .22s;
}

.palette-modal.open{
opacity:1;
visibility:visible;
pointer-events:auto;
transition:
opacity .22s ease,
visibility 0s linear 0s;
}

.palette-modal-backdrop{
position:absolute;
inset:0;
background:rgba(0,0,0,.34);
backdrop-filter:blur(13px);
-webkit-backdrop-filter:blur(13px);
}

.palette-window{
position:relative;
width:min(430px,100%);
max-height:min(720px,calc(100vh - 36px));
overflow:auto;
padding:14px;
border-radius:18px;
background:rgba(28,28,28,.97);
color:white;
box-shadow:
0 18px 60px rgba(0,0,0,.5),
0 0 0 1px rgba(255,255,255,.07);
transform:translateY(12px) scale(.97);
transition:
transform .28s cubic-bezier(.22,.61,.36,1);
-webkit-overflow-scrolling:touch;
}

.palette-modal.open .palette-window{
transform:translateY(0) scale(1);
}

.palette-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:12px;
}

.palette-title{
font-size:18px;
font-weight:750;
}

.palette-close{
width:34px;
height:34px;
flex:none;
border:0;
outline:0;
border-radius:9px;
background:#3a3a3a;
color:white;
font-size:21px;
display:flex;
align-items:center;
justify-content:center;
}

.palette-close:active{
transform:scale(.92);
}

.palette-description{
font-size:11px;
line-height:1.4;
opacity:.58;
margin-bottom:11px;
}

.palette-row{
display:grid;
grid-template-columns:1fr 48px;
align-items:center;
gap:9px;
padding:7px 0;
border-bottom:1px solid rgba(255,255,255,.07);
}

.palette-row:last-child{
border-bottom:0;
}

.palette-name{
font-size:12px;
line-height:1.2;
}

.palette-color-wrap{
width:48px;
height:32px;
position:relative;
}

.palette-color{
position:absolute;
inset:0;
width:48px;
height:32px;
padding:0;
border:2px solid rgba(255,255,255,.7);
border-radius:8px;
background:transparent;
overflow:hidden;
}

.palette-color::-webkit-color-swatch-wrapper{
padding:0;
}

.palette-color::-webkit-color-swatch{
border:0;
border-radius:5px;
}

.palette-color::-moz-color-swatch{
border:0;
border-radius:5px;
}

.palette-reset{
width:100%;
height:38px;
margin-top:11px;
border:0;
outline:0;
border-radius:10px;
background:#353535;
color:white;
font-size:13px;
font-weight:650;
}

.palette-reset:active{
transform:scale(.98);
}

body.light .palette-window{
background:rgba(250,250,250,.97);
color:#111;
}

body.light .palette-close{
background:#e5e5e5;
color:#111;
}

body.light .palette-reset{
background:#e5e5e5;
color:#111;
}

body.light .palette-row{
border-bottom-color:rgba(0,0,0,.08);
}

body.light .palette-color{
border-color:rgba(0,0,0,.35);
}

/* =====================================================
   TIMELINE
===================================================== */

.timeline{
position:absolute;
left:50%;
bottom:14px;
transform:translateX(-50%);
width:min(680px,calc(100vw - 28px));
z-index:1000;
padding:8px 12px 9px;
border-radius:15px;
background:rgba(20,20,20,.9);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.timeline-play{
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:7px;
margin-bottom:6px;
}

#playBtn{
width:38px;
height:30px;
border:0;
outline:0;
border-radius:8px;
background:#292929;
color:white;
font-size:14px;
display:flex;
align-items:center;
justify-content:center;
}

#playBtn:active{
transform:scale(.92);
}

#preloadBtn{
width:34px;
height:30px;
flex:none;
border:0;
outline:0;
border-radius:8px;
background:#292929;
color:white;
display:flex;
align-items:center;
justify-content:center;
padding:0;
}

#preloadBtn:active{
transform:scale(.91);
}

#preloadBtn:disabled{
opacity:.3;
}

.download-icon{
width:15px;
height:18px;
display:block;
background:currentColor;
clip-path:polygon(
38% 0%,
62% 0%,
62% 55%,
100% 55%,
50% 100%,
0% 55%,
38% 55%
);
-webkit-clip-path:polygon(
38% 0%,
62% 0%,
62% 55%,
100% 55%,
50% 100%,
0% 55%,
38% 55%
);
}

#preloadBtn.loading .download-icon{
animation:downloadFloat .7s ease-in-out infinite;
}

@keyframes downloadFloat{
0%,100%{transform:translateY(0)}
50%{transform:translateY(2px)}
}

#preloadBtn.done{
background:#315f45;
}

.timeline-controls{
display:flex;
align-items:center;
gap:7px;
}

.timeline-arrow{
width:36px;
height:32px;
flex:none;
border:0;
outline:0;
border-radius:8px;
background:#292929;
color:white;
font-size:15px;
display:flex;
align-items:center;
justify-content:center;
}

.timeline-arrow:active{
transform:scale(.92);
}

.timeline-slider-wrap{
position:relative;
flex:1;
min-width:0;
height:18px;
display:flex;
align-items:center;
}

#oyaTimelineSegments{
position:absolute;
left:0;
right:0;
top:2px;
height:14px;
display:flex;
align-items:center;
gap:2px;
pointer-events:none;
overflow:hidden;
z-index:1;
}

.oya-segment{
flex:1;
min-width:0;
height:14px;
border-radius:3px;
background:#666;
opacity:.95;
transition:
background .18s ease,
transform .12s ease,
opacity .18s ease;
}

.oya-segment.loaded{
background:#45c9ef;
}

.oya-segment.current{
transform:scaleY(1.08);
filter:brightness(1.15);
}

#oyaLongProgress{
position:absolute;
left:0;
right:0;
top:5px;
height:6px;
border-radius:999px;
background:#666;
overflow:hidden;
pointer-events:none;
z-index:1;
display:none;
}

#oyaLongProgressFill{
position:absolute;
left:0;
top:0;
bottom:0;
width:0%;
background:#45c9ef;
border-radius:999px;
}

#timeSlider{
position:relative;
z-index:3;
width:100%;
min-width:0;
margin:0;
background:transparent;
appearance:none;
-webkit-appearance:none;
}

#timeSlider::-webkit-slider-runnable-track{
height:14px;
background:transparent;
border:0;
}

#timeSlider::-webkit-slider-thumb{
-webkit-appearance:none;
width:18px;
height:18px;
margin-top:-2px;
border-radius:50%;
border:2px solid white;
background:#fff;
box-shadow:0 1px 5px rgba(0,0,0,.45);
}

#timeSlider::-moz-range-track{
height:14px;
background:transparent;
border:0;
}

#timeSlider::-moz-range-thumb{
width:18px;
height:18px;
border-radius:50%;
border:2px solid white;
background:#fff;
}

body.light .oya-segment{
background:#c8c8c8;
}

body.light .oya-segment.loaded{
background:#49b9df;
}

body.light #oyaLongProgress{
background:#c8c8c8;
}

body.light #oyaLongProgressFill{
background:#49b9df;
}

body.light .top-panel,
body.light #layerDrawer,
body.light #settings,
body.light .timeline,
body.light #status{
background:rgba(255,255,255,.94);
}

body.light .logo,
body.light #status,
body.light .drawer-header{
color:#111;
}

body.light #selectedLayer,
body.light .icon-btn,
body.light .layer-item,
body.light .timeline-arrow,
body.light #playBtn,
body.light .theme-btn,
body.light .map-theme-btn,
body.light .map-action-btn,
body.light .settings-section-btn,
body.light .frame-count-arrow,
body.light #frameCountInput,
body.light .radar-beam-button{
background:#eee;
color:#111;
}

body.light .layer-item.active,
body.light .radar-beam-button.active{
background:#ddd;
}

body.light #preloadBtn{
background:#eee;
color:#111;
}

#timeLabel{
width:100%;
margin-top:5px;
text-align:center;
color:white;
font-size:11px;
opacity:.85;
}

body.light #timeLabel{
color:#111;
}

#loading{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
z-index:2000;
display:none;
padding:9px 13px;
border-radius:10px;
background:rgba(20,20,20,.92);
color:white;
font-size:13px;
}

@media(max-width:600px){

.top-panel{
top:8px;
left:8px;
right:8px;
height:54px;
gap:5px;
}

.logo{
font-size:21px;
margin-left:6px;
margin-right:3px;
}

#selectedLayer{
height:42px;
padding:0 11px;
font-size:16px;
}

.icon-btn{
width:38px;
height:38px;
border-radius:11px;
font-size:19px;
}

   МАСКА РАДАРНОГО ПОКРЫТИЯ
===================================================== */

const radarMaskSource=
new ol.source.Vector();

function createRadarMaskGeometry(radars){

const outer=[
[-20037508,-20037508],
[20037508,-20037508],
[20037508,20037508],
[-20037508,20037508],
[-20037508,-20037508]
];

const holes=[];

for(
const radar of radars
){

if(
!Number.isFinite(radar.lat)||
!Number.isFinite(radar.lon)
){
continue;
}

const center=
ol.proj.fromLonLat([
radar.lon,
radar.lat
]);

const ring=[];

const points=96;

for(
let i=0;
i<=points;
i++
){

const angle=
(i/points)*
Math.PI*2;

ring.push([
center[0]+
Math.cos(angle)*
RADAR_COVERAGE_RADIUS,

center[1]+
Math.sin(angle)*
RADAR_COVERAGE_RADIUS
]);

}

holes.push(ring);

}

return new ol.geom.Polygon([
outer,
...holes
]);

}

function renderRadarMask(radars){

radarMaskSource.clear();

if(
!Array.isArray(radars)||
!radars.length
){
return;
}

const feature=
new ol.Feature(
createRadarMaskGeometry(
radars
)
);

feature.setStyle(
new ol.style.Style({

fill:
new ol.style.Fill({
color:
"rgba(0,0,0,0.24)"
}),

stroke:null

})
);

radarMaskSource.addFeature(
feature
);

map.render();

}

function renderRadarPositions(radars){

if(
!Array.isArray(radars)||
!radars.length
){
return;
}

radarBeamSource.clear();

for(
const radar of radars
){

if(
!Number.isFinite(radar.lat)||
!Number.isFinite(radar.lon)
){
continue;
}

const center=
ol.proj.fromLonLat([
radar.lon,
radar.lat
]);

const circle=
new ol.geom.Circle(
center,
RADAR_COVERAGE_RADIUS
);

const coverageFeature=
new ol.Feature(
circle
);

coverageFeature.set(
"radarType",
"coverage"
);

coverageFeature.set(
"radarLatitude",
radar.lat
);

coverageFeature.set(
"radarLongitude",
radar.lon
);

coverageFeature.setStyle(
radarCoverageStyle
);

radarBeamSource.addFeature(
coverageFeature
);

const radarPoint=
new ol.Feature(
new ol.geom.Point(
center
)
);

radarPoint.set(
"radarType",
"radar"
);

radarPoint.set(
"radarLatitude",
radar.lat
);

radarPoint.set(
"radarLongitude",
radar.lon
);

radarPoint.setStyle(
radarPointStyle
);

radarBeamSource.addFeature(
radarPoint
);

}

renderRadarMask(
radars
);

map.render();

}

function mergeRadarPositions(
dynamicPositions
){

const result=[];

const seen=new Set();

const all=[
...KNOWN_RADAR_POSITIONS,
...dynamicPositions
];

for(
const radar of all
){

if(
!radar||
!Number.isFinite(radar.lat)||
!Number.isFinite(radar.lon)
){
continue;
}

const key=
radar.lat.toFixed(6)+","+
radar.lon.toFixed(6);

if(
seen.has(key)
){
continue;
}

seen.add(key);

result.push({
lat:radar.lat,
lon:radar.lon
});

}

return result;

}

async function loadRadarPositions(){

try{

const response=
await fetch(
RADAR_VECTOR_PROXY,
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Radar vector HTTP "+
response.status
);

}

const data=
await response.json();

if(!Array.isArray(data)){

throw new Error(
"Invalid radar vector"
);

}

const result=[];

for(
const item of data
){

if(
!Array.isArray(item)||
item.length<2
){
continue;
}

const lat=
Number(item[0]);

const lon=
Number(item[1]);

if(
!Number.isFinite(lat)||
!Number.isFinite(lon)
){
continue;
}

if(
lat<-90||
lat>90||
lon<-180||
lon>180
){
continue;
}

result.push({
lat,
lon
});

}

const unique=
mergeRadarPositions(
result
);

console.log(
"Radar positions:",
unique.length
);

return unique;

}catch(error){

console.error(
"Radar positions:",
error
);

return mergeRadarPositions([]);

}

}

async function updateRadarPositions(){

const radars=
await loadRadarPositions();

if(
!radars.length
){

console.warn(
"Radar coordinates were not received"
);

return;

}

radarPositions=
radars;

renderRadarPositions(
radarPositions
);

}

function hexToRgb(hex){

const value=
String(hex)
.replace("#","")
.trim();

if(value.length!==6){
return null;
}

const r=
parseInt(
value.slice(0,2),
16
);

const g=
parseInt(
value.slice(2,4),
16
);

const b=
parseInt(
value.slice(4,6),
16
);

if(
!Number.isFinite(r)||
!Number.isFinite(g)||
!Number.isFinite(b)
){
return null;
}

return[r,g,b];

}

function rgbToHex(r,g,b){

return "#"+
[r,g,b]
.map(
value=>
Math.max(
0,
Math.min(
255,
Math.round(value)
)
)
.toString(16)
.padStart(2,"0")
).join("");

}

function applyOyaPalette(
pixels
){

for(
let i=0;
i<pixels.length;
i+=4
){

const a=
pixels[i+3];

if(a===0){
continue;
}

const r=
pixels[i];

const g=
pixels[i+1];

const b=
pixels[i+2];

let bestIndex=-1;

let bestDistance=Infinity;

for(
let c=0;
c<OYA_SOURCE_COLORS.length;
c++
){

const source=
OYA_SOURCE_COLORS[c];

const dr=
r-source[0];

const dg=
g-source[1];

const db=
b-source[2];

const distance=
dr*dr+
dg*dg+
db*db;

if(
distance<bestDistance
){

bestDistance=
distance;

bestIndex=
c;

}

}

if(
bestIndex===-1||
bestDistance>2600
){
continue;
}

const rgb=
hexToRgb(
oyaPalette[bestIndex].color
);

if(!rgb){
continue;
}

pixels[i]=rgb[0];
pixels[i+1]=rgb[1];
pixels[i+2]=rgb[2];
pixels[i+3]=255;

}

}

function applyCanvasSmoothing(
canvas,
level
){

if(
level<=0
){
return canvas;
}

const width=
canvas.width;

const height=
canvas.height;

const radius=
Math.max(
1,
Math.min(
6,
Math.round(
level/18
)
)
);

const output=
document.createElement(
"canvas"
);

output.width=
width;

output.height=
height;

const ctx=
output.getContext(
"2d"
);

if(!ctx){
return canvas;
}

ctx.imageSmoothingEnabled=true;

ctx.filter=
"blur("+
radius+
"px)";

ctx.drawImage(
canvas,
0,
0
);

return output;

}

function createCleanOyaBlobUrl(
blobUrl
){

return new Promise(
(resolve,reject)=>{

const image=
new Image();

image.onload=()=>{

try{

let canvas=
document.createElement(
"canvas"
);

canvas.width=
image.naturalWidth;

canvas.height=
image.naturalHeight;

const ctx=
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);

if(!ctx){

reject(
new Error(
"Canvas unavailable"
)
);

return;

}

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.drawImage(
image,
0,
0
);

const imageData=
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const pixels=
imageData.data;

/*
 * Сначала удаляем серый фон.
 */

for(
let i=0;
i<pixels.length;
i+=4
){

const r=
pixels[i];

const g=
pixels[i+1];

const b=
pixels[i+2];

const a=
pixels[i+3];

if(a===0){
continue;
}

const max=
Math.max(r,g,b);

const min=
Math.min(r,g,b);

const diff=
max-min;

if(
diff<=22&&
r>=125&&
g>=125&&
b>=125&&
r<=250&&
g<=250&&
b<=250
){

pixels[i+3]=0;

continue;

}

/*
 * Цветной пиксель делаем полностью
 * непрозрачным на уровне исходного изображения.
 */

pixels[i+3]=255;

}

/*
 * Затем применяем пользовательскую палитру.
 */

applyOyaPalette(
pixels
);

ctx.putImageData(
imageData,
0,
0
);

/*
 * И только после палитры применяем
 * пространственное сглаживание.
 */

canvas=
applyCanvasSmoothing(
canvas,
oyaSmoothing
);

canvas.toBlob(
blob=>{

if(!blob){

reject(
new Error(
"PNG creation failed"
)
);

return;

}

resolve(
URL.createObjectURL(
blob
)
);

},
"image/png"
);

}catch(error){

reject(error);

}

};

image.onerror=()=>{

reject(
new Error(
"OYA image error"
)
);

};

image.src=
blobUrl;

});

}

function wait(ms){

return new Promise(
resolve=>
setTimeout(
resolve,
ms
)
);

}

function getCurrentViewportData(){

const size=
map.getSize()||
[
window.innerWidth,
window.innerHeight
];

const extent=
view.calculateExtent(size);

const geoExtent=
ol.proj.transformExtent(
extent,
"EPSG:3857",
"EPSG:4326"
);

const width=
Math.max(
256,
Math.min(
1600,
Math.round(size[0])
)
);

const height=
Math.max(
256,
Math.min(
1200,
Math.round(size[1])
)
);

const key=[
geoExtent[0].toFixed(5),
geoExtent[1].toFixed(5),
geoExtent[2].toFixed(5),
geoExtent[3].toFixed(5),
width,
height
].join("|");

return{
extent,
geoExtent,
width,
height,
viewportKey:key,
key
};

}

function getOyaRequestData(
timeValue
){

const viewport=
getCurrentViewportData();

const params=
new URLSearchParams({

action:"image",

SERVICE:"WMS",

VERSION:"1.1.1",

REQUEST:"GetMap",

LAYERS:OYA_LAYER,

STYLES:"",

SRS:"EPSG:3857",

BBOX:
viewport.extent.join(","),

WIDTH:
String(viewport.width),

HEIGHT:
String(viewport.height),

FORMAT:"image/png",

TRANSPARENT:"true",

EXCEPTIONS:
"application/vnd.ogc.se_inimage",

TIME:
new Date(
timeValue*1000
).toISOString()

});

return{

url:
OYA_PROXY+
"?"+
params.toString(),

extent:
viewport.extent,

width:
viewport.width,

height:
viewport.height,

viewportKey:
viewport.key

};

}

function makeOyaCacheKey(
time,
data
){

return[
time,
data.viewportKey
].join("|");

}

function fetchOyaBlob(
url,
attempts=3
){

return new Promise(
async(resolve,reject)=>{

let lastError=null;

for(
let attempt=1;
attempt<=attempts;
attempt++
){

try{

const response=
await fetch(
url,
{
cache:"force-cache"
}
);

if(!response.ok){

throw new Error(
"OYA HTTP "+
response.status
);

}

const blob=
await response.blob();

if(
!blob||
blob.size===0
){

throw new Error(
"OYA empty response"
);

}

resolve(blob);

return;

}catch(error){

lastError=error;

console.warn(
`OYA request attempt ${attempt}/${attempts}:`,
error
);

if(
attempt<attempts
){

await wait(
250*attempt
);

}

}

}

reject(
lastError||
new Error(
"OYA request failed"
)
);

});

}

async function createOyaImageLayer(
originalBlobUrl,
extent
){

const cleanedUrl=
await createCleanOyaBlobUrl(
originalBlobUrl
);

const source=
new ol.source.ImageStatic({

url:cleanedUrl,

imageExtent:extent,

projection:"EPSG:3857",

interpolate:false

});

const layer=
new ol.layer.Image({

source:source,

opacity:
oyaOpacity/100,

zIndex:60

});

layer.__oyaCleanUrl=
cleanedUrl;

return layer;

}

function waitForOyaLayerReady(
layer,
timeout=15000
){

return new Promise(
(resolve,reject)=>{

const source=
layer.getSource();

let finished=false;

let timer=null;

const cleanup=()=>{

source.un(
"imageloadend",
onLoadEnd
);

source.un(
"imageloaderror",
onLoadError
);

if(timer){

clearTimeout(
timer
);

timer=null;

}

};

const finish=(
error
)=>{

if(finished)return;

finished=true;

cleanup();

if(error){

reject(error);

}else{

resolve();

}

};

const onLoadEnd=()=>finish();

const onLoadError=()=>{

finish(
new Error(
"OYA ImageStatic load error"
)
);

};

source.on(
"imageloadend",
onLoadEnd
);

source.on(
"imageloaderror",
onLoadError
);

timer=setTimeout(
()=>{

finish(
new Error(
"OYA image timeout"
)
);

},
timeout
);

map.addLayer(
layer
);

map.renderSync();

});

}

async function preloadOyaFrame(
timeValue,
generation,
cacheGeneration
){

if(
generation!==oyaPreloadGeneration||
cacheGeneration!==oyaCacheGeneration||
activeLayer!=="oya"
){

return false;

}

const data=
getOyaRequestData(
timeValue
);

const key=
makeOyaCacheKey(
timeValue,
data
);

if(
oyaFrameCache.has(key)
){

oyaLoadedTimes.add(
timeValue
);

return true;

}

let pending=
oyaPendingRequests.get(
key
);

if(!pending){

pending=(async()=>{

const blob=
await fetchOyaBlob(
data.url,
3
);

if(
generation!==oyaPreloadGeneration||
cacheGeneration!==oyaCacheGeneration||
activeLayer!=="oya"
){

return null;

}

const blobUrl=
URL.createObjectURL(
blob
);

oyaFrameCache.set(
key,
{
blobUrl,
extent:data.extent,
timeValue
}
);

oyaLoadedTimes.add(
timeValue
);

return true;

})();

oyaPendingRequests.set(
key,
pending
);

}

try{

return !!(
await pending
);

}catch(error){

console.error(
"Preload:",
error
);

return false;

}finally{

oyaPendingRequests.delete(
key
);

}

}

async function preloadAllOyaFrames(){

activeLayer!=="oya"||
oyaTimes.length<1||
oyaTimes.length>=52||
oyaPreloading

oyaPreloading=true;

const generation=
++oyaPreloadGeneration;

const cacheGeneration=
oyaCacheGeneration;

updatePreloadButton();

oyaTimes.slice();

let cursor=0;

async function worker(){

while(true){

if(
generation!==oyaPreloadGeneration||
cacheGeneration!==oyaCacheGeneration||
activeLayer!=="oya"
){

return;

}

const index=
cursor++;

if(index>=times.length)return;

await preloadOyaFrame(
times[index],
generation,
cacheGeneration
);

let loaded=0;

for(
const time of times
){

if(
oyaLoadedTimes.has(time)
){

loaded++;

}

}

setStatus(
`Загрузка кадров: ${loaded}/${times.length}`
);

renderOyaTimeline();

}

}

try{

await Promise.all(
Array.from(
{
length:
Math.min(
4,
times.length
)
},
()=>worker()
)
);

if(
generation===oyaPreloadGeneration&&
activeLayer==="oya"
){

const complete=
times.every(
t=>oyaLoadedTimes.has(t)
);

setStatus(
complete
?
"Все кадры ОЯ загружены"
:
"Загрузка ОЯ завершена"
);

}

}catch(error){

console.error(error);

setStatus(
"Ошибка загрузки ОЯ"
);

}finally{

if(
generation===oyaPreloadGeneration
){

oyaPreloading=false;

}

renderOyaTimeline();

updatePreloadButton();

}

}

function isoToUnix(value){

const t=
Date.parse(value);

return Number.isNaN(t)
?
null
:
Math.floor(t/1000);

}

function parseOyaTimes(text){

if(!text)return[];

const result=[];

for(
const value of
text
.split(",")
.map(
x=>x.trim()
)
.filter(Boolean)
){

const unix=
isoToUnix(value);

if(unix!==null){

const date=
new Date(
unix*1000
);

const minute=
date.getUTCMinutes();

const second=
date.getUTCSeconds();

if(
minute%10===0&&
second===0
){

result.push(
unix
);

}

}

}

return[
...new Set(result)
];

}

function normalizeOyaTimes(times){

const now=
Math.floor(
Date.now()/1000
);

const result=[];

for(
const time of times
){

if(!Number.isFinite(time)){
continue;
}

if(time>now){
continue;
}

const date=
new Date(
time*1000
);

const minute=
date.getUTCMinutes();

const second=
date.getUTCSeconds();

if(
minute%10!==0||
second!==0
){

continue;

}

result.push(time);

}

return[
...new Set(result)
].sort(
(a,b)=>a-b
);

}

async function loadOyaCapabilities(){

if(
oyaCapabilitiesLoaded&&
oyaAllTimes.length
){

return true;

}

if(oyaCapabilitiesLoading){

while(oyaCapabilitiesLoading){

await new Promise(
r=>setTimeout(
r,
50
)
);

}

return(
oyaCapabilitiesLoaded&&
oyaAllTimes.length
);

}

oyaCapabilitiesLoading=true;

try{

const response=
await fetch(
OYA_PROXY+
"?action=capabilities",
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"Capabilities HTTP "+
response.status
);

}

const text=
await response.text();

const xml=
new DOMParser()
.parseFromString(
text,
"text/xml"
);

if(
xml.querySelector(
"parsererror"
)
){

throw new Error(
"Ошибка XML"
);

}

let times=[];

for(
const node of
Array.from(
xml.getElementsByTagName("*")
)
){

if(
node.localName!=="Extent"&&
node.localName!=="Dimension"
){

continue;

}

const name=
node.getAttribute(
"name"
);

if(
name&&
name.toLowerCase()!=="time"
){

continue;

}

const value=
(
node.textContent||
""
).trim();

if(!value)continue;

if(
value.includes("/")
){

const parts=
value.split("/");

const start=
isoToUnix(
parts[0]
);

const end=
isoToUnix(
parts[1]
);

if(
start!==null&&
end!==null&&
end>=start
){

const step=600;

const alignedStart=
Math.ceil(
start/step
)*step;

const now=
Math.floor(
Date.now()/1000
);

const lastAllowed=
Math.min(
end,
now
);

for(
let t=alignedStart;
t<=lastAllowed;
t+=step
){

times.push(t);

}

}

}else{

times.push(
...parseOyaTimes(value)
);

}

}

oyaAllTimes=
normalizeOyaTimes(
times
);

if(!oyaAllTimes.length){

throw new Error(
"В GetCapabilities нет актуального времени"
);

}

oyaCapabilitiesLoaded=true;

const saved=
Number(
localStorage.getItem(
"gptrad-oya-frame-count"
)
);

oyaFrameCount=
Number.isFinite(saved)&&
saved>=1
?
Math.min(
Math.floor(saved),
oyaAllTimes.length
)
:
Math.min(
50,
oyaAllTimes.length
);

frameCountInput.min=1;

frameCountInput.max=
oyaAllTimes.length;

frameCountInput.value=
oyaFrameCount;

applyOyaFrameCount(
oyaFrameCount,
false
);

return true;

}catch(error){

console.error(
"OYA capabilities:",
error
);

setStatus(
"Ошибка загрузки ОЯ"
);

return false;

}finally{

oyaCapabilitiesLoading=false;

}

}

function applyOyaFrameCount(
count,
preserve=true
){

if(!oyaAllTimes.length)return;

const oldTime=
preserve&&oyaTimes.length
?
oyaTimes[oyaFrameIndex]
:
null;

let numeric=
Number.parseInt(
count,
10
);

if(!Number.isFinite(numeric)){

numeric=
oyaFrameCount||
50;

}

oyaFrameCount=
Math.max(
1,
Math.min(
numeric,
oyaAllTimes.length
)
);

oyaTimes=
oyaAllTimes.slice(
-oyaFrameCount
);

oyaFrameIndex=
oyaTimes.length-1;

if(oldTime!==null){

const index=
oyaTimes.indexOf(
oldTime
);

if(index!==-1){

oyaFrameIndex=index;

}

}

localStorage.setItem(
"gptrad-oya-frame-count",
String(
oyaFrameCount
)
);

frameCountInput.min=1;

frameCountInput.max=
oyaAllTimes.length;

frameCountInput.value=
oyaFrameCount;

setOyaTimeline();

}

async function loadRainViewer(){

showLoading(
"Загрузка радара…"
);

setStatus(
"Получение RainViewer…"
);

try{

const response=
await fetch(
"https://api.rainviewer.com/public/weather-maps.json",
{
cache:"no-store"
}
);

if(!response.ok){

throw new Error(
"RainViewer HTTP "+
response.status
);

}

const data=
await response.json();

const past=
Array.isArray(
data.radar?.past
)
?
data.radar.past
:
[];

const nowcast=
Array.isArray(
data.radar?.nowcast
)
?
data.radar.nowcast
:
[];

rainFrames=[
...past,
...nowcast
]
.filter(
frame=>
frame&&
Number.isFinite(
Number(frame.time)
)&&
typeof frame.path==="string"&&
frame.path.length>0
)
.sort(
(a,b)=>a.time-b.time
);

if(!rainFrames.length){

throw new Error(
"RainViewer не вернул кадры"
);

}

currentFrame=
rainFrames.length-1;

setRadarTimeline();

showRainFrame(
currentFrame
);

setStatus(
"Радар RainViewer"
);

}catch(error){

console.error(
"RainViewer:",
error
);

setStatus(
"Ошибка RainViewer"
);

}finally{

hideLoading();

}

}

function makeRainLayer(frame){

let path=
String(
frame.path||""
).trim();

if(!path){

throw new Error(
"Пустой RainViewer path"
);

}

if(!path.startsWith("/")){

path="/"+path;

}

const tileUrl=
"https://tilecache.rainviewer.com"+
path+
"/256/{z}/{x}/{y}/2/1_1.png";

const source=
new ol.source.XYZ({

url:tileUrl,

tileSize:256,

maxZoom:19,

wrapX:true,

transition:0

});

const layer=
new ol.layer.Tile({

source,

opacity:.82,

zIndex:20,

preload:1

});

layer.__rainFrame=
frame;

return layer;

}

function showRainFrame(index){

if(
activeLayer!=="radar"||
!rainFrames[index]
){

return;

}

const frame=
rainFrames[index];

const requestId=
++rainFrameRequestId;

let newLayer;

try{

newLayer=
makeRainLayer(
frame
);

}catch(error){

console.error(error);

setStatus(
"Ошибка URL радара"
);

return;

}

const source=
newLayer.getSource();

let finished=false;

let loadedTiles=0;

let failedTiles=0;

const cleanup=()=>{

source.un(
"tileloadend",
onTileLoadEnd
);

source.un(
"tileloaderror",
onTileLoadError
);

};

const removeNewLayer=()=>{

cleanup();

try{

map.removeLayer(
newLayer
);

}catch(e){}

};

const promote=()=>{

if(finished)return;

finished=true;

cleanup();

if(
requestId!==rainFrameRequestId||
activeLayer!=="radar"
){

removeNewLayer();

return;

}

const oldLayer=
radarLayer;

radarLayer=
newLayer;

if(
oldLayer&&
oldLayer!==newLayer
){

map.removeLayer(
oldLayer
);

}

map.render();

setStatus(
"Радар RainViewer"
);

};

const onTileLoadEnd=()=>{

loadedTiles++;

if(!finished){

promote();

}

};

const onTileLoadError=()=>{

failedTiles++;

if(
!finished&&
loadedTiles===0&&
failedTiles>=4
){

removeNewLayer();

if(
requestId===rainFrameRequestId
){

setStatus(
"Кадр радара недоступен"
);

}

}

};

source.on(
"tileloadend",
onTileLoadEnd
);

source.on(
"tileloaderror",
onTileLoadError
);

map.addLayer(
newLayer
);

map.render();

updateTimeLabel();

setTimeout(
()=>{

if(
finished||
requestId!==rainFrameRequestId
){

return;

}

if(loadedTiles>0){

promote();

}else{

removeNewLayer();

setStatus(
"Кадр радара не загрузился"
);

}

},
5000
);

}
