<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GPTrad</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  background:#fff;
}

#map{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
}

/* ---------- TOP PANEL ---------- */

.top-panel{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  z-index:1000;

  display:flex;
  align-items:center;
  gap:8px;

  padding:10px 12px;

  background:rgba(255,255,255,.94);
  border-radius:14px;

  box-shadow:0 3px 18px rgba(0,0,0,.18);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.logo{
  font-size:19px;
  font-weight:800;
  white-space:nowrap;
  letter-spacing:-.3px;
}

.layer-select{
  flex:1;
  min-width:0;

  height:38px;
  padding:0 10px;

  border:1px solid rgba(0,0,0,.15);
  border-radius:10px;

  background:#fff;
  color:#111;

  font-size:14px;
  outline:none;
}

.panel-button{
  width:38px;
  height:38px;

  border:0;
  border-radius:10px;

  background:#f1f1f1;
  color:#111;

  font-size:20px;
  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:none;
}

.panel-button:active{
  transform:scale(.95);
}

/* ---------- STATUS ---------- */

#status{
  position:absolute;
  top:72px;
  left:50%;
  transform:translateX(-50%);

  z-index:999;

  padding:6px 11px;

  border-radius:10px;

  background:rgba(0,0,0,.68);
  color:#fff;

  font-size:12px;

  pointer-events:none;

  opacity:0;
  transition:opacity .15s ease;
}

#status.show{
  opacity:1;
}

/* ---------- SETTINGS ---------- */

.settings{
  position:absolute;
  top:62px;
  right:12px;

  width:220px;

  z-index:1100;

  padding:12px;

  border-radius:14px;

  background:rgba(255,255,255,.96);

  box-shadow:0 5px 25px rgba(0,0,0,.2);

  display:none;

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.settings.open{
  display:block;
}

.settings-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:10px;
}

.theme-button{
  width:100%;
  padding:10px;

  margin-top:6px;

  border:0;
  border-radius:9px;

  text-align:left;

  background:#f1f1f1;

  font-size:14px;
}

/* ---------- TIMELINE ---------- */

.timeline{
  position:absolute;

  left:12px;
  right:12px;
  bottom:14px;

  z-index:1000;

  display:flex;
  align-items:center;
  gap:8px;

  padding:9px 11px;

  background:rgba(255,255,255,.94);

  border-radius:14px;

  box-shadow:0 3px 18px rgba(0,0,0,.18);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.timeline button{
  width:36px;
  height:34px;

  border:0;
  border-radius:9px;

  background:#f1f1f1;

  font-size:17px;

  cursor:pointer;
}

#timeSlider{
  flex:1;
  min-width:0;
}

#timeLabel{
  min-width:95px;
  text-align:center;

  font-size:12px;
  font-weight:600;
}

/* ---------- DARK ---------- */

body.dark{
  background:#111;
}

body.dark .top-panel,
body.dark .timeline,
body.dark .settings{
  background:rgba(25,25,25,.94);
  color:#fff;
}

body.dark .layer-select{
  background:#222;
  color:#fff;
  border-color:#444;
}

body.dark .panel-button,
body.dark .timeline button,
body.dark .theme-button{
  background:#333;
  color:#fff;
}

/* ---------- GREEN ---------- */

body.green .top-panel,
body.green .timeline,
body.green .settings{
  background:rgba(239,248,239,.95);
}

body.green .panel-button,
body.green .timeline button,
body.green .theme-button{
  background:#dcebdc;
}

/* ---------- LEAFLET ---------- */

.leaflet-container{
  background:#dfe5e8;
}

.leaflet-control-zoom{
  border:0 !important;
  box-shadow:0 3px 15px rgba(0,0,0,.18) !important;
}

.leaflet-control-zoom a{
  border:0 !important;
}

/* ---------- LOADING ---------- */

#loading{
  position:absolute;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:2000;

  display:none;

  padding:9px 14px;

  border-radius:12px;

  background:rgba(0,0,0,.75);
  color:#fff;

  font-size:13px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top-panel">

  <div class="logo">GPTrad</div>

  <select id="layerSelect" class="layer-select">
    <option value="radar">Радар (RainViewer)</option>
    <option value="warnings">Опасные явления</option>
  </select>

  <button
    id="locateBtn"
    class="panel-button"
    title="Моё местоположение">
    ⌖
  </button>

  <button
    id="reloadBtn"
    class="panel-button"
    title="Обновить">
    ↻
  </button>

  <button
    id="settingsBtn"
    class="panel-button"
    title="Настройки">
    ⚙
  </button>

</div>

<div id="status"></div>

<div id="settings" class="settings">

  <div class="settings-title">
    Тема
  </div>

  <button class="theme-button" data-theme="light">
    Светлая
  </button>

  <button class="theme-button" data-theme="dark">
    Тёмная
  </button>

  <button class="theme-button" data-theme="green">
    Зелёная
  </button>

</div>

<div id="loading">
  Загрузка…
</div>

<div class="timeline">

  <button id="backBtn">
    ‹
  </button>

  <button id="playBtn">
    ▶
  </button>

  <button id="forwardBtn">
    ›
  </button>

  <input
    id="timeSlider"
    type="range"
    min="0"
    max="0"
    value="0"
  >

  <div id="timeLabel">
    —
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   GPTrad
   ========================================================= */

/* ---------- MAP ---------- */

const map = L.map("map", {
  zoomControl:true,
  attributionControl:true,

  zoomSnap:0,
  zoomDelta:0.5,

  zoomAnimation:false,
  fadeAnimation:false,
  markerZoomAnimation:false,
  zoomAnimationThreshold:0,

  touchZoom:true,
  scrollWheelZoom:true,

  wheelDebounceTime:20,
  wheelPxPerZoomLevel:80,

  doubleClickZoom:true,
  dragging:true,

  inertia:true,
  inertiaDeceleration:3000,
  easeLinearity:0.2,

  minZoom:2,
  maxZoom:19
}).setView([54.7, 55.9], 5);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    minZoom:2,
    maxZoom:19,

    tileSize:256,

    updateWhenIdle:true,
    updateWhenZooming:false,

    keepBuffer:3,

    attribution:"© OpenStreetMap"
  }
).addTo(map);


/* =========================================================
   STATE
   ========================================================= */

let currentMode = "radar";

let radarFrames = [];
let radarLayer = null;

let oyaLayer = null;
let oyaTimes = [];
let oyaIndex = 0;

let playing = false;
let playTimer = null;

let userMarker = null;


/* =========================================================
   UI
   ========================================================= */

const layerSelect =
  document.getElementById("layerSelect");

const timeSlider =
  document.getElementById("timeSlider");

const timeLabel =
  document.getElementById("timeLabel");

const status =
  document.getElementById("status");

const loading =
  document.getElementById("loading");

const settings =
  document.getElementById("settings");


function setStatus(text){
  status.textContent = text;

  if(text){
    status.classList.add("show");

    clearTimeout(setStatus.timer);

    setStatus.timer = setTimeout(()=>{
      status.classList.remove("show");
    },3500);
  }else{
    status.classList.remove("show");
  }
}


function setLoading(value){
  loading.style.display =
    value ? "block" : "none";
}


/* =========================================================
   SETTINGS
   ========================================================= */

document
  .getElementById("settingsBtn")
  .addEventListener("click",()=>{
    settings.classList.toggle("open");
  });


document
  .querySelectorAll(".theme-button")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      const theme =
        button.dataset.theme;

      document.body.classList.remove(
        "dark",
        "green"
      );

      if(theme === "dark"){
        document.body.classList.add("dark");
      }

      if(theme === "green"){
        document.body.classList.add("green");
      }

      localStorage.setItem(
        "gptrad-theme",
        theme
      );
    });

  });


const savedTheme =
  localStorage.getItem("gptrad-theme");

if(savedTheme === "dark"){
  document.body.classList.add("dark");
}

if(savedTheme === "green"){
  document.body.classList.add("green");
}


/* =========================================================
   RAINVIEWER
   ========================================================= */

async function loadRadar(){

  try{

    setLoading(true);
    setStatus("Загрузка радара…");

    const response =
      await fetch(
        "https://api.rainviewer.com/public/weather-maps.json",
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "RainViewer HTTP " +
        response.status
      );
    }

    const data =
      await response.json();

    const frames = [];

    if(data.radar){

      if(Array.isArray(data.radar.past)){
        frames.push(
          ...data.radar.past
        );
      }

      if(Array.isArray(data.radar.nowcast)){
        frames.push(
          ...data.radar.nowcast
        );
      }
    }

    if(!frames.length){
      throw new Error(
        "RainViewer не вернул кадры"
      );
    }

    radarFrames = frames;

    timeSlider.min = 0;
    timeSlider.max =
      Math.max(0, radarFrames.length - 1);

    timeSlider.value =
      radarFrames.length - 1;

    showRadarFrame(
      radarFrames.length - 1
    );

    setStatus("");

  }catch(error){

    console.error(
      "RainViewer:",
      error
    );

    setStatus(
      "Не удалось загрузить радар"
    );

  }finally{

    setLoading(false);
  }
}


function createRadarLayer(frame){

  const url =
    "https://tilecache.rainviewer.com" +
    frame.path +
    "/256/{z}/{x}/{y}/2/1_1.png";

  return L.tileLayer(url,{
    tileSize:256,

    opacity:1,

    minZoom:2,
    maxZoom:18,

    zIndex:10,

    updateWhenIdle:true,
    updateWhenZooming:false,

    keepBuffer:3,

    fadeAnimation:false
  });
}


function showRadarFrame(index){

  if(!radarFrames.length){
    return;
  }

  index = Math.max(
    0,
    Math.min(
      radarFrames.length - 1,
      index
    )
  );

  const frame =
    radarFrames[index];

  const newLayer =
    createRadarLayer(frame);

  newLayer.addTo(map);

  newLayer.once("load",()=>{

    if(radarLayer &&
       map.hasLayer(radarLayer)){

      map.removeLayer(
        radarLayer
      );
    }

    radarLayer = newLayer;
  });

  setTimeout(()=>{

    if(
      radarLayer !== newLayer &&
      map.hasLayer(newLayer)
    ){

      if(radarLayer &&
         map.hasLayer(radarLayer)){

        map.removeLayer(
          radarLayer
        );
      }

      radarLayer = newLayer;
    }

  },8000);

  timeSlider.value = index;

  updateTimeLabel(
    frame.time
  );
}


/* =========================================================
   OЯ / NOWCAST WMS
   ========================================================= */

/*
 * Это тот же WMS endpoint,
 * который используется оригинальным
 * savelov/radar-wms.
 *
 * Важно:
 * здесь НЕТ Vercel proxy.
 */

const OYA_WMS =
  "https://www.nowcast.ru/baltrad_wsgi";


const OYA_LAYERS =
  "bufr_phenomena," +
  "bufr_novosib_phenomena," +
  "bufr_vlad_phenomena";


const OYA_CAPABILITIES =
  OYA_WMS +
  "?SERVICE=WMS" +
  "&VERSION=1.1.1" +
  "&REQUEST=GetCapabilities";


/* ---------- CREATE OЯ WMS ---------- */

function createOyaLayer(time){

  const params = {

    layers:OYA_LAYERS,

    format:"image/png",

    transparent:true,

    version:"1.1.1",

    styles:"",

    opacity:1,

    zIndex:30
  };

  if(time){
    params.time = time;
  }

  return L.tileLayer.wms(
    OYA_WMS,
    params
  );
}


/* ---------- PARSE CAPABILITIES ---------- */

function parseOyaTimes(xmlText){

  const parser =
    new DOMParser();

  const xml =
    parser.parseFromString(
      xmlText,
      "text/xml"
    );

  const parserError =
    xml.querySelector("parsererror");

  if(parserError){
    throw new Error(
      "WMS XML parse error"
    );
  }

  const layers =
    Array.from(
      xml.getElementsByTagName("Layer")
    );

  const wanted =
    "bufr_phenomena";

  let targetLayer = null;

  for(const layer of layers){

    const nameNode =
      layer.getElementsByTagName("Name")[0];

    if(!nameNode){
      continue;
    }

    const name =
      nameNode.textContent
        .trim();

    /*
     * Берём именно базовый слой,
     * как в оригинальном demo.js.
     */
    if(name === wanted){

      targetLayer = layer;
      break;
    }
  }

  if(!targetLayer){

    /*
     * Иногда сервер может отдавать
     * объединённый слой иначе.
     *
     * Ищем первый слой, начинающийся
     * с bufr_phenomena.
     */

    for(const layer of layers){

      const nameNode =
        layer.getElementsByTagName("Name")[0];

      if(!nameNode){
        continue;
      }

      const name =
        nameNode.textContent
          .trim();

      if(
        name === wanted ||
        name.startsWith(wanted + ",")
      ){

        targetLayer = layer;
        break;
      }
    }
  }

  if(!targetLayer){
    throw new Error(
      "OЯ layer not found"
    );
  }


  /*
   * В оригинальном demo.js
   * время берётся из непосредственного
   * child Extent.
   */

  let extent = null;

  for(
    const child of Array.from(
      targetLayer.children
    )
  ){

    if(
      child.localName === "Extent" ||
      child.nodeName === "Extent"
    ){

      extent = child;
      break;
    }
  }


  if(!extent){

    /*
     * Дополнительный fallback.
     */

    const extents =
      targetLayer.getElementsByTagName(
        "Extent"
      );

    if(extents.length){
      extent = extents[0];
    }
  }


  if(!extent){
    throw new Error(
      "OЯ time Extent not found"
    );
  }


  const raw =
    extent.textContent.trim();


  const times =
    raw
      .split(",")
      .map(x=>x.trim())
      .filter(Boolean);


  /*
   * Убираем дубликаты.
   */

  return [...new Set(times)];
}


/* ---------- LOAD OЯ TIMES ---------- */

async function loadOyaTimes(){

  try{

    setLoading(true);
    setStatus(
      "Получение времён опасных явлений…"
    );


    const response =
      await fetch(
        OYA_CAPABILITIES,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "GetCapabilities HTTP " +
        response.status
      );
    }


    const xmlText =
      await response.text();


    const times =
      parseOyaTimes(
        xmlText
      );


    if(!times.length){

      throw new Error(
        "Времена OЯ отсутствуют"
      );
    }


    oyaTimes =
      times;


    /*
     * Сервер обычно отдаёт
     * самые свежие времена в конце.
     */

    oyaIndex =
      oyaTimes.length - 1;


    timeSlider.min = 0;

    timeSlider.max =
      Math.max(
        0,
        oyaTimes.length - 1
      );

    timeSlider.value =
      oyaIndex;


    await showOyaTime(
      oyaIndex
    );


    setStatus("");

  }catch(error){

    console.error(
      "OЯ GetCapabilities:",
      error
    );

    /*
     * Даже если GetCapabilities
     * заблокирован CORS, пытаемся
     * показать текущий WMS слой
     * без TIME.
     */

    setStatus(
      "Времена OЯ недоступны — показываю текущие данные"
    );

    showOyaLatest();

  }finally{

    setLoading(false);
  }
}


/* ---------- CURRENT OЯ ---------- */

function showOyaLatest(){

  const newLayer =
    createOyaLayer();


  newLayer.addTo(map);


  if(oyaLayer){

    setTimeout(()=>{

      if(
        oyaLayer &&
        map.hasLayer(oyaLayer)
      ){

        map.removeLayer(
          oyaLayer
        );
      }

      oyaLayer =
        newLayer;

    },500);

  }else{

    oyaLayer =
      newLayer;
  }


  timeLabel.textContent =
    "текущее OЯ";
}


/* ---------- SHOW OЯ TIME ---------- */

async function showOyaTime(index){

  if(!oyaTimes.length){
    showOyaLatest();
    return;
  }


  index = Math.max(
    0,
    Math.min(
      oyaTimes.length - 1,
      index
    )
  );


  oyaIndex =
    index;


  const time =
    oyaTimes[index];


  const newLayer =
    createOyaLayer(
      time
    );


  /*
   * Сначала добавляем новый слой.
   * Старый остаётся до появления
   * нового, чтобы карта не мигала.
   */

  newLayer.addTo(map);


  const removeOld = ()=>{

    if(
      oyaLayer &&
      map.hasLayer(oyaLayer)
    ){

      map.removeLayer(
        oyaLayer
      );
    }

    oyaLayer =
      newLayer;
  };


  /*
   * WMS tile layer может загрузить
   * несколько тайлов.
   */

  let finished = false;

  const finish = ()=>{

    if(finished){
      return;
    }

    finished = true;

    removeOld();
  };


  newLayer.once(
    "load",
    finish
  );


  /*
   * Fallback, если событие load
   * не приходит.
   */

  setTimeout(
    finish,
    7000
  );


  timeSlider.value =
    index;


  updateTimeLabel(
    time
  );
}


/* =========================================================
   TIME LABEL
   ========================================================= */

function updateTimeLabel(value){

  if(!value){

    timeLabel.textContent =
      "—";

    return;
  }


  const date =
    new Date(
      typeof value === "number"
        ? value * 1000
        : value
    );


  if(
    !Number.isNaN(
      date.getTime()
    )
  ){

    timeLabel.textContent =
      date.toLocaleString(
        "ru-RU",
        {
          day:"2-digit",
          month:"2-digit",

          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }else{

    timeLabel.textContent =
      String(value)
        .replace("T"," ")
        .replace("Z","");
  }
}


/* =========================================================
   SWITCH LAYERS
   ========================================================= */

async function switchLayer(mode){

  stopPlayback();

  currentMode =
    mode;


  if(mode === "radar"){

    /*
     * Убираем OЯ.
     */

    if(
      oyaLayer &&
      map.hasLayer(oyaLayer)
    ){

      map.removeLayer(
        oyaLayer
      );
    }

    oyaLayer = null;


    /*
     * Загружаем RainViewer,
     * если ещё не загружен.
     */

    if(!radarFrames.length){

      await loadRadar();

    }else{

      showRadarFrame(
        Number(
          timeSlider.value
        )
      );
    }

    return;
  }


  if(mode === "warnings"){

    /*
     * Убираем RainViewer.
     */

    if(
      radarLayer &&
      map.hasLayer(radarLayer)
    ){

      map.removeLayer(
        radarLayer
      );
    }

    radarLayer = null;


    /*
     * Загружаем OЯ.
     */

    await loadOyaTimes();
  }
}


/* =========================================================
   SELECT
   ========================================================= */

layerSelect.addEventListener(
  "change",
  async ()=>{

    await switchLayer(
      layerSelect.value
    );
  }
);


/* =========================================================
   TIMELINE
   ========================================================= */

timeSlider.addEventListener(
  "input",
  ()=>{

    const index =
      Number(
        timeSlider.value
      );


    if(currentMode === "radar"){

      if(radarFrames[index]){
        showRadarFrame(index);
      }

    }else{

      if(oyaTimes[index]){
        showOyaTime(index);
      }
    }
  }
);


/* ---------- BACK ---------- */

document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    ()=>{

      const max =
        currentMode === "radar"
          ? radarFrames.length - 1
          : oyaTimes.length - 1;


      if(max < 0){
        return;
      }


      let index =
        Number(
          timeSlider.value
        );


      index--;

      if(index < 0){
        index = 0;
      }


      timeSlider.value =
        index;


      if(currentMode === "radar"){
        showRadarFrame(index);
      }else{
        showOyaTime(index);
      }
    }
  );


/* ---------- FORWARD ---------- */

document
  .getElementById("forwardBtn")
  .addEventListener(
    "click",
    ()=>{

      const max =
        currentMode === "radar"
          ? radarFrames.length - 1
          : oyaTimes.length - 1;


      if(max < 0){
        return;
      }


      let index =
        Number(
          timeSlider.value
        );


      index++;

      if(index > max){
        index = max;
      }


      timeSlider.value =
        index;


      if(currentMode === "radar"){
        showRadarFrame(index);
      }else{
        showOyaTime(index);
      }
    }
  );


/* ---------- PLAY ---------- */

document
  .getElementById("playBtn")
  .addEventListener(
    "click",
    ()=>{

      if(playing){

        stopPlayback();

      }else{

        startPlayback();
      }
    }
  );


function startPlayback(){

  const max =
    currentMode === "radar"
      ? radarFrames.length - 1
      : oyaTimes.length - 1;


  if(max < 1){
    return;
  }


  playing = true;

  document
    .getElementById("playBtn")
    .textContent = "Ⅱ";


  playTimer =
    setInterval(()=>{

      let index =
        Number(
          timeSlider.value
        );


      index++;


      if(index > max){
        index = 0;
      }


      timeSlider.value =
        index;


      if(currentMode === "radar"){

        showRadarFrame(index);

      }else{

        showOyaTime(index);
      }

    },1000);
}


function stopPlayback(){

  playing = false;

  document
    .getElementById("playBtn")
    .textContent = "▶";


  if(playTimer){

    clearInterval(
      playTimer
    );

    playTimer = null;
  }
}


/* =========================================================
   LOCATE
   ========================================================= */

document
  .getElementById("locateBtn")
  .addEventListener(
    "click",
    ()=>{

      if(!navigator.geolocation){

        setStatus(
          "Геолокация недоступна"
        );

        return;
      }


      setStatus(
        "Определение местоположения…"
      );


      navigator.geolocation.getCurrentPosition(

        position=>{

          const lat =
            position.coords.latitude;

          const lon =
            position.coords.longitude;


          map.setView(
            [lat,lon],
            Math.max(
              map.getZoom(),
              7
            ),
            {
              animate:false
            }
          );


          if(userMarker){

            map.removeLayer(
              userMarker
            );
          }


          userMarker =
            L.circleMarker(
              [lat,lon],
              {
                radius:7,

                weight:3,

                fillOpacity:.8
              }
            ).addTo(map);


          setStatus("");

        },

        error=>{

          console.error(
            "Geolocation:",
            error
          );

          setStatus(
            "Не удалось определить местоположение"
          );
        },

        {
          enableHighAccuracy:true,

          timeout:10000,

          maximumAge:30000
        }
      );
    }
  );


/* =========================================================
   RELOAD
   ========================================================= */

document
  .getElementById("reloadBtn")
  .addEventListener(
    "click",
    async ()=>{

      if(currentMode === "radar"){

        await loadRadar();

      }else{

        await loadOyaTimes();
      }
    }
  );


/* =========================================================
   INITIAL LOAD
   ========================================================= */

(async function init(){

  /*
   * Сразу загружаем RainViewer,
   * потому что это слой по умолчанию.
   */

  await loadRadar();

})();
</script>
