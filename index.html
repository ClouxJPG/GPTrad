<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта ДМРЛ Росгидромета</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { height: 100vh; width: 100%; background: #242424; }
        .info-panel {
            position: absolute;
            top: 15px; right: 15px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="info-panel">
    <strong>Слой:</strong> Объединенная карта ДМРЛ РФ<br>
    <strong>Источник:</strong> ЦАО / Росгидромет
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Инициализируем карту (Центр - Европейская часть РФ)
    const map = L.map('map').setView([55.75, 37.61], 6);

    // 2. Тёмная подложка карты (чтобы радарные данные выглядели контрастно)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 12
    }).addTo(map);

    // 3. Прямой слой карты ДМРЛ из открытого геосервиса ЦАО
    // Этот WMS/Tile сервис отдаёт сырые отражаемости осадков (dBZ)
    const dmrlLayer = L.tileLayer('https://radar.rmc.ru/tiles/dmrl/{z}/{x}/{y}.png', {
        opacity: 0.75,
        maxZoom: 10,
        tileSize: 256
    }).addTo(map);
</script>

</body>
</html>
