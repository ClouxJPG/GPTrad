<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>COOLrad — radar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.4.0/ol.css" />
  <style>
    :root {
      --bg: #071827;
      --panel: rgba(8, 24, 39, 0.94);
      --line: rgba(142, 196, 218, 0.24);
      --text: #edfaff;
      --muted: #a7c3d4;
      --accent: #5bd3ff;
      --ok: #9ef3c4;
      --err: #ffb9b9;
    }

    * { box-sizing: border-box; }
    html, body, #map {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      color: var(--text);
    }

    #map {
      position: absolute;
      inset: 0;
      background: #0d1d2a;
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 16px 38px rgba(2, 8, 23, 0.5);
      backdrop-filter: blur(10px);
    }

    .btn, select, input {
      font: inherit;
    }

    #topbar {
      position: absolute;
      z-index: 10;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .brand, .tools {
      pointer-events: auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-dot {
      color: var(--accent);
      font-size: 20px;
      line-height: 1;
    }

    .brand small {
      display: block;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-size: 9px;
      margin-top: 2px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--line);
      background: rgba(17, 35, 53, 0.9);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #panel {
      position: absolute;
      z-index: 12;
      top: 78px;
      right: 14px;
      width: min(360px, calc(100vw - 28px));
      border-radius: 14px;
      padding: 16px;
      transform: translateX(120%);
      transition: transform 0.2s ease;
    }

    #panel.open {
      transform: translateX(0);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 800;
      font-size: 18px;
    }

    .close-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .field {
      margin: 14px 0;
    }

    .field label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    select, input[type="range"] {
      width: 100%;
    }

    select {
      background: #0b2c44;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
    }

    input[type="range"] {
      accent-color: var(--accent);
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .hint {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    #status {
      position: absolute;
      z-index: 11;
      left: 14px;
      bottom: 98px;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 12px;
      color: var(--muted);
      max-width: min(420px, calc(100vw - 28px));
    }

    #status.ok {
      color: var(--ok);
    }

    #status.err {
      color: var(--err);
    }

    #timeline {
      position: absolute;
      z-index: 11;
      left: 14px;
      right: 14px;
      bottom: 14px;
      border-radius: 14px;
      padding: 10px 14px;
    }

    #timeline-head {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
      letter-spacing: 0.08em;
    }

    #slider {
      width: 100%;
      accent-color: var(--accent);
    }

    .ol-zoom {
      left: 14px !important;
      top: 121px !important;
    }

    .ol-control button {
      background: rgba(11, 29, 42, 0.94) !important;
      color: white !important;
      border: 1px solid var(--line) !important;
      border-radius: 10px !important;
    }

    @media (max-width: 620px) {
      #topbar {
        top: 10px;
        left: 10px;
        right: 10px;
      }

      .brand {
        padding: 8px 10px;
        letter-spacing: 0.08em;
      }

      .brand small {
        font-size: 8px;
      }

      .btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      #panel {
        top: 72px;
        right: 10px;
      }

      #status {
        left: 10px;
        bottom: 92px;
      }

      #timeline {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="topbar">
    <div class="brand glass">
      <span class="brand-dot">●</span>
      <div>
        COOLrad
        <small>LIVE RUS RADAR</small>
      </div>
    </div>

    <div class="tools">
      <button class="btn glass" id="refreshBtn">↻ Обновить</button>
      <button class="btn glass" id="locateBtn">⌖ Россия</button>
      <button class="btn glass" id="togglePanelBtn">⚙ Панель</button>
    </div>
  </div>

  <aside id="panel" class="glass">
    <div class="panel-head">
      <span>Управление</span>
      <button class="close-btn" id="closePanelBtn" aria-label="close">×</button>
    </div>

    <div class="field">
      <label for="citySelect">Город</label>
      <select id="citySelect">
        <option value="100,61,3">Вся Россия</option>
        <option value="37.62,55.75,7">Москва</option>
        <option value="30.31,59.94,7">Санкт-Петербург</option>
        <option value="56.84,60.61,7">Екатеринбург</option>
        <option value="82.92,55.03,6">Новосибирск</option>
        <option value="49.11,55.79,7">Казань</option>
      </select>
    </div>

    <div class="field">
      <label for="opacitySlider">Прозрачность <span id="opacityValue">78%</span></label>
      <input id="opacitySlider" type="range" min="0" max="100" value="78" />
    </div>

    <div class="field">
      <label>Карта</label>
      <div class="segmented">
        <button class="btn" data-base="light">Светлая</button>
        <button class="btn" data-base="dark">Тёмная</button>
      </div>
    </div>

    <div class="field">
      <div class="segmented">
        <button class="btn" id="fullscreenBtn">⛶ Экран</button>
        <button class="btn" id="sourceBtn">↗ Источник</button>
      </div>
    </div>

    <div class="hint">
      Слой радара обновляется по мере доступности Meteoinfo. В случае временной недоступности источника карта остаётся на базовой подложке.
    </div>
  </aside>

  <div id="status" class="glass">Инициализация карты…</div>

  <div id="timeline" class="glass">
    <div id="timeline-head">
      <span>RADAR</span>
      <span id="timeLabel">—</span>
    </div>
    <input id="slider" type="range" min="0" max="0" value="0" disabled />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ol@7.4.0/dist/ol.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const timeLabel = document.getElementById('timeLabel');
    const panel = document.getElementById('panel');
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityValue = document.getElementById('opacityValue');

    let radarLayer = null;
    let radarUrl = null;
    let autoRefreshTimer = null;

    const extent = ol.proj.transformExtent([20, 35, 180, 82], 'EPSG:4326', 'EPSG:3857');

    const lightLayer = new ol.layer.Tile({
      source: new ol.source.OSM({
        attributions: '© OpenStreetMap contributors'
      })
    });

    const darkLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://{a-d}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        attributions: '© OpenStreetMap contributors © CARTO'
      })
    });

    const map = new ol.Map({
      target: 'map',
      layers: [lightLayer],
      view: new ol.View({
        center: ol.proj.fromLonLat([100, 61]),
        zoom: 3,
        minZoom: 2,
        maxZoom: 10
      }),
      controls: ol.control.defaults({
        rotate: false,
        attribution: true
      })
    });

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = 'glass';
      if (type) {
        statusEl.classList.add(type);
      }
    }

    function centerTo(value) {
      const parts = String(value).split(',').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return;
      const [lon, lat, zoom] = parts;
      map.getView().animate({
        center: ol.proj.fromLonLat([lon, lat]),
        zoom: zoom,
        duration: 500
      });
    }

    function updateOpacity() {
      const value = Number(opacitySlider.value);
      opacityValue.textContent = value + '%';
      if (radarLayer) {
        radarLayer.setOpacity(value / 100);
      }
    }

    function setBaseLayer(name) {
      const next = name === 'dark' ? darkLayer : lightLayer;
      map.getLayers().setAt(0, next);
      document.querySelectorAll('[data-base]').forEach((btn) => {
        btn.style.borderColor = btn.dataset.base === name ? '#5bd3ff' : 'rgba(142, 196, 218, 0.24)';
      });
    }

    function removeRadar() {
      if (radarLayer) {
        try {
          map.removeLayer(radarLayer);
        } catch (_) {}
        radarLayer = null;
      }
      if (radarUrl) {
        try {
          URL.revokeObjectURL(radarUrl);
        } catch (_) {}
        radarUrl = null;
      }
    }

    async function loadRadar() {
      const currentOpacity = Number(opacitySlider.value) / 100;
      const refreshBtn = document.getElementById('refreshBtn');
      refreshBtn.disabled = true;
      setStatus('Загрузка радарного композита…', '');

      try {
        const response = await fetch('/api/meteoinfo?_=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const blob = await response.blob();
        if (!blob.type || !blob.type.startsWith('image/')) {
          throw new Error('Источник вернул не изображение');
        }

        const nextUrl = URL.createObjectURL(blob);
        const nextLayer = new ol.layer.Image({
          source: new ol.source.ImageStatic({
            url: nextUrl,
            imageExtent: extent,
            projection: 'EPSG:3857'
          }),
          opacity: currentOpacity
        });

        removeRadar();
        radarLayer = nextLayer;
        radarUrl = nextUrl;
        map.addLayer(radarLayer);

        const now = new Date();
        timeLabel.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setStatus('Радар успешно загружен', 'ok');
      } catch (error) {
        console.error(error);
        setStatus('Радар временно недоступен: ' + error.message, 'err');
      } finally {
        refreshBtn.disabled = false;
      }
    }

    function startAutoRefresh() {
      clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(loadRadar, 5 * 60 * 1000);
    }

    document.getElementById('refreshBtn').addEventListener('click', loadRadar);
    document.getElementById('locateBtn').addEventListener('click', function () {
      centerTo('100,61,3');
    });

    document.getElementById('citySelect').addEventListener('change', function (event) {
      centerTo(event.target.value);
    });

    document.getElementById('togglePanelBtn').addEventListener('click', function () {
      panel.classList.toggle('open');
    });

    document.getElementById('closePanelBtn').addEventListener('click', function () {
      panel.classList.remove('open');
    });

    opacitySlider.addEventListener('input', updateOpacity);
    document.querySelectorAll('[data-base]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setBaseLayer(btn.dataset.base);
      });
    });

    document.getElementById('fullscreenBtn').addEventListener('click', function () {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });

    document.getElementById('sourceBtn').addEventListener('click', function () {
      window.open('https://meteoinfo.ru/radanim', '_blank', 'noopener');
    });

    setBaseLayer('light');
    updateOpacity();
    setStatus('Карта готова. Загрузка радара…', '');
    loadRadar();
    startAutoRefresh();
  </script>
</body>
</html>
