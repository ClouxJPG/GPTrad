<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>GPTrad</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#map{
  width:100%;
  height:100%;
  background:#111;
}

.top-panel{
  position:absolute;
  z-index:1000;
  top:10px;
  left:10px;
  right:10px;
  height:52px;

  display:flex;
  align-items:center;
  gap:8px;

  padding:8px 10px;

  background:rgba(20,20,20,.88);
  border-radius:12px;
  color:white;

  box-shadow:0 3px 15px rgba(0,0,0,.3);
}

.title{
  font-weight:700;
  margin-right:auto;
}

select,
button{
  border:0;
  outline:none;
}

select{
  height:34px;
  border-radius:8px;
  padding:0 8px;
  background:#333;
  color:white;
}

button{
  width:34px;
  height:34px;
  border-radius:8px;
  background:#333;
  color:white;
  font-size:18px;
  cursor:pointer;
}

button:active{
  transform:scale(.95);
}

.status{
  position:absolute;
  z-index:1000;

  top:70px;
  left:50%;
  transform:translateX(-50%);

  padding:5px 10px;

  border-radius:8px;

  background:rgba(20,20,20,.75);
  color:white;

  font-size:12px;

  pointer-events:none;
}

.timeline{
  position:absolute;
  z-index:1000;

  left:10px;
  right:10px;
  bottom:12px;

  height:54px;

  display:flex;
  align-items:center;
  gap:8px;

  padding:8px 10px;

  background:rgba(20,20,20,.88);
  border-radius:12px;

  box-shadow:0 3px 15px rgba(0,0,0,.3);
}

.timeline button{
  flex:0 0 34px;
}

#slider{
  flex:1;
}

#timeLabel{
  min-width:120px;
  text-align:center;
  color:white;
  font-size:12px;
}

.leaflet-control-attribution{
  font-size:9px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="top-panel">

  <div class="title">GPTrad</div>

  <select id="layer">
    <option value="radar">Радар (RainViewer)</option>
    <option value="warnings">Опасные явления</option>
  </select>

  <button id="locate">⌖</button>
  <button id="reload">↻</button>

</div>

<div class="status" id="status">
  Загрузка…
</div>

<div class="timeline">

  <button id="back">‹</button>

  <input
    id="slider"
    type="range"
    min="0"
    max="0"
    value="0"
  >

  <button id="play">▶</button>

  <button id="forward">›</button>

  <div id="timeLabel">—</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ============================================================
   НАСТРОЙКИ
   ============================================================ */

/*
 * Здесь должен быть сервер, где работает vector_wms.wsgi.
 *
 * Например:
 *
 * const VECTOR_BASE = "https://example.ru";
 *
 * Тогда запрос будет:
 *
 * https://example.ru/vector_wsgi?time=...
 *
 * Если /vector_wsgi находится непосредственно на твоём
 * рабочем домене — укажи его здесь.
 */
const VECTOR_BASE = "";


/* ============================================================
   КАРТА
   ============================================================ */

const map = L.map("map", {
  zoomControl:true,
  attributionControl:true
}).setView([54.74,55.97],5);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);


/* ============================================================
   UI
   ============================================================ */

const layerSelect = document.getElementById("layer");
const slider      = document.getElementById("slider");
const back        = document.getElementById("back");
const forward     = document.getElementById("forward");
const play        = document.getElementById("play");
const locate      = document.getElementById("locate");
const reload      = document.getElementById("reload");
const status      = document.getElementById("status");
const timeLabel   = document.getElementById("timeLabel");


/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */

let frames = [];

let currentIndex = 0;

let radarLayer = null;

let radarLoadingLayer = null;

let warningsLayer = L.layerGroup();

let playing = false;

let playTimer = null;


/*
 * Кэш слоёв.
 *
 * index -> {
 *   layer,
 *   loaded
 * }
 */
const radarCache = new Map();


/*
 * Кэш ОЯ.
 *
 * timestamp -> Leaflet layer
 */
const warningCache = new Map();


/* ============================================================
   СТАТУС
   ============================================================ */

function setStatus(text){
  status.textContent = text;
}


/* ============================================================
   ФОРМАТ ВРЕМЕНИ
   ============================================================ */

function formatTime(timestamp, forecast){

  const d = new Date(timestamp * 1000);

  return d.toLocaleString("ru-RU",{
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  }) + (forecast ? " · прогноз" : "");
}


/* ============================================================
   RAINVIEWER
   ============================================================ */

async function loadFrames(){

  try{

    setStatus("Загрузка радара…");

    const response = await fetch(
      "https://api.rainviewer.com/public/weather-maps.json",
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("RainViewer HTTP " + response.status);
    }

    const data = await response.json();

    const result = [];

    const past = data.radar?.past || [];
    const nowcast = data.radar?.nowcast || [];

    for(const f of past){

      result.push({
        time:f.time,
        forecast:false,
        path:f.path,
        url:
          data.host +
          f.path +
          "/256/{z}/{x}/{y}/2/1_1.png"
      });

    }

    for(const f of nowcast){

      result.push({
        time:f.time,
        forecast:true,
        path:f.path,
        url:
          data.host +
          f.path +
          "/256/{z}/{x}/{y}/2/1_1.png"
      });

    }

    if(!result.length){
      throw new Error("Кадры не найдены");
    }

    /*
     * Удаляем старые дубликаты времени.
     */
    const unique = [];

    const seen = new Set();

    for(const f of result){

      if(seen.has(f.time)) continue;

      seen.add(f.time);

      unique.push(f);
    }

    frames = unique;

    slider.max = Math.max(0,frames.length - 1);

    /*
     * Если раньше уже был выбран кадр,
     * стараемся сохранить его.
     */
    currentIndex = Math.min(
      currentIndex,
      frames.length - 1
    );

    slider.value = currentIndex;

    /*
     * Первый запуск.
     */
    if(!radarLayer){

      await showFrame(currentIndex,true);

    }else{

      await showFrame(currentIndex,true);

    }

    /*
     * Предзагрузка соседних кадров.
     */
    preloadAround(currentIndex);

    setStatus("Радар готов");

  }catch(error){

    console.error(error);

    setStatus("Ошибка загрузки радара");

  }

}


/* ============================================================
   СОЗДАНИЕ СЛОЯ РАДАРА
   ============================================================ */

function createRadarLayer(index){

  const frame = frames[index];

  if(!frame) return null;

  return L.tileLayer(
    frame.url,
    {
      opacity:.75,
      tileSize:256,
      zIndex:5,
      updateWhenZooming:false,
      updateWhenIdle:true,
      keepBuffer:2
    }
  );
}


/* ============================================================
   ОЖИДАНИЕ ЗАГРУЗКИ СЛОЯ
   ============================================================ */

function waitForLayer(layer){

  return new Promise(resolve => {

    let finished = false;

    function done(){

      if(finished) return;

      finished = true;

      resolve();

    }

    layer.once("load",done);

    /*
     * Если браузер уже взял все тайлы из cache,
     * load может пройти очень быстро.
     *
     * Страховка от вечного ожидания.
     */
    setTimeout(done,8000);

  });

}


/* ============================================================
   БЕСШОВНАЯ СМЕНА КАДРА
   ============================================================ */

async function showFrame(index,force=false){

  if(!frames.length) return;

  index = Math.max(
    0,
    Math.min(index,frames.length - 1)
  );

  currentIndex = index;

  slider.value = index;

  const frame = frames[index];

  timeLabel.textContent =
    formatTime(
      frame.time,
      frame.forecast
    );


  /*
   * Если этот кадр уже является текущим,
   * ничего делать не нужно.
   */
  if(
    !force &&
    radarLayer &&
    radarLayer._gptradIndex === index
  ){

    preloadAround(index);

    return;
  }


  /*
   * 1. Сначала проверяем кэш.
   */
  let entry = radarCache.get(index);


  /*
   * 2. Если слоя ещё нет — создаём.
   */
  if(!entry){

    const newLayer = createRadarLayer(index);

    if(!newLayer) return;

    entry = {
      layer:newLayer,
      loaded:false
    };

    radarCache.set(index,entry);

    /*
     * НОВЫЙ слой добавляется ПОВЕРХ старого.
     *
     * Старый пока НЕ удаляем.
     */
    newLayer._gptradIndex = index;

    newLayer.addTo(map);

    /*
     * Ждём готовности.
     */
    await waitForLayer(newLayer);

    entry.loaded = true;

  }else{

    /*
     * Кэшированный слой уже есть.
     */
    if(!entry.layer._map){

      entry.layer.addTo(map);

    }

  }


  /*
   * 3. Теперь новый слой готов.
   *
   * Только здесь удаляем старый.
   */
  const oldLayer = radarLayer;

  radarLayer = entry.layer;

  radarLayer.setOpacity(.75);

  if(
    oldLayer &&
    oldLayer !== radarLayer
  ){

    map.removeLayer(oldLayer);

    /*
     * Старый слой оставляем в кэше,
     * чтобы можно было вернуться мгновенно.
     */
  }


  /*
   * 4. Ограничиваем кэш.
   */
  trimRadarCache(index);


  /*
   * 5. Загружаем соседние кадры.
   */
  preloadAround(index);

}


/* ============================================================
   ПРЕДЗАГРУЗКА КАДРОВ
   ============================================================ */

function preloadFrame(index){

  if(
    index < 0 ||
    index >= frames.length
  ) return;

  if(radarCache.has(index)) return;

  const layer = createRadarLayer(index);

  if(!layer) return;

  layer._gptradIndex = index;

  /*
   * Сначала делаем слой прозрачным.
   *
   * Он будет загружаться в фоне.
   */
  layer.setOpacity(0);

  layer.addTo(map);

  const entry = {
    layer:layer,
    loaded:false
  };

  radarCache.set(index,entry);

  layer.once("load",() => {

    entry.loaded = true;

    /*
     * Если этот кадр не текущий,
     * оставляем его прозрачным.
     */
    if(radarLayer !== layer){

      layer.setOpacity(0);

    }

  });

}


/*
 * Предзагружаем предыдущий и следующий кадр.
 */
function preloadAround(index){

  preloadFrame(index - 1);
  preloadFrame(index + 1);
}


/* ============================================================
   ОГРАНИЧЕНИЕ КЭША
   ============================================================ */

function trimRadarCache(center){

  for(const [index,entry] of radarCache){

    if(
      Math.abs(index - center) > 2 &&
      entry.layer !== radarLayer
    ){

      if(entry.layer._map){

        map.removeLayer(entry.layer);

      }

      radarCache.delete(index);

    }

  }

}


/* ============================================================
   ОЯ
   ============================================================ */


/*
 * Расчёт конечной точки вектора.
 *
 * Используется тот же географический принцип,
 * что и в demo/dmrl.html репозитория.
 */
function destination(
  lng,
  lat,
  dist,
  heading
){

  const R = 6371;

  lat *= Math.PI / 180;
  lng *= Math.PI / 180;
  heading *= Math.PI / 180;

  const lat2 =
    Math.asin(
      Math.sin(lat) *
      Math.cos(dist / R) +

      Math.cos(lat) *
      Math.sin(dist / R) *
      Math.cos(heading)
    );

  const lng2 =
    lng +
    Math.atan2(
      Math.sin(heading) *
      Math.sin(dist / R) *
      Math.cos(lat),

      Math.cos(dist / R) -
      Math.sin(lat) *
      Math.sin(lat2)
    );

  return [
    180 / Math.PI * lng2,
    180 / Math.PI * lat2
  ];

}


/* ============================================================
   ЗАПРОС ОЯ
   ============================================================ */

async function loadWarnings(timestamp){

  /*
   * Уже загружено.
   */
  if(warningCache.has(timestamp)){

    return warningCache.get(timestamp);

  }


  /*
   * Если endpoint не задан,
   * просто возвращаем пустой слой.
   */
  if(!VECTOR_BASE){

    console.warn(
      "VECTOR_BASE не задан"
    );

    return L.layerGroup();

  }


  const url =
    VECTOR_BASE.replace(/\/$/,"") +
    "/vector_wsgi?time=" +
    encodeURIComponent(
      new Date(timestamp * 1000)
        .toISOString()
        .replace(".000","")
    );


  try{

    const response = await fetch(
      url,
      {
        cache:"no-store"
      }
    );

    if(!response.ok){

      throw new Error(
        "vector_wsgi HTTP " +
        response.status
      );

    }

    const data = await response.json();

    const layer = L.layerGroup();


    /*
     * Формат репозитория:
     *
     * [
     *   latitude,
     *   longitude,
     *   distance,
     *   bearing
     * ]
     */
    for(const item of data){

      if(!Array.isArray(item)) continue;

      const lat = Number(item[0]);
      const lon = Number(item[1]);
      const dist = Number(item[2]);
      const bearing = Number(item[3]);

      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lon) ||
        !Number.isFinite(dist) ||
        !Number.isFinite(bearing)
      ){

        continue;

      }


      /*
       * Не рисуем нулевые/служебные значения.
       */
      if(dist <= 0) continue;

      /*
       * bearing=511 в исходном WSGI означает
       * отсутствие направления.
       */
      if(bearing === 511) continue;


      /*
       * В оригинальном demo расстояние
       * преобразуется через *3.6.
       */
      const distance = dist * 3.6;

      const end = destination(
        lon,
        lat,
        distance,
        bearing
      );


      /*
       * Сам центр.
       */
      L.circleMarker(
        [lat,lon],
        {
          radius:4,
          color:"#ff3030",
          weight:2,
          fillColor:"#ff3030",
          fillOpacity:.9
        }
      ).addTo(layer);


      /*
       * Направление/перемещение.
       */
      L.polyline(
        [
          [lat,lon],
          [end[1],end[0]]
        ],
        {
          color:"#ff3030",
          weight:3,
          opacity:.9
        }
      ).addTo(layer);


      /*
       * Наконечник.
       */
      L.circleMarker(
        [end[1],end[0]],
        {
          radius:3,
          color:"#ff3030",
          fillColor:"#ff3030",
          fillOpacity:.9,
          weight:1
        }
      ).addTo(layer);

    }


    warningCache.set(
      timestamp,
      layer
    );

    return layer;


  }catch(error){

    console.error(
      "Ошибка vector_wsgi:",
      error
    );

    /*
     * Не ломаем интерфейс.
     */
    return L.layerGroup();

  }

}


/* ============================================================
   ПОКАЗ ОЯ
   ============================================================ */

async function showWarnings(index){

  if(!frames[index]) return;

  const timestamp =
    frames[index].time;


  setStatus("Загрузка опасных явлений…");


  const layer =
    await loadWarnings(timestamp);


  /*
   * Старый слой ОЯ не держим.
   */
  if(warningsLayer){

    map.removeLayer(
      warningsLayer
    );

  }


  warningsLayer = layer;


  warningsLayer.addTo(map);


  setStatus("Опасные явления");


}


/* ============================================================
   ПЕРЕКЛЮЧЕНИЕ СЛОЁВ
   ============================================================ */

layerSelect.addEventListener(
  "change",
  async () => {

    if(layerSelect.value === "radar"){

      /*
       * ОЯ убрать.
       */
      if(warningsLayer){

        map.removeLayer(
          warningsLayer
        );

      }


      /*
       * Показать текущий радар.
       */
      if(radarLayer){

        radarLayer.setOpacity(.75);

        if(!radarLayer._map){

          radarLayer.addTo(map);

        }

      }else{

        await showFrame(
          currentIndex,
          true
        );

      }


      setStatus("Радар готов");


    }else{

      /*
       * Радар не удаляем.
       *
       * Просто скрываем его.
       */
      if(radarLayer){

        radarLayer.setOpacity(0);

      }


      await showWarnings(
        currentIndex
      );

    }

  }
);


/* ============================================================
   SLIDER
   ============================================================ */

slider.addEventListener(
  "input",
  async () => {

    const index =
      Number(slider.value);

    currentIndex = index;


    /*
     * Время меняем сразу.
     */
    if(frames[index]){

      timeLabel.textContent =
        formatTime(
          frames[index].time,
          frames[index].forecast
        );

    }


    /*
     * При режиме радара — бесшовный swap.
     */
    if(layerSelect.value === "radar"){

      await showFrame(index);

    }else{

      /*
       * Для ОЯ тоже сразу грузим соответствующий
       * временной слой.
       */
      await showWarnings(index);

    }

  }
);


/* ============================================================
   НАЗАД
   ============================================================ */

back.addEventListener(
  "click",
  async () => {

    const next =
      Math.max(
        0,
        currentIndex - 1
      );

    slider.value = next;

    slider.dispatchEvent(
      new Event("input")
    );

  }
);


/* ============================================================
   ВПЕРЁД
   ============================================================ */

forward.addEventListener(
  "click",
  async () => {

    const next =
      Math.min(
        frames.length - 1,
        currentIndex + 1
      );

    slider.value = next;

    slider.dispatchEvent(
      new Event("input")
    );

  }
);


/* ============================================================
   PLAY / PAUSE
   ============================================================ */

function stopPlayback(){

  playing = false;

  if(playTimer){

    clearInterval(
      playTimer
    );

    playTimer = null;

  }

  play.textContent = "▶";

}


function startPlayback(){

  if(playing) return;

  playing = true;

  play.textContent = "Ⅱ";


  playTimer =
    setInterval(
      async () => {

        let next =
          currentIndex + 1;


        if(next >= frames.length){

          next = 0;

        }


        slider.value = next;

        await (
          async () => {

            currentIndex = next;

            if(layerSelect.value === "radar"){

              await showFrame(next);

            }else{

              await showWarnings(next);

            }

          }
        )();

      },
      600
    );

}


play.addEventListener(
  "click",
  () => {

    if(playing){

      stopPlayback();

    }else{

      startPlayback();

    }

  }
);


/* ============================================================
   ГЕОЛОКАЦИЯ
   ============================================================ */

locate.addEventListener(
  "click",
  () => {

    if(!navigator.geolocation){

      return;

    }

    navigator.geolocation.getCurrentPosition(
      position => {

        const lat =
          position.coords.latitude;

        const lon =
          position.coords.longitude;

        map.setView(
          [lat,lon],
          8
        );

      },
      error => {

        console.error(
          "Geolocation:",
          error
        );

      },
      {
        enableHighAccuracy:true,
        timeout:10000,
        maximumAge:60000
      }
    );

  }
);


/* ============================================================
   RELOAD
   ============================================================ */

reload.addEventListener(
  "click",
  async () => {

    /*
     * Сохраняем текущий кадр.
     */
    const oldIndex =
      currentIndex;


    /*
     * Не трогаем интерфейс.
     */
    await loadFrames();


    /*
     * Возвращаемся к прежнему индексу,
     * если он ещё существует.
     */
    currentIndex =
      Math.min(
        oldIndex,
        frames.length - 1
      );

    slider.value =
      currentIndex;


    if(layerSelect.value === "warnings"){

      await showWarnings(
        currentIndex
      );

    }

  }
);


/* ============================================================
   ПЕРИОДИЧЕСКОЕ ОБНОВЛЕНИЕ
   ============================================================ */

setInterval(
  async () => {

    await loadFrames();

  },
  10 * 60 * 1000
);


/* ============================================================
   СТАРТ
   ============================================================ */

loadFrames();

</script>

</body>
</html>
