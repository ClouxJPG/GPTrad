<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COOLrad — российский радар</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.4.0/ol.css"><style>
:root{--p:#071827dd;--line:#31526a;--a:#59d5ff;--t:#eaf7ff}*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}body{background:#071827;color:var(--t);font:14px Arial,sans-serif}.glass{background:var(--p);border:1px solid var(--line);box-shadow:0 14px 35px #02081788;backdrop-filter:blur(10px)}#map{position:absolute;inset:0}.dark img,.dark canvas{filter:brightness(.75) saturate(.85)}#head{position:absolute;z-index:5;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.brand,.actions{pointer-events:auto}.brand{padding:12px 16px;border-radius:14px;font-weight:900;letter-spacing:.12em}.brand b{color:var(--a)}small{display:block;color:#9db8ca;font-size:9px;margin-top:4px;letter-spacing:.06em}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:10px;background:#0d283ddd;color:var(--t);padding:10px 12px;font-weight:700;cursor:pointer}.btn:hover{border-color:var(--a)}#status{position:absolute;z-index:6;left:16px;bottom:98px;padding:10px 12px;border-radius:10px;color:#9db8ca;font-size:12px}#status.ok{color:#b7f5cd}#status.err{color:#ffc5c5}#timeline{position:absolute;z-index:6;left:16px;right:16px;bottom:16px;padding:10px 14px;border-radius:14px;text-align:center;font-size:11px}#slider{width:100%;accent-color:var(--a)}.ol-zoom{left:16px!important;top:120px!important}.ol-control button{background:#0b2438dd!important;color:white!important;border:1px solid var(--line)!important}@media(max-width:600px){#head{top:10px;left:10px;right:10px}.brand{padding:10px;font-size:12px}.btn{padding:8px;font-size:12px}#status{left:10px;bottom:88px}}
</style></head><body><div id="map"></div><header id="head"><div class="brand glass"><b>●</b> COOLrad<small>РОССИЙСКИЙ РАДАР • РОСГИДРОМЕТ</small></div><div class="actions"><button class="btn glass" id="refresh">↻ Обновить</button><button class="btn glass" id="center">⌖ Россия</button></div></header><div id="status" class="glass">Загрузка радара Росгидромета…</div><div id="timeline" class="glass"><div id="time">Последний доступный композит</div><input id="slider" type="range" min="0" max="0" value="0"></div><script src="https://cdn.jsdelivr.net/npm/ol@7.4.0/dist/ol.js"></script><script>
const map=new ol.Map({target:'map',layers:[new ol.layer.Tile({className:'dark',source:new ol.source.OSM()})],view:new ol.View({center:ol.proj.fromLonLat([100,61]),zoom:3,minZoom:2,maxZoom:8})});const status=document.getElementById('status');let radar=null;let objectUrl=null;const setStatus=(x,c='')=>{status.className='glass '+c;status.textContent=x};
// Approximate published Russia-wide composite extent. The source is a real radar image,
// not a forecast model. The upstream image contains its own cartographic frame.
const extent=ol.proj.transformExtent([20,35,180,82],'EPSG:4326','EPSG:3857');
async function load(){try{setStatus('Загрузка реального радиолокационного композита…');const r=await fetch('/api/meteoinfo?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const b=await r.blob();if(!b.type.includes('image'))throw Error('источник вернул не изображение');if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(b);const source=new ol.source.ImageStatic({url:objectUrl,imageExtent:extent,projection:'EPSG:3857'});const next=new ol.layer.Image({source,opacity:.88});if(radar)map.removeLayer(radar);radar=next;map.addLayer(radar);setStatus('Реальный радар Росгидромета отображён','ok');document.getElementById('time').textContent='Последний доступный композит • '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){console.error(e);setStatus('⚠ Не удалось загрузить российский радар: '+e.message,'err')}}document.getElementById('refresh').onclick=load;document.getElementById('center').onclick=()=>map.getView().animate({center:ol.proj.fromLonLat([100,61]),zoom:3,duration:400});load();
</script></body></html>
