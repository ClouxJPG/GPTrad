<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COOLrad — российский радар</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@7.4.0/ol.css">
<style>
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden}body{background:#071827;color:#eaf7ff;font:14px Arial,sans-serif}.glass{background:#071827e8;border:1px solid #31526a;box-shadow:0 14px 35px #02081799;backdrop-filter:blur(10px)}#map{position:absolute;inset:0}.dark img,.dark canvas{filter:brightness(.76) saturate(.85)}#head{position:absolute;z-index:8;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.brand,.actions{pointer-events:auto}.brand{padding:12px 16px;border-radius:14px;font-weight:900;letter-spacing:.12em}.brand b{color:#59d5ff}.brand small{display:block;color:#9db8ca;font-size:9px;margin-top:4px}.actions{display:flex;gap:8px}.btn{border:1px solid #31526a;border-radius:10px;background:#0d283ddd;color:#eaf7ff;padding:10px 12px;font-weight:700;cursor:pointer}.btn:hover{border-color:#59d5ff}#status{position:absolute;z-index:8;left:16px;bottom:98px;padding:10px 12px;border-radius:10px;color:#9db8ca;font-size:12px;max-width:calc(100% - 32px)}#status.ok{color:#b7f5cd}#status.err{color:#ffc5c5}#timeline{position:absolute;z-index:8;left:16px;right:16px;bottom:16px;padding:10px 14px;border-radius:14px;text-align:center;font-size:11px}#slider{width:100%;accent-color:#59d5ff}.ol-zoom{left:16px!important;top:120px!important}.ol-control button{background:#0b2438dd!important;color:white!important;border:1px solid #31526a!important}@media(max-width:600px){#head{top:10px;left:10px;right:10px}.brand{padding:10px;font-size:12px}.btn{padding:8px;font-size:12px}#status{left:10px;bottom:88px}}
</style></head>
<body>
<div id="map"></div><header id="head"><div class="brand glass"><b>●</b> COOLrad<small>РОССИЙСКИЙ РАДАР • РОСГИДРОМЕТ</small></div><div class="actions"><button class="btn glass" id="refresh">↻ Обновить</button><button class="btn glass" id="center">⌖ Россия</button></div></header><div id="status" class="glass">Загрузка…</div><div id="timeline" class="glass"><div id="time">Последний доступный композит</div><input id="slider" type="range" min="0" max="0" value="0"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@7.4.0/dist/ol.js"></script><script>
const map=new ol.Map({target:"map",layers:[new ol.layer.Tile({className:"dark",source:new ol.source.OSM()})],view:new ol.View({center:ol.proj.fromLonLat([100,61]),zoom:3,minZoom:2,maxZoom:8})});
const status=document.getElementById("status");let radar=null,url=null;
function say(text,kind=""){status.className="glass "+kind;status.textContent=text}
const extent=ol.proj.transformExtent([20,35,180,82],"EPSG:4326","EPSG:3857");
function removeBackground(canvas){const ctx=canvas.getContext("2d",{willReadFrequently:true}), image=ctx.getImageData(0,0,canvas.width,canvas.height), p=image.data;for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2],max=Math.max(r,g,b),min=Math.min(r,g,b);if((max-min<16&&max>125)||(r>242&&g>242&&b>242)){p[i+3]=0;}}ctx.putImageData(image,0,0)}
function blobUrlWithTransparentBackground(blob){return new Promise((resolve,reject)=>{const raw=URL.createObjectURL(blob),img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext("2d");ctx.drawImage(img,0,0);removeBackground(c);c.toBlob(x=>{URL.revokeObjectURL(raw);if(!x)reject(Error("canvas conversion failed"));else resolve(URL.createObjectURL(x)),"image/png");},"image/png")}catch(e){URL.revokeObjectURL(raw);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(raw);reject(Error("radar image decode failed"))};img.src=raw})}
async function load(){try{say("Загрузка реального российского композита…");const response=await fetch("/api/meteoinfo?_="+Date.now(),{cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);const blob=await response.blob();if(!blob.type.startsWith("image/"))throw Error("Источник вернул не изображение");const nextUrl=await blobUrlWithTransparentBackground(blob);if(url)URL.revokeObjectURL(url);url=nextUrl;const source=new ol.source.ImageStatic({url,imageExtent:extent,projection:"EPSG:3857"});const next=new ol.layer.Image({source,opacity:.9});if(radar)map.removeLayer(radar);radar=next;map.addLayer(radar);say("Реальный радар Росгидромета отображён","ok");document.getElementById("time").textContent="Последний кадр • "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}catch(e){console.error(e);say("⚠ Не удалось отобразить радар: "+e.message,"err")}}
document.getElementById("refresh").onclick=load;document.getElementById("center").onclick=()=>map.getView().animate({center:ol.proj.fromLonLat([100,61]),zoom:3,duration:400});load();
</script></body></html>
