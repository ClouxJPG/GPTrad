<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта осадков</title>
    <!-- Подключаем стили Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div class="controls">
    <button onclick="toggleRadar()">Вкл/Выкл радар</button>
</div>

<div id="map"></div>

<!-- Подключаем скрипт Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Инициализация карты (центрируем на Россию/Москву)
    const map = L.map('map').setView([55.751244, 37.618423], 6);

    // 2. Базовый слой подложки (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // 3. Слой погодного радара с вашего бэкенд-сервера
    const radarLayer = L.tileLayer('http://localhost:8000/api/tile/{z}/{x}/{y}.png?time=1789999600000', {
        opacity: 0.6, // Прозрачность слоя осадков
        maxZoom: 12
    }).addTo(map);

    // Функция переключения видимости радара
    let isVisible = true;
    function toggleRadar() {
        if (isVisible) {
            map.removeLayer(radarLayer);
        } else {
            map.addLayer(radarLayer);
        }
        isVisible = !isVisible;
    }
</script>

</body>
</html>
